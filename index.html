<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<title>FX LEVEL Neon Frame</title>

<style>

/* =====================================================
   BASE
===================================================== */

html,
body {

    width: 1920px;
    height: 1080px;

    margin: 0;
    padding: 0;

    overflow: hidden;

    background: transparent !important;

    font-family: Arial, sans-serif;
}


/* =====================================================
   WEBCAM NEON FRAME
   EXACT MAIN OVERLAY GEOMETRY
===================================================== */

.webcam-frame {

    position: absolute;

    left: 40px;
    bottom: 125px;

    width: 430px;
    height: 250px;

    border: 4px solid #ffae4a;

    border-radius: 0;

    background: transparent;

    /*
       Premium amber illumination
       Core + controlled bloom
    */

    box-shadow:

        /* sharp outer core */
        0 0 2px rgba(255,174,74,1),

        /* tight glow */
        0 0 7px rgba(255,174,74,.95),

        /* medium bloom */
        0 0 16px rgba(255,174,74,.65),

        /* soft atmospheric halo */
        0 0 34px rgba(255,174,74,.32),

        /* deep ambient glow */
        0 0 65px rgba(255,174,74,.16);

}


/* =====================================================
   WEBCAM INNER LIGHT
   Very subtle designer highlight
===================================================== */

.webcam-frame::before {

    content: "";

    position: absolute;

    top: -1px;
    left: -1px;

    width: calc(100% + 2px);
    height: calc(100% + 2px);

    border: 1px solid rgba(255,230,190,.55);

    pointer-events: none;

    box-sizing: border-box;

    opacity: .55;

}


/* =====================================================
   WEBCAM CORNER ACCENT
   Minimal graphic highlight
===================================================== */

.webcam-frame::after {

    content: "";

    position: absolute;

    top: -4px;
    left: -4px;

    width: 76px;
    height: 4px;

    background: linear-gradient(
        90deg,
        rgba(255,244,220,1),
        rgba(255,174,74,.9),
        rgba(255,174,74,0)
    );

    box-shadow:

        0 0 5px rgba(255,174,74,1),
        0 0 13px rgba(255,174,74,.75);

    pointer-events: none;

}


/* =====================================================
   UPPER PANEL
   EXACT MAIN OVERLAY GEOMETRY
===================================================== */

.webcam-panel {

    position: absolute;

    left: 40px;
    bottom: 389px;

    width: 430px;
    height: 140px;

    border: 4px solid #ffae4a;

    border-radius: 0;

    background: transparent;

    /*
       Same optical system as webcam frame
       for visual unity
    */

    box-shadow:

        0 0 2px rgba(255,174,74,1),

        0 0 7px rgba(255,174,74,.95),

        0 0 16px rgba(255,174,74,.65),

        0 0 34px rgba(255,174,74,.32),

        0 0 65px rgba(255,174,74,.16);

}


/* =====================================================
   UPPER PANEL INNER HIGHLIGHT
===================================================== */

.webcam-panel::before {

    content: "";

    position: absolute;

    top: -1px;
    left: -1px;

    width: calc(100% + 2px);
    height: calc(100% + 2px);

    border: 1px solid rgba(255,230,190,.55);

    pointer-events: none;

    box-sizing: border-box;

    opacity: .55;

}


/* =====================================================
   UPPER PANEL CORNER ACCENT
===================================================== */

.webcam-panel::after {

    content: "";

    position: absolute;

    top: -4px;
    right: -4px;

    width: 92px;
    height: 4px;

    background: linear-gradient(
        270deg,
        rgba(255,244,220,1),
        rgba(255,174,74,.9),
        rgba(255,174,74,0)
    );

    box-shadow:

        0 0 5px rgba(255,174,74,1),
        0 0 13px rgba(255,174,74,.75);

    pointer-events: none;

}


/* =====================================================
   PROFESSIONAL 6PX SEPARATOR
   BETWEEN PANEL AND WEBCAM

   IMPORTANT:
   This does NOT change either frame's
   width / height / position.

   Main overlay geometry creates exactly
   6px of space between the two outer borders.
===================================================== */

.separator {

    position: absolute;

    left: 40px;

    /*
       Panel outer bottom:
       1080 - 389 = 691

       Webcam outer top:
       1080 - 125 - 250 - 8 = 697

       Gap:
       697 - 691 = 6px

       Center line is therefore at y = 694.
    */

    top: 693px;

    width: 438px;

    height: 2px;

    background: linear-gradient(
        90deg,

        rgba(255,174,74,0),

        rgba(255,174,74,.20) 10%,

        rgba(255,174,74,.85) 30%,

        rgba(255,236,190,1) 50%,

        rgba(255,174,74,.85) 70%,

        rgba(255,174,74,.20) 90%,

        rgba(255,174,74,0)
    );

    box-shadow:

        0 0 2px rgba(255,245,220,1),

        0 0 7px rgba(255,174,74,.85),

        0 0 16px rgba(255,174,74,.45);

    pointer-events: none;

}


/* =====================================================
   SEPARATOR CENTER CORE
   Small graphic connection
===================================================== */

.separator::before {

    content: "";

    position: absolute;

    left: 50%;

    top: 0;

    transform: translateX(-50%);

    width: 110px;

    height: 2px;

    background: #fff0d0;

    box-shadow:

        0 0 3px #ffffff,

        0 0 8px #ffae4a,

        0 0 18px rgba(255,174,74,.85);

}


/* =====================================================
   SEPARATOR MICRO CUTS
   Designer-style optical breaks
===================================================== */

.separator::after {

    content: "";

    position: absolute;

    left: 50%;

    top: -1px;

    transform: translateX(-50%);

    width: 190px;

    height: 4px;

    background:

        linear-gradient(
            90deg,

            transparent 0%,
            transparent 18%,

            rgba(255,174,74,.20) 18%,
            rgba(255,174,74,.20) 20%,

            transparent 20%,
            transparent 80%,

            rgba(255,174,74,.20) 80%,
            rgba(255,174,74,.20) 82%,

            transparent 82%,
            transparent 100%
        );

    pointer-events: none;

}


/* =====================================================
   VERY SUBTLE PREMIUM PULSE
   Slow — not flashy
===================================================== */

.webcam-frame,
.webcam-panel {

    animation: neonBreath 4.8s ease-in-out infinite;

}


@keyframes neonBreath {

    0%,
    100% {

        filter:
            brightness(1);

    }

    50% {

        filter:
            brightness(1.08);

    }

}


/* =====================================================
   SEPARATOR BREATH
===================================================== */

.separator {

    animation: separatorBreath 4.8s ease-in-out infinite;

}


@keyframes separatorBreath {

    0%,
    100% {

        opacity: .72;

    }

    50% {

        opacity: 1;

    }

}


/* =====================================================
   TRANSPARENCY GUARANTEE
===================================================== */

body,
.webcam-frame,
.webcam-panel {

    background-color: transparent !important;

}

</style>

</head>


<body>


<!-- =====================================================
     UPPER PANEL
===================================================== -->

<div class="webcam-panel"></div>


<!-- =====================================================
     6PX PROFESSIONAL SEPARATOR
===================================================== -->

<div class="separator"></div>


<!-- =====================================================
     WEBCAM FRAME
===================================================== -->

<div class="webcam-frame"></div>


</body>

</html>
