<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<title>FX LEVEL Overlay</title>

<style>

/* =====================================================
   صفحه اصلی
===================================================== */

html, body {

    width: 1920px;
    height: 1080px;

    margin: 0;
    padding: 0;

    overflow: hidden;

    background: #808080;

    font-family: Arial, sans-serif;

    color: white;
}


/* =====================================================
   شبکه پس‌زمینه
===================================================== */

body::before {

    content: "";

    position: absolute;

    inset: 0;

    background-image:

        linear-gradient(
            rgba(0,255,136,0.40) 1px,
            transparent 1px
        ),

        linear-gradient(
            90deg,
            rgba(0,255,136,0.40) 1px,
            transparent 1px
        );

    background-size: 40px 40px;

    pointer-events: none;
}


/* =====================================================
   فریم اصلی
===================================================== */

.main-frame {

    position: absolute;

    top: 40px;
    left: 40px;

    width: calc(100% - 80px);
    height: calc(100% - 80px);

    clip-path: polygon(

        25px 0,
        calc(100% - 25px) 0,
        100% 25px,
        100% calc(100% - 25px),
        calc(100% - 25px) 100%,
        25px 100%,
        0 calc(100% - 25px),
        0 25px

    );

    background: rgba(0, 0, 0, 0.18);

    border: 3px solid #00ff88;

    box-shadow:

        0 0 25px #00ff88,
        inset 0 0 25px #00ff88;
}


/* =====================================================
   نوار بالا
===================================================== */

.top-bar {

    position: absolute;

    top: 55px;
    left: 50%;

    transform: translateX(-50%);

    width: 86%;
    height: 90px;

    clip-path: polygon(

        18px 0,
        calc(100% - 18px) 0,
        100% 18px,
        100% 100%,
        0 100%,
        0 18px

    );

    background: rgba(0, 0, 0, 0.35);

    border: 2px solid #00ff88;

    box-shadow:

        0 0 14px #00ff88,
        inset 0 0 14px #00ff88;

    display: flex;

    justify-content: space-between;

    align-items: center;

    padding: 0 35px;

    box-sizing: border-box;
}


/* =====================================================
   آیتم‌های نوار بالا
===================================================== */

.top-item {

    flex: 1;

    display: flex;

    justify-content: center;
}


.item-row {

    display: flex;

    align-items: center;

    gap: 14px;
}


/* =====================================================
   آیکون‌های بالا
===================================================== */

.icon {

    width: 40px;
    height: 40px;

    stroke: #ffffff;

    fill: none;

    filter:
        drop-shadow(0 0 6px #00ff88);
}


/* =====================================================
   متن‌های بالا
===================================================== */

.text-box {

    display: flex;

    flex-direction: column;

    line-height: 1.1;
}


.text-box span:first-child {

    font-size: 14px;

    color: #ffae4a;

    text-shadow:
        0 0 6px #ffae4a;
}


.text-box span:last-child {

    font-size: 22px;

    font-weight: bold;

    color: #00ff88;

    text-shadow:
        0 0 8px #00ff88;
}


/* =====================================================
   هشدار نام سشن
===================================================== */

#session-value.session-warning {

    animation:
        sessionNameBlink 1s ease-in-out infinite;
}


@keyframes sessionNameBlink {

    0%, 100% {
        opacity: 1;
    }

    50% {
        opacity: 0.15;
    }
}


/* =====================================================
   هشدار ساعت سشن
===================================================== */

#newyork-value.clock-warning {

    animation:
        sessionClockBlink 0.65s ease-in-out infinite;
}


@keyframes sessionClockBlink {

    0%, 100% {
        opacity: 1;
    }

    50% {
        opacity: 0.10;
    }
}


/* =====================================================
   جداکننده
===================================================== */

.divider {

    width: 1px;

    height: 60%;

    background:
        rgba(255,255,255,0.35);
}


/* =====================================================
   SESSION MAP
===================================================== */

.session-map {

    position: absolute;

    top: 170px;
    right: 80px;

    width: 720px;
    height: 145px;

    box-sizing: border-box;

    padding: 18px 28px;

    background:
        rgba(0,0,0,0.28);

    border: 2px solid rgba(0,255,136,0.75);

    clip-path: polygon(

        14px 0,
        calc(100% - 14px) 0,
        100% 14px,
        100% calc(100% - 14px),
        calc(100% - 14px) 100%,
        14px 100%,
        0 calc(100% - 14px),
        0 14px

    );

    box-shadow:

        0 0 15px rgba(0,255,136,0.45),
        inset 0 0 20px rgba(0,255,136,0.08);

    overflow: hidden;
}


/* =====================================================
   عنوان SESSION MAP
===================================================== */

.session-map-title {

    display: flex;

    align-items: center;

    justify-content: space-between;

    height: 28px;
}


.session-map-title .title {

    font-size: 13px;

    font-weight: bold;

    letter-spacing: 3px;

    color: #ffae4a;

    text-shadow:
        0 0 7px #ffae4a;
}


#overlap-label {

    font-size: 11px;

    font-weight: bold;

    letter-spacing: 1.5px;

    color: #00ff88;

    opacity: 0;

    transition: opacity 0.3s ease;

    text-shadow:
        0 0 8px #00ff88;
}


#overlap-label.visible {

    opacity: 1;
}


/* =====================================================
   ردیف Sessionها
===================================================== */

.sessions-row {

    position: relative;

    height: 72px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    margin-top: 4px;
}


/* =====================================================
   خط انرژی
===================================================== */

.session-track {

    position: absolute;

    left: 28px;
    right: 28px;

    top: 36px;

    height: 2px;

    background:
        rgba(255,255,255,0.18);

    overflow: hidden;
}


.session-track::after {

    content: "";

    position: absolute;

    top: 0;
    left: -25%;

    width: 25%;
    height: 100%;

    background:
        linear-gradient(
            90deg,
            transparent,
            #00ff88,
            transparent
        );

    animation:
        trackEnergy 2.4s linear infinite;
}


@keyframes trackEnergy {

    from {
        left: -25%;
    }

    to {
        left: 125%;
    }
}


/* =====================================================
   Session Node
===================================================== */

.session-node {

    position: relative;

    z-index: 5;

    width: 105px;

    display: flex;

    flex-direction: column;

    align-items: center;

    gap: 9px;

    transition:
        transform 0.35s ease,
        opacity 0.35s ease;
}


.session-dot {

    position: relative;

    width: 18px;
    height: 18px;

    border-radius: 50%;

    background: #3f4a46;

    border: 2px solid rgba(255,255,255,0.35);

    box-sizing: border-box;

    transition:
        background 0.35s ease,
        border-color 0.35s ease,
        box-shadow 0.35s ease,
        transform 0.35s ease;
}


.session-dot::before {

    content: "";

    position: absolute;

    inset: -7px;

    border-radius: 50%;

    border: 1px solid rgba(0,255,136,0);

    transform: scale(0.5);

    opacity: 0;

}


/* =====================================================
   Session فعال
===================================================== */

.session-node.active {

    transform:
        translateY(-4px)
        scale(1.04);
}


.session-node.active .session-dot {

    background: #00ff88;

    border-color: #ffffff;

    box-shadow:

        0 0 7px #00ff88,
        0 0 16px #00ff88,
        0 0 32px rgba(0,255,136,0.9);

    animation:
        activeDot 1.5s ease-in-out infinite;
}


.session-node.active .session-dot::before {

    border-color: #00ff88;

    animation:
        activeRing 1.5s ease-out infinite;
}


@keyframes activeDot {

    0%, 100% {
        transform: scale(0.9);
    }

    50% {
        transform: scale(1.18);
    }
}


@keyframes activeRing {

    0% {
        transform: scale(0.5);
        opacity: 0.9;
    }

    100% {
        transform: scale(1.7);
        opacity: 0;
    }
}


/* =====================================================
   نام Session
===================================================== */

.session-name {

    font-size: 13px;

    font-weight: bold;

    letter-spacing: 1.5px;

    color: rgba(255,255,255,0.38);

    transition:
        color 0.35s ease,
        text-shadow 0.35s ease;
}


.session-node.active .session-name {

    color: #00ff88;

    text-shadow:
        0 0 7px #00ff88,
        0 0 16px rgba(0,255,136,0.75);
}


/* =====================================================
   وضعیت Session
===================================================== */

.session-status {

    position: absolute;

    top: 52px;

    font-size: 8px;

    letter-spacing: 1.5px;

    font-weight: bold;

    color: rgba(255,255,255,0.22);

    transition:
        color 0.35s ease,
        opacity 0.35s ease;
}


.session-node.active .session-status {

    color: #ffffff;

    opacity: 0.9;
}


/* =====================================================
   Weekend
===================================================== */

.session-map.weekend .session-map-title .title {

    color: #ffae4a;
}


.session-map.weekend .session-track {

    background:
        rgba(255,174,74,0.20);
}


.session-map.weekend .session-track::after {

    background:
        linear-gradient(
            90deg,
            transparent,
            #ffae4a,
            transparent
        );
}


.session-map.weekend .session-dot {

    background: #333333;

    border-color:
        rgba(255,174,74,0.45);
}


/* =====================================================
   Holiday
===================================================== */

.session-node.holiday .session-dot {

    background: #ff3333;

    border-color: #ff7777;

    box-shadow:
        0 0 8px #ff3333,
        0 0 20px rgba(255,51,51,0.65);
}


.session-node.holiday .session-name {

    color: #ff5555;

    text-shadow:
        0 0 7px #ff3333;
}


.session-node.holiday .session-status {

    color: #ff5555;
}


/* =====================================================
   وبکم
===================================================== */

.webcam-frame {

    position: absolute;

    bottom: 170px;
    left: 80px;

    width: 430px;
    height: 250px;

    border: 4px solid #00ff66;

    border-radius: 0;

    background:
        rgba(0, 0, 0, 0.18);

    box-shadow:

        0 0 25px rgba(0, 255, 102, 1),
        0 0 55px rgba(0, 255, 102, 0.85),
        0 0 110px rgba(0, 255, 102, 0.65),
        0 0 160px rgba(0, 255, 102, 0.45);
}


/* =====================================================
   نوار پایین
===================================================== */

.bottom-bar {

    position: absolute;

    bottom: 55px;
    left: 50%;

    transform: translateX(-50%);

    width: 86%;
    height: 80px;

    clip-path: polygon(

        0 0,
        100% 0,
        100% calc(100% - 18px),
        calc(100% - 18px) 100%,
        18px 100%,
        0 calc(100% - 18px)

    );

    background:
        rgba(0, 0, 0, 0.35);

    border: 2px solid #00ff88;

    box-shadow:

        0 0 14px #00ff88,
        inset 0 0 14px #00ff88;

    display: flex;

    justify-content: space-between;

    align-items: center;

    padding: 0 40px;

    box-sizing: border-box;
}


/* =====================================================
   فونت نوار پایین
===================================================== */

.bottom-item span {

    font-family: Arial, sans-serif;

    font-size: 18px;

    font-weight: bold;

    line-height: 1;

    display: flex;

    align-items: center;

    white-space: nowrap;
}


/* =====================================================
   آیتم‌های نوار پایین
===================================================== */

.bottom-item {

    display: flex;

    align-items: center;

    gap: 10px;
}


/* =====================================================
   رنگ متن‌های معمولی
===================================================== */

.bottom-item:not(.subscribe) span {

    color: #4da6ff;

    text-shadow:
        0 0 6px #4da6ff;
}


/* =====================================================
   آیکون‌های نوار پایین
===================================================== */

.bottom-icon {

    width: 40px;
    height: 40px;

    stroke: #ffffff;

    fill: none;

    display: flex;

    align-items: center;

    flex-shrink: 0;

    filter:
        drop-shadow(0 0 4px #ffb347);
}


/* =====================================================
   SUBSCRIBE / LIKE
===================================================== */

.subscribe {

    position: relative;

    width: 145px;
    min-width: 145px;
    max-width: 145px;

    height: 40px;

    flex-shrink: 0;
}


.promo-state {

    position: absolute;

    left: 0;
    top: 50%;

    transform: translateY(-50%);

    display: flex;

    align-items: center;

    gap: 10px;

    white-space: nowrap;
}


.subscribe-state span {

    font-family: Arial, sans-serif;

    font-size: 18px;

    font-weight: bold;

    color: #ff3333;

    text-shadow:
        0 0 5px rgba(255,51,51,0.55);
}


/* =====================================================
   زنگوله
===================================================== */

.bell-icon {

    stroke: #ff3333;

    filter:
        drop-shadow(0 0 4px #ff3333);

    transform-origin: 50% 15%;
}


.subscribe-state .bell-icon {

    animation:
        bellMiddle 10s ease-in-out infinite;
}


@keyframes bellMiddle {

    0% {
        transform: rotate(0deg);
    }

    45% {
        transform: rotate(0deg);
    }

    47% {
        transform: rotate(-6deg);
    }

    48.5% {
        transform: rotate(6deg);
    }

    50% {
        transform: rotate(-4deg);
    }

    51.5% {
        transform: rotate(0deg);
    }

    53% {
        transform: rotate(-6deg);
    }

    54.5% {
        transform: rotate(6deg);
    }

    56% {
        transform: rotate(-4deg);
    }

    57.5% {
        transform: rotate(0deg);
    }

    100% {
        transform: rotate(0deg);
    }
}


/* =====================================================
   LIKE
===================================================== */

.like-state {

    display: none;
}


.like-state span {

    font-family: Arial, sans-serif;

    font-size: 18px;

    font-weight: bold;

    color: #4da6ff;

    text-shadow:
        0 0 5px rgba(77,166,255,0.55);
}


.like-icon {

    stroke: #4da6ff;

    filter:
        drop-shadow(0 0 4px #4da6ff);

    transform-origin: center;
}


/* =====================================================
   انیمیشن LIKE
===================================================== */

.like-pulse {

    animation:
        likePulse 10s ease-in-out infinite;
}


@keyframes likePulse {

    0% {
        transform: scale(0.82);
    }

    8% {
        transform: scale(1.10);
    }

    15% {
        transform: scale(0.88);
    }

    22% {
        transform: scale(1.12);
    }

    29% {
        transform: scale(0.88);
    }

    38% {
        transform: scale(1);
    }

    100% {
        transform: scale(1);
    }
}


/* =====================================================
   VIP
===================================================== */

.vip {

    position: relative;

    overflow: hidden;
}


.vip span {

    animation:
        vipPulse 1.8s infinite ease-in-out;
}


@keyframes vipPulse {

    0% {

        text-shadow:
            0 0 6px #00ff88;
    }

    50% {

        text-shadow:
            0 0 18px #00ff88;
    }

    100% {

        text-shadow:
            0 0 6px #00ff88;
    }
}


/* =====================================================
   Shine
===================================================== */

.vip .shine {

    position: absolute;

    top: 0;
    left: -120%;

    width: 80%;
    height: 100%;

    background:

        linear-gradient(
            120deg,
            transparent,
            rgba(255,255,255,0.4),
            transparent
        );

    animation:
        shineSweep 3s infinite;
}


@keyframes shineSweep {

    0% {
        left: -120%;
    }

    50% {
        left: 120%;
    }

    100% {
        left: 120%;
    }
}

</style>

<script>


/* =====================================================
   تنظیمات Sessionها
=====================================================

   هر Session بر اساس ساعت محلی همان شهر محاسبه می‌شود.

   Sydney:
   08:00 → 17:00

   Tokyo:
   09:00 → 18:00

   London:
   08:00 → 17:00

   New York:
   09:30 → 16:00
   بر اساس ساعت رسمی بازار سهام آمریکا.

   تمام DST ها توسط IANA Time Zone
   به صورت خودکار محاسبه می‌شوند.
===================================================== */


const tradingSessions = [

    {
        name: "Sydney",

        shortName: "SYD",

        timeZone: "Australia/Sydney",

        openHour: 8,

        openMinute: 0,

        closeHour: 17,

        closeMinute: 0
    },


    {
        name: "Tokyo",

        shortName: "TOK",

        timeZone: "Asia/Tokyo",

        openHour: 9,

        openMinute: 0,

        closeHour: 18,

        closeMinute: 0
    },


    {
        name: "London",

        shortName: "LON",

        timeZone: "Europe/London",

        openHour: 8,

        openMinute: 0,

        closeHour: 17,

        closeMinute: 0
    },


    {
        name: "New York",

        shortName: "NY",

        timeZone: "America/New_York",

        openHour: 9,

        openMinute: 30,

        closeHour: 16,

        closeMinute: 0
    }

];


/* =====================================================
   تعطیلات NYSE
   2026
===================================================== */

const nyseHolidays2026 = [

    "2026-01-01",
    "2026-01-19",
    "2026-02-16",
    "2026-04-03",
    "2026-05-25",
    "2026-06-19",
    "2026-07-03",
    "2026-09-07",
    "2026-11-26",
    "2026-12-25"

];


/* =====================================================
   عناصر HTML
===================================================== */

const sessionValue =
    document.getElementById(
        "session-value"
    );


const sessionClockLabel =
    document.getElementById(
        "session-clock-label"
    );


const sessionClockValue =
    document.getElementById(
        "newyork-value"
    );


const tehranClockValue =
    document.getElementById(
        "tehran-value"
    );


const sessionMap =
    document.getElementById(
        "session-map"
    );


const overlapLabel =
    document.getElementById(
        "overlap-label"
    );


const sessionMapMini =
    document.getElementById(
        "session-map-mini"
    );


/* =====================================================
   گرفتن اجزای زمان در Time Zone
===================================================== */

function getTimeZoneParts(
    date,
    timeZone
) {

    const parts =
        new Intl.DateTimeFormat(
            "en-US",
            {

                timeZone: timeZone,

                year: "numeric",

                month: "2-digit",

                day: "2-digit",

                weekday: "short",

                hour: "2-digit",

                minute: "2-digit",

                second: "2-digit",

                hourCycle: "h23"

            }
        ).formatToParts(date);


    const result = {};


    parts.forEach(
        part => {

            if (
                part.type !== "literal"
            ) {

                result[part.type] =
                    part.value;

            }

        }
    );


    return {

        year:
            parseInt(
                result.year,
                10
            ),

        month:
            parseInt(
                result.month,
                10
            ),

        day:
            parseInt(
                result.day,
                10
            ),

        weekday:
            result.weekday,

        hour:
            parseInt(
                result.hour,
                10
            ),

        minute:
            parseInt(
                result.minute,
                10
            ),

        second:
            parseInt(
                result.second,
                10
            )

    };

}


/* =====================================================
   Offset واقعی Time Zone
===================================================== */

function getTimeZoneOffset(
    date,
    timeZone
) {

    const parts =
        new Intl.DateTimeFormat(
            "en-US",
            {

                timeZone: timeZone,

                year: "numeric",

                month: "2-digit",

                day: "2-digit",

                hour: "2-digit",

                minute: "2-digit",

                second: "2-digit",

                hourCycle: "h23"

            }
        ).formatToParts(date);


    const values = {};


    parts.forEach(
        part => {

            if (
                part.type !== "literal"
            ) {

                values[part.type] =
                    part.value;

            }

        }
    );


    const asUTC =
        Date.UTC(

            Number(values.year),

            Number(values.month) - 1,

            Number(values.day),

            Number(values.hour),

            Number(values.minute),

            Number(values.second)

        );


    return (
        asUTC -
        date.getTime()
    );

}


/* =====================================================
   ساخت Timestamp یک زمان محلی
===================================================== */

function getLocalTimestamp(
    date,
    timeZone,
    hour,
    minute,
    dayOffset = 0
) {

    const localParts =
        getTimeZoneParts(
            date,
            timeZone
        );


    const localDate =
        new Date(

            Date.UTC(

                localParts.year,

                localParts.month - 1,

                localParts.day + dayOffset,

                hour,

                minute,

                0

            )

        );


    const offset =
        getTimeZoneOffset(
            localDate,
            timeZone
        );


    return (
        localDate.getTime() -
        offset
    );

}


/* =====================================================
   گرفتن Timestamp شروع Session
===================================================== */

function getSessionOpenTimestamp(
    date,
    session,
    dayOffset = 0
) {

    return getLocalTimestamp(

        date,

        session.timeZone,

        session.openHour,

        session.openMinute,

        dayOffset

    );

}


/* =====================================================
   گرفتن Timestamp پایان Session
===================================================== */

function getSessionCloseTimestamp(
    date,
    session,
    dayOffset = 0
) {

    return getLocalTimestamp(

        date,

        session.timeZone,

        session.closeHour,

        session.closeMinute,

        dayOffset

    );

}


/* =====================================================
   بررسی Weekend در Time Zone
===================================================== */

function isWeekend(
    date,
    timeZone
) {

    const parts =
        getTimeZoneParts(
            date,
            timeZone
        );


    return (

        parts.weekday === "Sat" ||

        parts.weekday === "Sun"

    );

}


/* =====================================================
   تبدیل تاریخ به YYYY-MM-DD
===================================================== */

function getDateKey(
    date,
    timeZone
) {

    const parts =
        getTimeZoneParts(
            date,
            timeZone
        );


    return (

        String(parts.year) +
        "-" +
        String(parts.month).padStart(2, "0") +
        "-" +
        String(parts.day).padStart(2, "0")

    );

}


/* =====================================================
   Holiday نیویورک
===================================================== */

function isNYSEHoliday(
    date
) {

    const key =
        getDateKey(
            date,
            "America/New_York"
        );


    return nyseHolidays2026.includes(
        key
    );

}


/* =====================================================
   آیا Session فعال است؟
===================================================== */

function isSessionActive(
    now,
    session
) {

    if (
        isWeekend(
            now,
            session.timeZone
        )
    ) {

        return false;

    }


    /* -----------------------------------------------
       New York در Holiday
    ----------------------------------------------- */

    if (

        session.name === "New York" &&

        isNYSEHoliday(now)

    ) {

        return false;

    }


    const open =
        getSessionOpenTimestamp(
            now,
            session,
            0
        );


    const close =
        getSessionCloseTimestamp(
            now,
            session,
            0
        );


    return (

        now.getTime() >= open &&

        now.getTime() < close

    );

}


/* =====================================================
   Sessionهای فعال
===================================================== */

function getActiveSessions(
    now
) {

    return tradingSessions.filter(
        session =>
            isSessionActive(
                now,
                session
            )
    );

}


/* =====================================================
   Session اصلی برای نمایش بالا
===================================================== */

function getPrimarySession(
    activeSessions
) {

    if (
        activeSessions.length === 0
    ) {

        return null;

    }


    /*
       اگر دو Session فعال باشند،
       Session با اولویت بالاتر انتخاب می‌شود.

       New York > London > Tokyo > Sydney
    */

    const priority = {

        "New York": 4,

        "London": 3,

        "Tokyo": 2,

        "Sydney": 1

    };


    return [...activeSessions]
        .sort(
            (
                a,
                b
            ) =>
                priority[b.name] -
                priority[a.name]
        )[0];

}


/* =====================================================
   ساعت محلی
===================================================== */

function getSessionTime(
    timeZone,
    date = new Date()
) {

    return new Intl.DateTimeFormat(
        "en-US",
        {

            timeZone: timeZone,

            hour: "2-digit",

            minute: "2-digit",

            second: "2-digit",

            hour12: true

        }
    ).format(date);

}


/* =====================================================
   تاریخ تهران
===================================================== */

function getTehranDate(
    date = new Date()
) {

    return new Intl.DateTimeFormat(
        "en-US",
        {

            timeZone: "Asia/Tehran",

            day: "2-digit",

            month: "short",

            year: "numeric"

        }
    ).format(date);

}


/* =====================================================
   بروزرسانی Session Map
===================================================== */

function updateSessionMap(
    now
) {

    const activeSessions =
        getActiveSessions(
            now
        );


    const activeNames =
        activeSessions.map(
            session =>
                session.name
        );


    /* -----------------------------------------------
       Weekend
    ----------------------------------------------- */

    const weekend =
        isWeekend(
            now,
            "Europe/London"
        );


    sessionMap.classList.toggle(
        "weekend",
        weekend
    );


    /* -----------------------------------------------
       پیدا کردن Holiday نیویورک
    ----------------------------------------------- */

    const nyHoliday =
        isNYSEHoliday(
            now
        );


    /* -----------------------------------------------
       Reset Nodeها
    ----------------------------------------------- */

    document
        .querySelectorAll(
            ".session-node"
        )
        .forEach(
            node => {

                node.classList.remove(
                    "active"
                );

                node.classList.remove(
                    "holiday"
                );

                const name =
                    node.dataset.session;


                const session =
                    tradingSessions.find(
                        item =>
                            item.name ===
                            name
                    );


                const status =
                    node.querySelector(
                        ".session-status"
                    );


                if (
                    weekend
                ) {

                    status.innerText =
                        "WEEKEND";

                }

                else if (

                    name ===
                    "New York" &&

                    nyHoliday

                ) {

                    node.classList.add(
                        "holiday"
                    );

                    status.innerText =
                        "HOLIDAY";

                }

                else {

                    status.innerText =
                        "CLOSED";

                }

            }
        );


    /* -----------------------------------------------
       فعال‌ها
    ----------------------------------------------- */

    activeSessions.forEach(
        session => {

            const node =
                document.querySelector(
                    `.session-node[data-session="${session.name}"]`
                );


            if (!node) {

                return;

            }


            node.classList.add(
                "active"
            );


            node.querySelector(
                ".session-status"
            ).innerText =
                "ACTIVE";

        }
    );


    /* -----------------------------------------------
       Overlap
    ----------------------------------------------- */

    if (
        activeSessions.length >= 2
    ) {

        const names =
            activeSessions.map(
                session =>
                    session.shortName
            );


        overlapLabel.innerText =
            names.join(
                " + "
            ) +
            " OVERLAP";


        overlapLabel.classList.add(
            "visible"
        );

    }

    else {

        overlapLabel.innerText =
            "";


        overlapLabel.classList.remove(
            "visible"
        );

    }


    /* -----------------------------------------------
       Mini status
    ----------------------------------------------- */

    if (
        weekend
    ) {

        sessionMapMini.innerText =
            "WEEKEND";

    }

    else if (
        activeSessions.length === 0
    ) {

        sessionMapMini.innerText =
            "CLOSED";

    }

    else {

        sessionMapMini.innerText =
            activeSessions
                .map(
                    session =>
                        session.shortName
                )
                .join(
                    " + "
                );

    }

}


/* =====================================================
   بروزرسانی ساعت‌ها
===================================================== */

function updateClocks() {

    const now =
        new Date();


    /* ================================================
       ساعت تهران
    ================================================ */

    tehranClockValue.innerText =
        getSessionTime(
            "Asia/Tehran",
            now
        );


    /* ================================================
       Sessionهای فعال
    ================================================ */

    const activeSessions =
        getActiveSessions(
            now
        );


    /* ================================================
       Session اصلی
    ================================================ */

    const primarySession =
        getPrimarySession(
            activeSessions
        );


    /* ================================================
       نمایش Session اصلی
    ================================================ */

    if (
        primarySession
    ) {

        sessionValue.innerText =
            primarySession.name;


        sessionClockLabel.innerText =
            primarySession.name.toUpperCase();


        sessionClockValue.innerText =
            getSessionTime(
                primarySession.timeZone,
                now
            );

    }

    else {

        sessionValue.innerText =
            "CLOSED";


        sessionClockLabel.innerText =
            "MARKET";


        sessionClockValue.innerText =
            "--:--:--";

    }


    /* ================================================
       Map
    ================================================ */

    updateSessionMap(
        now
    );


    /* ================================================
       تاریخ
    ================================================ */

    document.getElementById(
        "date-value"
    ).innerText =
        getTehranDate(
            now
        );

}


/* =====================================================
   اجرای ساعت
===================================================== */

setInterval(
    updateClocks,
    1000
);


updateClocks();


/* =====================================================
   SUBSCRIBE / LIKE
===================================================== */

const subscribeState =
    document.querySelector(
        ".subscribe-state"
    );


const likeState =
    document.querySelector(
        ".like-state"
    );


const likeIcon =
    document.querySelector(
        ".like-icon"
    );


setInterval(
    function () {


        /* =============================================
           SUBSCRIBE → LIKE
        ============================================= */

        if (

            subscribeState.style.display !==
            "none"

        ) {

            subscribeState.style.display =
                "none";


            likeState.style.display =
                "flex";


            likeIcon.classList.remove(
                "like-pulse"
            );


            void likeIcon.offsetWidth;


            likeIcon.classList.add(
                "like-pulse"
            );

        }


        /* =============================================
           LIKE → SUBSCRIBE
        ============================================= */

        else {

            likeState.style.display =
                "none";


            subscribeState.style.display =
                "flex";

        }

    },

    10000

);

</script>
