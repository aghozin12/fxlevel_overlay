<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<title>FX LEVEL Overlay</title>

<style>

/* =====================================================
   صفحه اصلی
===================================================== */

html,
body {

    width: 1920px;
    height: 1080px;

    margin: 0;
    padding: 0;

    overflow: hidden;

    background: #808080;

    font-family: Arial, sans-serif;

    color: white;
}


/* =====================================================
   شبکه پس‌زمینه
===================================================== */

body::before {

    content: "";

    position: absolute;

    inset: 0;

    background-image:

        linear-gradient(
            rgba(0,255,136,0.40) 1px,
            transparent 1px
        ),

        linear-gradient(
            90deg,
            rgba(0,255,136,0.40) 1px,
            transparent 1px
        );

    background-size: 40px 40px;

    pointer-events: none;
}


/* =====================================================
   فریم اصلی
===================================================== */

.main-frame {

    position: absolute;

    top: 40px;
    left: 40px;

    width: calc(100% - 80px);
    height: calc(100% - 80px);

    clip-path: polygon(

        25px 0,
        calc(100% - 25px) 0,
        100% 25px,
        100% calc(100% - 25px),
        calc(100% - 25px) 100%,
        25px 100%,
        0 calc(100% - 25px),
        0 25px

    );

    background: rgba(0, 0, 0, 0.18);

    border: 3px solid #00ff88;

    box-shadow:

        0 0 25px #00ff88,
        inset 0 0 25px #00ff88;
}


/* =====================================================
   نوار بالا
===================================================== */

.top-bar {

    position: absolute;

    top: 55px;
    left: 50%;

    transform: translateX(-50%);

    width: 86%;
    height: 90px;

    clip-path: polygon(

        18px 0,
        calc(100% - 18px) 0,
        100% 18px,
        100% 100%,
        0 100%,
        0 18px

    );

    background: rgba(0, 0, 0, 0.35);

    border: 2px solid #00ff88;

    box-shadow:

        0 0 14px #00ff88,
        inset 0 0 14px #00ff88;

    display: flex;

    justify-content: space-between;

    align-items: center;

    padding: 0 35px;

    box-sizing: border-box;
}


/* =====================================================
   آیتم‌های نوار بالا
===================================================== */

.top-item {

    flex: 1;

    display: flex;

    justify-content: center;
}


.item-row {

    display: flex;

    align-items: center;

    gap: 14px;
}


/* =====================================================
   آیکون‌های بالا
===================================================== */

.icon {

    width: 40px;
    height: 40px;

    stroke: #ffffff;

    fill: none;

    filter:
        drop-shadow(0 0 6px #00ff88);
}


/* =====================================================
   متن‌های بالا
===================================================== */

.text-box {

    display: flex;

    flex-direction: column;

    line-height: 1.1;
}


.text-box span:first-child {

    font-size: 14px;

    color: #ffae4a;

    text-shadow:
        0 0 6px #ffae4a;
}


.text-box span:last-child {

    font-size: 22px;

    font-weight: bold;

    color: #00ff88;

    text-shadow:
        0 0 8px #00ff88;
}


/* =====================================================
   هشدار نام سشن
===================================================== */

#session-value.session-warning {

    animation:
        sessionNameBlink 0.7s ease-in-out infinite;
}


@keyframes sessionNameBlink {

    0%,
    100% {

        opacity: 1;

        text-shadow:
            0 0 8px #00ff88,
            0 0 18px #00ff88;
    }

    50% {

        opacity: 0.25;

        text-shadow:
            0 0 2px #00ff88;
    }
}


/* =====================================================
   هشدار ساعت سشن
===================================================== */

#newyork-value.clock-warning {

    animation:
        sessionClockBlink 0.65s ease-in-out infinite;
}


@keyframes sessionClockBlink {

    0%,
    100% {

        opacity: 1;
    }

    50% {

        opacity: 0.10;
    }
}


/* =====================================================
   جداکننده بالا
===================================================== */

.divider {

    width: 1px;

    height: 60%;

    background:
        rgba(255,255,255,0.35);
}


/* =====================================================
   SESSION MAP
===================================================== */

.session-map {

    flex: 1.25;

    display: flex;

    justify-content: center;

    align-items: center;

    min-width: 360px;

    position: relative;
}


.session-map-inner {

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    width: 100%;

    position: relative;
}


/* =====================================================
   عنوان SESSION
===================================================== */

.session-map-title {

    font-size: 13px;

    font-weight: bold;

    letter-spacing: 3px;

    color: #ffae4a;

    text-shadow:

        0 0 6px #ffae4a,
        0 0 14px rgba(255,174,74,0.35);

    margin-bottom: 8px;

    position: relative;
}


/* =====================================================
   مپ اصلی
===================================================== */

.session-track {

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 13px;

    height: 27px;

    position: relative;
}


/* =====================================================
   Session Node
===================================================== */

.session-node {

    display: flex;

    align-items: center;

    gap: 6px;

    position: relative;

    font-size: 15px;

    font-weight: bold;

    letter-spacing: 1px;

    color: rgba(255,255,255,0.42);

    transition:

        color 0.35s ease,

        text-shadow 0.35s ease,

        opacity 0.35s ease,

        filter 0.35s ease;
}


.session-name {

    position: relative;

    z-index: 3;

    transition:

        color 0.35s ease,

        text-shadow 0.35s ease;
}


/* =====================================================
   Dot
===================================================== */

.session-dot {

    width: 7px;
    height: 7px;

    border-radius: 50%;

    background: rgba(255,255,255,0.25);

    box-shadow:

        0 0 2px rgba(255,255,255,0.15);

    position: relative;

    z-index: 3;

    transition:

        background 0.35s ease,

        box-shadow 0.35s ease,

        transform 0.35s ease,

        opacity 0.35s ease;
}


/* =====================================================
   Halo پشت Dot
===================================================== */

.session-dot::before {

    content: "";

    position: absolute;

    width: 18px;
    height: 18px;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%)
        scale(0.65);

    border-radius: 50%;

    border: 1px solid
        rgba(0,255,136,0.0);

    opacity: 0;

    transition:

        opacity 0.3s ease,

        transform 0.3s ease,

        border-color 0.3s ease;
}


/* =====================================================
   Session Active
===================================================== */

.session-node.active {

    color: #00ff88;

    text-shadow:

        0 0 5px #00ff88,
        0 0 12px rgba(0,255,136,0.8);
}


.session-node.active .session-dot {

    background: #00ff88;

    box-shadow:

        0 0 4px #00ff88,
        0 0 10px #00ff88,
        0 0 20px rgba(0,255,136,0.85);

    animation:
        activeDotPulse 1.25s ease-in-out infinite;
}


.session-node.active .session-dot::before {

    opacity: 0.65;

    transform:
        translate(-50%, -50%)
        scale(1);

    border-color:
        rgba(0,255,136,0.55);

    animation:
        activeHalo 1.25s ease-in-out infinite;
}


@keyframes activeDotPulse {

    0%,
    100% {

        transform: scale(0.82);

        opacity: 0.78;
    }

    50% {

        transform: scale(1.30);

        opacity: 1;
    }
}


@keyframes activeHalo {

    0%,
    100% {

        transform:
            translate(-50%, -50%)
            scale(0.75);

        opacity: 0.20;
    }

    50% {

        transform:
            translate(-50%, -50%)
            scale(1.35);

        opacity: 0.75;
    }
}


/* =====================================================
   خط اتصال
===================================================== */

.session-connector {

    width: 16px;

    height: 1px;

    background:
        rgba(255,255,255,0.18);

    box-shadow:
        0 0 4px rgba(0,255,136,0.12);

    position: relative;

    overflow: hidden;
}


.session-connector::after {

    content: "";

    position: absolute;

    top: 0;

    left: -100%;

    width: 60%;

    height: 100%;

    background:

        linear-gradient(
            90deg,
            transparent,
            rgba(0,255,136,0.9),
            transparent
        );

    opacity: 0;
}


/* فقط در زمان باز بودن بازار */

.session-map.has-active
.session-connector::after {

    animation:
        connectorSweep 3.2s ease-in-out infinite;

    opacity: 1;
}


@keyframes connectorSweep {

    0% {

        left: -100%;
    }

    55% {

        left: 130%;
    }

    100% {

        left: 130%;
    }
}


/* =====================================================
   هشدار OPEN
===================================================== */

.session-node.open-warning {

    color: #00ff88;

    animation:
        openWarningBlink 0.72s ease-in-out infinite;
}


.session-node.open-warning .session-dot {

    background: #00ff88;

    box-shadow:

        0 0 5px #00ff88,
        0 0 13px #00ff88,
        0 0 28px rgba(0,255,136,0.95);

    animation:
        openDotWarning 0.72s ease-in-out infinite;
}


.session-node.open-warning .session-dot::before {

    border-color:
        rgba(0,255,136,0.85);

    opacity: 1;

    animation:
        warningHalo 0.72s ease-in-out infinite;
}


@keyframes openWarningBlink {

    0%,
    100% {

        opacity: 1;

        text-shadow:

            0 0 6px #00ff88,
            0 0 16px #00ff88;
    }

    50% {

        opacity: 0.22;

        text-shadow:

            0 0 2px #00ff88;
    }
}


@keyframes openDotWarning {

    0%,
    100% {

        transform: scale(0.80);

        opacity: 0.55;
    }

    50% {

        transform: scale(1.45);

        opacity: 1;
    }
}


@keyframes warningHalo {

    0%,
    100% {

        transform:
            translate(-50%, -50%)
            scale(0.65);

        opacity: 0.20;
    }

    50% {

        transform:
            translate(-50%, -50%)
            scale(1.55);

        opacity: 0.85;
    }
}


/* =====================================================
   هشدار CLOSE
===================================================== */

.session-node.close-warning {

    color: #ff3333;

    animation:
        closeWarningBlink 0.65s ease-in-out infinite;
}


.session-node.close-warning .session-dot {

    background: #ff3333;

    box-shadow:

        0 0 5px #ff3333,
        0 0 13px #ff3333,
        0 0 30px rgba(255,51,51,0.95);

    animation:
        closeDotWarning 0.65s ease-in-out infinite;
}


.session-node.close-warning .session-dot::before {

    border-color:
        rgba(255,51,51,0.85);

    opacity: 1;

    animation:
        warningHaloRed 0.65s ease-in-out infinite;
}


@keyframes closeWarningBlink {

    0%,
    100% {

        opacity: 1;

        text-shadow:

            0 0 6px #ff3333,
            0 0 16px #ff3333;
    }

    50% {

        opacity: 0.18;

        text-shadow:

            0 0 2px #ff3333;
    }
}


@keyframes closeDotWarning {

    0%,
    100% {

        transform: scale(0.80);

        opacity: 0.55;
    }

    50% {

        transform: scale(1.50);

        opacity: 1;
    }
}


@keyframes warningHaloRed {

    0%,
    100% {

        transform:
            translate(-50%, -50%)
            scale(0.65);

        opacity: 0.20;
    }

    50% {

        transform:
            translate(-50%, -50%)
            scale(1.55);

        opacity: 0.85;
    }
}


/* =====================================================
   آخر هفته / MARKET CLOSED
   مهم:
   در شنبه و یکشنبه هیچ Session فعالی وجود ندارد.
===================================================== */

.session-map.weekend
.session-map-title {

    color: #ffae4a;

    text-shadow:
        0 0 6px #ffae4a;
}


/* Sessionهای بسته آخر هفته */

.session-map.weekend
.session-node {

    color: rgba(255,51,51,0.55);

    text-shadow:
        0 0 5px rgba(255,51,51,0.25);

    animation:
        weekendSessionBlink 1.8s ease-in-out infinite;
}


.session-map.weekend
.session-dot {

    background: #ff3333;

    box-shadow:

        0 0 4px #ff3333,
        0 0 10px rgba(255,51,51,0.55);

    animation:
        closedWeekendPulse 1.8s ease-in-out infinite;
}


.session-map.weekend
.session-dot::before {

    border-color:
        rgba(255,51,51,0.45);

    opacity: 0.55;

    transform:
        translate(-50%, -50%)
        scale(0.9);
}


.session-map.weekend
.session-connector {

    background:
        rgba(255,51,51,0.16);

    box-shadow:
        0 0 4px rgba(255,51,51,0.08);
}


/*
   بسیار مهم:
   آخر هفته نباید هیچ sweep سبزی
   روی خطوط اجرا شود.
*/

.session-map.weekend
.session-connector::after {

    animation: none !important;

    opacity: 0 !important;
}


.session-map.weekend
.session-active-label {

    color: #ff3333;

    text-shadow:

        0 0 6px #ff3333,
        0 0 14px rgba(255,51,51,0.45);
}


@keyframes weekendSessionBlink {

    0%,
    100% {

        opacity: 0.48;
    }

    50% {

        opacity: 0.85;
    }
}


@keyframes closedWeekendPulse {

    0%,
    100% {

        transform: scale(0.85);

        opacity: 0.55;
    }

    50% {

        transform: scale(1.15);

        opacity: 1;
    }
}

.subscribe-state span {

@keyframes bellMiddle {

    48.5% {

    51.5% {

    }

    53% {
        transform: rotate(-6deg);
    }

    54.5% {
        transform: rotate(6deg);
    }

    56% {
        transform: rotate(-4deg);
    }

    57.5% {

@keyframes likePulse {

    }

    }

    29% {

    }

    38% {

    }

    100% {
        transform: scale(1);
    }
}


.vip {

}


.vip span {

}

        );

}


@keyframes shineSweep {

        left: 120%;
    }

        left: 120%;
    }
}

<script>

/* =====================================================
   تنظیمات Sessionها
   =====================================================

   تمام ساعت‌ها بر اساس ساعت تهران هستند.

   Sydney  00:30 → 09:30
   Tokyo   03:30 → 12:30
   London  10:30 → 19:30
   New York 16:30 → 00:30

===================================================== */

const SESSION_CONFIG = {

    sydney: {

        name: "Sydney",

        shortName: "SYD",

        open: "00:30",

        close: "09:30"

    },


    tokyo: {

        name: "Tokyo",

        shortName: "TOK",

        open: "03:30",

        close: "12:30"

    },


    london: {

        name: "London",

        shortName: "LON",

        open: "10:30",

        close: "19:30"

    },


    newyork: {

        name: "New York",

        shortName: "NY",

        open: "16:30",

        close: "00:30"

    }

};


/* =====================================================
   تنظیمات هشدار
===================================================== */

const OPEN_WARNING_MINUTES = 5;

const CLOSE_WARNING_MINUTES = 5;


/* =====================================================
   عناصر HTML
===================================================== */

const marketValue =
    document.getElementById(
        "market-value"
    );


const sessionClockLabel =
    document.getElementById(
        "session-clock-label"
    );


const sessionClockValue =
    document.getElementById(
        "newyork-value"
    );


const tehranClockValue =
    document.getElementById(
        "tehran-value"
    );


const sessionMap =
    document.getElementById(
        "session-map"
    );


const sessionActiveLabel =
    document.getElementById(
        "session-active-label"
    );


const activeSessionText =
    document.getElementById(
        "active-session-text"
    );


const sessionNodes = {

    sydney:
        document.getElementById(
            "session-sydney"
        ),

    tokyo:
        document.getElementById(
            "session-tokyo"
        ),

    london:
        document.getElementById(
            "session-london"
        ),

    newyork:
        document.getElementById(
            "session-newyork"
        )

};


/* =====================================================
   تبدیل HH:MM به دقیقه
===================================================== */

function timeToMinutes(
    time
) {

    const parts =
        time.split(":");


    return (
        Number(parts[0]) * 60 +
        Number(parts[1])
    );

}


/* =====================================================
   گرفتن اجزای تاریخ تهران
===================================================== */

function getTehranDateParts(
    date = new Date()
) {

    const parts =
        new Intl.DateTimeFormat(
            "en-US",
            {

                timeZone:
                    "Asia/Tehran",

                year:
                    "numeric",

                month:
                    "2-digit",

                day:
                    "2-digit",

                hour:
                    "2-digit",

                minute:
                    "2-digit",

                second:
                    "2-digit",

                hourCycle:
                    "h23"

            }
        ).formatToParts(date);


    const result = {};


    parts.forEach(
        part => {

            if (
                part.type !==
                "literal"
            ) {

                result[part.type] =
                    part.value;

            }

        }
    );


    return {

        year:
            Number(result.year),

        month:
            Number(result.month),

        day:
            Number(result.day),

        hour:
            Number(result.hour),

        minute:
            Number(result.minute),

        second:
            Number(result.second)

    };

}


/* =====================================================
   تشخیص Weekend بر اساس تاریخ تهران

   بسیار مهم:
   شنبه = 6
   یکشنبه = 0

   این تابع فقط تاریخ تهران را بررسی می‌کند.
===================================================== */

function isWeekend(
    date = new Date()
) {

    const parts =
        getTehranDateParts(
            date
        );


    const utcDate =
        new Date(
            Date.UTC(
                parts.year,
                parts.month - 1,
                parts.day
            )
        );


    const day =
        utcDate.getUTCDay();


    return (
        day === 0 ||
        day === 6
    );

}


/* =====================================================
   دقیقه فعلی تهران
===================================================== */

function getTehranMinuteOfDay(
    date = new Date()
) {

    const parts =
        getTehranDateParts(
            date
        );


    return (
        parts.hour * 60 +
        parts.minute +
        parts.second / 60
    );

}


/* =====================================================
   ساخت وضعیت Session
===================================================== */

function getSessionState(
    session,
    currentMinute
) {

    const open =
        timeToMinutes(
            session.open
        );


    const close =
        timeToMinutes(
            session.close
        );


    let isOpen = false;


    /*
       Session معمولی
    */

    if (
        open < close
    ) {

        isOpen =
            currentMinute >= open &&
            currentMinute < close;

    }


    /*
       Session عبوری از نیمه‌شب
    */

    else {

        isOpen =
            currentMinute >= open ||
            currentMinute < close;

    }


    return {

        open,

        close,

        isOpen

    };

}


/* =====================================================
   فاصله تا OPEN
===================================================== */

function getMinutesUntilOpen(
    session,
    currentMinute
) {

    const open =
        timeToMinutes(
            session.open
        );


    let diff =
        open -
        currentMinute;


    if (
        diff < 0
    ) {

        diff += 1440;

    }


    return diff;

}


/* =====================================================
   فاصله تا CLOSE
===================================================== */

function getMinutesUntilClose(
    session,
    currentMinute
) {

    const close =
        timeToMinutes(
            session.close
        );


    let diff =
        close -
        currentMinute;


    if (
        diff < 0
    ) {

        diff += 1440;

    }


    return diff;

}


/* =====================================================
   هشدار OPEN
===================================================== */

function isOpenWarning(
    session,
    currentMinute
) {

    const minutes =
        getMinutesUntilOpen(
            session,
            currentMinute
        );


    return (

        minutes > 0 &&

        minutes <=
            OPEN_WARNING_MINUTES

    );

}


/* =====================================================
   هشدار CLOSE
===================================================== */

function isCloseWarning(
    session,
    currentMinute
) {

    const minutes =
        getMinutesUntilClose(
            session,
            currentMinute
        );


    return (

        minutes > 0 &&

        minutes <=
            CLOSE_WARNING_MINUTES

    );

}


/* =====================================================
   Sessionهای فعال

   مهم:
   Weekend در همین ابتدای تابع متوقف می‌شود.

   بنابراین:
   شنبه → []
   یکشنبه → []

   حتی اگر ساعت داخل محدوده NY باشد،
   Session فعال نخواهد شد.
===================================================== */

function getActiveSessions(
    currentMinute,
    now = new Date()
) {

    if (
        isWeekend(now)
    ) {

        return [];

    }


    const active = [];


    Object.entries(
        SESSION_CONFIG
    ).forEach(
        ([id, session]) => {

            const state =
                getSessionState(
                    session,
                    currentMinute
                );


            if (
                state.isOpen
            ) {

                active.push({

                    id,

                    ...session,

                    ...state

                });

            }

        }
    );


    return active;

}


/* =====================================================
   تعیین Session اصلی

   فقط وقتی Market باز باشد.
===================================================== */

function getPrimaryActiveSession(
    currentMinute,
    now = new Date()
) {

    /*
       Weekend = هیچ Session اصلی وجود ندارد
    */

    if (
        isWeekend(now)
    ) {

        return null;

    }


    const active =
        getActiveSessions(
            currentMinute,
            now
        );


    if (
        active.length === 0
    ) {

        return null;

    }


    let primary =
        active[0];


    let latestOpen =
        -1;


    active.forEach(
        session => {

            const open =
                timeToMinutes(
                    session.open
                );


            if (
                open > latestOpen &&
                open <= currentMinute
            ) {

                latestOpen =
                    open;

                primary =
                    session;

            }

        }
    );


    /*
       New York از نیمه‌شب عبور می‌کند.

       بنابراین از 00:00 تا 00:30
       همچنان NY Session اصلی است.

       اما فقط در روزهای کاری.
    */

    if (
        currentMinute < 30
    ) {

        const ny =
            active.find(
                s =>
                    s.id ===
                    "newyork"
            );


        if (
            ny
        ) {

            primary = ny;

        }

    }


    return primary;

}


/* =====================================================
   وضعیت کلی Market

   Weekend همیشه CLOSED است.
===================================================== */

function isMarketOpen(
    currentMinute,
    now = new Date()
) {

    /*
       شنبه و یکشنبه
    */

    if (
        isWeekend(now)
    ) {

        return false;

    }


    return (
        getActiveSessions(
            currentMinute,
            now
        ).length > 0
    );

}


/* =====================================================
   ساعت تهران
===================================================== */

function getTehranTime(
    date = new Date()
) {

    return new Intl.DateTimeFormat(
        "en-US",
        {

            timeZone:
                "Asia/Tehran",

            hour:
                "2-digit",

            minute:
                "2-digit",

            second:
                "2-digit",

            hour12:
                true

        }
    ).format(date);

}


/* =====================================================
   تاریخ تهران
===================================================== */

function getTehranDate(
    date = new Date()
) {

    return new Intl.DateTimeFormat(
        "en-US",
        {

            timeZone:
                "Asia/Tehran",

            day:
                "2-digit",

            month:
                "short",

            year:
                "numeric"

        }
    ).format(date);

}


/* =====================================================
   آپدیت Session Map

   این تابع مرکز اصلی منطق گرافیکی است.
===================================================== */

function updateSessionMap(
    currentMinute,
    now = new Date()
) {

    /*
       ابتدا تمام وضعیت‌های قبلی پاک می‌شوند.
    */

    sessionMap.classList.remove(
        "has-active"
    );


    sessionMap.classList.remove(
        "weekend"
    );


    Object.values(
        sessionNodes
    ).forEach(
        node => {

            node.classList.remove(
                "active",
                "open-warning",
                "close-warning"
            );

        }
    );


    /* =================================================
       WEEKEND
       شنبه و یکشنبه
    ================================================= */

    if (
        isWeekend(now)
    ) {

        sessionMap.classList.add(
            "weekend"
        );


        /*
           هیچ Session فعالی وجود ندارد.
        */

        sessionActiveLabel.classList.add(
            "visible"
        );


        activeSessionText.innerText =
            "MARKET CLOSED";


        /*
           فقط حالت قرمز بسته برای همه
           Sessionها.
        */

        Object.keys(
            sessionNodes
        ).forEach(
            id => {

                sessionNodes[id]
                    .classList.add(
                        "close-warning"
                    );

            }
        );


        /*
           بسیار مهم:
           هیچ Session واقعی محاسبه نمی‌شود.
        */

        return;

    }


    /* =================================================
       WEEKDAY
    ================================================= */

    const active =
        getActiveSessions(
            currentMinute,
            now
        );


    /*
       اگر حداقل یک Session باز باشد،
       خط‌های اتصال فعال می‌شوند.
    */

    if (
        active.length > 0
    ) {

        sessionMap.classList.add(
            "has-active"
        );

    }


    /*
       Sessionهای فعال
    */

    active.forEach(
        session => {

            const node =
                sessionNodes[
                    session.id
                ];


            if (!node) {

                return;

            }


            node.classList.add(
                "active"
            );

        }
    );


    /* =================================================
       هشدار OPEN / CLOSE
    ================================================= */

    Object.entries(
        SESSION_CONFIG
    ).forEach(
        ([id, session]) => {

            const node =
                sessionNodes[id];


            if (!node) {

                return;

            }


            const state =
                getSessionState(
                    session,
                    currentMinute
                );


            /*
               CLOSE WARNING
            */

            if (
                state.isOpen &&
                isCloseWarning(
                    session,
                    currentMinute
                )
            ) {

                node.classList.remove(
                    "active"
                );


                node.classList.add(
                    "close-warning"
                );

            }


            /*
               OPEN WARNING
            */

            else if (
                !state.isOpen &&
                isOpenWarning(
                    session,
                    currentMinute
                )
            ) {

                node.classList.add(
                    "open-warning"
                );

            }

        }
    );


    /* =================================================
       Active Label
    ================================================= */

    if (
        active.length > 0
    ) {

        sessionActiveLabel.classList.add(
            "visible"
        );


        activeSessionText.innerText =
            "ACTIVE";

    }

    else {

        sessionActiveLabel.classList.remove(
            "visible"
        );

    }

}


/* =====================================================
   آپدیت Market
===================================================== */

function updateMarket(
    currentMinute,
    now = new Date()
) {

    const open =
        isMarketOpen(
            currentMinute,
            now
        );


    if (open) {

        marketValue.innerText =
            "OPEN";


        marketValue.style.color =
            "#00ff88";


        marketValue.style.textShadow =
            "0 0 8px #00ff88";

    }

    else {

        marketValue.innerText =
            "CLOSED";


        marketValue.style.color =
            "#ff3333";


        marketValue.style.textShadow =
            "0 0 8px #ff3333";

    }

}


/* =====================================================
   آپدیت ساعت‌ها
===================================================== */

function updateClocks() {

    const now =
        new Date();


    /*
       همه چیز از همین now محاسبه می‌شود.
       بنابراین تاریخ Weekend و Session
       دقیقاً مربوط به یک لحظه هستند.
    */

    const tehranParts =
        getTehranDateParts(
            now
        );


    const currentMinute =
        tehranParts.hour * 60 +
        tehranParts.minute +
        tehranParts.second / 60;


    /*
       ساعت تهران
    */

    tehranClockValue.innerText =
        getTehranTime(
            now
        );


    /*
       Session Map
    */

    updateSessionMap(
        currentMinute,
        now
    );


    /*
       Market
    */

    updateMarket(
        currentMinute,
        now
    );


    /*
       Session اصلی
    */

    const activeSession =
        getPrimaryActiveSession(
            currentMinute,
            now
        );


    if (
        !activeSession
    ) {

        sessionClockLabel.innerText =
            "MARKET";


        sessionClockValue.innerText =
            "--:--:--";

    }

    else {

        sessionClockLabel.innerText =
            activeSession.name
                .toUpperCase();


        sessionClockValue.innerText =
            getTehranTime(
                now
            );

    }


    /*
       تاریخ
    */

    document.getElementById(
        "date-value"
    ).innerText =
        getTehranDate(
            now
        );

}


/* =====================================================
   اجرای ساعت
===================================================== */

setInterval(
    updateClocks,
    1000
);


updateClocks();


/* =====================================================
   SUBSCRIBE / LIKE
===================================================== */

const subscribeState =
    document.querySelector(
        ".subscribe-state"
    );


const likeState =
    document.querySelector(
        ".like-state"
    );


const likeIcon =
    document.querySelector(
        ".like-icon"
    );


setInterval(
    function () {

        if (

            subscribeState.style.display !==
            "none"

        ) {

            subscribeState.style.display =
                "none";


            likeState.style.display =
                "flex";


            likeIcon.classList.remove(
                "like-pulse"
            );


            void likeIcon.offsetWidth;


            likeIcon.classList.add(
                "like-pulse"
            );

        }

        else {

            likeState.style.display =
                "none";


            subscribeState.style.display =
                "flex";

        }

    },

    10000

);

</script>
