<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<title>FX LEVEL Overlay</title>

<style>

html, body {
    width: 1920px;
    height: 1080px;
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #808080;
    font-family: Arial, sans-serif;
    color: white;
}

/* =====================================================
   BACKGROUND GRID
===================================================== */

body::before {
    content: "";
    position: absolute;
    inset: 0;

    background-image:
        linear-gradient(
            rgba(0,255,136,0.40) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(0,255,136,0.40) 1px,
            transparent 1px
        );

    background-size: 40px 40px;
    pointer-events: none;
}

/* =====================================================
   MAIN FRAME
===================================================== */

.main-frame {
    position: absolute;
    top: 40px;
    left: 40px;

    width: calc(100% - 80px);
    height: calc(100% - 80px);

    clip-path: polygon(
        25px 0,
        calc(100% - 25px) 0,
        100% 25px,
        100% calc(100% - 25px),
        calc(100% - 25px) 100%,
        25px 100%,
        0 calc(100% - 25px),
        0 25px
    );

    background: rgba(0, 0, 0, 0.18);

    border: 3px solid #00ff88;

    box-shadow:
        0 0 25px #00ff88,
        inset 0 0 25px #00ff88;
}

/* =====================================================
   TOP BAR
===================================================== */

.top-bar {
    position: absolute;

    top: 55px;
    left: 50%;

    transform: translateX(-50%);

    width: 86%;
    height: 90px;

    clip-path: polygon(
        18px 0,
        calc(100% - 18px) 0,
        100% 18px,
        100% 100%,
        0 100%,
        0 18px
    );

    background: rgba(0, 0, 0, 0.35);

    border: 2px solid #00ff88;

    box-shadow:
        0 0 14px #00ff88,
        inset 0 0 14px #00ff88;

    display: flex;
    align-items: center;

    padding: 0 28px;

    box-sizing: border-box;
}

/* =====================================================
   WORKDAY SESSION LAYOUT
===================================================== */

.sessions-left,
.sessions-right {

    display: flex;

    align-items: center;

    gap: 24px;

    width: 37%;

}

.sessions-left {
    justify-content: flex-start;
}

.sessions-right {
    justify-content: flex-end;
}

/* =====================================================
   SESSION ITEM
===================================================== */

.session-item {

    display: flex;

    align-items: center;

    gap: 10px;

    min-width: 145px;

}

.session-icon {

    width: 34px;
    height: 34px;

    stroke: #ffffff;
    fill: none;

    flex-shrink: 0;

    filter:
        drop-shadow(0 0 6px #00ff88);

}

.session-text {

    display: flex;

    flex-direction: column;

    line-height: 1.1;

}

.session-name {

    font-size: 13px;

    color: #ffae4a;

    text-shadow:
        0 0 6px #ffae4a;

}

.session-status {

    margin-top: 3px;

    font-size: 18px;

    font-weight: bold;

    white-space: nowrap;

    transition:
        color 0.2s,
        text-shadow 0.2s;

}

/* =====================================================
   SESSION COLORS
===================================================== */

.session-status.open {

    color: #00ff88;

    text-shadow:
        0 0 8px #00ff88;

}

.session-status.closed {

    color: #ff5555;

    text-shadow:
        0 0 8px #ff5555;

}

.session-status.warning {

    color: #ffae4a;

    text-shadow:
        0 0 8px #ffae4a;

}

/* =====================================================
   SESSION BLINK
===================================================== */

.session-item.session-warning
.session-status {

    animation:
        sessionBlink 0.65s ease-in-out infinite;

}

@keyframes sessionBlink {

    0%, 100% {
        opacity: 1;
    }

    50% {
        opacity: 0.12;
    }

}

/* =====================================================
   CENTER MARKET STATUS
===================================================== */

.market-status {

    width: 26%;

    height: 100%;

    display: none;

    align-items: center;

    justify-content: center;

    text-align: center;

}

.market-status-inner {

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    line-height: 1.1;

}

.market-status-label {

    font-size: 13px;

    color: #ffae4a;

    text-shadow:
        0 0 6px #ffae4a;

}

#market-status-value {

    margin-top: 5px;

    font-size: 22px;

    font-weight: bold;

}

#market-status-value.market-closed {

    color: #ff5555;

    text-shadow:
        0 0 8px #ff5555;

}

#market-status-value.bank-holiday {

    color: #ffae4a;

    text-shadow:
        0 0 8px #ffae4a;

}

/* =====================================================
   WEEKEND MODE
===================================================== */

.top-bar.weekend {

    justify-content: center;

}

.top-bar.weekend
.sessions-left,
.top-bar.weekend
.sessions-right {

    display: none;

}

.top-bar.weekend
.market-status {

    display: flex;

    width: 100%;

}

/* =====================================================
   WEBCAM
===================================================== */

.webcam-frame {

    position: absolute;

    bottom: 170px;
    left: 80px;

    width: 430px;
    height: 250px;

    border: 4px solid #00ff66;

    background:
        rgba(0, 0, 0, 0.18);

    box-shadow:
        0 0 25px rgba(0, 255, 102, 1),
        0 0 55px rgba(0, 255, 102, 0.85),
        0 0 110px rgba(0, 255, 102, 0.65),
        0 0 160px rgba(0, 255, 102, 0.45);

}

/* =====================================================
   BOTTOM BAR
===================================================== */

.bottom-bar {

    position: absolute;

    bottom: 55px;
    left: 50%;

    transform: translateX(-50%);

    width: 86%;
    height: 80px;

    clip-path: polygon(
        0 0,
        100% 0,
        100% calc(100% - 18px),
        calc(100% - 18px) 100%,
        18px 100%,
        0 calc(100% - 18px)
    );

    background:
        rgba(0, 0, 0, 0.35);

    border: 2px solid #00ff88;

    box-shadow:
        0 0 14px #00ff88,
        inset 0 0 14px #00ff88;

    display: flex;

    justify-content: space-between;
    align-items: center;

    padding: 0 40px;

    box-sizing: border-box;

}

/* =====================================================
   BOTTOM TEXT
===================================================== */

.bottom-item span {

    font-family: Arial, sans-serif;

    font-size: 18px;

    font-weight: bold;

    line-height: 1;

    display: flex;

    align-items: center;

    white-space: nowrap;

}

.bottom-item {

    display: flex;

    align-items: center;

    gap: 10px;

}

.bottom-item:not(.subscribe) span {

    color: #4da6ff;

    text-shadow:
        0 0 6px #4da6ff;

}

/* =====================================================
   BOTTOM ICON
===================================================== */

.bottom-icon {

    width: 40px;
    height: 40px;

    stroke: #ffffff;

    fill: none;

    display: flex;

    align-items: center;

    flex-shrink: 0;

    filter:
        drop-shadow(0 0 4px #ffb347);

}

/* =====================================================
   SUBSCRIBE
===================================================== */

.subscribe {

    position: relative;

    width: 145px;
    min-width: 145px;
    max-width: 145px;

    height: 40px;

    flex-shrink: 0;

}

.promo-state {

    position: absolute;

    left: 0;
    top: 50%;

    transform: translateY(-50%);

    display: flex;

    align-items: center;

    gap: 10px;

    white-space: nowrap;

}

.subscribe-state span {

    font-size: 18px;

    font-weight: bold;

    color: #ff3333;

    text-shadow:
        0 0 5px rgba(255,51,51,0.55);

}

.bell-icon {

    stroke: #ff3333;

    filter:
        drop-shadow(0 0 4px #ff3333);

    transform-origin: 50% 15%;

}

.subscribe-state .bell-icon {

    animation:
        bellMiddle 10s ease-in-out infinite;

}

@keyframes bellMiddle {

    0%, 45%, 100% {
        transform: rotate(0deg);
    }

    47% {
        transform: rotate(-6deg);
    }

    48.5% {
        transform: rotate(6deg);
    }

    50% {
        transform: rotate(-4deg);
    }

    51.5% {
        transform: rotate(0deg);
    }

    53% {
        transform: rotate(-6deg);
    }

    54.5% {
        transform: rotate(6deg);
    }

    56% {
        transform: rotate(-4deg);
    }

    57.5% {
        transform: rotate(0deg);
    }

}

/* =====================================================
   LIKE
===================================================== */

.like-state {

    display: none;

}

.like-state span {

    font-size: 18px;

    font-weight: bold;

    color: #4da6ff;

    text-shadow:
        0 0 5px rgba(77,166,255,0.55);

}

.like-icon {

    stroke: #4da6ff;

    filter:
        drop-shadow(0 0 4px #4da6ff);

    transform-origin: center;

}

.like-pulse {

    animation:
        likePulse 10s ease-in-out infinite;

}

@keyframes likePulse {

    0% {
        transform: scale(0.82);
    }

    8% {
        transform: scale(1.10);
    }

    15% {
        transform: scale(0.88);
    }

    22% {
        transform: scale(1.12);
    }

    29% {
        transform: scale(0.88);
    }

    38%, 100% {
        transform: scale(1);
    }

}

/* =====================================================
   VIP
===================================================== */

.vip {

    position: relative;

    overflow: hidden;

}

.vip span {

    animation:
        vipPulse 1.8s infinite ease-in-out;

}

@keyframes vipPulse {

    0%, 100% {
        text-shadow:
            0 0 6px #00ff88;
    }

    50% {
        text-shadow:
            0 0 18px #00ff88;
    }

}

.vip .shine {

    position: absolute;

    top: 0;
    left: -120%;

    width: 80%;
    height: 100%;

    background:
        linear-gradient(
            120deg,
            transparent,
            rgba(255,255,255,0.4),
            transparent
        );

    animation:
        shineSweep 3s infinite;

}

@keyframes shineSweep {

    0% {
        left: -120%;
    }

    50%, 100% {
        left: 120%;
    }

}

</style>

<script>

/* =====================================================
   SESSION CONFIGURATION
===================================================== */

const sessions = [

    {
        id: "sydney",
        name: "Sydney",
        timeZone: "Australia/Sydney",
        openHour: 8,
        closeHour: 17
    },

    {
        id: "tokyo",
        name: "Tokyo",
        timeZone: "Asia/Tokyo",
        openHour: 9,
        closeHour: 18
    },

    {
        id: "london",
        name: "London",
        timeZone: "Europe/London",
        openHour: 8,
        closeHour: 17
    },

    {
        id: "newyork",
        name: "New York",
        timeZone: "America/New_York",
        openHour: 9,
        openMinute: 30,
        closeHour: 16,
        closeMinute: 0
    }

];


/* =====================================================
   ELEMENTS
===================================================== */

const topBar =
    document.getElementById(
        "top-bar"
    );

const marketStatusValue =
    document.getElementById(
        "market-status-value"
    );


/* =====================================================
   TIME ZONE PARTS
===================================================== */

function getTimeZoneParts(
    date,
    timeZone
) {

    const parts =
        new Intl.DateTimeFormat(
            "en-US",
            {
                timeZone,
                year: "numeric",
                month: "2-digit",
                day: "2-digit",
                hour: "2-digit",
                minute: "2-digit",
                second: "2-digit",
                hourCycle: "h23"
            }
        ).formatToParts(date);


    const result = {};


    parts.forEach(
        part => {

            if (
                part.type !== "literal"
            ) {

                result[part.type] =
                    part.value;

            }

        }
    );


    return {

        year: Number(result.year),
        month: Number(result.month),
        day: Number(result.day),
        hour: Number(result.hour),
        minute: Number(result.minute),
        second: Number(result.second)

    };

}


/* =====================================================
   TIME ZONE OFFSET
===================================================== */

function getTimeZoneOffset(
    date,
    timeZone
) {

    const parts =
        new Intl.DateTimeFormat(
            "en-US",
            {
                timeZone,
                year: "numeric",
                month: "2-digit",
                day: "2-digit",
                hour: "2-digit",
                minute: "2-digit",
                second: "2-digit",
                hourCycle: "h23"
            }
        ).formatToParts(date);


    const values = {};


    parts.forEach(
        part => {

            if (
                part.type !== "literal"
            ) {

                values[part.type] =
                    part.value;

            }

        }
    );


    const asUTC =
        Date.UTC(
            Number(values.year),
            Number(values.month) - 1,
            Number(values.day),
            Number(values.hour),
            Number(values.minute),
            Number(values.second)
        );


    return (
        asUTC -
        date.getTime()
    );

}


/* =====================================================
   CREATE TIMESTAMP IN TIMEZONE
===================================================== */

function getTimestamp(
    date,
    timeZone,
    hour,
    minute = 0
) {

    const local =
        getTimeZoneParts(
            date,
            timeZone
        );


    const utcGuess =
        Date.UTC(
            local.year,
            local.month - 1,
            local.day,
            hour,
            minute,
            0
        );


    const offset =
        getTimeZoneOffset(
            new Date(utcGuess),
            timeZone
        );


    return (
        utcGuess -
        offset
    );

}


/* =====================================================
   SESSION STATUS
===================================================== */

function getSessionStatus(
    now,
    session
) {

    const open =
        getTimestamp(
            now,
            session.timeZone,
            session.openHour,
            session.openMinute || 0
        );


    const close =
        getTimestamp(
            now,
            session.timeZone,
            session.closeHour,
            session.closeMinute || 0
        );


    const current =
        now.getTime();


    const fiveMinutes =
        5 * 60 * 1000;


    /* ================================================
       BEFORE OPEN
    ================================================ */

    if (
        current < open
    ) {

        const remaining =
            open - current;


        if (
            remaining <= fiveMinutes
        ) {

            return {
                state: "warning",
                label: "OPEN SOON"
            };

        }


        return {
            state: "closed",
            label: "CLOSED"
        };

    }


    /* ================================================
       FIVE MINUTES BEFORE CLOSE
    ================================================ */

    if (
        current >= open &&
        current < close
    ) {

        const remaining =
            close - current;


        if (
            remaining <= fiveMinutes
        ) {

            return {
                state: "warning",
                label: "CLOSING"
            };

        }


        return {
            state: "open",
            label: "OPEN"
        };

    }


    /* ================================================
       AFTER CLOSE
    ================================================ */

    return {
        state: "closed",
        label: "CLOSED"
    };

}


/* =====================================================
   UPDATE ONE SESSION
===================================================== */

function updateSession(
    session,
    now
) {

    const item =
        document.getElementById(
            "session-" +
            session.id
        );


    const statusElement =
        document.getElementById(
            "status-" +
            session.id
        );


    const status =
        getSessionStatus(
            now,
            session
        );


    statusElement.classList.remove(
        "open",
        "closed",
        "warning"
    );


    item.classList.remove(
        "session-warning"
    );


    statusElement.classList.add(
        status.state
    );


    statusElement.innerText =
        status.label;


    if (
        status.state ===
        "warning"
    ) {

        item.classList.add(
            "session-warning"
        );

    }

}


/* =====================================================
   WEEKEND
===================================================== */

function isWeekendInNewYork(
    now
) {

    const weekday =
        new Intl.DateTimeFormat(
            "en-US",
            {
                timeZone:
                    "America/New_York",

                weekday:
                    "short"
            }
        ).format(now);


    return (
        weekday === "Sat" ||
        weekday === "Sun"
    );

}


/* =====================================================
   NEW YORK DATE KEY
===================================================== */

function getNewYorkDateKey(
    now
) {

    const p =
        getTimeZoneParts(
            now,
            "America/New_York"
        );


    return (
        p.year +
        "-" +
        String(p.month).padStart(2, "0") +
        "-" +
        String(p.day).padStart(2, "0")
    );

}


/* =====================================================
   NYSE HOLIDAYS
===================================================== */

const nyseHolidays = {

    "2026-01-01":
        "NEW YEAR'S DAY",

    "2026-01-19":
        "MARTIN LUTHER KING JR. DAY",

    "2026-02-16":
        "WASHINGTON'S BIRTHDAY",

    "2026-04-03":
        "GOOD FRIDAY",

    "2026-05-25":
        "MEMORIAL DAY",

    "2026-06-19":
        "JUNETEENTH",

    "2026-07-03":
        "INDEPENDENCE DAY",

    "2026-09-07":
        "LABOR DAY",

    "2026-11-26":
        "THANKSGIVING DAY",

    "2026-12-25":
        "CHRISTMAS DAY"

};


/* =====================================================
   WEEKEND / HOLIDAY MARKET STATUS
===================================================== */

function updateMarketStatus() {

    const now =
        new Date();


    const weekend =
        isWeekendInNewYork(
            now
        );


    if (
        !weekend
    ) {

        topBar.classList.remove(
            "weekend"
        );

        return;

    }


    topBar.classList.add(
        "weekend"
    );


    const key =
        getNewYorkDateKey(
            now
        );


    marketStatusValue.classList.remove(
        "market-closed",
        "bank-holiday"
    );


    if (
        nyseHolidays[key]
    ) {

        marketStatusValue.classList.add(
            "bank-holiday"
        );

        marketStatusValue.innerText =
            "BANK HOLIDAY";

    }
    else {

        marketStatusValue.classList.add(
            "market-closed"
        );

        marketStatusValue.innerText =
            "MARKET CLOSED";

    }

}


/* =====================================================
   MAIN UPDATE
===================================================== */

function updateOverlay() {

    const now =
        new Date();


    const weekend =
        isWeekendInNewYork(
            now
        );


    /* ================================================
       WEEKEND
    ================================================ */

    if (
        weekend
    ) {

        updateMarketStatus();

        return;

    }


    /* ================================================
       WEEKDAY
    ================================================ */

    topBar.classList.remove(
        "weekend"
    );


    sessions.forEach(
        session => {

            updateSession(
                session,
                now
            );

        }
    );

}


/* =====================================================
   START
===================================================== */

updateOverlay();

setInterval(
    updateOverlay,
    1000
);


/* =====================================================
   SUBSCRIBE / LIKE
===================================================== */

const subscribeState =
    document.querySelector(
        ".subscribe-state"
    );

const likeState =
    document.querySelector(
        ".like-state"
    );

const likeIcon =
    document.querySelector(
        ".like-icon"
    );


setInterval(
    function () {

        if (
            subscribeState.style.display !==
            "none"
        ) {

            subscribeState.style.display =
                "none";

            likeState.style.display =
                "flex";


            likeIcon.classList.remove(
                "like-pulse"
            );


            void likeIcon.offsetWidth;


            likeIcon.classList.add(
                "like-pulse"
            );

        }
        else {

            likeState.style.display =
                "none";

            subscribeState.style.display =
                "flex";

        }

    },
    10000
);

</script>
