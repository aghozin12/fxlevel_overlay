<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FX LEVEL Overlay</title>

<style>

/* =====================================================
   صفحه اصلی
===================================================== */

html, body {
    width: 1920px;
    height: 1080px;
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #808080;
    font-family: Arial, sans-serif;
    color: white;
}


/* =====================================================
   شبکه پس‌زمینه
===================================================== */

body::before {
    content: "";
    position: absolute;
    inset: 0;

    background-image:
        linear-gradient(
            rgba(0,255,136,0.40) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(0,255,136,0.40) 1px,
            transparent 1px
        );

    background-size: 40px 40px;
    pointer-events: none;
}


/* =====================================================
   فریم اصلی
===================================================== */

.main-frame {
    position: absolute;

    top: 40px;
    left: 40px;

    width: calc(100% - 80px);
    height: calc(100% - 80px);

    clip-path: polygon(
        25px 0,
        calc(100% - 25px) 0,
        100% 25px,
        100% calc(100% - 25px),
        calc(100% - 25px) 100%,
        25px 100%,
        0 calc(100% - 25px),
        0 25px
    );

    background: rgba(0, 0, 0, 0.18);

    border: 3px solid #00ff88;

    box-shadow:
        0 0 25px #00ff88,
        inset 0 0 25px #00ff88;
}


/* =====================================================
   نوار بالا
===================================================== */

.top-bar {
    position: absolute;

    top: 55px;
    left: 50%;

    transform: translateX(-50%);

    width: 86%;
    height: 90px;

    clip-path: polygon(
        18px 0,
        calc(100% - 18px) 0,
        100% 18px,
        100% 100%,
        0 100%,
        0 18px
    );

    background: rgba(0, 0, 0, 0.35);

    border: 2px solid #00ff88;

    box-shadow:
        0 0 14px #00ff88,
        inset 0 0 14px #00ff88;

    display: flex;

    justify-content: space-between;
    align-items: center;

    padding: 0 35px;

    box-sizing: border-box;
}


/* =====================================================
   آیتم‌های نوار بالا
===================================================== */

.top-item {
    flex: 1;

    display: flex;

    justify-content: center;
}

.item-row {
    display: flex;

    align-items: center;

    gap: 14px;
}


/* آیکون‌های بالا */

.icon {
    width: 40px;
    height: 40px;

    stroke: #ffffff;
    fill: none;

    filter:
        drop-shadow(0 0 6px #00ff88);
}


/* متن‌های بالا */

.text-box {
    display: flex;

    flex-direction: column;

    line-height: 1.1;
}


.text-box span:first-child {
    font-size: 14px;

    color: #ffae4a;

    text-shadow:
        0 0 6px #ffae4a;
}


.text-box span:last-child {
    font-size: 22px;

    font-weight: bold;

    color: #00ff88;

    text-shadow:
        0 0 8px #00ff88;
}


/* جداکننده بالا */

.divider {
    width: 1px;

    height: 60%;

    background:
        rgba(255,255,255,0.35);
}


/* =====================================================
   وبکم
===================================================== */

.webcam-frame {
    position: absolute;

    bottom: 170px;
    left: 80px;

    width: 430px;
    height: 250px;

    border: 4px solid #00ff66;

    border-radius: 0;

    background:
        rgba(0, 0, 0, 0.18);

    box-shadow:
        0 0 25px rgba(0, 255, 102, 1),
        0 0 55px rgba(0, 255, 102, 0.85),
        0 0 110px rgba(0, 255, 102, 0.65),
        0 0 160px rgba(0, 255, 102, 0.45);
}


/* =====================================================
   نوار پایین
===================================================== */

.bottom-bar {
    position: absolute;

    bottom: 55px;
    left: 50%;

    transform: translateX(-50%);

    width: 86%;
    height: 80px;

    clip-path: polygon(
        0 0,
        100% 0,
        100% calc(100% - 18px),
        calc(100% - 18px) 100%,
        18px 100%,
        0 calc(100% - 18px)
    );

    background:
        rgba(0, 0, 0, 0.35);

    border: 2px solid #00ff88;

    box-shadow:
        0 0 14px #00ff88,
        inset 0 0 14px #00ff88;

    display: flex;

    justify-content: space-between;
    align-items: center;

    padding: 0 40px;

    box-sizing: border-box;
}


/* =====================================================
   فونت یکسان تمام نوشته‌های نوار پایین
===================================================== */

.bottom-item span {
    font-family: Arial, sans-serif;

    font-size: 18px;

    font-weight: bold;

    line-height: 1;

    display: flex;

    align-items: center;

    white-space: nowrap;
}


/* =====================================================
   آیتم‌های نوار پایین
===================================================== */

.bottom-item {
    display: flex;

    align-items: center;

    gap: 10px;
}


/* =====================================================
   رنگ متن‌های معمولی نوار پایین
===================================================== */

.bottom-item:not(.subscribe) span {
    color: #4da6ff;

    text-shadow:
        0 0 6px #4da6ff;
}


/* =====================================================
   آیکون‌های نوار پایین
===================================================== */

.bottom-icon {
    width: 40px;
    height: 40px;

    stroke: #ffffff;

    fill: none;

    display: flex;

    align-items: center;

    flex-shrink: 0;

    filter:
        drop-shadow(0 0 4px #ffb347);
}


/* =====================================================
   بخش ثابت SUBSCRIBE / LIKE
===================================================== */

.subscribe {
    position: relative;

    width: 145px;
    min-width: 145px;
    max-width: 145px;

    height: 40px;

    flex-shrink: 0;
}


/*
   هر دو حالت در یک نقطه قرار می‌گیرند
   تا نوار جابه‌جا نشود.
*/

.promo-state {
    position: absolute;

    left: 0;
    top: 50%;

    transform: translateY(-50%);

    display: flex;

    align-items: center;

    gap: 10px;

    white-space: nowrap;
}


/* =====================================================
   SUBSCRIBE
===================================================== */

.subscribe-state span {
    font-family: Arial, sans-serif;

    font-size: 18px;

    font-weight: bold;

    color: #ff3333;

    text-shadow:
        0 0 5px rgba(255,51,51,0.55);
}


/* =====================================================
   زنگوله
===================================================== */

.bell-icon {
    stroke: #ff3333;

    filter:
        drop-shadow(0 0 4px #ff3333);

    transform-origin: 50% 15%;
}


/*
   در هر ۱۰ ثانیه،
   زنگوله دو بار لرزش دارد.

   حرکت اصلی در نیمه چرخه اتفاق می‌افتد.
*/

.subscribe-state .bell-icon {
    animation:
        bellMiddle 10s ease-in-out infinite;
}


@keyframes bellMiddle {

    /* شروع */

    0% {
        transform: rotate(0deg);
    }


    /* تا نیمه تقریباً ثابت */

    45% {
        transform: rotate(0deg);
    }


    /* لرزش اول */

    47% {
        transform: rotate(-6deg);
    }

    48.5% {
        transform: rotate(6deg);
    }

    50% {
        transform: rotate(-4deg);
    }

    51.5% {
        transform: rotate(0deg);
    }


    /* مکث کوتاه */


    /* لرزش دوم */

    53% {
        transform: rotate(-6deg);
    }

    54.5% {
        transform: rotate(6deg);
    }

    56% {
        transform: rotate(-4deg);
    }

    57.5% {
        transform: rotate(0deg);
    }


    /* پایان */

    100% {
        transform: rotate(0deg);
    }
}


/* =====================================================
   LIKE
===================================================== */

.like-state {
    display: none;
}


.like-state span {
    font-family: Arial, sans-serif;

    font-size: 18px;

    font-weight: bold;

    color: #4da6ff;

    text-shadow:
        0 0 5px rgba(77,166,255,0.55);
}


/* آیکون لایک */

.like-icon {
    stroke: #4da6ff;

    filter:
        drop-shadow(0 0 4px #4da6ff);

    transform-origin: center;
}


/* =====================================================
   انیمیشن لایک
===================================================== */

/*
   وقتی LIKE نمایش داده می‌شود،
   دو بار کوچک و بزرگ می‌شود.
*/

.like-pulse {
    animation:
        likePulse 10s ease-in-out infinite;
}


@keyframes likePulse {

    /* شروع */

    0% {
        transform: scale(0.82);
    }


    /* حرکت اول */

    8% {
        transform: scale(1.10);
    }

    15% {
        transform: scale(0.88);
    }


    /* حرکت دوم */

    22% {
        transform: scale(1.12);
    }

    29% {
        transform: scale(0.88);
    }


    /* برگشت آرام */

    38% {
        transform: scale(1);
    }


    /* بقیه زمان ثابت */

    100% {
        transform: scale(1);
    }
}


/* =====================================================
   VIP
===================================================== */

.vip {
    position: relative;

    overflow: hidden;
}


.vip span {
    animation:
        vipPulse 1.8s infinite ease-in-out;
}


@keyframes vipPulse {

    0% {
        text-shadow:
            0 0 6px #00ff88;
    }

    50% {
        text-shadow:
            0 0 18px #00ff88;
    }

    100% {
        text-shadow:
            0 0 6px #00ff88;
    }
}


/* Shine */

.vip .shine {
    position: absolute;

    top: 0;
    left: -120%;

    width: 80%;
    height: 100%;

    background:
        linear-gradient(
            120deg,
            transparent,
            rgba(255,255,255,0.4),
            transparent
        );

    animation:
        shineSweep 3s infinite;
}


@keyframes shineSweep {

    0% {
        left: -120%;
    }

    50% {
        left: 120%;
    }

    100% {
        left: 120%;
    }
}



/* =====================================================
   هشدار تغییر سشن - ۵ دقیقه مانده به شروع سشن بعدی
===================================================== */

#newyork-value.session-time-blink {

}

@keyframes sessionTimeBlink {
    0%, 100% {
        opacity: 1;
    }

    50% {
        opacity: 0.15;
    }
}
</style>

<script>


/* =====================================================
   ساعت، تاریخ و سشن‌ها
===================================================== */

/*
   زمان شروع سشن‌ها بر اساس وقت تهران:
   Sydney    = 12:30
   Tokyo     = 03:30
   London    = 10:30
   New York  = 16:30

   منطق انتخاب سشن:
   همیشه آخرین سشنی که شروع شده، سشن فعال است.
   بنابراین از 00:00 تا 03:29، آخرین سشن بازشده New York است
   که از روز قبل در حال فعالیت بوده است.
*/

const tradingSessions = [
    {
        name: "Sydney",
        start: 12 * 60 + 30,
        timeZone: "Australia/Sydney"
    },
    {
        name: "Tokyo",
        start: 3 * 60 + 30,
        timeZone: "Asia/Tokyo"
    },
    {
        name: "London",
        start: 10 * 60 + 30,
        timeZone: "Europe/London"
    },
    {
        name: "New York",
        start: 16 * 60 + 30,
        timeZone: "America/New_York"
    }
];

const sessionValue =
    document.getElementById("session-value");

const sessionClockLabel =
    document.getElementById("session-clock-label");

const sessionClockValue =
    document.getElementById("newyork-value");

const tehranClockValue =
    document.getElementById("tehran-value");

function getTehranParts(date = new Date()) {

    const parts = new Intl.DateTimeFormat(
        "en-US",
        {
            timeZone: "Asia/Tehran",
            hour: "2-digit",
            minute: "2-digit",
            hourCycle: "h23"
        }
    ).formatToParts(date);

    const result = {};

    parts.forEach(part => {
        if (part.type !== "literal") {
            result[part.type] = part.value;
        }
    });

    return {
        hour: parseInt(result.hour, 10),
        minute: parseInt(result.minute, 10)
    };
}

function getActiveSession(tehranMinutes) {

    /*
       ترتیب از جدیدترین شروع به قدیمی‌ترین شروع است.
       اگر قبل از 03:30 باشیم، New York سشن فعال باقی می‌ماند
       چون شروع آن در 16:30 روز قبل بوده است.
    */

    if (tehranMinutes >= 16 * 60 + 30) {
        return tradingSessions[3];
    }

    if (tehranMinutes >= 12 * 60 + 30) {
        return tradingSessions[0];
    }

    if (tehranMinutes >= 10 * 60 + 30) {
        return tradingSessions[2];
    }

    if (tehranMinutes >= 3 * 60 + 30) {
        return tradingSessions[1];
    }

    return tradingSessions[3];
}

function getNextSession(tehranMinutes) {

    /*
       نزدیک‌ترین شروع بعدی را پیدا می‌کنیم.
       اگر از آخرین شروع روز عبور کرده باشیم، شروع Sydney
       در روز بعد، شروع بعدی خواهد بود.
    */

    const futureSessions = tradingSessions
        .filter(session => session.start > tehranMinutes)
        .sort((a, b) => a.start - b.start);

    return futureSessions.length > 0
        ? futureSessions[0]
        : tradingSessions[0];
}

function getMinutesUntilNextSession(
    tehranMinutes,
    nextSession
) {

    let difference =
        nextSession.start - tehranMinutes;

    if (difference <= 0) {
        difference += 24 * 60;
    }

    return difference;
}

function getSessionTime(timeZone, date = new Date()) {

    return new Intl.DateTimeFormat(
        "en-US",
        {
            timeZone,
            hour: "2-digit",
            minute: "2-digit",
            hour12: true
        }
    ).format(date);
}

function updateClocks() {

    const now = new Date();

    /* ================================
       زمان تهران برای تشخیص سشن
    ================================ */

    const tehran = getTehranParts(now);

    const tehranMinutes =
        tehran.hour * 60 + tehran.minute;

    /* ================================
       نمایش ساعت واقعی تهران
    ================================ */

    tehranClockValue.innerText =
        getSessionTime("Asia/Tehran", now);

    /* ================================
       سشن فعال
    ================================ */

    const activeSession =
        getActiveSession(tehranMinutes);

    /* ================================
       سشن بعدی
    ================================ */

    const nextSession =
        getNextSession(tehranMinutes);

    const minutesUntilNext =
        getMinutesUntilNextSession(
            tehranMinutes,
            nextSession
        );

    /* ================================
       نمایش نام سشن
    ================================ */

    sessionValue.innerText =
        activeSession.name;

    /* ================================
       نمایش ساعت سشن فعال
    ================================ */

    sessionClockLabel.innerText =
        activeSession.name.toUpperCase();

    sessionClockValue.innerText =
        getSessionTime(
            activeSession.timeZone,
            now
        );

    /* ================================
       چشمک زدن ۵ دقیقه مانده به سشن بعدی
    ================================ */

    if (
        minutesUntilNext <= 5 &&
        minutesUntilNext > 0
    ) {
        sessionClockValue.classList.add(
            "session-time-blink"
        );
    } else {
        sessionClockValue.classList.remove(
            "session-time-blink"
        );
    }

    /* ================================
       تاریخ تهران
    ================================ */

    const today =
        new Date().toLocaleDateString(
            "en-US",
            {
                timeZone: "Asia/Tehran",
                day: "2-digit",
                month: "short",
                year: "numeric"
            }
        );

    document.getElementById(
        "date-value"
    ).innerText = today;
}

setInterval(
    updateClocks,
    1000
);

updateClocks();


/* =====================================================
   خبر
===================================================== */

async function updateNews() {

    try {

        const rssUrl =
            "https://www.marketwatch.com/rss/topstories";


        const response =
            await fetch(
                `https://api.allorigins.win/get?url=${encodeURIComponent(rssUrl)}`
            );


        const data =
            await response.json();


        const parser =
            new DOMParser();


        const xml =
            parser.parseFromString(
                data.contents,
                "text/xml"
            );


        const firstItem =
            xml.querySelector(
                "item > title"
            ).textContent;


        const shortTitle =
            firstItem.length > 55
                ? firstItem.slice(0, 55) + "..."
                : firstItem;


        document.getElementById(
            "news-value"
        ).innerText = shortTitle;

    }

    catch (e) {

        document.getElementById(
            "news-value"
        ).innerText = "Loading...";

    }
}


updateNews();


setInterval(
    updateNews,
    30000
);


/* =====================================================
   SUBSCRIBE / LIKE
===================================================== */

const subscribeState =
    document.querySelector(
        ".subscribe-state"
    );


const likeState =
    document.querySelector(
        ".like-state"
    );


const likeIcon =
    document.querySelector(
        ".like-icon"
    );


/*
   هر ۱۰ ثانیه تغییر می‌کند.
*/

setInterval(
    function () {

        /* =============================================
           SUBSCRIBE → LIKE
        ============================================= */

        if (
            subscribeState.style.display !== "none"
        ) {

            subscribeState.style.display =
                "none";

            likeState.style.display =
                "flex";


            /*
               انیمیشن لایک از کوچک به بزرگ
               دو بار در چرخه ۱۰ ثانیه‌ای
            */

            likeIcon.classList.remove(
                "like-pulse"
            );


            void likeIcon.offsetWidth;


            likeIcon.classList.add(
                "like-pulse"
            );

        }


        /* =============================================
           LIKE → SUBSCRIBE
        ============================================= */

        else {

            likeState.style.display =
                "none";

            subscribeState.style.display =
                "flex";

        }

    },
    10000
);

</script>
