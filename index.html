<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<title>FX LEVEL Overlay</title>

<style>

/* =====================================================
   صفحه اصلی
===================================================== */

html,
body {

    width: 1920px;
    height: 1080px;

    margin: 0;
    padding: 0;

    overflow: hidden;

    background: #303030;

    font-family: Arial, sans-serif;

    color: white;
}


/* =====================================================
   شبکه پس‌زمینه
===================================================== */

body::before {

    content: "";

    position: absolute;

    inset: 0;

    background-image:

        linear-gradient(
            rgba(0,217,255,0.40) 1px,
            transparent 1px
        ),

        linear-gradient(
            90deg,
            rgba(0,217,255,0.40) 1px,
            transparent 1px
        );

    background-size: 40px 40px;

    pointer-events: none;
}


/* =====================================================
   فریم اصلی
   فقط Layout تغییر کرده
===================================================== */

.main-frame {

    position: absolute;

    top: 2px;
    left: 2px;

    width: calc(100% - 8px);
    height: calc(100% - 8px);
    box-sizing: border-box;

    clip-path: polygon(

        25px 0,
        calc(100% - 25px) 0,
        100% 25px,
        100% calc(100% - 25px),
        calc(100% - 25px) 100%,
        25px 100%,
        0 calc(100% - 25px),
        0 25px

    );

    background: rgba(0, 0, 0, 0.18);

    /* قاب یکدست فیروزه‌ای؛ پس‌زمینه و اجزای داخل قاب بدون تغییر */
    border: 3px solid #00d9ff;

    box-shadow:
        0 0 25px rgba(0, 217, 255, 0.75),
        inset 0 0 25px rgba(0, 217, 255, 0.45);
}


/* =====================================================
   نوار بالا
===================================================== */

.top-bar {

    position: absolute;

    top: 10px;
    left: 50%;

    transform: translateX(-50%);

    width: 92%;
    height: 90px;

    clip-path: polygon(

        18px 0,
        calc(100% - 18px) 0,
        100% 18px,
        100% 100%,
        0 100%,
        0 18px

    );

    background: linear-gradient(
        110deg,
        rgba(5, 18, 23, 0.94) 0%,
        rgba(8, 28, 30, 0.90) 48%,
        rgba(8, 16, 28, 0.94) 100%
    );

    border: 2px solid rgba(0, 210, 255, 0.95);

    box-shadow:
        0 0 8px rgba(0, 217, 255, 0.72),
        0 0 22px rgba(0, 217, 255, 0.25),
        inset 0 0 18px rgba(0, 217, 255, 0.10),
        inset 0 1px 0 rgba(255, 255, 255, 0.12);

    backdrop-filter: blur(5px);

    display: flex;

    justify-content: space-between;

    align-items: center;

    padding: 0 30px;

    box-sizing: border-box;
}


/* =====================================================
   آیتم‌های نوار بالا
===================================================== */

.top-item {

    flex: 1;

    min-width: 0;

    height: 100%;

    display: flex;

    justify-content: center;

    align-items: center;

    overflow: hidden;
    position: relative;
}

/* عرض بخش‌های نوار بالا یکسان باشد */
.top-item.next-event-item {
    flex: 1 1 0;
    min-width: 0;
    overflow: visible;
}

.top-item.next-event-item .text-box {
    overflow: visible;
    min-width: 0;
}

.top-item.next-event-item .item-row {
    gap: 5px;
}

.top-item.next-event-item .icon {
    width: 30px;
    height: 30px;
    flex-basis: 30px;
}

.top-item.next-event-item .next-event-value {
    gap: 4px;
    font-size: 18px;
}

.top-item.next-event-item .next-open {
    font-size: 16px;
}

.top-item.next-event-item .next-countdown {
    width: 86px;
    flex-basis: 86px;
    font-size: 17px;
}

.top-item + .top-item::before {

    content: "";
    position: absolute;
    left: 0;
    top: 23%;
    height: 54%;
    width: 1px;
    background: linear-gradient(
        to bottom,
        transparent,
        rgba(0, 210, 255, 0.42),
        rgba(255, 174, 74, 0.32),
        transparent
    );
    box-shadow: 0 0 5px rgba(0, 210, 255, 0.16);
}


.item-row {

    width: 100%;

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 12px;

    box-sizing: border-box;

    min-width: 0;
}


/* =====================================================
   آیکون‌های بالا
===================================================== */

.icon {

    width: 40px;
    height: 40px;

    flex: 0 0 40px;

    stroke: #b8f8ff;

    fill: none;

    filter:
        drop-shadow(0 0 4px rgba(0, 210, 255, 0.85));
}


/* =====================================================
   متن‌های بالا
===================================================== */

.text-box {

    min-width: 0;

    height: 44px;

    display: flex;

    flex-direction: column;

    justify-content: center;

    line-height: 1.1;

    text-align: left;

    overflow: hidden;
}


.text-box span:first-child {

    font-family: "Trebuchet MS", "Segoe UI", Arial, sans-serif;

    font-size: 14px;

    font-weight: 950;
    -webkit-text-stroke: 0.9px currentColor;

    letter-spacing: 2.1px;

    line-height: 20px;

    height: 20px;

    color: #ffad32;

    text-shadow:
        0 0 7px rgba(255, 157, 28, 0.72),
        0 0 14px rgba(255, 125, 20, 0.34),
        0 0 22px rgba(255, 157, 28, 0.16);

    white-space: nowrap;
}


.text-box span:last-child {

    font-family: "Segoe UI", Arial, sans-serif;

    font-size: 23px;

    font-weight: 750;

    letter-spacing: 0.35px;

    line-height: 24px;

    height: 24px;

    color: #8deeff;

    text-shadow:
        0 0 7px rgba(0, 217, 255, 0.62),
        0 0 16px rgba(0, 217, 255, 0.20);

    white-space: nowrap;

    font-variant-numeric:
        tabular-nums;
}

/* یکدست‌سازی ظاهر ساعت‌ها و مقادیر نوار بالا بر اساس ساعت تهران */
#market-value,
#tehran-value,
#date-value {
    font-family: "Segoe UI", Arial, sans-serif;
    font-size: 23px;
    font-weight: 750;
    letter-spacing: 0.35px;
    line-height: 24px;
    height: 24px;
    color: #73dfff;
    text-shadow: 0 0 7px rgba(75, 205, 255, 0.48), 0 0 15px rgba(75, 205, 255, 0.16);
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
}

/* حفظ رنگ اصلی تاریخ، در کنار یکسان ماندن فونت و اندازه */
#date-value {
    color: #d4c4ff;
    text-shadow: 0 0 7px rgba(170, 135, 255, 0.38);
}


/* =====================================================
   NEXT EVENT
===================================================== */

.next-event-value {

    display: flex;

    align-items: center;

    gap: 7px;

    white-space: nowrap;

    font-family: "Segoe UI", Arial, sans-serif;

    font-size: 22px;

    font-weight: 750;

    letter-spacing: 0.25px;

    line-height: 24px;

    height: 24px;

    color: #8deeff;

    text-shadow:
        0 0 7px rgba(0, 217, 255, 0.62),
        0 0 14px rgba(0, 217, 255, 0.18);

    font-variant-numeric:
        tabular-nums;

    min-width: 0;
}


.next-event-value .next-session {

    color: #00d9ff;

}


.next-event-value .next-open {

    color: #39ff88;

    font-family: "Trebuchet MS", "Segoe UI", Arial, sans-serif;

    font-size: 19px;

    font-weight: 950;
    -webkit-text-stroke: 0.75px currentColor;
    text-shadow: 0 0 7px rgba(57, 255, 136, 0.68), 0 0 14px rgba(25, 220, 100, 0.28);

    letter-spacing: 0.7px;

}


.next-event-value .next-separator {

    color: rgba(255,255,255,0.45);

    font-size: 15px;
}


.next-event-value .next-countdown {

    color: #00d9ff;

    font-size: 20px;

    font-variant-numeric:
        tabular-nums;

    /* عرض ثابت تا با تغییر اعداد تایمر، آیکون و نوشته‌ها جابه‌جا نشوند */
    display: inline-block;
    width: 104px;
    flex: 0 0 104px;
    text-align: center;
}


.next-event-value.warning {

    animation:
        nextEventWarning 0.72s ease-in-out infinite;
}


.next-event-value.warning .next-countdown {

    color: #ff3333;

    text-shadow:
        0 0 6px #ff3333,
        0 0 14px #ff3333;
}


@keyframes nextEventWarning {

    0%,
    100% {

        opacity: 1;
    }

    50% {

        opacity: 0.25;
    }
}


/* =====================================================
   جداکننده بالا
===================================================== */

.divider {

    width: 1px;

    height: 60%;

    flex: 0 0 1px;

    background:
        rgba(255,255,255,0.35);
}


/* =====================================================
   SESSION MAP
   Layout اصلاح شده - منطق Session دست نخورده
===================================================== */

.session-map {

    flex: 1.15;

    min-width: 0;

    max-width: 100%;

    display: flex;

    justify-content: center;

    align-items: center;

    position: relative;

    overflow: hidden;
}


.session-map-inner {

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    width: 100%;

    max-width: 100%;

    min-width: 0;

    position: relative;

    transform: translateY(7px);

    overflow: hidden;
}


/* =====================================================
   عنوان SESSION
===================================================== */

.session-map-title {

    font-family: "Trebuchet MS", "Segoe UI", Arial, sans-serif;

    font-size: 16px;

    font-weight: 950;

    letter-spacing: 3.8px;

    line-height: 19px;

    height: 19px;

    color: #ffae4a;

    text-shadow:

        0 0 6px #ffae4a,
        0 0 14px rgba(255,174,74,0.35);

    margin-bottom: 8px;

    position: relative;

    flex-shrink: 0;
}


/* =====================================================
   مپ اصلی
   محدود به محدوده خودش
===================================================== */

.session-track {

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 22px;

    height: 27px;

    width: 100%;

    max-width: 100%;

    min-width: 0;

    position: relative;

    white-space: nowrap;

    box-sizing: border-box;

    overflow: hidden;
}


/* =====================================================
   Session Node
===================================================== */

.session-node {

    display: flex;

    align-items: center;

    gap: 6px;

    position: relative;

    font-family: Arial, sans-serif;

    font-size: 15px;

    font-weight: 950;

    letter-spacing: 0.8px;

    color: rgba(255,255,255,0.42);

    transition:

        color 0.35s ease,

        text-shadow 0.35s ease,

        opacity 0.35s ease;

    flex: 0 1 auto;

    min-width: 0;

    white-space: nowrap;
}


.session-name {

    font-weight: 950;

    position: relative;

    z-index: 3;

    transition:

        color 0.35s ease,

        text-shadow 0.35s ease;

    white-space: nowrap;
}


/* =====================================================
   Dot
===================================================== */

.session-dot {

    width: 7px;
    height: 7px;

    flex: 0 0 7px;

    border-radius: 50%;

    background: rgba(255,255,255,0.25);

    box-shadow:

        0 0 2px rgba(255,255,255,0.15);

    position: relative;

    z-index: 3;

    transition:

        background 0.35s ease,

        box-shadow 0.35s ease,

        transform 0.35s ease;
}


/* =====================================================
   Halo
===================================================== */

.session-dot::before {

    content: "";

    position: absolute;

    width: 18px;
    height: 18px;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%)
        scale(0.65);

    border-radius: 50%;

    border: 1px solid
        rgba(0,217,255,0);

    opacity: 0;

    transition:

        opacity 0.3s ease,

        transform 0.3s ease,

        border-color 0.3s ease;
}


/* =====================================================
   Session Active
===================================================== */

.session-node.active {

    color: #00d9ff;

    text-shadow:

        0 0 5px #00d9ff,
        0 0 12px rgba(0,217,255,0.8);
}


.session-node.active .session-dot {

    background: #00d9ff;

    box-shadow:

        0 0 4px #00d9ff,
        0 0 10px #00d9ff,
        0 0 20px rgba(0,217,255,0.85);

    animation:
        activeDotPulse 1.25s ease-in-out infinite;
}


.session-node.active .session-dot::before {

    opacity: 0.65;

    transform:
        translate(-50%, -50%)
        scale(1);

    border-color:
        rgba(0,217,255,0.55);

    animation:
        activeHalo 1.25s ease-in-out infinite;
}


@keyframes activeDotPulse {

    0%,
    100% {

        transform: scale(0.82);

        opacity: 0.78;
    }

    50% {

        transform: scale(1.30);

        opacity: 1;
    }
}


@keyframes activeHalo {

    0%,
    100% {

        transform:
            translate(-50%, -50%)
            scale(0.75);

        opacity: 0.20;
    }

    50% {

        transform:
            translate(-50%, -50%)
            scale(1.35);

        opacity: 0.75;
    }
}


/* =====================================================
   خط اتصال
===================================================== */

.session-connector {

    width: 16px;

    height: 1px;

    flex: 0 1 16px;

    min-width: 8px;

    background:
        rgba(255,255,255,0.18);

    box-shadow:
        0 0 4px rgba(0,217,255,0.12);

    position: relative;

    overflow: hidden;
}


.session-map.has-active
.session-connector::after {

    content: "";

    position: absolute;

    top: 0;

    left: -100%;

    width: 60%;

    height: 100%;

    background:

        linear-gradient(
            90deg,
            transparent,
            rgba(0,217,255,0.9),
            transparent
        );

    animation:
        connectorSweep 3.2s ease-in-out infinite;

    opacity: 1;
}


@keyframes connectorSweep {

    0% {
        left: -100%;
    }

    55% {
        left: 130%;
    }

    100% {
        left: 130%;
    }
}


/* =====================================================
   هشدار OPEN
===================================================== */

.session-node.open-warning {

    color: #00d9ff;

    animation:
        openWarningBlink 0.72s ease-in-out infinite;
}


.session-node.open-warning .session-dot {

    background: #00d9ff;

    box-shadow:

        0 0 5px #00d9ff,
        0 0 13px #00d9ff,
        0 0 28px rgba(0,217,255,0.95);

    animation:
        openDotWarning 0.72s ease-in-out infinite;
}


.session-node.open-warning .session-dot::before {

    border-color:
        rgba(0,217,255,0.85);

    opacity: 1;

    animation:
        warningHalo 0.72s ease-in-out infinite;
}


@keyframes openWarningBlink {

    0%,
    100% {

        opacity: 1;

        text-shadow:

            0 0 6px #00d9ff,
            0 0 16px #00d9ff;
    }

    50% {

        opacity: 0.22;

        text-shadow:
            0 0 2px #00d9ff;
    }
}


@keyframes openDotWarning {

    0%,
    100% {

        transform: scale(0.80);

        opacity: 0.55;
    }

    50% {

        transform: scale(1.45);

        opacity: 1;
    }
}


@keyframes warningHalo {

    0%,
    100% {

        transform:
            translate(-50%, -50%)
            scale(0.65);

        opacity: 0.20;
    }

    50% {

        transform:
            translate(-50%, -50%)
            scale(1.55);

        opacity: 0.85;
    }
}


/* =====================================================
   هشدار CLOSE
===================================================== */

.session-node.close-warning {

    color: #ff3333;

    animation:
        closeWarningBlink 0.65s ease-in-out infinite;
}


.session-node.close-warning .session-dot {

    background: #ff3333;

    box-shadow:

        0 0 5px #ff3333,
        0 0 13px #ff3333,
        0 0 30px rgba(255,51,51,0.95);

    animation:
        closeDotWarning 0.65s ease-in-out infinite;
}


.session-node.close-warning .session-dot::before {

    border-color:
        rgba(255,51,51,0.85);

    opacity: 1;

    animation:
        warningHaloRed 0.65s ease-in-out infinite;
}


@keyframes closeWarningBlink {

    0%,
    100% {

        opacity: 1;

        text-shadow:

            0 0 6px #ff3333,
            0 0 16px #ff3333;
    }

    50% {

        opacity: 0.18;

        text-shadow:
            0 0 2px #ff3333;
    }
}


@keyframes closeDotWarning {

    0%,
    100% {

        transform: scale(0.80);

        opacity: 0.55;
    }

    50% {

        transform: scale(1.50);

        opacity: 1;
    }
}


@keyframes warningHaloRed {

    0%,
    100% {

        transform:
            translate(-50%, -50%)
            scale(0.65);

        opacity: 0.20;
    }

    50% {

        transform:
            translate(-50%, -50%)
            scale(1.55);

        opacity: 0.85;
    }
}


/* =====================================================
   WEEKEND
===================================================== */

.session-map.weekend
.session-node {

    color: rgba(255,51,51,0.55);
}


.session-map.weekend
.session-dot {

    background: #ff3333;

    box-shadow:

        0 0 4px #ff3333,
        0 0 10px rgba(255,51,51,0.55);

    animation:
        closedWeekendPulse 1.8s ease-in-out infinite;
}


.session-map.weekend
.session-dot::before {

    border-color:
        rgba(255,51,51,0.45);

    opacity: 0.55;

    transform:
        translate(-50%, -50%)
        scale(0.9);
}


.session-map.weekend
.session-active-label {

    color: #ff3333;

    text-shadow:

        0 0 6px #ff3333,
        0 0 14px rgba(255,51,51,0.45);
}


@keyframes closedWeekendPulse {

    0%,
    100% {

        transform: scale(0.85);

        opacity: 0.55;
    }

    50% {

        transform: scale(1.15);

        opacity: 1;
    }
}


/* =====================================================
   Active Label
===================================================== */

.session-active-label {

    position: relative;

    height: 14px;

    margin-top: 1px;

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 5px;

    font-family: Arial, sans-serif;

    font-size: 9px;

    font-weight: bold;

    letter-spacing: 2px;

    color: #00d9ff;

    text-shadow:

        0 0 6px #00d9ff,
        0 0 14px rgba(0,217,255,0.45);

    opacity: 0;

    transition:
        opacity 0.35s ease;
}


.session-active-label.visible {

    opacity: 1;
}


.active-arrow {

    display: inline-block;

    font-size: 10px;

    animation:
        activeArrowFloat 1s ease-in-out infinite;
}


@keyframes activeArrowFloat {

    0%,
    100% {
        transform:
            translateY(2px);
    }

    50% {
        transform:
            translateY(-1px);
    }
}


/* =====================================================
   وبکم
   متناسب با فریم جدید
===================================================== */


/* =====================================================
   نوار پایین
===================================================== */

.bottom-bar {

    position: absolute;

    bottom: 10px;
    left: 50%;

    transform: translateX(-50%);

    width: 92%;
    height: 80px;

    clip-path: polygon(

        0 0,
        100% 0,
        100% calc(100% - 18px),
        calc(100% - 18px) 100%,
        18px 100%,
        0 calc(100% - 18px)

    );

    background:
        rgba(0, 0, 0, 0.35);

    border: 2px solid #00d9ff;

    box-shadow:

        0 0 14px #00d9ff,
        inset 0 0 14px #00d9ff;

    display: flex;

    justify-content: space-between;

    align-items: center;

    padding: 0 30px;

    box-sizing: border-box;
}


/* =====================================================
   فونت نوار پایین
===================================================== */

.bottom-item span {

    font-family: Arial, sans-serif;

    font-size: 18px;

    font-weight: bold;

    line-height: 1;

    display: flex;

    align-items: center;

    white-space: nowrap;
}


.bottom-item {

    display: flex;

    align-items: center;

    gap: 10px;

    min-width: 0;
}


.bottom-divider {

    width: 1px;

    height: 35px;

    background:
        rgba(255,255,255,0.22);

    flex-shrink: 0;
}


.bottom-icon {

    width: 40px;
    height: 40px;

    stroke: #ffffff;

    fill: none;

    display: flex;

    align-items: center;

    flex-shrink: 0;

    filter:
        drop-shadow(0 0 4px #ffb347);
}


/* =====================================================
   SUBSCRIBE
===================================================== */

.subscribe {

    position: relative;

    width: 145px;
    min-width: 145px;
    max-width: 145px;

    height: 40px;

    flex-shrink: 0;
}


.promo-state {

    position: absolute;

    left: 0;
    top: 50%;

    transform: translateY(-50%);

    display: flex;

    align-items: center;

    gap: 10px;

    white-space: nowrap;
}


.subscribe-state span {

    font-family: Arial, sans-serif;

    font-size: 18px;

    font-weight: bold;

    color: #ff3333;

    text-shadow:
        0 0 5px rgba(255,51,51,0.55);
}


.bell-icon {

    stroke: #ff3333;

    filter:
        drop-shadow(0 0 4px #ff3333);

    transform-origin: 50% 15%;
}


.subscribe-state .bell-icon {

    animation:
        bellMiddle 10s ease-in-out infinite;
}


@keyframes bellMiddle {

    0% {
        transform: rotate(0deg);
    }

    45% {
        transform: rotate(0deg);
    }

    47% {
        transform: rotate(-6deg);
    }

    48.5% {
        transform: rotate(6deg);
    }

    50% {
        transform: rotate(-4deg);
    }

    51.5% {
        transform: rotate(0deg);
    }

    53% {
        transform: rotate(-6deg);
    }

    54.5% {
        transform: rotate(6deg);
    }

    56% {
        transform: rotate(-4deg);
    }

    57.5% {
        transform: rotate(0deg);
    }

    100% {
        transform: rotate(0deg);
    }
}


/* =====================================================
   LIKE
===================================================== */

.like-state {

    display: none;
}


.like-state span {

    font-family: Arial, sans-serif;

    font-size: 18px;

    font-weight: bold;

/* =====================================================
   HH:MM → minutes
===================================================== */

function timeToMinutes(time) {

    const [
        hours,
        minutes
    ] = time.split(":").map(Number);

    return (
        hours * 60 +
        minutes
    );

}


/* =====================================================
   تهران
===================================================== */

function getTehranDateParts(
    date = new Date()
) {

    const parts =
        new Intl.DateTimeFormat(
            "en-US",
            {

                timeZone:
                    "Asia/Tehran",

                year:
                    "numeric",

                month:
                    "2-digit",

                day:
                    "2-digit",

                hour:
                    "2-digit",

                minute:
                    "2-digit",

                second:
                    "2-digit",

                hourCycle:
                    "h23"

            }
        ).formatToParts(date);


    const result = {};


    parts.forEach(
        part => {

            if (
                part.type !==
                "literal"
            ) {

                result[part.type] =
                    part.value;

            }

        }
    );


    return {

        year:
            Number(result.year),

        month:
            Number(result.month),

        day:
            Number(result.day),

        hour:
            Number(result.hour),

        minute:
            Number(result.minute),

        second:
            Number(result.second)

    };

}


/* =====================================================
   روز هفته تهران
===================================================== */

function getTehranDayOfWeek(
    date = new Date()
) {

    const parts =
        getTehranDateParts(
            date
        );


    const utcDate =
        new Date(
            Date.UTC(
                parts.year,
                parts.month - 1,
                parts.day
            )
        );


    return utcDate.getUTCDay();

}


/* =====================================================
   تعطیلی هفتگی
===================================================== */

function isWeekend(
    date = new Date()
) {

    const day =
        getTehranDayOfWeek(
            date
        );


    return (
        day === 0 ||
        day === 6
    );

}


/* =====================================================
   روز معاملاتی
===================================================== */

function isTradingDay(
    date = new Date()
) {

    return !isWeekend(date);

}


/* =====================================================
   دقیقه فعلی تهران
===================================================== */

function getCurrentTehranMinute(
    date = new Date()
) {

    const parts =
        getTehranDateParts(
            date
        );


    return (
        parts.hour * 60 +
        parts.minute +
        parts.second / 60
    );

}


/* =====================================================
   وضعیت Session
===================================================== */

function getSessionState(
    session,
    currentMinute
) {

    const open =
        timeToMinutes(
            session.open
        );


    const close =
        timeToMinutes(
            session.close
        );


    let isOpen;


    if (open < close) {

        isOpen =
            currentMinute >= open &&
            currentMinute < close;

    }

    else {

        isOpen =
            currentMinute >= open ||
            currentMinute < close;

    }


    return {

        open,
        close,
        isOpen

    };

}


/* =====================================================
   Session فعال
===================================================== */

function getActiveSessions(
    currentMinute,
    date = new Date()
) {

    if (
        !isTradingDay(date)
    ) {

        return [];

    }


    const active = [];


    Object.entries(
        SESSION_CONFIG
    ).forEach(
        ([id, session]) => {

            const state =
                getSessionState(
                    session,
                    currentMinute
                );


            if (
                state.isOpen
            ) {

                active.push({

                    id,

                    ...session,

                    ...state

                });

            }

        }
    );


    return active;

}


/* =====================================================
   Session اصلی
===================================================== */

function getPrimaryActiveSession(
    currentMinute,
    date = new Date()
) {

    const active =
        getActiveSessions(
            currentMinute,
            date
        );


    if (
        active.length === 0
    ) {

        return null;

    }


    let primary = null;

    let bestScore = -Infinity;


    active.forEach(
        session => {

            let score =
                timeToMinutes(
                    session.open
                );


            if (
                session.id === "newyork" &&
                currentMinute <
                    timeToMinutes(
                        session.close
                    )
            ) {

                score -= 1440;

            }


            if (
                score > bestScore
            ) {

                bestScore =
                    score;

                primary =
                    session;

            }

        }
    );


    return primary;

}


/* =====================================================
   MARKET STATUS
===================================================== */

function isMarketOpen(
    currentMinute,
    date = new Date()
) {

    if (
        !isTradingDay(date)
    ) {

        return false;

    }


    return (
        getActiveSessions(
            currentMinute,
            date
        ).length > 0
    );

}


/* =====================================================
   هشدار OPEN
===================================================== */

function getMinutesUntilOpen(
    session,
    currentMinute
) {

    const open =
        timeToMinutes(
            session.open
        );


    let diff =
        open -
        currentMinute;


    if (
        diff < 0
    ) {

        diff += 1440;

    }


    return diff;

}


function getMinutesUntilClose(
    session,
    currentMinute
) {

    const close =
        timeToMinutes(
            session.close
        );


    let diff =
        close -
        currentMinute;


    if (
        diff < 0
    ) {

        diff += 1440;

    }


    return diff;

}


function isOpenWarning(
    session,
    currentMinute
) {

    const minutes =
        getMinutesUntilOpen(
            session,
            currentMinute
        );


    return (

        minutes > 0 &&

        minutes <=
            OPEN_WARNING_MINUTES

    );

}


function isCloseWarning(
    session,
    currentMinute
) {

    const minutes =
        getMinutesUntilClose(
            session,
            currentMinute
        );


    return (

        minutes > 0 &&

        minutes <=
            CLOSE_WARNING_MINUTES

    );

}


/* =====================================================
   SESSION MAP
===================================================== */

function updateSessionMap(
    currentMinute,
    now = new Date()
) {

    sessionMap.classList.remove(
        "has-active"
    );


    Object.values(
        sessionNodes
    ).forEach(
        node => {

            node.classList.remove(
                "active",
                "open-warning",
                "close-warning"
            );

        }
    );


    if (
        isWeekend(now)
    ) {

        sessionMap.classList.add(
            "weekend"
        );


        sessionActiveLabel.classList.add(
            "visible"
        );


        activeSessionText.textContent =
            "MARKET CLOSED";


        return;

    }


    sessionMap.classList.remove(
        "weekend"
    );


    const active =
        getActiveSessions(
            currentMinute,
            now
        );


    if (
        active.length > 0
    ) {

        sessionMap.classList.add(
            "has-active"
        );

    }


    active.forEach(
        session => {

            const node =
                sessionNodes[
                    session.id
                ];


            if (!node) {
                return;
            }


            node.classList.add(
                "active"
            );

        }
    );


    Object.entries(
        SESSION_CONFIG
    ).forEach(
        ([id, session]) => {

            const node =
                sessionNodes[id];


            if (!node) {
                return;
            }


            const state =
                getSessionState(
                    session,
                    currentMinute
                );


            if (
                state.isOpen &&
                isCloseWarning(
                    session,
                    currentMinute
                )
            ) {

                node.classList.remove(
                    "active"
                );


                node.classList.add(
                    "close-warning"
                );

            }


            else if (
                !state.isOpen &&
                isOpenWarning(
                    session,
                    currentMinute
                )
            ) {

                node.classList.add(
                    "open-warning"
                );

            }

        }
    );


    if (
        active.length > 0
    ) {

        sessionActiveLabel.classList.add(
            "visible"
        );


        activeSessionText.textContent =
            "ACTIVE";

    }

    else {

        sessionActiveLabel.classList.remove(
            "visible"
        );

    }

}


/* =====================================================
   MARKET
===================================================== */

function updateMarket(
    currentMinute,
    now = new Date()
) {

    const open =
        isMarketOpen(
            currentMinute,
            now
        );


    if (open) {

        marketValue.textContent =
            "OPEN";


        marketValue.style.color =
            "#00d9ff";


        marketValue.style.textShadow =
            "0 0 8px #00d9ff";

    }

    else {

        marketValue.textContent =
            "CLOSED";


        marketValue.style.color =
            "#ff3333";


        marketValue.style.textShadow =
            "0 0 8px #ff3333";

    }

}


/* =====================================================
   ساعت تهران
===================================================== */

function getTehranTime(
    date = new Date()
) {

    return new Intl.DateTimeFormat(
        "en-US",
        {

            timeZone:
                "Asia/Tehran",

            hour:
                "2-digit",

            minute:
                "2-digit",

            second:
                "2-digit",

            hour12:
                true

        }
    ).format(date);

}


/* =====================================================
   تاریخ میلادی
===================================================== */

function getGregorianDate(
    date = new Date()
) {

    const formatter =
        new Intl.DateTimeFormat(
            "en-US",
            {

                calendar:
                    "gregory",

                year:
                    "numeric",

                month:
                    "short",

                day:
                    "2-digit"

            }
        );


    return formatter
        .format(date)
        .toUpperCase();

}


/* =====================================================
   NEXT EVENT
===================================================== */

function getNextSessionOpen(
    currentMinute,
    date = new Date()
) {

    const sessions =
        Object.entries(
            SESSION_CONFIG
        );


    let next = null;

    let smallestDiff =
        Infinity;


    sessions.forEach(
        ([id, session]) => {

            const open =
                timeToMinutes(
                    session.open
                );


            let diff =
                open -
                currentMinute;


            if (
                diff <= 0
            ) {

                diff += 1440;

            }


            if (
                diff < smallestDiff
            ) {

                smallestDiff =
                    diff;


                next = {

                    id,

                    ...session,

                    diff

                };

            }

        }
    );


    return next;

}


/* =====================================================
   زمان دقیق تا Session بعدی
===================================================== */

function updateNextEvent(
    now = new Date()
) {

    const tehranParts =
        getTehranDateParts(
            now
        );


    const currentMinute =
        tehranParts.hour * 60 +
        tehranParts.minute +
        tehranParts.second / 60;


    const next =
        getNextSessionOpen(
            currentMinute,
            now
        );


    if (!next) {

        nextSession.textContent =
            "---";


        nextCountdown.textContent =
            "--:--:--";


        return;

    }


    nextSession.textContent =
        next.shortName;


    const openMinutes =
        timeToMinutes(
            next.open
        );


    let currentSeconds =
        tehranParts.hour * 3600 +
        tehranParts.minute * 60 +
        tehranParts.second;


    let openSeconds =
        openMinutes * 60;


    let secondsUntil =
        openSeconds -
        currentSeconds;


    if (
        secondsUntil <= 0
    ) {

        secondsUntil +=
            24 * 60 * 60;

    }


    const hours =
        Math.floor(
            secondsUntil / 3600
        );


    const minutes =
        Math.floor(
            (secondsUntil % 3600) / 60
        );


    const seconds =
        secondsUntil % 60;


    nextCountdown.textContent =

        String(hours)
            .padStart(2, "0")

        + ":" +

        String(minutes)
            .padStart(2, "0")

        + ":" +

        String(seconds)
            .padStart(2, "0");


    if (
        secondsUntil <=
        OPEN_WARNING_MINUTES * 60
    ) {

        nextEventValue.classList.add(
            "warning"
        );

    }

    else {

        nextEventValue.classList.remove(
            "warning"
        );

    }

}


/* =====================================================
   CLOCKS
===================================================== */

function updateClocks() {

    const now =
        new Date();


    const tehranParts =
        getTehranDateParts(
            now
        );


    const currentMinute =
        tehranParts.hour * 60 +
        tehranParts.minute +
        tehranParts.second / 60;


    tehranClockValue.textContent =
        getTehranTime(
            now
        );


    updateSessionMap(
        currentMinute,
        now
    );


    updateMarket(
        currentMinute,
        now
    );


    updateNextEvent(
        now
    );


    dateValue.textContent =
        getGregorianDate(
            now
        );

}


updateClocks();

setInterval(
    updateClocks,
    1000
);


/* =====================================================
   SUBSCRIBE / LIKE
===================================================== */

const subscribeState =
    document.querySelector(
        ".subscribe-state"
    );


const likeState =
    document.querySelector(
        ".like-state"
    );


const likeIcon =
    document.querySelector(
        ".like-icon"
    );


setInterval(
    function () {

        if (

            subscribeState.style.display !==
            "none"

        ) {

            subscribeState.style.display =
                "none";


            likeState.style.display =
                "flex";


            likeIcon.classList.remove(
                "like-pulse"
            );


            void likeIcon.offsetWidth;


            likeIcon.classList.add(
                "like-pulse"
            );

        }

        else {

            likeState.style.display =
                "none";


            subscribeState.style.display =
                "flex";

        }

    },

    10000

);

</script>
