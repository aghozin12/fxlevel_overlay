<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<title>FX LEVEL Overlay</title>

<style>

/* =====================================================
   صفحه اصلی
===================================================== */

html,
body {

    width: 1920px;
    height: 1080px;

    margin: 0;
    padding: 0;

    overflow: hidden;

    background: #808080;

    font-family: Arial, sans-serif;

    color: white;
}


/* =====================================================
   شبکه پس‌زمینه
===================================================== */

body::before {

    content: "";

    position: absolute;

    inset: 0;

    background-image:

        linear-gradient(
            rgba(0,255,136,0.40) 1px,
            transparent 1px
        ),

        linear-gradient(
            90deg,
            rgba(0,255,136,0.40) 1px,
            transparent 1px
        );

    background-size: 40px 40px;

    pointer-events: none;
}


/* =====================================================
   فریم اصلی
===================================================== */

.main-frame {

    position: absolute;

    top: 40px;
    left: 40px;

    width: calc(100% - 80px);
    height: calc(100% - 80px);

    clip-path: polygon(

        25px 0,
        calc(100% - 25px) 0,
        100% 25px,
        100% calc(100% - 25px),
        calc(100% - 25px) 100%,
        25px 100%,
        0 calc(100% - 25px),
        0 25px

    );

    background: rgba(0, 0, 0, 0.18);

    border: 3px solid #00ff88;

    box-shadow:

        0 0 25px #00ff88,
        inset 0 0 25px #00ff88;
}


/* =====================================================
   نوار بالا
===================================================== */

.top-bar {

    position: absolute;

    top: 55px;
    left: 50%;

    transform: translateX(-50%);

    width: 86%;
    height: 90px;

    clip-path: polygon(

        18px 0,
        calc(100% - 18px) 0,
        100% 18px,
        100% 100%,
        0 100%,
        0 18px

    );

    background: rgba(0, 0, 0, 0.35);

    border: 2px solid #00ff88;

    box-shadow:

        0 0 14px #00ff88,
        inset 0 0 14px #00ff88;

    display: flex;

    justify-content: space-between;

    align-items: center;

    padding: 0 35px;

    box-sizing: border-box;
}


/* =====================================================
   آیتم‌های نوار بالا
===================================================== */

.top-item {

    flex: 1;

    display: flex;

    justify-content: center;
}


.item-row {

    display: flex;

    align-items: center;

    gap: 14px;
}


/* =====================================================
   آیکون‌های بالا
===================================================== */

.icon {

    width: 40px;
    height: 40px;

    stroke: #ffffff;

    fill: none;

    filter:
        drop-shadow(0 0 6px #00ff88);
}


/* =====================================================
   متن‌های بالا
===================================================== */

.text-box {

    display: flex;

    flex-direction: column;

    line-height: 1.1;
}


.text-box span:first-child {

    font-size: 14px;

    color: #ffae4a;

    text-shadow:
        0 0 6px #ffae4a;
}


.text-box span:last-child {

    font-size: 22px;

    font-weight: bold;

    color: #00ff88;

    text-shadow:
        0 0 8px #00ff88;
}


/* =====================================================
   SESSION MAP
===================================================== */

.session-map {

    flex: 1.25;

    display: flex;

    justify-content: center;

    align-items: center;

    min-width: 360px;

    position: relative;
}


.session-map-inner {

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    width: 100%;

    position: relative;
}


.session-map-title {

    font-size: 13px;

    font-weight: bold;

    letter-spacing: 3px;

    color: #ffae4a;

    text-shadow:

        0 0 6px #ffae4a,
        0 0 14px rgba(255,174,74,0.35);

    margin-bottom: 8px;

    position: relative;
}


.session-track {

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 13px;

    height: 27px;

    position: relative;
}


.session-node {

    display: flex;

    align-items: center;

    gap: 6px;

    position: relative;

    font-size: 15px;

    font-weight: bold;

    letter-spacing: 1px;

    color: rgba(255,255,255,0.42);

    transition:

        color 0.35s ease,

        text-shadow 0.35s ease,

        opacity 0.35s ease;
}


.session-name {

    position: relative;

    z-index: 3;
}


.session-dot {

    width: 7px;
    height: 7px;

    border-radius: 50%;

    background: rgba(255,255,255,0.25);

    box-shadow:

        0 0 2px rgba(255,255,255,0.15);

    position: relative;

    z-index: 3;

    transition:

        background 0.35s ease,

        box-shadow 0.35s ease,

        transform 0.35s ease;
}


/* =====================================================
   Halo
===================================================== */

.session-dot::before {

    content: "";

    position: absolute;

    width: 18px;
    height: 18px;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%)
        scale(0.65);

    border-radius: 50%;

    border: 1px solid
        rgba(0,255,136,0);

    opacity: 0;

    transition:

        opacity 0.3s ease,

        transform 0.3s ease,

        border-color 0.3s ease;
}


/* =====================================================
   ACTIVE
===================================================== */

.session-node.active {

    color: #00ff88;

    text-shadow:

        0 0 5px #00ff88,
        0 0 12px rgba(0,255,136,0.8);
}


.session-node.active .session-dot {

    background: #00ff88;

    box-shadow:

        0 0 4px #00ff88,
        0 0 10px #00ff88,
        0 0 20px rgba(0,255,136,0.85);

    animation:
        activeDotPulse 1.25s ease-in-out infinite;
}


.session-node.active .session-dot::before {

    opacity: 0.65;

    transform:
        translate(-50%, -50%)
        scale(1);

    border-color:
        rgba(0,255,136,0.55);

    animation:
        activeHalo 1.25s ease-in-out infinite;
}


@keyframes activeDotPulse {

    0%,
    100% {

        transform: scale(0.82);

        opacity: 0.78;
    }

    50% {

        transform: scale(1.30);

        opacity: 1;
    }
}


@keyframes activeHalo {

    0%,
    100% {

        transform:
            translate(-50%, -50%)
            scale(0.75);

        opacity: 0.20;
    }

    50% {

        transform:
            translate(-50%, -50%)
            scale(1.35);

        opacity: 0.75;
    }
}


/* =====================================================
   Connector
===================================================== */

.session-connector {

    width: 16px;

    height: 1px;

    background:
        rgba(255,255,255,0.18);

    position: relative;

    overflow: hidden;
}


.session-map.has-active
.session-connector::after {

    content: "";

    position: absolute;

    top: 0;

    left: -100%;

    width: 60%;

    height: 100%;

    background:

        linear-gradient(
            90deg,
            transparent,
            rgba(0,255,136,0.9),
            transparent
        );

    animation:
        connectorSweep 3.2s ease-in-out infinite;
}


@keyframes connectorSweep {

    0% {
        left: -100%;
    }

    55% {
        left: 130%;
    }

    100% {
        left: 130%;
    }
}


/* =====================================================
   OPEN WARNING
===================================================== */

.session-node.open-warning {

    color: #00ff88;

    animation:
        openWarningBlink 0.72s ease-in-out infinite;
}


.session-node.open-warning .session-dot {

    background: #00ff88;

    box-shadow:

        0 0 5px #00ff88,
        0 0 13px #00ff88,
        0 0 28px rgba(0,255,136,0.95);

    animation:
        openDotWarning 0.72s ease-in-out infinite;
}


@keyframes openWarningBlink {

    0%,
    100% {

        opacity: 1;
    }

    50% {

        opacity: 0.22;
    }
}


@keyframes openDotWarning {

    0%,
    100% {

        transform: scale(0.80);

        opacity: 0.55;
    }

    50% {

        transform: scale(1.45);

        opacity: 1;
    }
}


/* =====================================================
   CLOSE WARNING
===================================================== */

.session-node.close-warning {

    color: #ff3333;

    animation:
        closeWarningBlink 0.65s ease-in-out infinite;
}


.session-node.close-warning .session-dot {

    background: #ff3333;

    box-shadow:

        0 0 5px #ff3333,
        0 0 13px #ff3333,
        0 0 30px rgba(255,51,51,0.95);

    animation:
        closeDotWarning 0.65s ease-in-out infinite;
}


.session-node.close-warning .session-dot::before {

    border-color:
        rgba(255,51,51,0.85);

    opacity: 1;

    animation:
        warningHaloRed 0.65s ease-in-out infinite;
}


@keyframes closeWarningBlink {

    0%,
    100% {

        opacity: 1;
    }

    50% {

        opacity: 0.18;
    }
}


@keyframes closeDotWarning {

    0%,
    100% {

        transform: scale(0.80);

        opacity: 0.55;
    }

    50% {

        transform: scale(1.50);

        opacity: 1;
    }
}


@keyframes warningHaloRed {

    0%,
    100% {

        transform:
            translate(-50%, -50%)
            scale(0.65);

        opacity: 0.20;
    }

    50% {

        transform:
            translate(-50%, -50%)
            scale(1.55);

        opacity: 0.85;
    }
}


/* =====================================================
   MARKET CLOSED / WEEKEND
===================================================== */

.session-map.weekend
.session-node {

    color: rgba(255,51,51,0.55);
}


.session-map.weekend
.session-dot {

    background: #ff3333;

    box-shadow:

        0 0 4px #ff3333,
        0 0 10px rgba(255,51,51,0.55);

    animation:
        closedWeekendPulse 1.8s ease-in-out infinite;
}


.session-map.weekend
.session-active-label {

    color: #ff3333;

    text-shadow:

        0 0 6px #ff3333,
        0 0 14px rgba(255,51,51,0.45);
}


@keyframes closedWeekendPulse {

    0%,
    100% {

        transform: scale(0.85);

        opacity: 0.55;
    }

    50% {

        transform: scale(1.15);

        opacity: 1;
    }
}


/* =====================================================
   ACTIVE LABEL
===================================================== */

.session-active-label {

    position: relative;

    height: 18px;

    margin-top: 3px;

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 5px;

    font-size: 10px;

    font-weight: bold;

    letter-spacing: 2px;

    color: #00ff88;

    text-shadow:

        0 0 6px #00ff88,
        0 0 14px rgba(0,255,136,0.45);

    opacity: 0;

    transition:
        opacity 0.35s ease;
}


.session-active-label.visible {

    opacity: 1;
}


.active-arrow {

    display: inline-block;

    font-size: 12px;

    animation:
        activeArrowFloat 1s ease-in-out infinite;
}


@keyframes activeArrowFloat {

    0%,
    100% {
        transform: translateY(2px);
    }

    50% {
        transform: translateY(-1px);
    }
}


/* =====================================================
   SESSION TIMER - بخش سوم
===================================================== */

.session-timer-box {

    display: flex;

    align-items: center;

    justify-content: center;

    min-width: 230px;
}


.session-timer-inner {

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    line-height: 1;
}


.session-timer-status {

    font-size: 11px;

    font-weight: bold;

    letter-spacing: 2px;

    color: #ffae4a;

    text-shadow:
        0 0 6px #ffae4a;

    margin-bottom: 5px;
}


.session-timer-value {

    font-size: 23px;

    font-weight: bold;

    letter-spacing: 1px;

    color: #00ff88;

    text-shadow:

        0 0 7px #00ff88,
        0 0 16px rgba(0,255,136,0.45);
}


.session-timer-name {

    margin-top: 4px;

    font-size: 9px;

    font-weight: bold;

    letter-spacing: 2px;

    color: rgba(255,255,255,0.55);
}


.session-timer-box.timer-warning
.session-timer-value {

    color: #ffae4a;

    text-shadow:

        0 0 7px #ffae4a,
        0 0 16px rgba(255,174,74,0.5);

    animation:
        timerWarningPulse 0.8s ease-in-out infinite;
}


.session-timer-box.timer-closed
.session-timer-value {

    color: #ff3333;

    text-shadow:
        0 0 8px #ff3333;
}


@keyframes timerWarningPulse {

    0%,
    100% {
        opacity: 1;
    }

    50% {
        opacity: 0.35;
    }
}


/* =====================================================
   وبکم
===================================================== */

.webcam-frame {

    position: absolute;

    bottom: 170px;
    left: 80px;

    width: 430px;
    height: 250px;

    border: 4px solid #00ff66;

    background:
        rgba(0, 0, 0, 0.18);

    box-shadow:

        0 0 25px rgba(0, 255, 102, 1),
        0 0 55px rgba(0, 255, 102, 0.85),
        0 0 110px rgba(0, 255, 102, 0.65),
        0 0 160px rgba(0, 255, 102, 0.45);
}


/* =====================================================
   نوار پایین
===================================================== */

.bottom-bar {

    position: absolute;

    bottom: 55px;
    left: 50%;

    transform: translateX(-50%);

    width: 86%;
    height: 80px;

    clip-path: polygon(

        0 0,
        100% 0,
        100% calc(100% - 18px),
        calc(100% - 18px) 100%,
        18px 100%,
        0 calc(100% - 18px)

    );

    background:
        rgba(0, 0, 0, 0.35);

    border: 2px solid #00ff88;

    box-shadow:

        0 0 14px #00ff88,
        inset 0 0 14px #00ff88;

    display: flex;

    justify-content: space-between;

    align-items: center;

    padding: 0 40px;

    box-sizing: border-box;
}


.bottom-item span {

    font-family: Arial, sans-serif;

    font-size: 18px;

    font-weight: bold;

    line-height: 1;

    display: flex;

    align-items: center;

    white-space: nowrap;
}


.bottom-item {

    display: flex;

    align-items: center;

    gap: 10px;
}


.bottom-item:not(.subscribe)
span {

    color: #4da6ff;

    text-shadow:
        0 0 6px #4da6ff;
}


.bottom-divider {

    width: 1px;

    height: 35px;

    background:
        rgba(255,255,255,0.22);

    flex-shrink: 0;
}


.bottom-icon {

    width: 40px;
    height: 40px;

    stroke: #ffffff;

    fill: none;

    display: flex;

    align-items: center;

    flex-shrink: 0;

    filter:
        drop-shadow(0 0 4px #ffb347);
}


/* =====================================================
   SUBSCRIBE / LIKE
===================================================== */

.subscribe {

    position: relative;

    width: 145px;
    min-width: 145px;
    max-width: 145px;

    height: 40px;

    flex-shrink: 0;
}


.promo-state {

    position: absolute;

    left: 0;
    top: 50%;

    transform: translateY(-50%);

    display: flex;

    align-items: center;

    gap: 10px;

    white-space: nowrap;
}


.subscribe-state span {

    font-family: Arial, sans-serif;

    font-size: 18px;

    font-weight: bold;

    color: #ff3333;

    text-shadow:
        0 0 5px rgba(255,51,51,0.55);
}


.bell-icon {

    stroke: #ff3333;

    filter:
        drop-shadow(0 0 4px #ff3333);

    transform-origin: 50% 15%;
}


.subscribe-state .bell-icon {

    animation:
        bellMiddle 10s ease-in-out infinite;
}


@keyframes bellMiddle {

    0% {
        transform: rotate(0deg);
    }

    45% {
        transform: rotate(0deg);
    }

    47% {
        transform: rotate(-6deg);
    }

    48.5% {
        transform: rotate(6deg);
    }

    50% {
        transform: rotate(-4deg);
    }

    51.5% {
        transform: rotate(0deg);
    }

    53% {
        transform: rotate(-6deg);
    }

    54.5% {
        transform: rotate(6deg);
    }

    56% {
        transform: rotate(-4deg);
    }

    57.5% {
        transform: rotate(0deg);
    }

    100% {
        transform: rotate(0deg);
    }
}


.like-state {

    display: none;
}


.like-state span {

    font-family: Arial, sans-serif;

    font-size: 18px;

    font-weight: bold;

    color: #4da6ff;

    text-shadow:
        0 0 5px rgba(77,166,255,0.55);
}


.like-icon {

    stroke: #4da6ff;

    filter:
        drop-shadow(0 0 4px #4da6ff);

    transform-origin: center;
}


.like-pulse {

    animation:
        likePulse 10s ease-in-out infinite;
}


@keyframes likePulse {

    0% {
        transform: scale(0.82);
    }

    8% {
        transform: scale(1.10);
    }

    15% {
        transform: scale(0.88);
    }

    22% {
        transform: scale(1.12);
    }

    29% {
        transform: scale(0.88);
    }

    38% {
        transform: scale(1);
    }

    100% {
        transform: scale(1);
    }
}


/* =====================================================
   VIP
===================================================== */

.vip {

    position: relative;

    overflow: hidden;
}


.vip span {

    animation:
        vipPulse 1.8s infinite ease-in-out;
}


@keyframes vipPulse {

    0% {
        text-shadow:
            0 0 6px #00ff88;
    }

    50% {
        text-shadow:
            0 0 18px #00ff88;
    }

    100% {
        text-shadow:
            0 0 6px #00ff88;
    }
}


.vip .shine {

    position: absolute;

    top: 0;
    left: -120%;

    width: 80%;
    height: 100%;

    background:

        linear-gradient(
            120deg,
            transparent,
            rgba(255,255,255,0.4),
            transparent
        );

    animation:
        shineSweep 3s infinite;
}


@keyframes shineSweep {

    0% {
        left: -120%;
    }

    50% {
        left: 120%;
    }

    100% {
        left: 120%;
    }
}

</style>

</head>

</div>

>

        <svg

<script>

/* =====================================================
   SESSION CONFIG
   =====================================================

   تمام زمان‌ها بر اساس ساعت تهران هستند.

   Sydney   00:30 → 09:30
   Tokyo    03:30 → 12:30
   London   10:30 → 19:30
   New York 16:30 → 00:30

   شنبه و یکشنبه:
   تمام Sessionها CLOSED هستند.

   نکته مهم:
   New York که از نیمه‌شب عبور می‌کند،
   فقط تا 00:30 روز بعد ادامه دارد
   و در شروع هفته، یکشنبه به دوشنبه
   هرگز Active نمی‌شود.

===================================================== */

const SESSION_CONFIG = {

    sydney: {

        name: "Sydney",

        shortName: "SYD",

        open: "00:30",

        close: "09:30"

    },


    tokyo: {

        name: "Tokyo",

        shortName: "TOK",

        open: "03:30",

        close: "12:30"

    },


    london: {

        name: "London",

        shortName: "LON",

        open: "10:30",

        close: "19:30"

    },


    newyork: {

        name: "New York",

        shortName: "NY",

        open: "16:30",

        close: "00:30"

    }

};


/* =====================================================
   تنظیمات هشدار
===================================================== */

const OPEN_WARNING_MINUTES = 5;

const CLOSE_WARNING_MINUTES = 5;


/* =====================================================
   ELEMENTS
===================================================== */

const marketValue =
    document.getElementById(
        "market-value"
    );


const tehranClockValue =
    document.getElementById(
        "tehran-value"
    );


const sessionMap =
    document.getElementById(
        "session-map"
    );


const sessionActiveLabel =
    document.getElementById(
        "session-active-label"
    );


const activeSessionText =
    document.getElementById(
        "active-session-text"
    );


const sessionTimerBox =
    document.getElementById(
        "session-timer-box"
    );


const sessionTimerStatus =
    document.getElementById(
        "session-timer-status"
    );


const sessionTimerValue =
    document.getElementById(
        "session-timer-value"
    );


const sessionTimerName =
    document.getElementById(
        "session-timer-name"
    );


const sessionNodes = {

    sydney:
        document.getElementById(
            "session-sydney"
        ),

    tokyo:
        document.getElementById(
            "session-tokyo"
        ),

    london:
        document.getElementById(
            "session-london"
        ),

    newyork:
        document.getElementById(
            "session-newyork"
        )

};


/* =====================================================
   HH:MM → دقیقه
===================================================== */

function timeToMinutes(time) {

    const parts =
        time.split(":");

    return (
        Number(parts[0]) * 60 +
        Number(parts[1])
    );

}


/* =====================================================
   اجزای تاریخ تهران
===================================================== */

function getTehranDateParts(
    date = new Date()
) {

    const parts =
        new Intl.DateTimeFormat(
            "en-US",
            {

                timeZone:
                    "Asia/Tehran",

                year:
                    "numeric",

                month:
                    "2-digit",

                day:
                    "2-digit",

                hour:
                    "2-digit",

                minute:
                    "2-digit",

                second:
                    "2-digit",

                hourCycle:
                    "h23"

            }
        ).formatToParts(date);


    const result = {};


    parts.forEach(
        part => {

            if (
                part.type !== "literal"
            ) {

                result[part.type] =
                    part.value;

            }

        }
    );


    return {

        year:
            Number(result.year),

        month:
            Number(result.month),

        day:
            Number(result.day),

        hour:
            Number(result.hour),

        minute:
            Number(result.minute),

        second:
            Number(result.second)

    };

}


/* =====================================================
   روز هفته تهران

   0 = Sunday
   1 = Monday
   ...
   6 = Saturday
===================================================== */

function getTehranWeekday(
    date = new Date()
) {

    const parts =
        getTehranDateParts(
            date
        );


    const utcDate =
        new Date(
            Date.UTC(
                parts.year,
                parts.month - 1,
                parts.day
            )
        );


    return utcDate.getUTCDay();

}


/* =====================================================
   Weekend
===================================================== */

function isWeekend(
    date = new Date()
) {

    const weekday =
        getTehranWeekday(
            date
        );


    return (
        weekday === 0 ||
        weekday === 6
    );

}


/* =====================================================
   دقیقه فعلی تهران
===================================================== */

function getTehranMinuteOfDay(
    date = new Date()
) {

    const parts =
        getTehranDateParts(
            date
        );


    return (
        parts.hour * 60 +
        parts.minute +
        parts.second / 60
    );

}


/* =====================================================
   Session State

   منطق اصلی و اصلاح‌شده

   برای Session عبوری از نیمه‌شب:
   اگر امروز قبل از CLOSE هستیم،
   Session فقط زمانی ادامه دارد که
   روز قبل روز معاملاتی بوده باشد.

   بنابراین:

   Monday 00:00
   → NY CLOSED

   Tuesday 00:00
   → NY OPEN

===================================================== */

function getSessionState(
    session,
    currentMinute,
    date = new Date()
) {

    const open =
        timeToMinutes(
            session.open
        );


    const close =
        timeToMinutes(
            session.close
        );


    const weekday =
        getTehranWeekday(
            date
        );


    let isOpen = false;


    /*
       Session معمولی
    */

    if (open < close) {

        isOpen =
            currentMinute >= open &&
            currentMinute < close;

    }


    /*
       Session عبوری از نیمه‌شب
       مثال:
       NY = 16:30 → 00:30
    */

    else {

        /*
           بخش قبل از نیمه‌شب
        */

        if (
            currentMinute >= open
        ) {

            /*
               فقط دوشنبه تا جمعه
            */

            isOpen =
                weekday !== 0 &&
                weekday !== 6;

        }


        /*
           بخش بعد از نیمه‌شب
        */

        else {

            /*
               این بخش متعلق به Session روز قبل است.

               امروز دوشنبه:
               روز قبل = یکشنبه
               پس CLOSED

               امروز سه‌شنبه:
               روز قبل = دوشنبه
               پس OPEN
            */

            const previousDay =
                weekday === 0
                    ? 6
                    : weekday - 1;


            isOpen =
                previousDay !== 0 &&
                previousDay !== 6;

        }

    }


    /*
       احتیاط نهایی:
       شنبه و یکشنبه هرگز Session فعال ندارند.
    */

    if (
        weekday === 0 ||
        weekday === 6
    ) {

        /*
           در یکشنبه حتی اگر
           currentMinute < close باشد،
           هیچ Sessionی فعال نیست.
        */

        if (
            currentMinute < close
        ) {

            isOpen = false;

        }

    }


    return {

        open,
        close,
        isOpen

    };

}


/* =====================================================
   Active Sessions
===================================================== */

function getActiveSessions(
    currentMinute,
    date = new Date()
) {

    /*
       Weekend = هیچ Session فعالی نداریم
    */

    if (
        isWeekend(date)
    ) {

        return [];

    }


    const active = [];


    Object.entries(
        SESSION_CONFIG
    ).forEach(
        ([id, session]) => {

            const state =
                getSessionState(
                    session,
                    currentMinute,
                    date
                );


            if (
                state.isOpen
            ) {

                active.push({

                    id,

                    ...session,

                    ...state

                });

            }

        }
    );


    return active;

}


/* =====================================================
   Primary Session
===================================================== */

function getPrimaryActiveSession(
    currentMinute,
    date = new Date()
) {

    const active =
        getActiveSessions(
            currentMinute,
            date
        );


    if (
        active.length === 0
    ) {

        return null;

    }


    /*
       برای هر Session زمان OPEN
       را بررسی می‌کنیم.

       در ساعات بعد از نیمه‌شب،
       اگر NY هنوز فعال باشد،
       همان NY به عنوان Primary باقی می‌ماند.
    */

    if (
        currentMinute <
        timeToMinutes("00:30")
    ) {

        const ny =
            active.find(
                session =>
                    session.id ===
                    "newyork"
            );


        if (ny) {

            return ny;

        }

    }


    let primary =
        active[0];


    let latestOpen =
        -1;


    active.forEach(
        session => {

            const open =
                timeToMinutes(
                    session.open
                );


            if (
                open <= currentMinute &&
                open > latestOpen
            ) {

                latestOpen =
                    open;

                primary =
                    session;

            }

        }
    );


    return primary;

}


/* =====================================================
   Market
===================================================== */

function isMarketOpen(
    currentMinute,
    date = new Date()
) {

    if (
        isWeekend(date)
    ) {

        return false;

    }


    return (
        getActiveSessions(
            currentMinute,
            date
        ).length > 0
    );

}


/* =====================================================
   فاصله تا OPEN
===================================================== */

function getMinutesUntilOpen(
    session,
    currentMinute
) {

    const open =
        timeToMinutes(
            session.open
        );


    let diff =
        open -
        currentMinute;


    if (
        diff < 0
    ) {

        diff += 1440;

    }


    return diff;

}


/* =====================================================
   فاصله تا CLOSE
===================================================== */

function getMinutesUntilClose(
    session,
    currentMinute
) {

    const close =
        timeToMinutes(
            session.close
        );


    let diff =
        close -
        currentMinute;


    if (
        diff < 0
    ) {

        diff += 1440;

    }


    return diff;

}


/* =====================================================
   Open Warning
===================================================== */

function isOpenWarning(
    session,
    currentMinute,
    date = new Date()
) {

    /*
       در Weekend هشدار Session نداریم.
    */

    if (
        isWeekend(date)
    ) {

        return false;

    }


    const minutes =
        getMinutesUntilOpen(
            session,
            currentMinute
        );


    return (
        minutes > 0 &&
        minutes <=
            OPEN_WARNING_MINUTES
    );

}


/* =====================================================
   Close Warning
===================================================== */

function isCloseWarning(
    session,
    currentMinute,
    date = new Date()
) {

    if (
        isWeekend(date)
    ) {

        return false;

    }


    const state =
        getSessionState(
            session,
            currentMinute,
            date
        );


    if (
        !state.isOpen
    ) {

        return false;

    }


    const minutes =
        getMinutesUntilClose(
            session,
            currentMinute
        );


    return (
        minutes > 0 &&
        minutes <=
            CLOSE_WARNING_MINUTES
    );

}


/* =====================================================
   آپدیت Session Map
===================================================== */

function updateSessionMap(
    currentMinute,
    date = new Date()
) {

    sessionMap.classList.remove(
        "has-active",
        "weekend"
    );


    Object.values(
        sessionNodes
    ).forEach(
        node => {

            node.classList.remove(
                "active",
                "open-warning",
                "close-warning"
            );

        }
    );


    /*
       Weekend
    */

    if (
        isWeekend(date)
    ) {

        sessionMap.classList.add(
            "weekend"
        );


        sessionActiveLabel.classList.add(
            "visible"
        );


        activeSessionText.innerText =
            "MARKET CLOSED";


        /*
           همه Sessionها قرمز
           ولی فقط حالت Closed.
        */

        Object.values(
            sessionNodes
        ).forEach(
            node => {

                node.classList.add(
                    "close-warning"
                );

            }
        );


        return;

    }


    /*
       Active Sessions
    */

    const active =
        getActiveSessions(
            currentMinute,
            date
        );


    if (
        active.length > 0
    ) {

        sessionMap.classList.add(
            "has-active"
        );

    }


    active.forEach(
        session => {

            const node =
                sessionNodes[
                    session.id
                ];


            if (!node) {
                return;
            }


            node.classList.add(
                "active"
            );

        }
    );


    /*
       OPEN / CLOSE Warning
    */

    Object.entries(
        SESSION_CONFIG
    ).forEach(
        ([id, session]) => {

            const node =
                sessionNodes[id];


            const state =
                getSessionState(
                    session,
                    currentMinute,
                    date
                );


            /*
               CLOSE
            */

            if (
                state.isOpen &&
                isCloseWarning(
                    session,
                    currentMinute,
                    date
                )
            ) {

                node.classList.remove(
                    "active"
                );


                node.classList.add(
                    "close-warning"
                );

            }


            /*
               OPEN
            */

            else if (
                !state.isOpen &&
                isOpenWarning(
                    session,
                    currentMinute,
                    date
                )
            ) {

                node.classList.add(
                    "open-warning"
                );

            }

        }
    );


    /*
       Active Label
    */

    if (
        active.length > 0
    ) {

        sessionActiveLabel.classList.add(
            "visible"
        );


        const primary =
            getPrimaryActiveSession(
                currentMinute,
                date
            );


        if (primary) {

            activeSessionText.innerText =
                primary.shortName +
                " ACTIVE";

        }

    }

    else {

        sessionActiveLabel.classList.remove(
            "visible"
        );

    }

}


/* =====================================================
   Market Update
===================================================== */

function updateMarket(
    currentMinute,
    date = new Date()
) {

    const open =
        isMarketOpen(
            currentMinute,
            date
        );


    if (open) {

        marketValue.innerText =
            "OPEN";

        marketValue.style.color =
            "#00ff88";

        marketValue.style.textShadow =
            "0 0 8px #00ff88";

    }

    else {

        marketValue.innerText =
            "CLOSED";

        marketValue.style.color =
            "#ff3333";

        marketValue.style.textShadow =
            "0 0 8px #ff3333";

    }

}


/* =====================================================
   تبدیل ثانیه به HH:MM:SS
===================================================== */

function formatDuration(
    totalSeconds
) {

    totalSeconds =
        Math.max(
            0,
            Math.floor(
                totalSeconds
            )
        );


    const hours =
        Math.floor(
            totalSeconds / 3600
        );


    const minutes =
        Math.floor(
            (totalSeconds % 3600) / 60
        );


    const seconds =
        totalSeconds % 60;


    return (

        String(hours)
            .padStart(2, "0") +

        ":" +

        String(minutes)
            .padStart(2, "0") +

        ":" +

        String(seconds)
            .padStart(2, "0")

    );

}


/* =====================================================
   تایمر Session

   اگر Session فعال باشد:
   CLOSE → SYD

   اگر Session بسته باشد:
   NEXT → TOK

   در Weekend:
   MARKET → CLOSED

===================================================== */

function updateSessionTimer(
    now
) {

    const parts =
        getTehranDateParts(
            now
        );


    const currentSeconds =
        parts.hour * 3600 +
        parts.minute * 60 +
        parts.second;


    const currentMinute =
        currentSeconds / 60;


    /*
       Weekend
    */

    if (
        isWeekend(now)
    ) {

        sessionTimerBox.classList.remove(
            "timer-warning"
        );


        sessionTimerBox.classList.add(
            "timer-closed"
        );


        sessionTimerStatus.innerText =
            "MARKET";


        sessionTimerValue.innerText =
            "CLOSED";


        sessionTimerName.innerText =
            "WEEKEND";


        return;

    }


    sessionTimerBox.classList.remove(
        "timer-closed",
        "timer-warning"
    );


    const active =
        getActiveSessions(
            currentMinute,
            now
        );


    /*
       اگر Session فعال داریم
    */

    if (
        active.length > 0
    ) {

        const primary =
            getPrimaryActiveSession(
                currentMinute,
                now
            );


        if (!primary) {
            return;
        }


        let secondsToClose =
            getMinutesUntilClose(
                primary,
                currentMinute
            ) * 60;


        /*
           اصلاح دقت ثانیه
        */

        const closeSeconds =
            timeToMinutes(
                primary.close
            ) * 60;


        if (
            currentSeconds <
            closeSeconds
        ) {

            secondsToClose =
                closeSeconds -
                currentSeconds;

        }


        /*
           اگر CLOSE فردا است
        */

        if (
            secondsToClose < 0
        ) {

            secondsToClose +=
                86400;

        }


        sessionTimerStatus.innerText =
            "CLOSE";


        sessionTimerValue.innerText =
            formatDuration(
                secondsToClose
            );


        sessionTimerName.innerText =
            primary.shortName;


        /*
           هشدار پنج دقیقه آخر
        */

        if (
            secondsToClose <=
            CLOSE_WARNING_MINUTES * 60
        ) {

            sessionTimerBox.classList.add(
                "timer-warning"
            );

        }


        return;

    }


    /*
       هیچ Session فعالی نیست
       → پیدا کردن Session بعدی
    */

    let nextSession = null;

    let smallestDiff =
        Infinity;


    Object.entries(
        SESSION_CONFIG
    ).forEach(
        ([id, session]) => {

            const open =
                timeToMinutes(
                    session.open
                );


            let diff =
                open -
                currentMinute;


            if (
                diff <= 0
            ) {

                diff += 1440;

            }


            if (
                diff <
                smallestDiff
            ) {

                smallestDiff =
                    diff;

                nextSession = {

                    id,

                    ...session

                };

            }

        }
    );


    if (
        nextSession
    ) {

        let secondsToOpen =
            smallestDiff * 60;


        /*
           اگر کمتر از یک روز باشد،
           محاسبه دقیق‌تر با ثانیه
        */

        const openSeconds =
            timeToMinutes(
                nextSession.open
            ) * 60;


        if (
            openSeconds >
            currentSeconds
        ) {

            secondsToOpen =
                openSeconds -
                currentSeconds;

        }


        if (
            secondsToOpen <= 0
        ) {

            secondsToOpen +=
                86400;

        }


        sessionTimerStatus.innerText =
            "NEXT";


        sessionTimerValue.innerText =
            formatDuration(
                secondsToOpen
            );


        sessionTimerName.innerText =
            nextSession.shortName;


        if (
            secondsToOpen <=
            OPEN_WARNING_MINUTES * 60
        ) {

            sessionTimerBox.classList.add(
                "timer-warning"
            );

        }

    }

}


/* =====================================================
   ساعت تهران
===================================================== */

function getTehranTime(
    date = new Date()
) {

    return new Intl.DateTimeFormat(
        "en-US",
        {

            timeZone:
                "Asia/Tehran",

            hour:
                "2-digit",

            minute:
                "2-digit",

            second:
                "2-digit",

            hour12:
                true

        }
    ).format(date);

}


/* =====================================================
   تاریخ تهران
===================================================== */

function getTehranDate(
    date = new Date()
) {

    return new Intl.DateTimeFormat(
        "en-US",
        {

            timeZone:
                "Asia/Tehran",

            day:
                "2-digit",

            month:
                "short",

            year:
                "numeric"

        }
    ).format(date);

}


/* =====================================================
   UPDATE CLOCKS
===================================================== */

function updateClocks() {

    const now =
        new Date();


    const parts =
        getTehranDateParts(
            now
        );


    const currentMinute =
        parts.hour * 60 +
        parts.minute +
        parts.second / 60;


    /*
       تهران
    */

    tehranClockValue.innerText =
        getTehranTime(
            now
        );


    /*
       Session Map
    */

    updateSessionMap(
        currentMinute,
        now
    );


    /*
       Market
    */

    updateMarket(
        currentMinute,
        now
    );


    /*
       Session Timer
    */

    updateSessionTimer(
        now
    );


    /*
       Date
    */

    document.getElementById(
        "date-value"
    ).innerText =
        getTehranDate(
            now
        );

}


/* =====================================================
   START
===================================================== */

updateClocks();


setInterval(
    updateClocks,
    1000
);


/* =====================================================
   SUBSCRIBE / LIKE
===================================================== */

const subscribeState =
    document.querySelector(
        ".subscribe-state"
    );


const likeState =
    document.querySelector(
        ".like-state"
    );


const likeIcon =
    document.querySelector(
        ".like-icon"
    );


setInterval(
    function () {

        if (

            subscribeState.style.display !==
            "none"

        ) {

            subscribeState.style.display =
                "none";


            likeState.style.display =
                "flex";


            likeIcon.classList.remove(
                "like-pulse"
            );


            void likeIcon.offsetWidth;


            likeIcon.classList.add(
                "like-pulse"
            );

        }

        else {

            likeState.style.display =
                "none";


            subscribeState.style.display =
                "flex";

        }

    },

    10000

);
