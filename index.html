<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<title>FX LEVEL Overlay</title>

<style>

/* =====================================================
   PAGE
===================================================== */

html,
body {

    width: 1920px;
    height: 1080px;

    margin: 0;
    padding: 0;

    overflow: hidden;

    background: #808080;

    font-family: Arial, sans-serif;

    color: white;
}


/* =====================================================
   BACKGROUND GRID
===================================================== */

body::before {

    content: "";

    position: absolute;

    inset: 0;

    background-image:

        linear-gradient(
            rgba(0,255,136,0.40) 1px,
            transparent 1px
        ),

        linear-gradient(
            90deg,
            rgba(0,255,136,0.40) 1px,
            transparent 1px
        );

    background-size: 40px 40px;

    pointer-events: none;
}


/* =====================================================
   MAIN FRAME
===================================================== */

.main-frame {

    position: absolute;

    top: 40px;
    left: 40px;

    width: calc(100% - 80px);
    height: calc(100% - 80px);

    clip-path: polygon(

        25px 0,
        calc(100% - 25px) 0,
        100% 25px,
        100% calc(100% - 25px),
        calc(100% - 25px) 100%,
        25px 100%,
        0 calc(100% - 25px),
        0 25px

    );

    background: rgba(0,0,0,0.18);

    border: 3px solid #00ff88;

    box-shadow:

        0 0 25px #00ff88,
        inset 0 0 25px #00ff88;
}


/* =====================================================
   TOP BAR
===================================================== */

.top-bar {

    position: absolute;

    top: 55px;
    left: 50%;

    transform: translateX(-50%);

    width: 86%;
    height: 90px;

    clip-path: polygon(

        18px 0,
        calc(100% - 18px) 0,
        100% 18px,
        100% 100%,
        0 100%,
        0 18px

    );

    background: rgba(0,0,0,0.35);

    border: 2px solid #00ff88;

    box-shadow:

        0 0 14px #00ff88,
        inset 0 0 14px #00ff88;

    display: flex;

    justify-content: space-between;

    align-items: center;

    padding: 0 35px;

    box-sizing: border-box;
}


/* =====================================================
   TOP ITEMS
===================================================== */

.top-item {

    flex: 1;

    display: flex;

    justify-content: center;
}


.item-row {

    display: flex;

    align-items: center;

    gap: 14px;
}


/* =====================================================
   ICONS
===================================================== */

.icon {

    width: 40px;
    height: 40px;

    stroke: #ffffff;

    fill: none;

    filter:
        drop-shadow(0 0 6px #00ff88);
}


/* =====================================================
   TEXT
===================================================== */

.text-box {

    display: flex;

    flex-direction: column;

    line-height: 1.1;
}


.text-box span:first-child {

    font-size: 14px;

    color: #ffae4a;

    text-shadow:
        0 0 6px #ffae4a;
}


.text-box span:last-child {

    font-size: 22px;

    font-weight: bold;

    color: #00ff88;

    text-shadow:
        0 0 8px #00ff88;
}


/* =====================================================
   MARKET STATUS
===================================================== */

#market-value.market-open {

    color: #00ff88;

    text-shadow:
        0 0 8px #00ff88;
}


#market-value.market-closed {

    color: #ff3333;

    text-shadow:
        0 0 8px #ff3333;
}


/* =====================================================
   DIVIDER
===================================================== */

.divider {

    width: 1px;

    height: 60%;

    background:
        rgba(255,255,255,0.35);

    flex-shrink: 0;
}


/* =====================================================
   SESSION MAP
===================================================== */

.session-map {

    flex: 1.25;

    display: flex;

    justify-content: center;

    align-items: center;

    min-width: 360px;

    position: relative;
}


.session-map-inner {

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    width: 100%;

    position: relative;
}


/* =====================================================
   SESSION TITLE
===================================================== */

.session-map-title {

    font-size: 13px;

    font-weight: bold;

    letter-spacing: 3px;

    color: #ffae4a;

    text-shadow:

        0 0 6px #ffae4a,
        0 0 14px rgba(255,174,74,0.35);

    margin-bottom: 8px;
}


/* =====================================================
   SESSION TRACK
===================================================== */

.session-track {

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 13px;

    height: 27px;

    position: relative;
}


/* =====================================================
   SESSION NODE
===================================================== */

.session-node {

    display: flex;

    align-items: center;

    gap: 6px;

    position: relative;

    font-size: 15px;

    font-weight: bold;

    letter-spacing: 1px;

    color: rgba(255,255,255,0.42);

    transition:

        color 0.35s ease,

        text-shadow 0.35s ease,

        opacity 0.35s ease;
}


/* =====================================================
   SESSION NAME
===================================================== */

.session-name {

    position: relative;

    z-index: 3;

    transition:

        color 0.35s ease,

        text-shadow 0.35s ease;
}


/* =====================================================
   DOT
===================================================== */

.session-dot {

    width: 7px;
    height: 7px;

    border-radius: 50%;

    background: rgba(255,255,255,0.25);

    box-shadow:

        0 0 2px rgba(255,255,255,0.15);

    position: relative;

    z-index: 3;

    transition:

        background 0.35s ease,

        box-shadow 0.35s ease,

        transform 0.35s ease;
}


/* =====================================================
   DOT HALO
===================================================== */

.session-dot::before {

    content: "";

    position: absolute;

    width: 18px;
    height: 18px;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%,-50%)
        scale(0.65);

    border-radius: 50%;

    border: 1px solid
        rgba(0,255,136,0);

    opacity: 0;

    transition:

        opacity 0.3s ease,

        transform 0.3s ease,

        border-color 0.3s ease;
}


/* =====================================================
   ACTIVE SESSION
===================================================== */

.session-node.active {

    color: #00ff88;

    text-shadow:

        0 0 5px #00ff88,
        0 0 12px rgba(0,255,136,0.8);
}


.session-node.active .session-dot {

    background: #00ff88;

    box-shadow:

        0 0 4px #00ff88,
        0 0 10px #00ff88,
        0 0 20px rgba(0,255,136,0.85);

    animation:
        activeDotPulse 1.25s ease-in-out infinite;
}


.session-node.active .session-dot::before {

    opacity: 0.65;

    transform:
        translate(-50%,-50%)
        scale(1);

    border-color:
        rgba(0,255,136,0.55);

    animation:
        activeHalo 1.25s ease-in-out infinite;
}


@keyframes activeDotPulse {

    0%,
    100% {

        transform: scale(0.82);

        opacity: 0.78;
    }

    50% {

        transform: scale(1.30);

        opacity: 1;
    }
}


@keyframes activeHalo {

    0%,
    100% {

        transform:
            translate(-50%,-50%)
            scale(0.75);

        opacity: 0.20;
    }

    50% {

        transform:
            translate(-50%,-50%)
            scale(1.35);

        opacity: 0.75;
    }
}


/* =====================================================
   CONNECTOR
===================================================== */

.session-connector {

    width: 16px;

    height: 1px;

    background:
        rgba(255,255,255,0.18);

    box-shadow:
        0 0 4px rgba(0,255,136,0.12);

    position: relative;

    overflow: hidden;
}


.session-connector::after {

    content: "";

    position: absolute;

    top: 0;

    left: -100%;

    width: 60%;

    height: 100%;

    background:

        linear-gradient(
            90deg,
            transparent,
            rgba(0,255,136,0.9),
            transparent
        );

    opacity: 0;
}


.session-map.has-active
.session-connector::after {

    animation:
        connectorSweep 3.2s ease-in-out infinite;

    opacity: 1;
}


@keyframes connectorSweep {

    0% {

        left: -100%;
    }

    55% {

        left: 130%;
    }

    100% {

        left: 130%;
    }
}


/* =====================================================
   OPEN WARNING
===================================================== */

.session-node.open-warning {

    color: #00ff88;

    animation:
        openWarningBlink 0.72s ease-in-out infinite;
}


.session-node.open-warning .session-dot {

    background: #00ff88;

    box-shadow:

        0 0 5px #00ff88,
        0 0 13px #00ff88,
        0 0 28px rgba(0,255,136,0.95);

    animation:
        openDotWarning 0.72s ease-in-out infinite;
}


.session-node.open-warning .session-dot::before {

    border-color:
        rgba(0,255,136,0.85);

    opacity: 1;

    animation:
        warningHalo 0.72s ease-in-out infinite;
}


@keyframes openWarningBlink {

    0%,
    100% {

        opacity: 1;

        text-shadow:

            0 0 6px #00ff88,
            0 0 16px #00ff88;
    }

    50% {

        opacity: 0.22;

        text-shadow:
            0 0 2px #00ff88;
    }
}


@keyframes openDotWarning {

    0%,
    100% {

        transform: scale(0.80);

        opacity: 0.55;
    }

    50% {

        transform: scale(1.45);

        opacity: 1;
    }
}


@keyframes warningHalo {

    0%,
    100% {

        transform:
            translate(-50%,-50%)
            scale(0.65);

        opacity: 0.20;
    }

    50% {

        transform:
            translate(-50%,-50%)
            scale(1.55);

        opacity: 0.85;
    }
}


/* =====================================================
   CLOSE WARNING
===================================================== */

.session-node.close-warning {

    color: #ff3333;

    animation:
        closeWarningBlink 0.65s ease-in-out infinite;
}


.session-node.close-warning .session-dot {

    background: #ff3333;

    box-shadow:

        0 0 5px #ff3333,
        0 0 13px #ff3333,
        0 0 30px rgba(255,51,51,0.95);

    animation:
        closeDotWarning 0.65s ease-in-out infinite;
}


.session-node.close-warning .session-dot::before {

    border-color:
        rgba(255,51,51,0.85);

    opacity: 1;

    animation:
        warningHaloRed 0.65s ease-in-out infinite;
}


@keyframes closeWarningBlink {

    0%,
    100% {

        opacity: 1;

        text-shadow:

            0 0 6px #ff3333,
            0 0 16px #ff3333;
    }

    50% {

        opacity: 0.18;

        text-shadow:
            0 0 2px #ff3333;
    }
}


@keyframes closeDotWarning {

    0%,
    100% {

        transform: scale(0.80);

        opacity: 0.55;
    }

    50% {

        transform: scale(1.50);

        opacity: 1;
    }
}


@keyframes warningHaloRed {

    0%,
    100% {

        transform:
            translate(-50%,-50%)
            scale(0.65);

        opacity: 0.20;
    }

    50% {

        transform:
            translate(-50%,-50%)
            scale(1.55);

        opacity: 0.85;
    }
}


/* =====================================================
   WEEKEND / MARKET CLOSED
===================================================== */

.session-map.weekend .session-map-title {

    color: #ffae4a;

    text-shadow:
        0 0 6px #ffae4a;
}


.session-map.weekend .session-node {

    color: rgba(255,51,51,0.55);
}


.session-map.weekend .session-dot {

    background: #ff3333;

    box-shadow:

        0 0 4px #ff3333,
        0 0 10px rgba(255,51,51,0.55);

    animation:
        closedWeekendPulse 1.8s ease-in-out infinite;
}


.session-map.weekend .session-dot::before {

    border-color:
        rgba(255,51,51,0.45);

    opacity: 0.55;

    transform:
        translate(-50%,-50%)
        scale(0.9);
}


.session-map.weekend .session-active-label {

    color: #ff3333;

    text-shadow:

        0 0 6px #ff3333,
        0 0 14px rgba(255,51,51,0.45);
}


@keyframes closedWeekendPulse {

    0%,
    100% {

        transform: scale(0.85);

        opacity: 0.55;
    }

    50% {

        transform: scale(1.15);

        opacity: 1;
    }
}


/* =====================================================
   ACTIVE LABEL
===================================================== */

.session-active-label {

    position: relative;

    height: 18px;

    margin-top: 3px;

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 5px;

    font-size: 10px;

    font-weight: bold;

    letter-spacing: 2px;

    color: #00ff88;

    text-shadow:

        0 0 6px #00ff88,
        0 0 14px rgba(0,255,136,0.45);

    opacity: 0;

    transition:
        opacity 0.35s ease;
}


.session-active-label.visible {

    opacity: 1;
}


.active-arrow {

    display: inline-block;

    font-size: 12px;

    animation:
        activeArrowFloat 1s ease-in-out infinite;
}


@keyframes activeArrowFloat {

    0%,
    100% {

        transform:
            translateY(2px);
    }

    50% {

        transform:
            translateY(-1px);
    }
}


/* =====================================================
   SESSION TIMER
===================================================== */

.session-timer {

    min-width: 160px;

    display: flex;

    justify-content: center;

    align-items: center;
}


.session-timer-box {

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    line-height: 1;

    min-width: 150px;
}


.session-timer-label {

    font-size: 11px;

    font-weight: bold;

    letter-spacing: 2px;

    color: #ffae4a;

    margin-bottom: 5px;

    text-shadow:
        0 0 6px #ffae4a;
}


.session-timer-value {

    font-size: 20px;

    font-weight: bold;

    letter-spacing: 1px;

    color: #00ff88;

    text-shadow:

        0 0 7px #00ff88,
        0 0 14px rgba(0,255,136,0.55);

    font-variant-numeric:
        tabular-nums;
}


.session-timer-box.warning-close
.session-timer-value {

    color: #ff3333;

    text-shadow:

        0 0 7px #ff3333,
        0 0 16px rgba(255,51,51,0.65);

    animation:
        timerWarningBlink 0.65s ease-in-out infinite;
}


.session-timer-box.warning-open
.session-timer-value {

    color: #00ff88;

    text-shadow:

        0 0 7px #00ff88,
        0 0 16px rgba(0,255,136,0.65);

    animation:
        timerWarningBlink 0.72s ease-in-out infinite;
}


.session-timer-box.closed
.session-timer-value {

    color: #ff3333;

    text-shadow:
        0 0 7px #ff3333;
}


@keyframes timerWarningBlink {

    0%,
    100% {

        opacity: 1;
    }

    50% {

        opacity: 0.28;
    }
}


/* =====================================================
   WEBCAM
===================================================== */

.webcam-frame {

    position: absolute;

    bottom: 170px;
    left: 80px;

    width: 430px;
    height: 250px;

    border: 4px solid #00ff66;

    border-radius: 0;

    background:
        rgba(0,0,0,0.18);

    box-shadow:

        0 0 25px rgba(0,255,102,1),
        0 0 55px rgba(0,255,102,0.85),
        0 0 110px rgba(0,255,102,0.65),
        0 0 160px rgba(0,255,102,0.45);
}


/* =====================================================
   BOTTOM BAR
===================================================== */

.bottom-bar {

    position: absolute;

    bottom: 55px;
    left: 50%;

    transform: translateX(-50%);

    width: 86%;
    height: 80px;

    clip-path: polygon(

        0 0,
        100% 0,
        100% calc(100% - 18px),
        calc(100% - 18px) 100%,
        18px 100%,
        0 calc(100% - 18px)

    );

    background:
        rgba(0,0,0,0.35);

    border: 2px solid #00ff88;

    box-shadow:

        0 0 14px #00ff88,
        inset 0 0 14px #00ff88;

    display: flex;

    justify-content: space-between;

    align-items: center;

    padding: 0 40px;

    box-sizing: border-box;
}


/* =====================================================
   BOTTOM FONT
===================================================== */

.bottom-item span {

    font-family: Arial, sans-serif;

    font-size: 18px;

    font-weight: bold;

    line-height: 1;

    display: flex;

    align-items: center;

    white-space: nowrap;
}


/* =====================================================
   BOTTOM ITEMS
===================================================== */

.bottom-item {

    display: flex;

    align-items: center;

    gap: 10px;
}


/* =====================================================
   BOTTOM NORMAL COLORS
===================================================== */

.bottom-item:not(.subscribe) span {

    color: #4da6ff;

    text-shadow:
        0 0 6px #4da6ff;
}


/* =====================================================
   BOTTOM DIVIDER
===================================================== */

.bottom-divider {

    width: 1px;

    height: 35px;

    background:
        rgba(255,255,255,0.22);

    flex-shrink: 0;
}


/* =====================================================
   BOTTOM ICONS
===================================================== */

.bottom-icon {

    width: 40px;
    height: 40px;

    stroke: #ffffff;

    fill: none;

    display: flex;

    align-items: center;

    flex-shrink: 0;

    filter:
        drop-shadow(0 0 4px #ffb347);
}


/* =====================================================
   SUBSCRIBE
===================================================== */

.subscribe {

    position: relative;

    width: 145px;
    min-width: 145px;
    max-width: 145px;

    height: 40px;

    flex-shrink: 0;
}


.promo-state {

    position: absolute;

    left: 0;
    top: 50%;

    transform: translateY(-50%);

    display: flex;

    align-items: center;

    gap: 10px;

    white-space: nowrap;
}


.subscribe-state span {

    font-family: Arial, sans-serif;

    font-size: 18px;

    font-weight: bold;

    color: #ff3333;

    text-shadow:
        0 0 5px rgba(255,51,51,0.55);
}


/* =====================================================
   BELL
===================================================== */

.bell-icon {

    stroke: #ff3333;

    filter:
        drop-shadow(0 0 4px #ff3333);

    transform-origin: 50% 15%;
}


.subscribe-state .bell-icon {

    animation:
        bellMiddle 10s ease-in-out infinite;
}


@keyframes bellMiddle {

    0% {
        transform: rotate(0deg);
    }

    45% {
        transform: rotate(0deg);
    }

    47% {
        transform: rotate(-6deg);
    }

    48.5% {
        transform: rotate(6deg);
    }

    50% {
        transform: rotate(-4deg);
    }

    51.5% {
        transform: rotate(0deg);
    }

    53% {
        transform: rotate(-6deg);
    }

    54.5% {
        transform: rotate(6deg);
    }

    56% {
        transform: rotate(-4deg);
    }

    57.5% {
        transform: rotate(0deg);
    }

    100% {
        transform: rotate(0deg);
    }
}


/* =====================================================
   LIKE
===================================================== */

.like-state {

    display: none;
}


.like-state span {

    font-family: Arial, sans-serif;

    font-size: 18px;

    font-weight: bold;

    color: #4da6ff;

    text-shadow:
        0 0 5px rgba(77,166,255,0.55);
}


.like-icon {

    stroke: #4da6ff;

    filter:
        drop-shadow(0 0 4px #4da6ff);

    transform-origin: center;
}


.like-pulse {

    animation:
        likePulse 10s ease-in-out infinite;
}


@keyframes likePulse {

    0% {
        transform: scale(0.82);
    }

    8% {
        transform: scale(1.10);
    }

    15% {
        transform: scale(0.88);
    }

    22% {
        transform: scale(1.12);
    }

    29% {
        transform: scale(0.88);
    }

    38% {
        transform: scale(1);
    }

    100% {
        transform: scale(1);
    }
}


/* =====================================================
   VIP
===================================================== */

.vip {

    position: relative;

    overflow: hidden;
}


.vip span {

    animation:
        vipPulse 1.8s infinite ease-in-out;
}


@keyframes vipPulse {

    0% {

        text-shadow:
            0 0 6px #00ff88;
    }

    50% {

        text-shadow:
            0 0 18px #00ff88;
    }

    100% {

        text-shadow:
            0 0 6px #00ff88;
    }
}


/* =====================================================
   SHINE
===================================================== */

.vip .shine {

    position: absolute;

    top: 0;
    left: -120%;

    width: 80%;
    height: 100%;

    background:

        linear-gradient(
            120deg,
            transparent,
            rgba(255,255,255,0.4),
            transparent
        );

    animation:
        shineSweep 3s infinite;
}


@keyframes shineSweep {

    0% {
        left: -120%;
    }

    50% {
        left: 120%;
    }

    100% {
        left: 120%;
    }
}

</style>

</head>


<body>


<div class="main-frame"></div>


<!-- =====================================================
     TOP BAR
===================================================== -->

<div class="top-bar">


<!-- MARKET -->

<div class="top-item">

    <div class="item-row">

        <svg class="icon" viewBox="0 0 24 24">

            <path
                d="M4 17l5-5 3 3 7-8"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
            />

            <path
                d="M15 7h4v4"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
            />

        </svg>


        <div class="text-box">

            <span>MARKET</span>

            <span
                id="market-value"
                class="market-closed"
            >
                CLOSED
            </span>

        </div>

    </div>

</div>


<div class="divider"></div>


<!-- =====================================================
     SESSION MAP
===================================================== -->

<div
    class="top-item session-map"
    id="session-map"
>

    <div class="session-map-inner">

        <div class="session-map-title">
            SESSION
        </div>


        <div class="session-track">


            <div
                class="session-node"
                id="session-sydney"
            >

                <span class="session-name">
                    SYD
                </span>

                <span class="session-dot"></span>

            </div>


            <div class="session-connector"></div>


            <div
                class="session-node"
                id="session-tokyo"
            >

                <span class="session-name">
                    TOK
                </span>

                <span class="session-dot"></span>

            </div>


            <div class="session-connector"></div>


            <div
                class="session-node"
                id="session-london"
            >

                <span class="session-name">
                    LON
                </span>

                <span class="session-dot"></span>

            </div>


            <div class="session-connector"></div>


            <div
                class="session-node"
                id="session-newyork"
            >

                <span class="session-name">
                    NY
                </span>

                <span class="session-dot"></span>

            </div>


        </div>


        <div
            class="session-active-label"

<script>

/* =====================================================
   SESSION CONFIGURATION
   =====================================================

   تمام ساعت‌ها دقیقاً بر اساس ساعت تهران هستند.

   Sydney:
   01:30 → 09:30

   Tokyo:
   03:30 → 12:30

   London:
   10:30 → 19:30

   New York:
   16:30 → 00:30

===================================================== */

const SESSION_CONFIG = {

    sydney: {

        name: "Sydney",

        shortName: "SYD",

        open: "01:30",

        close: "09:30"

    },


    tokyo: {

        name: "Tokyo",

        shortName: "TOK",

        open: "03:30",

        close: "12:30"

    },


    london: {

        name: "London",

        shortName: "LON",

        open: "10:30",

        close: "19:30"

    },


    newyork: {

        name: "New York",

        shortName: "NY",

        open: "16:30",

        close: "00:30"

    }

};


/* =====================================================
   WARNING SETTINGS
===================================================== */

const OPEN_WARNING_MINUTES = 5;

const CLOSE_WARNING_MINUTES = 5;


/* =====================================================
   DOM
===================================================== */

const marketValue =
    document.getElementById(
        "market-value"
    );


const tehranClockValue =
    document.getElementById(
        "tehran-value"
    );


const dateValue =
    document.getElementById(
        "date-value"
    );


const sessionMap =
    document.getElementById(
        "session-map"
    );


const sessionActiveLabel =
    document.getElementById(
        "session-active-label"
    );


const activeSessionText =
    document.getElementById(
        "active-session-text"
    );


const sessionTimerBox =
    document.getElementById(
        "session-timer-box"
    );


const sessionTimerLabel =
    document.getElementById(
        "session-timer-label"
    );


const sessionTimerValue =
    document.getElementById(
        "session-timer-value"
    );


/* =====================================================
   SESSION NODES
===================================================== */

const sessionNodes = {

    sydney:
        document.getElementById(
            "session-sydney"
        ),

    tokyo:
        document.getElementById(
            "session-tokyo"
        ),

    london:
        document.getElementById(
            "session-london"
        ),

    newyork:
        document.getElementById(
            "session-newyork"
        )

};


/* =====================================================
   HH:MM → MINUTES
===================================================== */

function timeToMinutes(time) {

    const parts =
        time.split(":");

    return (
        Number(parts[0]) * 60 +
        Number(parts[1])
    );

}


/* =====================================================
   GET TEHRAN PARTS
===================================================== */

function getTehranDateParts(
    date = new Date()
) {

    const parts =
        new Intl.DateTimeFormat(
            "en-US",
            {

                timeZone:
                    "Asia/Tehran",

                year:
                    "numeric",

                month:
                    "2-digit",

                day:
                    "2-digit",

                hour:
                    "2-digit",

                minute:
                    "2-digit",

                second:
                    "2-digit",

                hourCycle:
                    "h23"

            }
        ).formatToParts(date);


    const result = {};


    parts.forEach(
        part => {

            if (
                part.type !== "literal"
            ) {

                result[part.type] =
                    part.value;

            }

        }
    );


    return {

        year:
            Number(result.year),

        month:
            Number(result.month),

        day:
            Number(result.day),

        hour:
            Number(result.hour),

        minute:
            Number(result.minute),

        second:
            Number(result.second)

    };

}


/* =====================================================
   GET CURRENT TEHRAN MINUTE
===================================================== */

function getTehranMinuteOfDay(
    date = new Date()
) {

    const parts =
        getTehranDateParts(
            date
        );


    return (

        parts.hour * 60 +
        parts.minute +
        parts.second / 60

    );

}


/* =====================================================
   WEEKEND
===================================================== */

function isWeekend(
    date = new Date()
) {

    const parts =
        getTehranDateParts(
            date
        );


    /*
       ساخت Date مصنوعی فقط برای
       تعیین روز هفته.

       هیچ Session Time Zoneای
       از این Date گرفته نمی‌شود.
    */

    const utcDate =
        new Date(
            Date.UTC(
                parts.year,
                parts.month - 1,
                parts.day
            )
        );


    const day =
        utcDate.getUTCDay();


    return (

        day === 0 ||
        day === 6

    );

}


/* =====================================================
   CORE SESSION LOGIC
   =====================================================

   نکته بسیار مهم:

   Session New York از 16:30 تا 00:30 است.

   اما 00:00 تا 00:30 مربوط به Session
   روز معاملاتی قبلی است.

   بنابراین در روز جدید، قبل از 00:30
   نباید New York را Active کنیم.

   برای حل کامل این موضوع، Sessionها را
   نسبت به "روز معاملاتی تهران" بررسی می‌کنیم.

===================================================== */

function getSessionState(
    id,
    session,
    currentMinute,
    date = new Date()
) {

    const weekend =
        isWeekend(date);


    /*
       آخر هفته:
       هیچ Session فعالی وجود ندارد.
    */

    if (weekend) {

        return {

            isOpen: false,

            isWeekend: true,

            open: timeToMinutes(
                session.open
            ),

            close: timeToMinutes(
                session.close
            )

        };

    }


    const open =
        timeToMinutes(
            session.open
        );


    const close =
        timeToMinutes(
            session.close
        );


    /*
       Sessionهای معمولی
       مانند:

       Sydney 01:30 → 09:30
       Tokyo  03:30 → 12:30
       London 10:30 → 19:30
    */

    if (open < close) {

        return {

            isOpen:
                currentMinute >= open &&
                currentMinute < close,

            isWeekend: false,

            open,

            close

        };

    }


    /*
       =================================================
       SESSION عبوری از نیمه‌شب
       =================================================

       فقط New York این حالت را دارد:

       16:30 → 00:30

       منطق قبلی:

       current >= 16:30
       OR
       current < 00:30

       باعث می‌شد در روز بعد، ساعت 00:00،
       New York دوباره Active دیده شود.

       اینجا عمداً قسمت بعد از نیمه‌شب را
       Active نمی‌کنیم.

       New York فقط از 16:30 همان روز
       تا 00:00 فعال است.

       از 00:00 تا 00:30:
       CLOSED

       از 00:30 تا 16:29:
       CLOSED

       از 16:30:
       OPEN
    */

    if (id === "newyork") {

        return {

            isOpen:
                currentMinute >= open,

            isWeekend: false,

            open,

            close

        };

    }


    return {

        isOpen: false,

        isWeekend: false,

        open,

        close

    };

}


/* =====================================================
   ACTIVE SESSIONS
===================================================== */

function getActiveSessions(
    currentMinute,
    date = new Date()
) {

    if (
        isWeekend(date)
    ) {

        return [];

    }


    const active = [];


    Object.entries(
        SESSION_CONFIG
    ).forEach(
        ([id, session]) => {

            const state =
                getSessionState(
                    id,
                    session,
                    currentMinute,
                    date
                );


            if (
                state.isOpen
            ) {

                active.push({

                    id,

                    ...session,

                    ...state

                });

            }

        }
    );


    return active;

}


/* =====================================================
   PRIMARY ACTIVE SESSION
===================================================== */

function getPrimaryActiveSession(
    currentMinute,
    date = new Date()
) {

    const active =
        getActiveSessions(
            currentMinute,
            date
        );


    if (
        active.length === 0
    ) {

        return null;

    }


    /*
       چون Sessionها در طول روز
       به ترتیب باز می‌شوند،
       آخرین Session بازشده
       Session اصلی است.
    */

    let primary =
        active[0];


    let latestOpen = -1;


    active.forEach(
        session => {

            const open =
                timeToMinutes(
                    session.open
                );


            if (
                open <= currentMinute &&
                open > latestOpen
            ) {

                latestOpen =
                    open;

                primary =
                    session;

            }

        }
    );


    return primary;

}


/* =====================================================
   MARKET OPEN
===================================================== */

function isMarketOpen(
    currentMinute,
    date = new Date()
) {

    if (
        isWeekend(date)
    ) {

        return false;

    }


    return (
        getActiveSessions(
            currentMinute,
            date
        ).length > 0
    );

}


/* =====================================================
   MINUTES UNTIL OPEN
===================================================== */

function getMinutesUntilOpen(
    session,
    currentMinute
) {

    const open =
        timeToMinutes(
            session.open
        );


    let diff =
        open -
        currentMinute;


    /*
       برای Sessionهایی که هنوز امروز
       باز نشده‌اند.

       اگر زمان گذشته باشد،
       OPEN بعدی فردا خواهد بود.
    */

    if (diff < 0) {

        diff += 1440;

    }


    return diff;

}


/* =====================================================
   MINUTES UNTIL CLOSE
===================================================== */

function getMinutesUntilClose(
    session,
    currentMinute
) {

    const close =
        timeToMinutes(
            session.close
        );


    /*
       برای New York:

       از 16:30 تا 24:00 باز است.

       CLOSE واقعی 00:30 است،
       اما چون در منطق Session Map
       00:00 به بعد New York دیگر
       Session فعال روز جدید نیست،
       تایمر بسته نیز باید به صورت
       منطقی به 00:30 اشاره کند.
    */

    if (
        session.id === "newyork"
    ) {

        if (
            currentMinute >=
            timeToMinutes("16:30")
        ) {

            return (
                1440 -
                currentMinute +
                close
            );

        }

        return 0;

    }


    let diff =
        close -
        currentMinute;


    if (diff < 0) {

        diff += 1440;

    }


    return diff;

}


/* =====================================================
   OPEN WARNING
===================================================== */

function isOpenWarning(
    id,
    session,
    currentMinute,
    date = new Date()
) {

    if (
        isWeekend(date)
    ) {

        return false;

    }


    const state =
        getSessionState(
            id,
            session,
            currentMinute,
            date
        );


    if (
        state.isOpen
    ) {

        return false;

    }


    /*
       برای New York بعد از نیمه‌شب
       هیچ OPEN WARNING وجود ندارد.

       OPEN بعدی New York ساعت 16:30 است.
    */

    const minutes =
        getMinutesUntilOpen(
            session,
            currentMinute
        );


    return (

        minutes > 0 &&
        minutes <= OPEN_WARNING_MINUTES

    );

}


/* =====================================================
   CLOSE WARNING
===================================================== */

function isCloseWarning(
    id,
    session,
    currentMinute,
    date = new Date()
) {

    if (
        isWeekend(date)
    ) {

        return false;

    }


    const state =
        getSessionState(
            id,
            session,
            currentMinute,
            date
        );


    if (
        !state.isOpen
    ) {

        return false;

    }


    const minutes =
        getMinutesUntilClose(
            {
                ...session,
                id
            },
            currentMinute
        );


    return (

        minutes > 0 &&
        minutes <= CLOSE_WARNING_MINUTES

    );

}


/* =====================================================
   FORMAT HH:MM:SS
===================================================== */

function formatDuration(
    totalSeconds
) {

    totalSeconds =
        Math.max(
            0,
            Math.floor(totalSeconds)
        );


    const hours =
        Math.floor(
            totalSeconds / 3600
        );


    const minutes =
        Math.floor(
            (totalSeconds % 3600) / 60
        );


    const seconds =
        totalSeconds % 60;


    return (

        String(hours).padStart(2,"0") +
        ":" +
        String(minutes).padStart(2,"0") +
        ":" +
        String(seconds).padStart(2,"0")

    );

}


/* =====================================================
   SESSION TIMER
===================================================== */

function updateSessionTimer(
    currentMinute,
    date = new Date()
) {

    sessionTimerBox.classList.remove(
        "warning-close",
        "warning-open",
        "closed"
    );


    /*
       آخر هفته
    */

    if (
        isWeekend(date)
    ) {

        sessionTimerLabel.innerText =
            "MARKET";


        sessionTimerValue.innerText =
            "CLOSED";


        sessionTimerBox.classList.add(
            "closed"
        );


        return;

    }


    const active =
        getActiveSessions(
            currentMinute,
            date
        );


    /*
       اگر Session فعال داریم
    */

    if (
        active.length > 0
    ) {

        const primary =
            getPrimaryActiveSession(
                currentMinute,
                date
            );


        if (!primary) {

            return;

        }


        const closeMinutes =
            getMinutesUntilClose(
                primary,
                currentMinute
            );


        const secondsRemaining =
            Math.max(
                0,
                Math.round(
                    closeMinutes * 60
                )
            );


        sessionTimerLabel.innerText =
            primary.shortName +
            " CLOSE";


        sessionTimerValue.innerText =
            formatDuration(
                secondsRemaining
            );


        if (
            closeMinutes <=
            CLOSE_WARNING_MINUTES
        ) {

            sessionTimerBox.classList.add(
                "warning-close"
            );

        }


        return;

    }


    /*
       هیچ Session فعالی نیست.

       پیدا کردن Session بعدی.
    */

    let nextSession = null;

    let smallestDiff = Infinity;


    Object.entries(
        SESSION_CONFIG
    ).forEach(
        ([id, session]) => {

            const state =
                getSessionState(
                    id,
                    session,
                    currentMinute,
                    date
                );


            if (
                state.isOpen
            ) {

                return;

            }


            let diff =
                getMinutesUntilOpen(
                    session,
                    currentMinute
                );


            /*
               برای New York:

               بعد از نیمه‌شب تا 16:30،
               OPEN بعدی همان روز 16:30 است.

               تابع بالا ممکن است مسیر روزانه را
               درست بدهد، ولی این شرط باعث می‌شود
               رفتار کاملاً شفاف و قطعی باشد.
            */

            if (
                id === "newyork" &&
                currentMinute < timeToMinutes("16:30")
            ) {

                diff =
                    timeToMinutes("16:30") -
                    currentMinute;

            }


            if (
                diff > 0 &&
                diff < smallestDiff
            ) {

                smallestDiff =
                    diff;

                nextSession = {

                    id,

                    ...session

                };

            }

        }
    );


    if (
        !nextSession
    ) {

        sessionTimerLabel.innerText =
            "MARKET";


        sessionTimerValue.innerText =
            "CLOSED";


        sessionTimerBox.classList.add(
            "closed"
        );


        return;

    }


    const secondsRemaining =
        Math.max(
            0,
            Math.round(
                smallestDiff * 60
            )
        );


    sessionTimerLabel.innerText =
        nextSession.shortName +
        " OPEN";


    sessionTimerValue.innerText =
        formatDuration(
            secondsRemaining
        );


    if (
        smallestDiff <=
        OPEN_WARNING_MINUTES
    ) {

        sessionTimerBox.classList.add(
            "warning-open"
        );

    }

}


/* =====================================================
   UPDATE SESSION MAP
===================================================== */

function updateSessionMap(
    currentMinute,
    date = new Date()
) {

    sessionMap.classList.remove(
        "has-active",
        "weekend"
    );


    /*
       پاک کردن تمام وضعیت‌های قبلی
    */

    Object.values(
        sessionNodes
    ).forEach(
        node => {

            node.classList.remove(
                "active",
                "open-warning",
                "close-warning"
            );

        }
    );


    /*
       WEEKEND
    */

    if (
        isWeekend(date)
    ) {

        sessionMap.classList.add(
            "weekend"
        );


        sessionActiveLabel.classList.add(
            "visible"
        );


        activeSessionText.innerText =
            "MARKET CLOSED";


        /*
           در Weekend فقط حالت
           قرمز بسته نمایش داده می‌شود.

           هیچ Sessionی Active نیست.
        */

        Object.values(
            sessionNodes
        ).forEach(
            node => {

                node.classList.remove(
                    "active",
                    "open-warning"
                );

                node.classList.add(
                    "close-warning"
                );

            }
        );


        return;

    }


    const active =
        getActiveSessions(
            currentMinute,
            date
        );


    /*
       حداقل یک Session فعال
    */

    if (
        active.length > 0
    ) {

        sessionMap.classList.add(
            "has-active"
        );

    }


    /*
       ACTIVE
    */

    active.forEach(
        session => {

            const node =
                sessionNodes[
                    session.id
                ];


            if (!node) {
                return;
            }


            node.classList.add(
                "active"
            );

        }
    );


    /*
       OPEN / CLOSE WARNING
    */

    Object.entries(
        SESSION_CONFIG
    ).forEach(
        ([id, session]) => {

            const node =
                sessionNodes[id];


            if (!node) {
                return;
            }


            const state =
                getSessionState(
                    id,
                    session,
                    currentMinute,
                    date
                );


            /*
               CLOSE WARNING
            */

            if (
                state.isOpen &&
                isCloseWarning(
                    id,
                    session,
                    currentMinute,
                    date
                )
            ) {

                node.classList.remove(
                    "active"
                );


                node.classList.add(
                    "close-warning"
                );

            }


            /*
               OPEN WARNING
            */

            else if (
                !state.isOpen &&
                isOpenWarning(
                    id,
                    session,
                    currentMinute,
                    date
                )
            ) {

                node.classList.add(
                    "open-warning"
                );

            }

        }
    );


    /*
       ACTIVE LABEL
    */

    if (
        active.length > 0
    ) {

        sessionActiveLabel.classList.add(
            "visible"
        );


        const primary =
            getPrimaryActiveSession(
                currentMinute,
                date
            );


        if (
            primary
        ) {

            activeSessionText.innerText =
                primary.shortName +
                " ACTIVE";

        }

    }

    else {

        sessionActiveLabel.classList.remove(
            "visible"
        );

    }

}


/* =====================================================
   MARKET
===================================================== */

function updateMarket(
    currentMinute,
    date = new Date()
) {

    const open =
        isMarketOpen(
            currentMinute,
            date
        );


    marketValue.classList.remove(
        "market-open",
        "market-closed"
    );


    if (open) {

        marketValue.innerText =
            "OPEN";


        marketValue.classList.add(
            "market-open"
        );

    }

    else {

        marketValue.innerText =
            "CLOSED";


        marketValue.classList.add(
            "market-closed"
        );

    }

}


/* =====================================================
   TEHRAN CLOCK
===================================================== */

function getTehranTime(
    date = new Date()
) {

    return new Intl.DateTimeFormat(
        "en-US",
        {

            timeZone:
                "Asia/Tehran",

            hour:
                "2-digit",

            minute:
                "2-digit",

            second:
                "2-digit",

            hour12:
                true

        }
    ).format(date);

}


/* =====================================================
   TEHRAN DATE
===================================================== */

function getTehranDate(
    date = new Date()
) {

    return new Intl.DateTimeFormat(
        "en-US",
        {

            timeZone:
                "Asia/Tehran",

            day:
                "2-digit",

            month:
                "short",

            year:
                "numeric"

        }
    ).format(date);

}


/* =====================================================
   MAIN UPDATE
===================================================== */

function updateClocks() {

    const now =
        new Date();


    const tehranParts =
        getTehranDateParts(
            now
        );


    const currentMinute =
        tehranParts.hour * 60 +
        tehranParts.minute +
        tehranParts.second / 60;


    /*
       Tehran Clock
    */

    tehranClockValue.innerText =
        getTehranTime(
            now
        );


    /*
       Session Map
    */

    updateSessionMap(
        currentMinute,
        now
    );


    /*
       Market
    */

    updateMarket(
        currentMinute,
        now
    );


    /*
       Session Timer
    */

    updateSessionTimer(
        currentMinute,
        now
    );


    /*
       Date
    */

    dateValue.innerText =
        getTehranDate(
            now
        );

}


/* =====================================================
   START CLOCK
===================================================== */

setInterval(
    updateClocks,
    1000
);


updateClocks();


/* =====================================================
   SUBSCRIBE / LIKE
===================================================== */

const subscribeState =
    document.querySelector(
        ".subscribe-state"
    );


const likeState =
    document.querySelector(
        ".like-state"
    );


const likeIcon =
    document.querySelector(
        ".like-icon"
    );


setInterval(
    function () {

        if (

            subscribeState.style.display !==
            "none"

        ) {

            subscribeState.style.display =
                "none";


            likeState.style.display =
                "flex";


            likeIcon.classList.remove(
                "like-pulse"
            );


            void likeIcon.offsetWidth;


            likeIcon.classList.add(
                "like-pulse"
            );

        }

        else {

            likeState.style.display =
                "none";


            subscribeState.style.display =
                "flex";

        }

    },

    10000

);

</script>
