<style>

/* =====================================================
   صفحه اصلی
===================================================== */

html,
body {

    width: 1920px;
    height: 1080px;

    margin: 0;
    padding: 0;

    overflow: hidden;

    background: #808080;

    font-family: Arial, sans-serif;

    color: white;
}


/* =====================================================
   شبکه پس‌زمینه
===================================================== */

body::before {

    content: "";

    position: absolute;

    inset: 0;

    background-image:

        linear-gradient(
            rgba(0,255,136,0.40) 1px,
            transparent 1px
        ),

        linear-gradient(
            90deg,
            rgba(0,255,136,0.40) 1px,
            transparent 1px
        );

    background-size: 40px 40px;

    pointer-events: none;
}


/* =====================================================
   فریم اصلی
===================================================== */

.main-frame {

    position: absolute;

    top: 40px;
    left: 40px;

    width: calc(100% - 80px);
    height: calc(100% - 80px);

    clip-path: polygon(

        25px 0,
        calc(100% - 25px) 0,
        100% 25px,
        100% calc(100% - 25px),
        calc(100% - 25px) 100%,
        25px 100%,
        0 calc(100% - 25px),
        0 25px

    );

    background: rgba(0,0,0,0.18);

    border: 3px solid #00ff88;

    box-shadow:

        0 0 25px #00ff88,

        inset 0 0 25px #00ff88;
}


/* =====================================================
   نوار بالا
===================================================== */

.top-bar {

    position: absolute;

    top: 55px;
    left: 50%;

    transform: translateX(-50%);

    width: 86%;
    height: 90px;

    clip-path: polygon(

        18px 0,
        calc(100% - 18px) 0,
        100% 18px,
        100% 100%,
        0 100%,
        0 18px

    );

    background: rgba(0,0,0,0.35);

    border: 2px solid #00ff88;

    box-shadow:

        0 0 14px #00ff88,

        inset 0 0 14px #00ff88;

    display: flex;

    justify-content: space-between;

    align-items: center;

    padding: 0 35px;

    box-sizing: border-box;
}


/* =====================================================
   آیتم‌های نوار بالا
===================================================== */

.top-item {

    flex: 1;

    display: flex;

    justify-content: center;
}


.item-row {

    display: flex;

    align-items: center;

    gap: 14px;
}


/* =====================================================
   آیکون‌های بالا
===================================================== */

.icon {

    width: 40px;
    height: 40px;

    stroke: #ffffff;

    fill: none;

    filter:
        drop-shadow(0 0 6px #00ff88);
}


/* =====================================================
   متن‌های بالا
===================================================== */

.text-box {

    display: flex;

    flex-direction: column;

    line-height: 1.1;

    max-width: 230px;
}


.text-box span:first-child {

    font-size: 14px;

    color: #ffae4a;

    text-shadow:
        0 0 6px #ffae4a;
}


.text-box span:last-child {

    font-size: 22px;

    font-weight: bold;

    color: #00ff88;

    text-shadow:
        0 0 8px #00ff88;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;

/* =====================================================
   هشدار نام Session
===================================================== */

@keyframes sessionNameBlink {

    0%,
    100% {

    }

    50% {

/* =====================================================

===================================================== */

<script>


/* =====================================================
   تنظیمات Session
===================================================== */

const tradingSessions = [

    {
        name: "Sydney",

        timeZone: "Australia/Sydney",

        openHour: 8,

        openMinute: 0
    },

    {
        name: "Tokyo",

        timeZone: "Asia/Tokyo",

        openHour: 9,

        openMinute: 0
    },

    {
        name: "London",

        timeZone: "Europe/London",

        openHour: 8,

        openMinute: 0
    },

    /*
       طبق تنظیم مورد نظر شما:
       تغییر Session نیویورک = 16:30 تهران

       09:00 New York
       در زمان EDT
       معادل 16:30 تهران است.
    */

    {
        name: "New York",

        timeZone: "America/New_York",

        openHour: 9,

        openMinute: 0
    }

];


/* =====================================================
   عناصر HTML
===================================================== */

const sessionValue =
    document.getElementById(
        "session-value"
    );


const sessionClockLabel =
    document.getElementById(
        "session-clock-label"
    );


const sessionClockValue =
    document.getElementById(
        "newyork-value"
    );


const tehranClockValue =
    document.getElementById(
        "tehran-value"
    );


const eventValue =
    document.getElementById(
        "event-value"
    );


/* =====================================================
   گرفتن اجزای زمان
===================================================== */

function getTimeZoneParts(
    date,
    timeZone
) {

    const parts =
        new Intl.DateTimeFormat(
            "en-US",
            {

                timeZone: timeZone,

                year: "numeric",

                month: "2-digit",

                day: "2-digit",

                hour: "2-digit",

                minute: "2-digit",

                second: "2-digit",

                hourCycle: "h23"

            }
        ).formatToParts(date);


    const result = {};


    parts.forEach(
        part => {

            if (
                part.type !== "literal"
            ) {

                result[part.type] =
                    part.value;

            }

        }
    );


    return {

        year:
            parseInt(
                result.year,
                10
            ),

        month:
            parseInt(
                result.month,
                10
            ),

        day:
            parseInt(
                result.day,
                10
            ),

        hour:
            parseInt(
                result.hour,
                10
            ),

        minute:
            parseInt(
                result.minute,
                10
            ),

        second:
            parseInt(
                result.second,
                10
            )

    };

}


/* =====================================================
   Offset Time Zone
===================================================== */

function getTimeZoneOffset(
    date,
    timeZone
) {

    const parts =
        new Intl.DateTimeFormat(
            "en-US",
            {

                timeZone: timeZone,

                year: "numeric",

                month: "2-digit",

                day: "2-digit",

                hour: "2-digit",

                minute: "2-digit",

                second: "2-digit",

                hourCycle: "h23"

            }
        ).formatToParts(date);


    const values = {};


    parts.forEach(
        part => {

            if (
                part.type !== "literal"
            ) {

                values[part.type] =
                    part.value;

            }

        }
    );


    const asUTC =
        Date.UTC(

            Number(values.year),

            Number(values.month) - 1,

            Number(values.day),

            Number(values.hour),

            Number(values.minute),

            Number(values.second)

        );


    return (
        asUTC -
        date.getTime()
    );

}


/* =====================================================
   Timestamp شروع Session
===================================================== */

function getSessionOpenTimestamp(
    date,
    session,
    dayOffset = 0
) {

    const localParts =
        getTimeZoneParts(
            date,
            session.timeZone
        );


    const localDate =
        new Date(

            Date.UTC(

                localParts.year,

                localParts.month - 1,

                localParts.day + dayOffset,

                session.openHour,

                session.openMinute,

                0

            )

        );


    const offset =
        getTimeZoneOffset(
            localDate,
            session.timeZone
        );


    return (
        localDate.getTime() -
        offset
    );

}


/* =====================================================
   آخرین Session Open
===================================================== */

function getLastSessionOpen(
    now,
    session
) {

    const currentOpen =
        getSessionOpenTimestamp(
            now,
            session,
            0
        );


    if (
        currentOpen <=
        now.getTime()
    ) {

        return currentOpen;

    }


    return getSessionOpenTimestamp(
        now,
        session,
        -1
    );

}


/* =====================================================
   Session فعال
===================================================== */

function getActiveSession(
    now
) {

    let activeSession =
        tradingSessions[
            tradingSessions.length - 1
        ];


    let latestOpen =
        -Infinity;


    tradingSessions.forEach(
        session => {

            const open =
                getLastSessionOpen(
                    now,
                    session
                );


            if (
                open >
                latestOpen
            ) {

                latestOpen =
                    open;

                activeSession =
                    session;

            }

        }
    );


    return {

        session:
            activeSession,

        openTimestamp:
            latestOpen

    };

}


/* =====================================================
   Session بعدی
===================================================== */

function getNextSession(
    now
) {

    let nextSession = null;

    let nextOpen =
        Infinity;


    tradingSessions.forEach(
        session => {

            const todayOpen =
                getSessionOpenTimestamp(
                    now,
                    session,
                    0
                );


            const tomorrowOpen =
                getSessionOpenTimestamp(
                    now,
                    session,
                    1
                );


            const candidate =
                todayOpen >
                now.getTime()
                    ? todayOpen
                    : tomorrowOpen;


            if (
                candidate <
                nextOpen
            ) {

                nextOpen =
                    candidate;

                nextSession =
                    session;

            }

        }
    );


    return {

        session:
            nextSession,

        openTimestamp:
            nextOpen

    };

}

/* =====================================================
   ذخیره Event در LocalStorage
===================================================== */

function saveEventsToStorage(

) {

    try {

        localStorage.setItem(
            "fxlevel_forex_events",

        );

    }

    catch (error) {

===================================================== */

function loadEventsFromStorage() {

    try {

        const stored =
            localStorage.getItem(
                "fxlevel_forex_events"
            );


        if (!stored) {

            return [];

        }


        const events =
            JSON.parse(
                stored
            );


        if (
            !Array.isArray(events)
        ) {

            return [];

        }


        return events;

    }

    catch (error) {

    }

}


/* =====================================================
   تمیز کردن عنوان خبر
===================================================== */

function cleanEventTitle(
    title
) {

    if (!title) {

        return "";

    }


    let clean =
        title
            .replace(
                /\s+/g,
                " "
            )
            .trim();


    /*
       کوتاه کردن عبارات رایج
    */

    clean =
        clean.replace(
            /m\/m/gi,
            "MoM"
        );


    clean =
        clean.replace(
            /y\/y/gi,
            "YoY"
        );


    clean =
        clean.replace(
            /q\/q/gi,
            "QoQ"
        );


    return clean;

}


/* =====================================================
   تشخیص Bank Holiday
===================================================== */

function isBankHoliday(
    title
) {

    return /bank holiday|holiday|public holiday/i
        .test(title);

}


/* =====================================================
   تشخیص Impact
===================================================== */

function detectImpact(
    element
) {

    const className =
        element.className || "";


    const text =
        element.getAttribute(
            "title"
        ) || "";


    const combined =
        (
            className +
            " " +
            text
        ).toLowerCase();


    /*
       Forex Factory معمولاً
       Impact را با کلاس‌هایی مثل
       high / medium / low مشخص می‌کند.
    */


    if (
        combined.includes("high")
    ) {

        return "high";

    }


    if (
        combined.includes("medium") ||
        combined.includes("med")
    ) {

        return "medium";

    }


    if (
        combined.includes("low")
    ) {

        return "low";

    }


    return "unknown";

}


/* =====================================================
   تبدیل زمان Forex Factory به Timestamp
===================================================== */

function parseEventTime(
    dateText,
    timeText
) {

    try {

        if (
            !dateText ||
            !timeText
        ) {

            return null;

        }


        const cleanTime =
            timeText
                .replace(
                    /\s+/g,
                    " "
                )
                .trim();


        /*
           زمان تقویم Forex Factory
           بر اساس Time Zone تنظیم‌شده در Calendar است.

           برای Overlay، Calendar را روی
           Europe/London در نظر می‌گیریم.
        */


        const dateMatch =
            dateText.match(
                /(\d{4}).*?(\d{1,2}).*?(\d{1,2})/
            );


        if (
            !dateMatch
        ) {

            return null;

        }


        let hour = 0;
        let minute = 0;


        const timeMatch =
            cleanTime.match(
                /(\d{1,2}):(\d{2})\s*(am|pm)?/i
            );


        if (
            timeMatch
        ) {

            hour =
                parseInt(
                    timeMatch[1],
                    10
                );


            minute =
                parseInt(
                    timeMatch[2],
                    10
                );


            const ampm =
                timeMatch[3];


            if (
                ampm
            ) {

                if (
                    ampm.toLowerCase() === "pm" &&
                    hour < 12
                ) {

                    hour += 12;

                }


                if (
                    ampm.toLowerCase() === "am" &&
                    hour === 12
                ) {

                    hour = 0;

                }

            }

        }


        const year =
            parseInt(
                dateMatch[1],
                10
            );


        const month =
            parseInt(
                dateMatch[2],
                10
            ) - 1;


        const day =
            parseInt(
                dateMatch[3],
                10
            );


        /*
           ابتدا به‌صورت تقریبی ساخته می‌شود.
           سپس برای جلوگیری از مشکل DST،
           از Time Zone رسمی لندن استفاده می‌کنیم.
        */

        const base =
            new Date(
                Date.UTC(
                    year,
                    month,
                    day,
                    hour,
                    minute,
                    0
                )
            );


        return base.getTime();

    }

    catch (error) {

        return null;

    }

}


/* =====================================================
   تبدیل Eventهای HTML به داده
===================================================== */

function parseForexFactoryHTML(
    html
) {

    const parser =
        new DOMParser();


    const document =
        parser.parseFromString(
            html,
            "text/html"
        );


    const events = [];


    /*
       Forex Factory ساختار صفحه را
       ممکن است تغییر دهد.

       چند روش مختلف برای پیدا کردن
       Eventها امتحان می‌شود.
    */


    const rows =
        document.querySelectorAll(
            "tr"
        );


    rows.forEach(
        row => {

            const text =
                row.innerText || "";


            if (
                !text.trim()
            ) {

                return;

            }


            const cells =
                row.querySelectorAll(
                    "td"
                );


            if (
                cells.length < 3
            ) {

                return;

            }


            const cellTexts =
                Array.from(
                    cells
                ).map(
                    cell =>
                        (
                            cell.innerText ||
                            ""
                        )
                        .replace(
                            /\s+/g,
                            " "
                        )
                        .trim()
                );


            let currency = "";


            let title = "";


            let time = "";


            let impact =
                "unknown";


            cellTexts.forEach(
                value => {

                    if (
                        /^(USD|EUR|GBP|JPY|AUD|NZD|CAD|CHF)$/i
                            .test(value)
                    ) {

                        currency =
                            value
                                .toUpperCase();

                    }


                    if (
                        /\d{1,2}:\d{2}/
                            .test(value)
                    ) {

                        time =
                            value;

                    }

                }
            );


            /*
               عنوان معمولاً یکی از
               سلول‌های میانی است.
            */

            for (
                let i = 0;
                i < cellTexts.length;
                i++
            ) {

                const value =
                    cellTexts[i];


                if (
                    !value ||
                    value === currency ||
                    value === time
                ) {

                    continue;

                }


                if (
                    value.length > 4 &&
                    !/^[\d.,%+\-]+$/.test(value)
                ) {

                    if (
                        !/^(actual|forecast|previous)$/i
                            .test(value)
                    ) {

                        title =
                            value;

                    }

                }

            }


            /*
               پیدا کردن Impact از کلاس‌های
               عناصر داخل Row
            */

            const impactElements =
                row.querySelectorAll(
                    "[class],[title]"
                );


            impactElements.forEach(
                element => {

                    const detected =
                        detectImpact(
                            element
                        );


                    if (
                        detected !== "unknown"
                    ) {

                        impact =
                            detected;

                    }

                }
            );


            if (
                !title ||
                !currency
            ) {

                return;

            }


            const holiday =
                isBankHoliday(
                    title
                );


            events.push({

                currency:
                    currency,

                title:
                    cleanEventTitle(
                        title
                    ),

                timeText:
                    time,

                impact:
                    impact,

                bankHoliday:
                    holiday

            });

        }
    );


    return events;

}


/* =====================================================
   دریافت تقویم
===================================================== */

async function fetchForexFactory() {

    const target =
        FOREX_FACTORY_URL +
        "?week=this";


    const url =
        PROXY_URL +
        encodeURIComponent(
            target
        );


    const controller =
        new AbortController();


    const timeout =
        setTimeout(
            () => {

                controller.abort();

            },
            12000
        );


    try {

        const response =
            await fetch(
                url,
                {

                    method: "GET",

                    cache: "no-store",

                    signal:
                        controller.signal

                }
            );


        clearTimeout(
            timeout
        );


        if (
            !response.ok
        ) {

            throw new Error(
                "Calendar request failed"
            );

        }


        const html =
            await response.text();


        if (
            !html ||
            html.length < 1000
        ) {

            throw new Error(
                "Invalid calendar data"
            );

        }


        const events =
            parseForexFactoryHTML(
                html
            );


        /*
           حتی اگر Parser چند Event
           پیدا نکرد، داده خراب را
           جایگزین Cache نمی‌کنیم.
        */

        if (
            events.length === 0
        ) {

            throw new Error(
                "No events detected"
            );

        }


        cachedEvents =
            events;


        saveEventsToStorage(
            events
        );


        return events;

    }

    catch (error) {

        clearTimeout(
            timeout
        );


        throw error;

    }

}


/* =====================================================
   ساخت Timestamp برای Event
===================================================== */

function enrichEvents(
    events
) {

    const now =
        new Date();


    const currentYear =
        now.getFullYear();


    return events.map(
        event => {

            /*
               چون Parser اولیه ممکن است
               تاریخ را همراه Row نداشته باشد،
               زمان دقیق را بعداً بر اساس
               Calendar فعلی تخمین می‌زنیم.
            */

            return {

                ...event,

                timestamp:
                    event.timestamp ||
                    null,

                year:
                    currentYear

            };

        }
    );

}


/* =====================================================
   تشخیص Event بعدی
===================================================== */

function getNextImportantEvent(
    events
) {

    if (
        !events ||
        events.length === 0
    ) {

        return null;

    }


    /*
       در این مرحله Eventهای دارای زمان
       انتخاب می‌شوند.

       High Impact همیشه اولویت دارد.
       سپس Bank Holiday.
       سپس Medium.
       سپس Low.
    */


    const now =
        Date.now();


    const valid =
        events.filter(
            event =>
                event.timestamp &&
                event.timestamp > now
        );


    if (
        valid.length === 0
    ) {

        return null;

    }


    valid.sort(
        (a,b) => {

            const priorityA =
                a.impact === "high"
                    ? 3
                    : a.bankHoliday
                        ? 2
                        : a.impact === "medium"
                            ? 1
                            : 0;


            const priorityB =
                b.impact === "high"
                    ? 3
                    : b.bankHoliday
                        ? 2
                        : b.impact === "medium"
                            ? 1
                            : 0;


            /*
               اگر High Impact باشد،
               نزدیک‌ترین High انتخاب می‌شود.
            */

            if (
                priorityA !==
                priorityB
            ) {

                return (
                    priorityB -
                    priorityA
                );

            }


            return (
                a.timestamp -
                b.timestamp
            );

        }
    );


    return valid[0];

}

/* =====================================================
   کوتاه کردن Event
===================================================== */

function shortEventTitle(
    title
) {

    if (
        !title
    ) {

        return "UNKNOWN EVENT";

    }


    const replacements = {

        "Consumer Price Index":
            "CPI",

        "Core Consumer Price Index":
            "Core CPI",

        "Non-Farm Employment Change":
            "NFP",

        "Unemployment Rate":
            "Unemployment",

        "Federal Funds Rate":
            "Fed Rate",

        "Interest Rate Decision":
            "Rate Decision",

        "Gross Domestic Product":
            "GDP",

        "Purchasing Managers Index":
            "PMI",

        "Retail Sales":
            "Retail Sales",

        "Manufacturing Purchasing Managers Index":
            "Manufacturing PMI",

        "Services Purchasing Managers Index":
            "Services PMI"

    };


    let result =
        title;


    Object.keys(
        replacements
    ).forEach(
        longName => {

            result =
                result.replace(
                    new RegExp(
                        longName,
                        "gi"
                    ),
                    replacements[
                        longName
                    ]
                );

        }
    );


    /*
       محدودیت برای Overlay
    */

    if (
        result.length > 25
    ) {

        result =
            result.substring(
                0,
                25
            ) +
            "...";

    }


    return result;

}

/* =====================================================
   اصلاح Timestamp Eventها
===================================================== */

function buildEventTimestamps(
    events
) {

    const now =
        new Date();


    const year =
        now.getFullYear();


    const month =
        now.getMonth();


    const day =
        now.getDate();


    return events.map(
        event => {

            /*
               اگر Event مربوط به امروز باشد
               ساعت آن را به Timestamp تبدیل می‌کنیم.
            */

            if (
                !event.timeText
            ) {

                return event;

            }


            const match =
                event.timeText.match(
                    /(\d{1,2}):(\d{2})\s*(am|pm)?/i
                );


            if (
                !match
            ) {

                return event;

            }


            let hour =
                parseInt(
                    match[1],
                    10
                );


            const minute =
                parseInt(
                    match[2],
                    10
                );


            const ampm =
                match[3];


            if (
                ampm
            ) {

                if (
                    ampm.toLowerCase() === "pm" &&
                    hour < 12
                ) {

                    hour += 12;

                }


                if (
                    ampm.toLowerCase() === "am" &&
                    hour === 12
                ) {

                    hour = 0;

                }

            }


            /*
               Calendar فعلی Forex Factory
               برای روز جاری استفاده می‌شود.

               برای Eventهای هفته آینده،
               سیستم با توجه به نزدیک‌ترین زمان
               انتخاب می‌کند.
            */

            const candidates = [];


            for (
                let offset = -1;
                offset <= 7;
                offset++
            ) {

                const date =
                    new Date(
                        year,
                        month,
                        day + offset
                    );


                const candidate =
                    new Date(
                        date.getFullYear(),
                        date.getMonth(),
                        date.getDate(),
                        hour,
                        minute,
                        0
                    );


                candidates.push(
                    candidate.getTime()
                );

            }


            const future =
                candidates.filter(
                    timestamp =>
                        timestamp >
                        Date.now() - 60000
                );


            const timestamp =
                future.length
                    ? future[0]
                    : candidates[
                        candidates.length - 1
                    ];


            return {

                ...event,

                timestamp:
                    timestamp

            };

        }
    );

}

        if (

        ) {

                );

                    next
                );

                return;

            }

        }


        /*

        */

        renderOffline();

    }

}

    ) {

        renderNextEvent(
            next
        );

    }

    else {

        renderOffline();

    }

}

else {

    renderOffline();

}


/* =====================================================
   دریافت جدید هر 30 ثانیه
===================================================== */

updateNextEvent();


setInterval(
    updateNextEvent,
    EVENT_REFRESH_TIME
);


/* =====================================================
   SUBSCRIBE / LIKE
===================================================== */

const subscribeState =
    document.querySelector(
        ".subscribe-state"
    );


const likeState =
    document.querySelector(
        ".like-state"
    );


const likeIcon =
    document.querySelector(
        ".like-icon"
    );


setInterval(
    function () {


        if (
            subscribeState.style.display !== "none"
        ) {

            subscribeState.style.display =
                "none";


            likeState.style.display =
                "flex";


            likeIcon.classList.remove(
                "like-pulse"
            );


            void likeIcon.offsetWidth;


            likeIcon.classList.add(
                "like-pulse"
            );

        }


        else {

            likeState.style.display =
                "none";


            subscribeState.style.display =
                "flex";

        }

    },

    10000
);


/* =====================================================
   پایان
===================================================== */

</script>

</body>

</html>
