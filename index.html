<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<title>FX LEVEL Neon Overlay</title>

<style>

/* =========================================================
   FX LEVEL — NEON ONLY OVERLAY
   Transparent 1920 × 1080
========================================================= */

html,
body {

    width: 1920px;
    height: 1080px;

    margin: 0;
    padding: 0;

    overflow: hidden;

    background: transparent;

    font-family: Arial, sans-serif;

    pointer-events: none;
}


/* =========================================================
   COMMON
========================================================= */

.neon {

    position: absolute;

    box-sizing: border-box;

    pointer-events: none;

    background: transparent;
}


/* =========================================================
   COPY TRADE NEON FRAME
   Position matches main overlay exactly
========================================================= */

.copy-neon {

    left: 40px;
    bottom: 389px;

    width: 430px;
    height: 140px;

    border: 2px solid rgba(0, 217, 255, 0.95);

    box-shadow:

        0 0 8px rgba(0, 217, 255, 1),

        0 0 18px rgba(0, 217, 255, 0.95),

        0 0 35px rgba(0, 217, 255, 0.75),

        0 0 65px rgba(0, 217, 255, 0.50),

        0 0 105px rgba(0, 217, 255, 0.25);

    animation: copyPulse 3.5s ease-in-out infinite;
}


/* =========================================================
   COPY TRADE CORNER ACCENTS
========================================================= */

.copy-neon::before,
.copy-neon::after {

    content: "";

    position: absolute;

    pointer-events: none;

    box-sizing: border-box;
}


/* Top / bottom electric lines */

.copy-neon::before {

    left: 14px;
    right: 14px;

    top: -2px;

    height: 2px;

    background: linear-gradient(

        90deg,

        transparent 0%,

        rgba(0,217,255,0.2) 10%,

        rgba(0,217,255,1) 25%,

        rgba(0,217,255,1) 75%,

        rgba(0,217,255,0.2) 90%,

        transparent 100%

    );

    box-shadow:

        0 0 8px rgba(0,217,255,1),

        0 0 18px rgba(0,217,255,0.8);
}


/* Bottom electric line */

.copy-neon::after {

    left: 14px;
    right: 14px;

    bottom: -2px;

    height: 2px;

    background: linear-gradient(

        90deg,

        transparent 0%,

        rgba(0,217,255,0.2) 10%,

        rgba(0,217,255,1) 25%,

        rgba(0,217,255,1) 75%,

        rgba(0,217,255,0.2) 90%,

        transparent 100%

    );

    box-shadow:

        0 0 8px rgba(0,217,255,1),

        0 0 18px rgba(0,217,255,0.8);
}


/* =========================================================
   COPY TRADE CORNER BRACKETS
========================================================= */

.copy-corner {

    position: absolute;

    width: 22px;
    height: 22px;

    box-sizing: border-box;

    pointer-events: none;

    z-index: 5;
}


/* Top Left */

.copy-corner.tl {

    left: -4px;
    top: -4px;

    border-left: 4px solid #00d9ff;
    border-top: 4px solid #00d9ff;

    box-shadow:

        -3px -3px 12px rgba(0,217,255,0.9),

        0 0 18px rgba(0,217,255,0.7);
}


/* Top Right */

.copy-corner.tr {

    right: -4px;
    top: -4px;

    border-right: 4px solid #00d9ff;
    border-top: 4px solid #00d9ff;

    box-shadow:

        3px -3px 12px rgba(0,217,255,0.9),

        0 0 18px rgba(0,217,255,0.7);
}


/* Bottom Left */

.copy-corner.bl {

    left: -4px;
    bottom: -4px;

    border-left: 4px solid #00d9ff;
    border-bottom: 4px solid #00d9ff;

    box-shadow:

        -3px 3px 12px rgba(0,217,255,0.9),

        0 0 18px rgba(0,217,255,0.7);
}


/* Bottom Right */

.copy-corner.br {

    right: -4px;
    bottom: -4px;

    border-right: 4px solid #00d9ff;
    border-bottom: 4px solid #00d9ff;

    box-shadow:

        3px 3px 12px rgba(0,217,255,0.9),

        0 0 18px rgba(0,217,255,0.7);
}


/* =========================================================
   COPY TRADE MOVING LIGHT
========================================================= */

.copy-scan {

    position: absolute;

    top: 0;
    left: -90px;

    width: 90px;
    height: 2px;

    background: linear-gradient(

        90deg,

        transparent,

        rgba(255,255,255,0.95),

        #00d9ff,

        transparent

    );

    filter:

        drop-shadow(0 0 6px #00d9ff)

        drop-shadow(0 0 12px #00d9ff);

    animation: copyScan 4.5s linear infinite;

    pointer-events: none;
}


/* =========================================================
   WEBCAM NEON FRAME
   Position matches main overlay exactly
========================================================= */

.webcam-neon {

    left: 40px;
    bottom: 125px;

    width: 430px;
    height: 250px;

    border: 2px solid rgba(0, 255, 102, 0.95);

    box-shadow:

        0 0 8px rgba(0, 255, 102, 1),

        0 0 18px rgba(0, 255, 102, 0.95),

        0 0 35px rgba(0, 255, 102, 0.80),

        0 0 65px rgba(0, 255, 102, 0.55),

        0 0 105px rgba(0, 255, 102, 0.30),

        0 0 150px rgba(0, 255, 102, 0.15);

    animation: webcamPulse 4s ease-in-out infinite;
}


/* =========================================================
   WEBCAM EDGE LIGHTS
========================================================= */

.webcam-neon::before,
.webcam-neon::after {

    content: "";

    position: absolute;

    pointer-events: none;

    box-sizing: border-box;
}


/* Top edge */

.webcam-neon::before {

    left: 18px;
    right: 18px;

    top: -2px;

    height: 2px;

    background: linear-gradient(

        90deg,

        transparent 0%,

        rgba(0,255,102,0.15) 8%,

        #00ff66 22%,

        #00ff66 78%,

        rgba(0,255,102,0.15) 92%,

        transparent 100%

    );

    box-shadow:

        0 0 8px #00ff66,

        0 0 20px rgba(0,255,102,0.8);
}


/* Bottom edge */

.webcam-neon::after {

    left: 18px;
    right: 18px;

    bottom: -2px;

    height: 2px;

    background: linear-gradient(

        90deg,

        transparent 0%,

        rgba(0,255,102,0.15) 8%,

        #00ff66 22%,

        #00ff66 78%,

        rgba(0,255,102,0.15) 92%,

        transparent 100%

    );

    box-shadow:

        0 0 8px #00ff66,

        0 0 20px rgba(0,255,102,0.8);
}


/* =========================================================
   WEBCAM CORNER BRACKETS
========================================================= */

.webcam-corner {

    position: absolute;

    width: 30px;
    height: 30px;

    box-sizing: border-box;

    pointer-events: none;

    z-index: 5;
}


/* Top Left */

.webcam-corner.tl {

    left: -4px;
    top: -4px;

    border-left: 4px solid #00ff66;
    border-top: 4px solid #00ff66;

    box-shadow:

        -4px -4px 14px rgba(0,255,102,0.95),

        0 0 22px rgba(0,255,102,0.75);
}


/* Top Right */

.webcam-corner.tr {

    right: -4px;
    top: -4px;

    border-right: 4px solid #00ff66;
    border-top: 4px solid #00ff66;

    box-shadow:

        4px -4px 14px rgba(0,255,102,0.95),

        0 0 22px rgba(0,255,102,0.75);
}


/* Bottom Left */

.webcam-corner.bl {

    left: -4px;
    bottom: -4px;

    border-left: 4px solid #00ff66;
    border-bottom: 4px solid #00ff66;

    box-shadow:

        -4px 4px 14px rgba(0,255,102,0.95),

        0 0 22px rgba(0,255,102,0.75);
}


/* Bottom Right */

.webcam-corner.br {

    right: -4px;
    bottom: -4px;

    border-right: 4px solid #00ff66;
    border-bottom: 4px solid #00ff66;

    box-shadow:

        4px 4px 14px rgba(0,255,102,0.95),

        0 0 22px rgba(0,255,102,0.75);
}


/* =========================================================
   WEBCAM SCAN LIGHT
========================================================= */

.webcam-scan {

    position: absolute;

    top: -2px;

    left: -120px;

    width: 120px;
    height: 2px;

    background: linear-gradient(

        90deg,

        transparent,

        rgba(255,255,255,0.95),

        #00ff66,

        transparent

    );

    filter:

        drop-shadow(0 0 7px #00ff66)

        drop-shadow(0 0 15px #00ff66);

    animation: webcamScan 5.5s linear infinite;

    pointer-events: none;
}


/* =========================================================
   SMALL SIDE ENERGY MARKS
========================================================= */

.energy {

    position: absolute;

    width: 3px;

    pointer-events: none;

    border-radius: 2px;

    opacity: 0.9;
}


/* Copy Trade left energy */

.copy-energy-left {

    left: -12px;
    top: 48px;

    height: 42px;

    background: #00d9ff;

    box-shadow:

        0 0 6px #00d9ff,

        0 0 15px #00d9ff,

        0 0 30px rgba(0,217,255,0.8);

    animation: energyBlue 2.4s ease-in-out infinite;
}


/* Copy Trade right energy */

.copy-energy-right {

    right: -12px;
    bottom: 30px;

    height: 25px;

    background: #00d9ff;

    box-shadow:

        0 0 6px #00d9ff,

        0 0 15px #00d9ff,

        0 0 30px rgba(0,217,255,0.8);

    animation: energyBlue 2.8s ease-in-out infinite reverse;
}


/* Webcam left energy */

.webcam-energy-left {

    left: -13px;
    top: 95px;

    height: 55px;

    background: #00ff66;

    box-shadow:

        0 0 7px #00ff66,

        0 0 18px #00ff66,

        0 0 35px rgba(0,255,102,0.8);

    animation: energyGreen 3s ease-in-out infinite;
}


/* Webcam right energy */

.webcam-energy-right {

    right: -13px;
    bottom: 75px;

    height: 35px;

    background: #00ff66;

    box-shadow:

        0 0 7px #00ff66,

        0 0 18px #00ff66,

        0 0 35px rgba(0,255,102,0.8);

    animation: energyGreen 3.5s ease-in-out infinite reverse;
}


/* =========================================================
   ANIMATIONS
========================================================= */

@keyframes copyPulse {

    0% {

        opacity: 0.86;

        filter: brightness(0.95);
    }

    50% {

        opacity: 1;

        filter: brightness(1.15);
    }

    100% {

        opacity: 0.86;

        filter: brightness(0.95);
    }
}


@keyframes webcamPulse {

    0% {

        opacity: 0.88;

        filter: brightness(0.95);
    }

    50% {

        opacity: 1;

        filter: brightness(1.12);
    }

    100% {

        opacity: 0.88;

        filter: brightness(0.95);
    }
}


@keyframes copyScan {

    0% {

        left: -100px;

        opacity: 0;
    }

    8% {

        opacity: 1;
    }

    45% {

        left: 430px;

        opacity: 1;
    }

    55% {

        opacity: 0;
    }

    100% {

        left: 430px;

        opacity: 0;
    }
}


@keyframes webcamScan {

    0% {

        left: -130px;

        opacity: 0;
    }

    8% {

        opacity: 1;
    }

    45% {

        left: 430px;

        opacity: 1;
    }

    55% {

        opacity: 0;
    }

    100% {

        left: 430px;

        opacity: 0;
    }
}


@keyframes energyBlue {

    0% {

        opacity: 0.35;

        transform: scaleY(0.65);
    }

    50% {

        opacity: 1;

        transform: scaleY(1);
    }

    100% {

        opacity: 0.35;

        transform: scaleY(0.65);
    }
}


@keyframes energyGreen {

    0% {

        opacity: 0.3;

        transform: scaleY(0.65);
    }

    50% {

        opacity: 1;

        transform: scaleY(1);
    }

    100% {

        opacity: 0.3;

        transform: scaleY(0.65);
    }
}

</style>

</head>


<body>


<!-- =======================================================
     COPY TRADE NEON
======================================================== -->

<div class="neon copy-neon">

    <div class="copy-corner tl"></div>
    <div class="copy-corner tr"></div>
    <div class="copy-corner bl"></div>
    <div class="copy-corner br"></div>

    <div class="copy-scan"></div>

    <div class="energy copy-energy-left"></div>
    <div class="energy copy-energy-right"></div>

</div>


<!-- =======================================================
     WEBCAM NEON
======================================================== -->

<div class="neon webcam-neon">

    <div class="webcam-corner tl"></div>
    <div class="webcam-corner tr"></div>
    <div class="webcam-corner bl"></div>
    <div class="webcam-corner br"></div>

    <div class="webcam-scan"></div>

    <div class="energy webcam-energy-left"></div>
    <div class="energy webcam-energy-right"></div>

</div>


</body>

</html>
