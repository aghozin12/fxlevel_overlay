<script>

/* =====================================================
   SESSION CONFIG
===================================================== */

const SESSION_CONFIG = {

    sydney: {
        name: "Sydney",
        shortName: "SYD",
        open: "00:30",
        close: "09:30"
    },

    tokyo: {
        name: "Tokyo",
        shortName: "TOK",
        open: "03:30",
        close: "12:30"
    },

    london: {

        open: "10:30",
        close: "19:30"
    },

    newyork: {
        name: "New York",
        shortName: "NY",
        open: "16:30",
        close: "00:30"
    }

};


/* =====================================================
   DOM
===================================================== */

const marketValue =
    document.getElementById(
        "market-value"
    );


const sessionClockLabel =
    document.getElementById(
        "session-clock-label"
    );


const sessionClockValue =
    document.getElementById(

    );


const tehranClockValue =
    document.getElementById(
        "tehran-value"
    );


/* =====================================================
   HH:MM → minutes
===================================================== */

function timeToMinutes(time) {

    const [
        hours,
        minutes
    ] = time.split(":").map(Number);

    return (
        hours * 60 +
        minutes
    );

}


/* =====================================================
   تهران
===================================================== */

function getTehranDateParts(
    date = new Date()
) {

    const parts =
        new Intl.DateTimeFormat(
            "en-US",
            {

                timeZone:
                    "Asia/Tehran",

                year:
                    "numeric",

                month:
                    "2-digit",

                day:
                    "2-digit",

                hour:
                    "2-digit",

                minute:
                    "2-digit",

                second:
                    "2-digit",

                hourCycle:
                    "h23"

            }
        ).formatToParts(date);


    const result = {};


    parts.forEach(
        part => {

            if (
                part.type !==
                "literal"
            ) {

                result[part.type] =
                    part.value;

            }

        }
    );


    return {

        year:
            Number(result.year),

        month:
            Number(result.month),

        day:
            Number(result.day),

        hour:
            Number(result.hour),

        minute:
            Number(result.minute),

        second:
            Number(result.second)

    };

}


/* =====================================================
   روز هفته تهران
===================================================== */

function getTehranDayOfWeek(
    date = new Date()
) {

    const parts =
        getTehranDateParts(
            date
        );


    const utcDate =
        new Date(
            Date.UTC(
                parts.year,
                parts.month - 1,
                parts.day
            )
        );


    return utcDate.getUTCDay();

}


/* =====================================================
   تعطیلی هفتگی
===================================================== */

function isWeekend(
    date = new Date()
) {

    const day =
        getTehranDayOfWeek(
            date
        );


    return (
        day === 0 ||
        day === 6
    );

}


/* =====================================================
   روز معاملاتی
===================================================== */

function isTradingDay(
    date = new Date()
) {

    return !isWeekend(date);

}


/* =====================================================
   دقیقه فعلی تهران
===================================================== */

function getCurrentTehranMinute(
    date = new Date()
) {

    const parts =
        getTehranDateParts(
            date
        );


    return (
        parts.hour * 60 +
        parts.minute +
        parts.second / 60
    );

}


/* =====================================================
   وضعیت Session
===================================================== */

function getSessionState(
    session,
    currentMinute
) {

    const open =
        timeToMinutes(
            session.open
        );


    const close =
        timeToMinutes(
            session.close
        );


    let isOpen;


    if (open < close) {

        isOpen =
            currentMinute >= open &&
            currentMinute < close;

    }

    else {

        isOpen =
            currentMinute >= open ||
            currentMinute < close;

    }


    return {

        open,
        close,
        isOpen

    };

}


/* =====================================================
   Session فعال
===================================================== */

function getActiveSessions(
    currentMinute,
    date = new Date()
) {

    if (
        !isTradingDay(date)
    ) {

        return [];

    }


    const active = [];


    Object.entries(
        SESSION_CONFIG
    ).forEach(
        ([id, session]) => {

            const state =
                getSessionState(
                    session,
                    currentMinute
                );


            if (
                state.isOpen
            ) {

                active.push({

                    id,

                    ...session,

                    ...state

                });

            }

        }
    );


    return active;

}


/* =====================================================
   Session اصلی
===================================================== */

function getPrimaryActiveSession(
    currentMinute,
    date = new Date()
) {

    const active =
        getActiveSessions(
            currentMinute,
            date
        );


    if (
        active.length === 0
    ) {

        return null;

    }


    let primary = null;

    let bestScore = -Infinity;


    active.forEach(
        session => {

            let score =
                timeToMinutes(
                    session.open
                );


            if (
                session.id === "newyork" &&
                currentMinute <
                    timeToMinutes(
                        session.close
                    )
            ) {

                score -= 1440;

            }


            if (
                score > bestScore
            ) {

                bestScore =
                    score;

                primary =
                    session;

            }

        }
    );


    return primary;

}


/* =====================================================
   MARKET STATUS
===================================================== */

function isMarketOpen(
    currentMinute,
    date = new Date()
) {

    if (
        !isTradingDay(date)
    ) {

        return false;

    }


    return (
        getActiveSessions(
            currentMinute,
            date
        ).length > 0
    );

}


/* =====================================================
   ساعت تهران
===================================================== */

function getTehranTime(
    date = new Date()
) {

    return new Intl.DateTimeFormat(
        "en-US",
        {

            timeZone:
                "Asia/Tehran",

            hour:
                "2-digit",

            minute:
                "2-digit",

            second:
                "2-digit",

            hour12:
                true

        }
    ).format(date);

}


/* =====================================================
   تاریخ میلادی امروز
===================================================== */

function getDate(
    date = new Date()
) {

    return new Intl.DateTimeFormat(
        "en-US",
        {

            calendar:
                "gregory",

            year:
                "numeric",

            month:
                "short",

            day:
                "2-digit"

        }
    )
    .format(date)
    .toUpperCase();

}


/* =====================================================
   CLOCKS
===================================================== */

function updateClocks() {

    const now =
        new Date();


    const tehranParts =
        getTehranDateParts(
            now
        );


    const currentMinute =
        tehranParts.hour * 60 +
        tehranParts.minute +
        tehranParts.second / 60;


    /* تهران */

    tehranClockValue.innerText =
        getTehranTime(
            now
        );


    /* Market */

    const marketOpen =
        isMarketOpen(
            currentMinute,
            now
        );


    if (marketOpen) {

        marketValue.innerText =
            "OPEN";

        marketValue.style.color =
            "#00ff88";

        marketValue.style.textShadow =
            "0 0 8px #00ff88";

    }

    else {

        marketValue.innerText =
            "CLOSED";

        marketValue.style.color =
            "#ff3333";

        marketValue.style.textShadow =
            "0 0 8px #ff3333";

    }


    /* Primary Session Clock */

    const activeSession =
        getPrimaryActiveSession(
            currentMinute,
            now
        );


    if (
        !activeSession
    ) {

        sessionClockLabel.innerText =
            "MARKET";


        sessionClockValue.innerText =
            "--:--:--";

    }

    else {

        sessionClockLabel.innerText =
            activeSession.name.toUpperCase();


        sessionClockValue.innerText =
            getTehranTime(
                now
            );

    }


    /* =================================================
       DATE
       تاریخ میلادی واقعی امروز
    ================================================= */

    const dateElement =
        document.getElementById(
            "date-value"
        );


    if (dateElement) {

        dateElement.innerText =
            getDate(now);

    }

}


/* =====================================================
   START CLOCK
===================================================== */

setInterval(
    updateClocks,
    1000
);

updateClocks();


/* =====================================================
   SUBSCRIBE / LIKE
===================================================== */

const subscribeState =
    document.querySelector(
        ".subscribe-state"
    );


const likeState =
    document.querySelector(
        ".like-state"
    );


const likeIcon =
    document.querySelector(
        ".like-icon"
    );


setInterval(
    function () {

        if (

            subscribeState.style.display !==
            "none"

        ) {

            subscribeState.style.display =
                "none";


            likeState.style.display =
                "flex";


            likeIcon.classList.remove(
                "like-pulse"
            );


            void likeIcon.offsetWidth;


            likeIcon.classList.add(
                "like-pulse"
            );

        }

        else {

            likeState.style.display =
                "none";


            subscribeState.style.display =
                "flex";

        }

    },

    10000

);

</script>
