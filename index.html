<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<title>FX LEVEL Overlay</title>

<style>

/* =====================================================
   صفحه اصلی
===================================================== */

html, body {
    width: 1920px;
    height: 1080px;
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #808080;
    font-family: Arial, sans-serif;
    color: white;
}


/* =====================================================
   شبکه پس‌زمینه
===================================================== */

body::before {
    content: "";
    position: absolute;
    inset: 0;

    background-image:
        linear-gradient(
            rgba(0,255,136,0.40) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(0,255,136,0.40) 1px,
            transparent 1px
        );

    background-size: 40px 40px;
    pointer-events: none;
}


/* =====================================================
   فریم اصلی
===================================================== */

.main-frame {
    position: absolute;

    top: 40px;
    left: 40px;

    width: calc(100% - 80px);
    height: calc(100% - 80px);

    clip-path: polygon(
        25px 0,
        calc(100% - 25px) 0,
        100% 25px,
        100% calc(100% - 25px),
        calc(100% - 25px) 100%,
        25px 100%,
        0 calc(100% - 25px),
        0 25px
    );

    background: rgba(0, 0, 0, 0.18);

    border: 3px solid #00ff88;

    box-shadow:
        0 0 25px #00ff88,
        inset 0 0 25px #00ff88;
}


/* =====================================================
   نوار بالا
===================================================== */

.top-bar {
    position: absolute;

    top: 55px;
    left: 50%;

    transform: translateX(-50%);

    width: 86%;
    height: 90px;

    clip-path: polygon(
        18px 0,
        calc(100% - 18px) 0,
        100% 18px,
        100% 100%,
        0 100%,
        0 18px
    );

    background: rgba(0, 0, 0, 0.35);

    border: 2px solid #00ff88;

    box-shadow:
        0 0 14px #00ff88,
        inset 0 0 14px #00ff88;

    display: flex;

    justify-content: space-between;
    align-items: center;

    padding: 0 35px;

    box-sizing: border-box;
}


/* =====================================================
   آیتم‌های نوار بالا
===================================================== */

.top-item {
    flex: 1;

    display: flex;

    justify-content: center;
}

.item-row {
    display: flex;

    align-items: center;

    gap: 14px;
}


/* آیکون‌های بالا */

.icon {
    width: 40px;
    height: 40px;

    stroke: #ffffff;
    fill: none;

    filter:
        drop-shadow(0 0 6px #00ff88);
}


/* متن‌های بالا */

.text-box {
    display: flex;

    flex-direction: column;

    line-height: 1.1;
}


.text-box span:first-child {
    font-size: 14px;

    color: #ffae4a;

    text-shadow:
        0 0 6px #ffae4a;
}


.text-box span:last-child {
    font-size: 22px;

    font-weight: bold;

    color: #00ff88;

    text-shadow:
        0 0 8px #00ff88;
}


/* جداکننده بالا */

.divider {
    width: 1px;

    height: 60%;

    background:
        rgba(255,255,255,0.35);
}


/* =====================================================
   وبکم
===================================================== */

.webcam-frame {
    position: absolute;

    bottom: 170px;
    left: 80px;

    width: 430px;
    height: 250px;

    border: 4px solid #00ff66;

    border-radius: 0;

    background:
        rgba(0, 0, 0, 0.18);

    box-shadow:
        0 0 25px rgba(0, 255, 102, 1),
        0 0 55px rgba(0, 255, 102, 0.85),
        0 0 110px rgba(0, 255, 102, 0.65),
        0 0 160px rgba(0, 255, 102, 0.45);
}


/* =====================================================
   نوار پایین
===================================================== */

.bottom-bar {
    position: absolute;

    bottom: 55px;
    left: 50%;

    transform: translateX(-50%);

    width: 86%;
    height: 80px;

    clip-path: polygon(
        0 0,
        100% 0,
        100% calc(100% - 18px),
        calc(100% - 18px) 100%,
        18px 100%,
        0 calc(100% - 18px)
    );

    background:
        rgba(0, 0, 0, 0.35);

    border: 2px solid #00ff88;

    box-shadow:
        0 0 14px #00ff88,
        inset 0 0 14px #00ff88;

    display: flex;

    justify-content: space-between;
    align-items: center;

    padding: 0 40px;

    box-sizing: border-box;
}


/* =====================================================
   فونت یکسان تمام نوشته‌های نوار پایین
===================================================== */

.bottom-item span {
    font-family: Arial, sans-serif;

    font-size: 18px;

    font-weight: bold;

    line-height: 1;

    display: flex;

    align-items: center;

    white-space: nowrap;
}


/* =====================================================
   آیتم‌های نوار پایین
===================================================== */

.bottom-item {
    display: flex;

    align-items: center;

    gap: 10px;
}


/* =====================================================
   رنگ متن‌های معمولی نوار پایین
===================================================== */

.bottom-item:not(.subscribe) span {
    color: #4da6ff;

    text-shadow:
        0 0 6px #4da6ff;
}


/* =====================================================
   آیکون‌های نوار پایین
===================================================== */

.bottom-icon {
    width: 40px;
    height: 40px;

    stroke: #ffffff;

    fill: none;

    display: flex;

    align-items: center;

    flex-shrink: 0;

    filter:
        drop-shadow(0 0 4px #ffb347);
}


/* =====================================================
   بخش ثابت SUBSCRIBE / LIKE
===================================================== */

.subscribe {
    position: relative;

    width: 145px;
    min-width: 145px;
    max-width: 145px;

    height: 40px;

    flex-shrink: 0;
}


.promo-state {
    position: absolute;

    left: 0;
    top: 50%;

    transform: translateY(-50%);

    display: flex;

    align-items: center;

    gap: 10px;

    white-space: nowrap;
}


/* =====================================================
   SUBSCRIBE
===================================================== */

.subscribe-state span {
    font-family: Arial, sans-serif;

    font-size: 18px;

    font-weight: bold;

    color: #ff3333;

    text-shadow:
        0 0 5px rgba(255,51,51,0.55);
}


/* =====================================================
   زنگوله
===================================================== */

.bell-icon {
    stroke: #ff3333;

    filter:
        drop-shadow(0 0 4px #ff3333);

    transform-origin: 50% 15%;
}


.subscribe-state .bell-icon {
    animation:
        bellMiddle 10s ease-in-out infinite;
}


@keyframes bellMiddle {

    0% {
        transform: rotate(0deg);
    }

    45% {
        transform: rotate(0deg);
    }

    47% {
        transform: rotate(-6deg);
    }

    48.5% {
        transform: rotate(6deg);
    }

    50% {
        transform: rotate(-4deg);
    }

    51.5% {
        transform: rotate(0deg);
    }

    53% {
        transform: rotate(-6deg);
    }

    54.5% {
        transform: rotate(6deg);
    }

    56% {
        transform: rotate(-4deg);
    }

    57.5% {
        transform: rotate(0deg);
    }

    100% {
        transform: rotate(0deg);
    }
}


/* =====================================================
   LIKE
===================================================== */

.like-state {
    display: none;
}


.like-state span {
    font-family: Arial, sans-serif;

    font-size: 18px;

    font-weight: bold;

    color: #4da6ff;

    text-shadow:
        0 0 5px rgba(77,166,255,0.55);
}


.like-icon {
    stroke: #4da6ff;

    filter:
        drop-shadow(0 0 4px #4da6ff);

    transform-origin: center;
}


/* =====================================================
   انیمیشن لایک
===================================================== */

.like-pulse {
    animation:
        likePulse 10s ease-in-out infinite;
}


@keyframes likePulse {

    0% {
        transform: scale(0.82);
    }

    8% {
        transform: scale(1.10);
    }

    15% {
        transform: scale(0.88);
    }

    22% {
        transform: scale(1.12);
    }

    29% {
        transform: scale(0.88);
    }

    38% {
        transform: scale(1);
    }

    100% {
        transform: scale(1);
    }
}


/* =====================================================
   VIP
===================================================== */

.vip {
    position: relative;

    overflow: hidden;
}


.vip span {
    animation:
        vipPulse 1.8s infinite ease-in-out;
}


@keyframes vipPulse {

    0% {
        text-shadow:
            0 0 6px #00ff88;
    }

    50% {
        text-shadow:
            0 0 18px #00ff88;
    }

    100% {
        text-shadow:
            0 0 6px #00ff88;
    }
}


/* Shine */

.vip .shine {
    position: absolute;

    top: 0;
    left: -120%;

    width: 80%;
    height: 100%;

    background:
        linear-gradient(
            120deg,
            transparent,
            rgba(255,255,255,0.4),
            transparent
        );

    animation:
        shineSweep 3s infinite;
}


@keyframes shineSweep {

    0% {
        left: -120%;
    }

    50% {
        left: 120%;
    }

    100% {
        left: 120%;
    }
}


/* =====================================================
   هشدار تغییر سشن
===================================================== */

#newyork-value.session-time-blink {
    animation: sessionTimeBlink 1s ease-in-out infinite;
}


@keyframes sessionTimeBlink {

    0%, 100% {
        opacity: 1;
    }

    50% {
        opacity: 0.15;
    }
}

</style>

<script>


/* =====================================================
   ساعت، تاریخ و سشن‌ها
===================================================== */

/*
   منطق جدید:

   هر سشن بر اساس ساعت محلی همان شهر تعریف می‌شود.

   Sydney    = 08:00 Australia/Sydney
   Tokyo     = 09:00 Asia/Tokyo
   London    = 08:00 Europe/London
   New York  = 08:00 America/New_York

   بنابراین تغییرات DST به صورت خودکار توسط
   IANA Time Zone و Intl.DateTimeFormat محاسبه می‌شود.

   Tokyo:
   Asia/Tokyo = UTC+9
   بدون DST

   London:
   Europe/London
   دارای GMT / BST

   New York:
   America/New_York
   دارای EST / EDT

   Sydney:
   Australia/Sydney
   دارای AEST / AEDT
*/


const tradingSessions = [

    {
        name: "Sydney",

        timeZone: "Australia/Sydney",

        openHour: 8,

        openMinute: 0
    },

    {
        name: "Tokyo",

        timeZone: "Asia/Tokyo",

        openHour: 9,

        openMinute: 0
    },

    {
        name: "London",

        timeZone: "Europe/London",

        openHour: 8,

        openMinute: 0
    },

    {
        name: "New York",

        timeZone: "America/New_York",

        openHour: 8,

        openMinute: 0
    }

];


const sessionValue =
    document.getElementById(
        "session-value"
    );


const sessionClockLabel =
    document.getElementById(
        "session-clock-label"
    );


const sessionClockValue =
    document.getElementById(
        "newyork-value"
    );


const tehranClockValue =
    document.getElementById(
        "tehran-value"
    );


/* =====================================================
   گرفتن اجزای تاریخ در یک Time Zone
===================================================== */

function getTimeZoneParts(
    date,
    timeZone
) {

    const parts =
        new Intl.DateTimeFormat(
            "en-US",
            {
                timeZone: timeZone,

                year: "numeric",

                month: "2-digit",

                day: "2-digit",

                hour: "2-digit",

                minute: "2-digit",

                second: "2-digit",

                hourCycle: "h23"
            }
        ).formatToParts(date);


    const result = {};


    parts.forEach(part => {

        if (
            part.type !== "literal"
        ) {

            result[part.type] =
                part.value;

        }

    });


    return {

        year:
            parseInt(
                result.year,
                10
            ),

        month:
            parseInt(
                result.month,
                10
            ),

        day:
            parseInt(
                result.day,
                10
            ),

        hour:
            parseInt(
                result.hour,
                10
            ),

        minute:
            parseInt(
                result.minute,
                10
            ),

        second:
            parseInt(
                result.second,
                10
            )

    };

}


/* =====================================================
   تبدیل زمان یک Time Zone به دقیقه روز
===================================================== */

function getLocalMinutes(
    date,
    timeZone
) {

    const parts =
        getTimeZoneParts(
            date,
            timeZone
        );


    return (
        parts.hour * 60 +
        parts.minute
    );

}


/* =====================================================
   تبدیل زمان محلی سشن به UTC Timestamp
===================================================== */

/*
   این تابع برای پیدا کردن زمان واقعی شروع سشن
   در همان روز محلی استفاده می‌شود.

   چون JavaScript به صورت مستقیم امکان ساختن
   Date در یک Time Zone دلخواه را ندارد،
   Offset واقعی Time Zone را از Intl استخراج می‌کنیم.
*/

function getTimeZoneOffset(
    date,
    timeZone
) {

    const parts =
        new Intl.DateTimeFormat(
            "en-US",
            {
                timeZone: timeZone,

                year: "numeric",

                month: "2-digit",

                day: "2-digit",

                hour: "2-digit",

                minute: "2-digit",

                second: "2-digit",

                hourCycle: "h23"
            }
        ).formatToParts(date);


    const values = {};


    parts.forEach(part => {

        if (
            part.type !== "literal"
        ) {

            values[part.type] =
                part.value;

        }

    });


    const asUTC =
        Date.UTC(
            Number(values.year),
            Number(values.month) - 1,
            Number(values.day),
            Number(values.hour),
            Number(values.minute),
            Number(values.second)
        );


    return (
        asUTC -
        date.getTime()
    );

}


/* =====================================================
   پیدا کردن Timestamp شروع یک سشن
===================================================== */

function getSessionOpenTimestamp(
    date,
    session,
    dayOffset = 0
) {

    const localParts =
        getTimeZoneParts(
            date,
            session.timeZone
        );


    /*
       ابتدا تاریخ محلی سشن را می‌سازیم.
    */

    const localDate =
        new Date(
            Date.UTC(
                localParts.year,
                localParts.month - 1,
                localParts.day + dayOffset,
                session.openHour,
                session.openMinute,
                0
            )
        );


    /*
       Offset Time Zone را در محدوده موردنظر
       محاسبه می‌کنیم.
    */

    const offset =
        getTimeZoneOffset(
            localDate,
            session.timeZone
        );


    return (
        localDate.getTime() -
        offset
    );

}


/* =====================================================
   پیدا کردن آخرین زمان شروع هر سشن
===================================================== */

function getLastSessionOpen(
    now,
    session
) {

    const currentOpen =
        getSessionOpenTimestamp(
            now,
            session,
            0
        );


    /*
       اگر شروع امروز گذشته باشد،
       همین شروع آخرین شروع است.
    */

    if (
        currentOpen <=
        now.getTime()
    ) {

        return currentOpen;

    }


    /*
       اگر هنوز شروع امروز نرسیده،
       شروع دیروز آخرین شروع است.
    */

    return getSessionOpenTimestamp(
        now,
        session,
        -1
    );

}


/* =====================================================
   تشخیص سشن فعال
===================================================== */

function getActiveSession(
    now
) {

    let activeSession =
        tradingSessions[
            tradingSessions.length - 1
        ];


    let latestOpen = -Infinity;


    tradingSessions.forEach(
        session => {

            const open =
                getLastSessionOpen(
                    now,
                    session
                );


            if (
                open >
                latestOpen
            ) {

                latestOpen =
                    open;

                activeSession =
                    session;

            }

        }
    );


    return {

        session:
            activeSession,

        openTimestamp:
            latestOpen

    };

}


/* =====================================================
   پیدا کردن سشن بعدی
===================================================== */

function getNextSession(
    now
) {

    let nextSession = null;

    let nextOpen = Infinity;


    tradingSessions.forEach(
        session => {

            const todayOpen =
                getSessionOpenTimestamp(
                    now,
                    session,
                    0
                );


            const tomorrowOpen =
                getSessionOpenTimestamp(
                    now,
                    session,
                    1
                );


            let candidate;


            if (
                todayOpen >
                now.getTime()
            ) {

                candidate =
                    todayOpen;

            } else {

                candidate =
                    tomorrowOpen;

            }


            if (
                candidate <
                nextOpen
            ) {

                nextOpen =
                    candidate;

                nextSession =
                    session;

            }

        }
    );


    return {

        session:
            nextSession,

        openTimestamp:
            nextOpen

    };

}


/* =====================================================
   فرمت ساعت محلی
===================================================== */

function getSessionTime(
    timeZone,
    date = new Date()
) {

    return new Intl.DateTimeFormat(
        "en-US",
        {
            timeZone: timeZone,

            hour: "2-digit",

            minute: "2-digit",

            hour12: true
        }
    ).format(date);

}


/* =====================================================
   فرمت تاریخ تهران
===================================================== */

function getTehranDate(
    date = new Date()
) {

    return new Intl.DateTimeFormat(
        "en-US",
        {
            timeZone: "Asia/Tehran",

            day: "2-digit",

            month: "short",

            year: "numeric"
        }
    ).format(date);

}


/* =====================================================
   آپدیت ساعت‌ها
===================================================== */

function updateClocks() {

    const now =
        new Date();


    /* ================================================
       ساعت واقعی تهران
    ================================================ */

    tehranClockValue.innerText =
        getSessionTime(
            "Asia/Tehran",
            now
        );


    /* ================================================
       سشن فعال
    ================================================ */

    const active =
        getActiveSession(
            now
        );


    const activeSession =
        active.session;


    /* ================================================
       سشن بعدی
    ================================================ */

    const next =
        getNextSession(
            now
        );


    /* ================================================
       نمایش نام سشن
    ================================================ */

    sessionValue.innerText =
        activeSession.name;


    /* ================================================
       نمایش نام شهر کنار ساعت
    ================================================ */

    sessionClockLabel.innerText =
        activeSession.name.toUpperCase();


    /* ================================================
       نمایش ساعت واقعی همان سشن
    ================================================ */

    sessionClockValue.innerText =
        getSessionTime(
            activeSession.timeZone,
            now
        );


    /* ================================================
       محاسبه زمان باقی‌مانده تا سشن بعدی
    ================================================ */

    const millisecondsUntilNext =
        next.openTimestamp -
        now.getTime();


    const minutesUntilNext =
        millisecondsUntilNext /
        (1000 * 60);


    /* ================================================
       هشدار ۵ دقیقه مانده
    ================================================ */

    if (
        minutesUntilNext <= 5 &&
        minutesUntilNext > 0
    ) {

        sessionClockValue.classList.add(
            "session-time-blink"
        );

    } else {

        sessionClockValue.classList.remove(
            "session-time-blink"
        );

    }


    /* ================================================
       تاریخ تهران
    ================================================ */

    document.getElementById(
        "date-value"
    ).innerText =
        getTehranDate(
            now
        );

}


/* =====================================================
   اجرای ساعت
===================================================== */

setInterval(
    updateClocks,
    1000
);


updateClocks();


/* =====================================================
   خبر
===================================================== */

async function updateNews() {

    try {

        const rssUrl =
            "https://www.marketwatch.com/rss/topstories";


        const response =
            await fetch(
                `https://api.allorigins.win/get?url=${encodeURIComponent(rssUrl)}`
            );


        const data =
            await response.json();


        const parser =
            new DOMParser();


        const xml =
            parser.parseFromString(
                data.contents,
                "text/xml"
            );


        const firstItem =
            xml.querySelector(
                "item > title"
            ).textContent;


        const shortTitle =
            firstItem.length > 55
                ? firstItem.slice(0, 55) + "..."
                : firstItem;


        document.getElementById(
            "news-value"
        ).innerText = shortTitle;

    }

    catch (e) {

        document.getElementById(
            "news-value"
        ).innerText = "Loading...";

    }
}


updateNews();


setInterval(
    updateNews,
    30000
);


/* =====================================================

===================================================== */

const subscribeState =
    document.querySelector(
        ".subscribe-state"
    );


const likeState =
    document.querySelector(
        ".like-state"
    );


const likeIcon =
    document.querySelector(
        ".like-icon"
    );


setInterval(
    function () {

        if (
            subscribeState.style.display !== "none"
        ) {

            subscribeState.style.display =
                "none";

            likeState.style.display =
                "flex";


            likeIcon.classList.remove(
                "like-pulse"
            );


            void likeIcon.offsetWidth;


            likeIcon.classList.add(
                "like-pulse"
            );

        }

        else {

            likeState.style.display =
                "none";

            subscribeState.style.display =
                "flex";

        }

    },
    10000
);
