<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<title>FX LEVEL Overlay</title>

<style>

/* =====================================================
   صفحه اصلی
===================================================== */

html,
body {

    width: 1920px;
    height: 1080px;

    margin: 0;
    padding: 0;

    overflow: hidden;

    background: #808080;

    font-family: Arial, sans-serif;

    color: white;
}


/* =====================================================
   شبکه پس‌زمینه
===================================================== */

body::before {

    content: "";

    position: absolute;

    inset: 0;

    background-image:

        linear-gradient(
            rgba(0,255,136,0.40) 1px,
            transparent 1px
        ),

        linear-gradient(
            90deg,
            rgba(0,255,136,0.40) 1px,
            transparent 1px
        );

    background-size: 40px 40px;

    pointer-events: none;
}


/* =====================================================
   فریم اصلی
===================================================== */

.main-frame {

    position: absolute;

    top: 40px;
    left: 40px;

    width: calc(100% - 80px);
    height: calc(100% - 80px);

    clip-path: polygon(

        25px 0,
        calc(100% - 25px) 0,
        100% 25px,
        100% calc(100% - 25px),
        calc(100% - 25px) 100%,
        25px 100%,
        0 calc(100% - 25px),
        0 25px

    );

    background: rgba(0, 0, 0, 0.18);

    border: 3px solid #00ff88;

    box-shadow:

        0 0 25px #00ff88,
        inset 0 0 25px #00ff88;
}


/* =====================================================
   نوار بالا
===================================================== */

.top-bar {

    position: absolute;

    top: 55px;
    left: 50%;

    transform: translateX(-50%);

    width: 86%;
    height: 90px;

    clip-path: polygon(

        18px 0,
        calc(100% - 18px) 0,
        100% 18px,
        100% 100%,
        0 100%,
        0 18px

    );

    background: rgba(0, 0, 0, 0.35);

    border: 2px solid #00ff88;

    box-shadow:

        0 0 14px #00ff88,
        inset 0 0 14px #00ff88;

    display: flex;

    justify-content: space-between;

    align-items: center;

    padding: 0 35px;

    box-sizing: border-box;
}


/* =====================================================
   آیتم‌های نوار بالا
===================================================== */

.top-item {

    flex: 1;

    display: flex;

    justify-content: center;
}


.item-row {

    display: flex;

    align-items: center;

    gap: 14px;
}


/* =====================================================
   آیکون‌های بالا
===================================================== */

.icon {

    width: 40px;
    height: 40px;

    stroke: #ffffff;

    fill: none;

    filter:
        drop-shadow(0 0 6px #00ff88);
}


/* =====================================================
   متن‌های بالا
===================================================== */

.text-box {

    display: flex;

    flex-direction: column;

    line-height: 1.1;
}


.text-box span:first-child {

    font-size: 14px;

    color: #ffae4a;

    text-shadow:
        0 0 6px #ffae4a;
}


.text-box span:last-child {

    font-size: 22px;

    font-weight: bold;

    color: #00ff88;

    text-shadow:
        0 0 8px #00ff88;
}


/* =====================================================
   هشدار نام سشن
===================================================== */

#session-value.session-warning {

    animation:
        sessionNameBlink 1s ease-in-out infinite;
}


@keyframes sessionNameBlink {

    0%, 100% {
        opacity: 1;
    }

    50% {
        opacity: 0.15;
    }
}


/* =====================================================
   هشدار ساعت سشن
===================================================== */

#newyork-value.clock-warning {

    animation:
        sessionClockBlink 0.65s ease-in-out infinite;
}


@keyframes sessionClockBlink {

    0%, 100% {
        opacity: 1;
    }

    50% {
        opacity: 0.10;
    }
}


/* =====================================================
   جداکننده بالا
===================================================== */

.divider {

    width: 1px;

    height: 60%;

    background:
        rgba(255,255,255,0.35);
}


/* =====================================================
   SESSION MAP
===================================================== */

.session-map {

    flex: 1.25;

    display: flex;

    justify-content: center;

    align-items: center;

    min-width: 360px;
}


.session-map-inner {

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    width: 100%;
}


/* =====================================================
   عنوان SESSION
===================================================== */

.session-map-title {

    font-size: 13px;

    font-weight: bold;

    letter-spacing: 3px;

    color: #ffae4a;

    text-shadow:
        0 0 6px #ffae4a;

    margin-bottom: 8px;
}


/* =====================================================
   مپ سشن‌ها
===================================================== */

.session-track {

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 13px;

    height: 27px;
}


.session-node {

    display: flex;

    align-items: center;

    gap: 5px;

    position: relative;

    font-size: 15px;

    font-weight: bold;

    letter-spacing: 1px;

    color: rgba(255,255,255,0.55);

    transition:
        color 0.35s ease,
        text-shadow 0.35s ease;
}


.session-dot {

    width: 7px;
    height: 7px;

    border-radius: 50%;

    background: rgba(255,255,255,0.30);

    box-shadow:
        0 0 2px rgba(255,255,255,0.2);

    transition:
        background 0.35s ease,
        box-shadow 0.35s ease,
        transform 0.35s ease;
}


/* =====================================================
   سشن ACTIVE
===================================================== */

.session-node.active {

    color: #00ff88;

    text-shadow:

        0 0 5px #00ff88,
        0 0 12px rgba(0,255,136,0.8);
}


.session-node.active .session-dot {

    background: #00ff88;

    box-shadow:

        0 0 5px #00ff88,
        0 0 12px #00ff88,
        0 0 22px rgba(0,255,136,0.9);

    animation:
        activeDotPulse 1.25s ease-in-out infinite;
}


@keyframes activeDotPulse {

    0%,
    100% {

        transform: scale(0.85);

        opacity: 0.75;

    }

    50% {

        transform: scale(1.35);

        opacity: 1;

    }
}


/* =====================================================
   خط اتصال بین سشن‌ها
===================================================== */

.session-connector {

    width: 16px;

    height: 1px;

    background:
        rgba(255,255,255,0.18);

    box-shadow:
        0 0 4px rgba(0,255,136,0.15);
}


/* =====================================================
   ACTIVE LABEL
===================================================== */

.session-active-label {

    position: relative;

    height: 18px;

    margin-top: 3px;

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 5px;

    font-size: 10px;

    font-weight: bold;

    letter-spacing: 2px;

    color: #00ff88;

    text-shadow:
        0 0 6px #00ff88;

    opacity: 0;

    transition:
        opacity 0.35s ease;
}


.session-active-label.visible {

    opacity: 1;
}


.active-arrow {

    display: inline-block;

    font-size: 12px;

    animation:
        activeArrowFloat 1s ease-in-out infinite;
}


@keyframes activeArrowFloat {

    0%,
    100% {

        transform:
            translateY(2px);

    }

    50% {

        transform:
            translateY(-1px);

    }
}


/* =====================================================
   آخر هفته / CLOSED
===================================================== */

.session-map.weekend .session-map-title {

    color: #ffae4a;

    text-shadow:
        0 0 6px #ffae4a;
}


.session-map.weekend .session-active-label {

    color: #ffae4a;

    text-shadow:
        0 0 6px #ffae4a;
}


.session-map.weekend .session-node {

    color: rgba(255,255,255,0.35);
}


.session-map.weekend .session-dot {

    background: rgba(255,174,74,0.28);

    box-shadow:
        0 0 5px rgba(255,174,74,0.15);
}


/* =====================================================
   وبکم
===================================================== */

.webcam-frame {

    position: absolute;

    bottom: 170px;
    left: 80px;

    width: 430px;
    height: 250px;

    border: 4px solid #00ff66;

    border-radius: 0;

    background:
        rgba(0, 0, 0, 0.18);

    box-shadow:

        0 0 25px rgba(0, 255, 102, 1),
        0 0 55px rgba(0, 255, 102, 0.85),
        0 0 110px rgba(0, 255, 102, 0.65),
        0 0 160px rgba(0, 255, 102, 0.45);
}


/* =====================================================
   نوار پایین
===================================================== */

.bottom-bar {

    position: absolute;

    bottom: 55px;
    left: 50%;

    transform: translateX(-50%);

    width: 86%;
    height: 80px;

    clip-path: polygon(

        0 0,
        100% 0,
        100% calc(100% - 18px),
        calc(100% - 18px) 100%,
        18px 100%,
        0 calc(100% - 18px)

    );

    background:
        rgba(0, 0, 0, 0.35);

    border: 2px solid #00ff88;

    box-shadow:

        0 0 14px #00ff88,
        inset 0 0 14px #00ff88;

    display: flex;

    justify-content: space-between;

    align-items: center;

    padding: 0 40px;

    box-sizing: border-box;
}


/* =====================================================
   فونت نوار پایین
===================================================== */

.bottom-item span {

    font-family: Arial, sans-serif;

    font-size: 18px;

    font-weight: bold;

    line-height: 1;

    display: flex;

    align-items: center;

    white-space: nowrap;
}


/* =====================================================
   آیتم‌های نوار پایین
===================================================== */

.bottom-item {

    display: flex;

    align-items: center;

    gap: 10px;
}


/* =====================================================
   رنگ متن‌های معمولی
===================================================== */

.bottom-item:not(.subscribe) span {

    color: #4da6ff;

    text-shadow:
        0 0 6px #4da6ff;
}


/* =====================================================
   جداکننده پایین
===================================================== */

.bottom-divider {

    width: 1px;

    height: 35px;

    background:
        rgba(255,255,255,0.22);

    flex-shrink: 0;
}


/* =====================================================
   آیکون‌های نوار پایین
===================================================== */

.bottom-icon {

    width: 40px;
    height: 40px;

    stroke: #ffffff;

    fill: none;

    display: flex;

    align-items: center;

    flex-shrink: 0;

    filter:
        drop-shadow(0 0 4px #ffb347);
}


/* =====================================================
   SUBSCRIBE / LIKE
===================================================== */

.subscribe {

    position: relative;

    width: 145px;
    min-width: 145px;
    max-width: 145px;

    height: 40px;

    flex-shrink: 0;
}


.promo-state {

    position: absolute;

    left: 0;
    top: 50%;

    transform: translateY(-50%);

    display: flex;

    align-items: center;

    gap: 10px;

    white-space: nowrap;
}


/* =====================================================
   SUBSCRIBE
===================================================== */

.subscribe-state span {

    font-family: Arial, sans-serif;

    font-size: 18px;

    font-weight: bold;

    color: #ff3333;

    text-shadow:
        0 0 5px rgba(255,51,51,0.55);
}


/* =====================================================
   زنگوله
===================================================== */

.bell-icon {

    stroke: #ff3333;

    filter:
        drop-shadow(0 0 4px #ff3333);

    transform-origin: 50% 15%;
}


.subscribe-state .bell-icon {

    animation:
        bellMiddle 10s ease-in-out infinite;
}


@keyframes bellMiddle {

    0% {
        transform: rotate(0deg);
    }

    45% {
        transform: rotate(0deg);
    }

    47% {
        transform: rotate(-6deg);
    }

    48.5% {
        transform: rotate(6deg);
    }

    50% {
        transform: rotate(-4deg);
    }

    51.5% {
        transform: rotate(0deg);
    }

    53% {
        transform: rotate(-6deg);
    }

    54.5% {
        transform: rotate(6deg);
    }

    56% {
        transform: rotate(-4deg);
    }

    57.5% {
        transform: rotate(0deg);
    }

    100% {
        transform: rotate(0deg);
    }
}


/* =====================================================
   LIKE
===================================================== */

.like-state {

    display: none;
}


.like-state span {

    font-family: Arial, sans-serif;

    font-size: 18px;

    font-weight: bold;

    color: #4da6ff;

    text-shadow:
        0 0 5px rgba(77,166,255,0.55);
}


.like-icon {

    stroke: #4da6ff;

    filter:
        drop-shadow(0 0 4px #4da6ff);

    transform-origin: center;
}


/* =====================================================
   انیمیشن LIKE
===================================================== */

.like-pulse {

    animation:
        likePulse 10s ease-in-out infinite;
}


@keyframes likePulse {

    0% {
        transform: scale(0.82);
    }

    8% {
        transform: scale(1.10);
    }

    15% {
        transform: scale(0.88);
    }

    22% {
        transform: scale(1.12);
    }

    29% {
        transform: scale(0.88);
    }

    38% {
        transform: scale(1);
    }

    100% {
        transform: scale(1);
    }
}


/* =====================================================
   VIP
===================================================== */

.vip {

    position: relative;

    overflow: hidden;
}


.vip span {

    animation:
        vipPulse 1.8s infinite ease-in-out;
}


@keyframes vipPulse {

    0% {

        text-shadow:
            0 0 6px #00ff88;
    }

    50% {

        text-shadow:
            0 0 18px #00ff88;
    }

    100% {

        text-shadow:
            0 0 6px #00ff88;
    }
}


/* =====================================================
   Shine
===================================================== */

.vip .shine {

    position: absolute;

    top: 0;
    left: -120%;

    width: 80%;
    height: 100%;

    background:

        linear-gradient(
            120deg,
            transparent,
            rgba(255,255,255,0.4),
            transparent
        );

    animation:
        shineSweep 3s infinite;
}


@keyframes shineSweep {

    0% {
        left: -120%;
    }

    50% {
        left: 120%;
    }

    100% {
        left: 120%;
    }
}

</style>

<script>


/* =====================================================
   تنظیمات سشن‌ها
===================================================== */

/*
   زمان شروع سشن‌ها بر اساس ساعت محلی همان شهر:

   Sydney    = 08:00
   Tokyo     = 09:00
   London    = 08:00

   New York  = 09:30
   اما در این Overlay، باز شدن بازار سهام آمریکا
   به صورت ثابت 16:30 به وقت تهران در نظر گرفته شده است.

   نکته:
   منطق Session Map امکان فعال بودن همزمان
   دو سشن را دارد.
*/

    {

/* =====================================================
   گرفتن اجزای زمان در Time Zone
===================================================== */

function getTimeZoneParts(
    date,
    timeZone
) {

    const parts =
        new Intl.DateTimeFormat(
            "en-US",
            {

                timeZone: timeZone,

                year: "numeric",

                month: "2-digit",

                day: "2-digit",

                hour: "2-digit",

                minute: "2-digit",

                second: "2-digit",

                hourCycle: "h23"

            }
        ).formatToParts(date);


    const result = {};


    parts.forEach(
        part => {

            if (
                part.type !== "literal"
            ) {

                result[part.type] =
                    part.value;

            }

        }
    );


    return {

        year:
            parseInt(
                result.year,
                10
            ),

        month:
            parseInt(
                result.month,
                10
            ),

        day:
            parseInt(
                result.day,
                10
            ),

        hour:
            parseInt(
                result.hour,
                10
            ),

        minute:
            parseInt(
                result.minute,
                10
            ),

        second:
            parseInt(
                result.second,
                10
            )

    };

}


/* =====================================================
   Offset واقعی Time Zone
===================================================== */

function getTimeZoneOffset(
    date,
    timeZone
) {

    const parts =
        new Intl.DateTimeFormat(
            "en-US",
            {

                timeZone: timeZone,

                year: "numeric",

                month: "2-digit",

                day: "2-digit",

                hour: "2-digit",

                minute: "2-digit",

                second: "2-digit",

                hourCycle: "h23"

            }
        ).formatToParts(date);


    const values = {};


    parts.forEach(
        part => {

            if (
                part.type !== "literal"
            ) {

                values[part.type] =
                    part.value;

            }

        }
    );


    const asUTC =
        Date.UTC(

            Number(values.year),

            Number(values.month) - 1,

            Number(values.day),

            Number(values.hour),

            Number(values.minute),

            Number(values.second)

        );


    return (
        asUTC -
        date.getTime()
    );

}


/* =====================================================
   Timestamp شروع سشن
===================================================== */

function getSessionOpenTimestamp(
    date,
    session,
    dayOffset = 0
) {

    /* -----------------------------------------------
       نیویورک:
       بازار سهام آمریکا = 16:30 تهران
       فعلاً به صورت ثابت
    ----------------------------------------------- */

    if (
        session.fixedTehranOpen
    ) {

        const tehranParts =
            getTimeZoneParts(
                date,
                "Asia/Tehran"
            );


        const tehranDate =
            new Date(

                Date.UTC(

                    tehranParts.year,

                    tehranParts.month - 1,

                    tehranParts.day + dayOffset,

                    session.tehranOpenHour,

                    session.tehranOpenMinute,

                    0

                )

            );


        const tehranOffset =
            getTimeZoneOffset(
                tehranDate,
                "Asia/Tehran"
            );


        return (
            tehranDate.getTime() -
            tehranOffset
        );

    }


    /* -----------------------------------------------
       سایر سشن‌ها
    ----------------------------------------------- */

    const localParts =
        getTimeZoneParts(
            date,
            session.timeZone
        );


    const localDate =
        new Date(

            Date.UTC(

                localParts.year,

                localParts.month - 1,

                localParts.day + dayOffset,

                session.openHour,

                session.openMinute,

                0

            )

        );


    const offset =
        getTimeZoneOffset(
            localDate,
            session.timeZone
        );


    return (
        localDate.getTime() -
        offset
    );

}


/* =====================================================
   آخرین شروع هر سشن
===================================================== */

function getLastSessionOpen(
    now,
    session
) {

    const currentOpen =
        getSessionOpenTimestamp(
            now,
            session,
            0
        );


    if (
        currentOpen <=
        now.getTime()
    ) {

        return currentOpen;

    }


    return getSessionOpenTimestamp(
        now,
        session,
        -1
    );

}


/* =====================================================
   بررسی آخر هفته
===================================================== */

function isWeekend(
    date = new Date()
) {

    const tehran =
        getTimeZoneParts(
            date,
            "Asia/Tehran"
        );


    const day =
        new Date(

            Date.UTC(

                tehran.year,

                tehran.month - 1,

                tehran.day

            )

        ).getUTCDay();


    return (
        day === 0 ||
        day === 6
    );

}


/* =====================================================
   سشن‌های فعال
===================================================== */

function getActiveSessions(
    now
) {

    /* -----------------------------------------------
       شنبه و یکشنبه:
       بازار تعطیل
    ----------------------------------------------- */

    if (
        isWeekend(now)
    ) {

        return [];

    }


    const activeSessions = [];


    tradingSessions.forEach(
        session => {

            const open =
                getLastSessionOpen(
                    now,
                    session
                );


            /*
               هر سشن از زمان باز شدن خودش
               تا قبل از شروع سشن بعدی فعال است.

               برای Session Map فقط سشن‌هایی را
               نمایش می‌دهیم که در وضعیت فعال
               معاملاتی قرار دارند.

               همپوشانی کاملاً مجاز است.
            */

            if (
                open <= now.getTime()
            ) {

                activeSessions.push(
                    session
                );

            }

        }
    );


    /*
       فقط چهار سشن آخرین چرخه را بررسی می‌کنیم.
       ترتیب زمانی برای مشخص کردن سشن جاری حفظ می‌شود.
    */

    return activeSessions;

}


/* =====================================================
   سشن اصلی برای نمایش ساعت
===================================================== */

function getPrimaryActiveSession(
    now
) {

    const active =
        getActiveSessions(
            now
        );


    if (
        active.length === 0
    ) {

        return null;

    }


    let primary =
        active[0];


    let latestOpen =
        -Infinity;


    active.forEach(
        session => {

            const open =
                getLastSessionOpen(
                    now,
                    session
                );


            if (
                open >
                latestOpen
            ) {

                latestOpen =
                    open;

                primary =
                    session;

            }

        }
    );


    return primary;

}


/* =====================================================
   سشن بعدی
===================================================== */

function getNextSession(
    now
) {

    let nextSession = null;

    let nextOpen =
        Infinity;


    tradingSessions.forEach(
        session => {

            const todayOpen =
                getSessionOpenTimestamp(
                    now,
                    session,
                    0
                );


            const tomorrowOpen =
                getSessionOpenTimestamp(
                    now,
                    session,
                    1
                );


            let candidate;


            if (
                todayOpen >
                now.getTime()
            ) {

                candidate =
                    todayOpen;

            } else {

                candidate =
                    tomorrowOpen;

            }


            if (
                candidate <
                nextOpen
            ) {

                nextOpen =
                    candidate;

                nextSession =
                    session;

            }

        }
    );


    return {

        session:
            nextSession,

        openTimestamp:
            nextOpen

    };

}


/* =====================================================
   نمایش ساعت محلی
===================================================== */

function getSessionTime(
    timeZone,
    date = new Date()
) {

    return new Intl.DateTimeFormat(
        "en-US",
        {

            timeZone: timeZone,

            hour: "2-digit",

            minute: "2-digit",

            second: "2-digit",

            hour12: true

        }
    ).format(date);

}


/* =====================================================
   تاریخ تهران
===================================================== */

function getTehranDate(
    date = new Date()
) {

    return new Intl.DateTimeFormat(
        "en-US",
        {

            timeZone: "Asia/Tehran",

            day: "2-digit",

            month: "short",

            year: "numeric"

        }
    ).format(date);

}


/* =====================================================
   آپدیت Session Map
===================================================== */

function updateSessionMap(
    now
) {

    const nodes = {

        sydney:
            document.getElementById(
                "session-sydney"
            ),

        tokyo:
            document.getElementById(
                "session-tokyo"
            ),

        london:
            document.getElementById(
                "session-london"
            ),

        newyork:
            document.getElementById(
                "session-newyork"
            )

    };


    /* -----------------------------------------------
       حذف Active قبلی
    ----------------------------------------------- */

    Object.values(nodes).forEach(
        node => {

            node.classList.remove(
                "active"
            );

        }
    );


    /* -----------------------------------------------
       آخر هفته
    ----------------------------------------------- */

    if (
        isWeekend(now)
    ) {

        sessionMap.classList.add(
            "weekend"
        );


        sessionActiveLabel.classList.add(
            "visible"
        );


        activeSessionText.innerText =
            "MARKET CLOSED";


        return;

    }


    sessionMap.classList.remove(
        "weekend"
    );


    /* -----------------------------------------------
       سشن‌های فعال
    ----------------------------------------------- */

    const active =
        getActiveSessions(
            now
        );


    active.forEach(
        session => {

            if (
                nodes[session.id]
            ) {

                nodes[
                    session.id
                ].classList.add(
                    "active"
                );

            }

        }
    );


    /* -----------------------------------------------
       نمایش Active
    ----------------------------------------------- */

    if (
        active.length > 0
    ) {

        sessionActiveLabel.classList.add(
            "visible"
        );


        activeSessionText.innerText =
            "ACTIVE";

    }

    else {

        sessionActiveLabel.classList.remove(
            "visible"
        );

    }

}


/* =====================================================
   آپدیت ساعت‌ها و Session Map
===================================================== */

function updateClocks() {

    const now =
        new Date();


    /* ================================================
       ساعت تهران
    ================================================ */

    tehranClockValue.innerText =
        getSessionTime(
            "Asia/Tehran",
            now
        );


    /* ================================================
       Session Map
    ================================================ */

    updateSessionMap(
        now
    );


    /* ================================================
       سشن اصلی
    ================================================ */

    const activeSession =
        getPrimaryActiveSession(
            now
        );


    /* ================================================
       آخر هفته
    ================================================ */

    if (
        !activeSession
    ) {

        sessionValue.innerText =
            "CLOSED";


        sessionClockLabel.innerText =
            "MARKET";


        sessionClockValue.innerText =
            "--:--:--";

    }

    else {

        /* --------------------------------------------
           نام سشن اصلی
        -------------------------------------------- */

        sessionValue.innerText =
            activeSession.name;


        /* --------------------------------------------
           نام کنار ساعت
        -------------------------------------------- */

        sessionClockLabel.innerText =
            activeSession.name.toUpperCase();


        /* --------------------------------------------
           ساعت سشن
        -------------------------------------------- */

        sessionClockValue.innerText =
            getSessionTime(
                activeSession.timeZone,
                now
            );

    }


    /* ================================================
       سشن بعدی
    ================================================ */

    const next =
        getNextSession(
            now
        );


    /* ================================================
       زمان تا شروع سشن بعدی
    ================================================ */

    const millisecondsUntilNext =
        next.openTimestamp -
        now.getTime();


    const minutesUntilNext =
        millisecondsUntilNext /
        (1000 * 60);


    /* ================================================
       پاک کردن هشدارها
    ================================================ */

    sessionValue.classList.remove(
        "session-warning"
    );


    sessionClockValue.classList.remove(
        "clock-warning"
    );


    /* ================================================
       هشدار نام سشن
       ۵ دقیقه قبل
    ================================================ */

    if (

        !isWeekend(now) &&

        minutesUntilNext <= 5 &&

        minutesUntilNext > 0

    ) {

        sessionValue.classList.add(
            "session-warning"
        );

    }


    /* ================================================
       هشدار ساعت سشن
       ۲ دقیقه قبل
    ================================================ */

    if (

        !isWeekend(now) &&

        minutesUntilNext <= 2 &&

        minutesUntilNext > 0

    ) {

        sessionClockValue.classList.add(
            "clock-warning"
        );

    }


    /* ================================================
       تاریخ تهران
    ================================================ */

    document.getElementById(
        "date-value"
    ).innerText =
        getTehranDate(
            now
        );

}


/* =====================================================
   اجرای ساعت
===================================================== */

setInterval(
    updateClocks,
    1000
);


updateClocks();


/* =====================================================
   SUBSCRIBE / LIKE
===================================================== */

const subscribeState =
    document.querySelector(
        ".subscribe-state"
    );


const likeState =
    document.querySelector(
        ".like-state"
    );


const likeIcon =
    document.querySelector(
        ".like-icon"
    );


setInterval(
    function () {


        /* =============================================
           SUBSCRIBE → LIKE
        ============================================= */

        if (

            subscribeState.style.display !==
            "none"

        ) {

            subscribeState.style.display =
                "none";


            likeState.style.display =
                "flex";


            likeIcon.classList.remove(
                "like-pulse"
            );


            void likeIcon.offsetWidth;


            likeIcon.classList.add(
                "like-pulse"
            );

        }


        /* =============================================
           LIKE → SUBSCRIBE
        ============================================= */

        else {

            likeState.style.display =
                "none";


            subscribeState.style.display =
                "flex";

        }

    },

    10000

);

</script>
