<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<title>FX LEVEL Overlay</title>

<style>

/* =====================================================
   صفحه اصلی
===================================================== */

html, body {

    width: 1920px;
    height: 1080px;

    margin: 0;
    padding: 0;

    overflow: hidden;

    background: #808080;

    font-family: Arial, sans-serif;

    color: white;
}


/* =====================================================
   شبکه پس‌زمینه
===================================================== */

body::before {

    content: "";

    position: absolute;

    inset: 0;

    background-image:

        linear-gradient(
            rgba(0,255,136,0.40) 1px,
            transparent 1px
        ),

        linear-gradient(
            90deg,
            rgba(0,255,136,0.40) 1px,
            transparent 1px
        );

    background-size: 40px 40px;

    pointer-events: none;
}


/* =====================================================
   فریم اصلی
===================================================== */

.main-frame {

    position: absolute;

    top: 40px;
    left: 40px;

    width: calc(100% - 80px);
    height: calc(100% - 80px);

    clip-path: polygon(

        25px 0,
        calc(100% - 25px) 0,
        100% 25px,
        100% calc(100% - 25px),
        calc(100% - 25px) 100%,
        25px 100%,
        0 calc(100% - 25px),
        0 25px

    );

    background: rgba(0, 0, 0, 0.18);

    border: 3px solid #00ff88;

    box-shadow:

        0 0 25px #00ff88,
        inset 0 0 25px #00ff88;
}


/* =====================================================
   نوار بالا
===================================================== */

.top-bar {

    position: absolute;

    top: 55px;
    left: 50%;

    transform: translateX(-50%);

    width: 86%;
    height: 90px;

    clip-path: polygon(

        18px 0,
        calc(100% - 18px) 0,
        100% 18px,
        100% 100%,
        0 100%,
        0 18px

    );

    background: rgba(0, 0, 0, 0.35);

    border: 2px solid #00ff88;

    box-shadow:

        0 0 14px #00ff88,
        inset 0 0 14px #00ff88;

    display: flex;

    justify-content: space-between;

    align-items: center;

    padding: 0 35px;

    box-sizing: border-box;
}


/* =====================================================
   آیتم‌های نوار بالا
===================================================== */

.top-item {

    flex: 1;

    display: flex;

    justify-content: center;
}


.item-row {

    display: flex;

    align-items: center;

    gap: 14px;
}


/* =====================================================
   آیکون‌های بالا
===================================================== */

.icon {

    width: 40px;
    height: 40px;

    stroke: #ffffff;

    fill: none;

    filter:
        drop-shadow(0 0 6px #00ff88);
}


/* =====================================================
   متن‌های بالا
===================================================== */

.text-box {

    display: flex;

    flex-direction: column;

    line-height: 1.1;
}


.text-box span:first-child {

    font-size: 14px;

    color: #ffae4a;

    text-shadow:
        0 0 6px #ffae4a;
}


.text-box span:last-child {

    font-size: 22px;

    font-weight: bold;

    color: #00ff88;

    text-shadow:
        0 0 8px #00ff88;
}


/* =====================================================
   هشدار نام سشن
===================================================== */

#session-value.session-warning {

    animation:
        sessionNameBlink 1s ease-in-out infinite;
}


@keyframes sessionNameBlink {

    0%, 100% {
        opacity: 1;
    }

    50% {
        opacity: 0.15;
    }
}


/* =====================================================
   هشدار ساعت سشن
===================================================== */

#newyork-value.clock-warning {

    animation:
        sessionClockBlink 0.65s ease-in-out infinite;
}


@keyframes sessionClockBlink {

    0%, 100% {
        opacity: 1;
    }

    50% {
        opacity: 0.10;
    }
}


/* =====================================================
   جداکننده
===================================================== */

.divider {

    width: 1px;

    height: 60%;

    background:
        rgba(255,255,255,0.35);
}


/* =====================================================
   وبکم
===================================================== */

.webcam-frame {

    position: absolute;

    bottom: 170px;
    left: 80px;

    width: 430px;
    height: 250px;

    border: 4px solid #00ff66;

    border-radius: 0;

    background:
        rgba(0, 0, 0, 0.18);

    box-shadow:

        0 0 25px rgba(0, 255, 102, 1),
        0 0 55px rgba(0, 255, 102, 0.85),
        0 0 110px rgba(0, 255, 102, 0.65),
        0 0 160px rgba(0, 255, 102, 0.45);
}


/* =====================================================
   NEWS
===================================================== */

#news-value {

    max-width: 310px;

    overflow: hidden;

    text-overflow: ellipsis;

    white-space: nowrap;

    transition:
        opacity 0.35s ease,
        transform 0.35s ease;
}


.news-normal {

    color: #00ff88 !important;

    text-shadow:
        0 0 8px #00ff88 !important;
}


.news-high {

    color: #ff3333 !important;

    text-shadow:
        0 0 10px #ff3333 !important;

        newsHighPulse 1.4s ease-in-out infinite;
}


.news-medium {

    color: #ffae4a !important;

    text-shadow:
        0 0 8px #ffae4a !important;
}


.news-low {

    color: #4da6ff !important;

    text-shadow:
        0 0 8px #4da6ff !important;
}


.news-holiday {

    color: #ffffff !important;

    text-shadow:
        0 0 8px #ffffff !important;
}


@keyframes newsHighPulse {

    0%, 100% {
        opacity: 1;
    }

    50% {
        opacity: 0.55;
    }
}


.news-switch-out {

    opacity: 0;

    transform: translateY(5px);
}


/* =====================================================
   نوار پایین
===================================================== */

.bottom-bar {

    position: absolute;

    bottom: 55px;
    left: 50%;

    transform: translateX(-50%);

    width: 86%;

/* =====================================================
   فونت نوار پایین
===================================================== */

.bottom-item span {

    font-size: 18px;

    align-items: center;

/* =====================================================
   آیتم‌های نوار پایین
===================================================== */

/* =====================================================
   رنگ متن
===================================================== */

    color: #4da6ff;

/* =====================================================
   آیکون‌های پایین
===================================================== */

.bottom-icon {

    width: 40px;
    height: 40px;

    stroke: #ffffff;

    fill: none;

    display: flex;

    align-items: center;

    flex-shrink: 0;

        drop-shadow(0 0 4px #ffb347);
}


/* =====================================================
   SUBSCRIBE / LIKE
===================================================== */

.subscribe {

    position: relative;

    width: 145px;
    min-width: 145px;
    max-width: 145px;

    height: 40px;

    flex-shrink: 0;
}


.promo-state {

    position: absolute;

    left: 0;
    top: 50%;

    transform: translateY(-50%);

    display: flex;

    align-items: center;

    gap: 10px;

    white-space: nowrap;
}


/* =====================================================
   SUBSCRIBE
===================================================== */

.subscribe-state span {

    font-family: Arial, sans-serif;

    font-size: 18px;

    font-weight: bold;

    color: #ff3333;

    text-shadow:
        0 0 5px rgba(255,51,51,0.55);
}


/* =====================================================
   زنگوله
===================================================== */

.bell-icon {

    stroke: #ff3333;

    filter:
        drop-shadow(0 0 4px #ff3333);

    transform-origin: 50% 15%;
}


.subscribe-state .bell-icon {

    animation:
        bellMiddle 10s ease-in-out infinite;
}


@keyframes bellMiddle {

    0% {
        transform: rotate(0deg);
    }

    45% {
        transform: rotate(0deg);
    }

    47% {
        transform: rotate(-6deg);
    }

    48.5% {
        transform: rotate(6deg);
    }

    50% {
        transform: rotate(-4deg);
    }

    51.5% {
        transform: rotate(0deg);
    }

    53% {
        transform: rotate(-6deg);
    }

    54.5% {
        transform: rotate(6deg);
    }

    56% {
        transform: rotate(-4deg);
    }

    57.5% {
        transform: rotate(0deg);
    }

    100% {
        transform: rotate(0deg);
    }
}


/* =====================================================
   LIKE
===================================================== */

.like-state {

    display: none;
}


.like-state span {

    font-family: Arial, sans-serif;

    font-size: 18px;

    font-weight: bold;

    color: #4da6ff;

    text-shadow:
        0 0 5px rgba(77,166,255,0.55);
}


.like-icon {

    stroke: #4da6ff;

    filter:
        drop-shadow(0 0 4px #4da6ff);

    transform-origin: center;
}


/* =====================================================
   انیمیشن LIKE
===================================================== */

.like-pulse {

    animation:
        likePulse 10s ease-in-out infinite;
}


@keyframes likePulse {

    0% {
        transform: scale(0.82);
    }

    8% {
        transform: scale(1.10);
    }

    15% {
        transform: scale(0.88);
    }

    22% {
        transform: scale(1.12);
    }

    29% {
        transform: scale(0.88);
    }

    38% {
        transform: scale(1);
    }

    100% {
        transform: scale(1);
    }
}


/* =====================================================
   VIP
===================================================== */

.vip {

    position: relative;

    overflow: hidden;

.vip span {

        vipPulse 1.8s infinite ease-in-out;

@keyframes vipPulse {

    }

    50% {

        text-shadow:
            0 0 18px #00ff88;
    }

    100% {

            0 0 6px #00ff88;
    }
}


/* =====================================================
   Shine
===================================================== */

.vip .shine {

    position: absolute;

    top: 0;
    left: -120%;

    width: 80%;
    height: 100%;

    background:

        linear-gradient(
            120deg,
            transparent,
            rgba(255,255,255,0.4),
            transparent
        );

    animation:
        shineSweep 3s infinite;
}


@keyframes shineSweep {

    0% {
        left: -120%;
    }

    50% {
        left: 120%;
    }

    100% {
        left: 120%;
    }
}

<script>

/* =====================================================
   SESSION SETTINGS
===================================================== */

const tradingSessions = [

    {
        name: "Sydney",
        timeZone: "Australia/Sydney",
        openHour: 8,
        openMinute: 0
    },

    {
        name: "Tokyo",
        timeZone: "Asia/Tokyo",
        openHour: 9,
        openMinute: 0
    },

    {
        name: "London",
        timeZone: "Europe/London",
        openHour: 8,
        openMinute: 0
    },

    {
        /*
         * NYSE / NASDAQ regular session
         * 09:30 New York time
         */

        name: "New York",
        timeZone: "America/New_York",
        openHour: 9,
        openMinute: 30
    }

];


/* =====================================================
   HTML ELEMENTS
===================================================== */

const sessionValue =
    document.getElementById(
        "session-value"
    );


const sessionClockLabel =
    document.getElementById(
        "session-clock-label"
    );


const sessionClockValue =
    document.getElementById(
        "newyork-value"
    );


const tehranClockValue =
    document.getElementById(
        "tehran-value"
    );


const newsValue =
    document.getElementById(
        "news-value"
    );


/* =====================================================
   TIMEZONE
===================================================== */

function getTimeZoneParts(
    date,
    timeZone
) {

    const parts =
        new Intl.DateTimeFormat(
            "en-US",
            {

                timeZone,

                year: "numeric",

                month: "2-digit",

                day: "2-digit",

                hour: "2-digit",

                minute: "2-digit",

                second: "2-digit",

                hourCycle: "h23"

            }
        ).formatToParts(date);


    const result = {};


    parts.forEach(
        part => {

            if (
                part.type !== "literal"
            ) {

                result[part.type] =
                    part.value;

            }

        }
    );


    return {

        year:
            parseInt(
                result.year,
                10
            ),

        month:
            parseInt(
                result.month,
                10
            ),

        day:
            parseInt(
                result.day,
                10
            ),

        hour:
            parseInt(
                result.hour,
                10
            ),

        minute:
            parseInt(
                result.minute,
                10
            ),

        second:
            parseInt(
                result.second,
                10
            )

    };

}


/* =====================================================
   TIMEZONE OFFSET
===================================================== */

function getTimeZoneOffset(
    date,
    timeZone
) {

    const parts =
        new Intl.DateTimeFormat(
            "en-US",
            {

                timeZone,

                year: "numeric",

                month: "2-digit",

                day: "2-digit",

                hour: "2-digit",

                minute: "2-digit",

                second: "2-digit",

                hourCycle: "h23"

            }
        ).formatToParts(date);


    const values = {};


    parts.forEach(
        part => {

            if (
                part.type !== "literal"
            ) {

                values[part.type] =
                    part.value;

            }

        }
    );


    const asUTC =
        Date.UTC(

            Number(values.year),

            Number(values.month) - 1,

            Number(values.day),

            Number(values.hour),

            Number(values.minute),

            Number(values.second)

        );


    return (
        asUTC -
        date.getTime()
    );

}


/* =====================================================
   SESSION OPEN TIMESTAMP
===================================================== */

function getSessionOpenTimestamp(
    date,
    session,
    dayOffset = 0
) {

    const localParts =
        getTimeZoneParts(
            date,
            session.timeZone
        );


    const localDate =
        new Date(

            Date.UTC(

                localParts.year,

                localParts.month - 1,

                localParts.day + dayOffset,

                session.openHour,

                session.openMinute,

                0

            )

        );


    const offset =
        getTimeZoneOffset(
            localDate,
            session.timeZone
        );


    return (
        localDate.getTime() -
        offset
    );

}


/* =====================================================
   LAST SESSION OPEN
===================================================== */

function getLastSessionOpen(
    now,
    session
) {

    const currentOpen =
        getSessionOpenTimestamp(
            now,
            session,
            0
        );


    if (
        currentOpen <=
        now.getTime()
    ) {

        return currentOpen;

    }


    return getSessionOpenTimestamp(
        now,
        session,
        -1
    );

}


/* =====================================================
   ACTIVE SESSION
===================================================== */

function getActiveSession(
    now
) {

    let activeSession =
        tradingSessions[
            tradingSessions.length - 1
        ];


    let latestOpen =
        -Infinity;


    tradingSessions.forEach(
        session => {

            const open =
                getLastSessionOpen(
                    now,
                    session
                );


            if (
                open >
                latestOpen
            ) {

                latestOpen =
                    open;

                activeSession =
                    session;

            }

        }
    );


    return {

        session:
            activeSession,

        openTimestamp:
            latestOpen

    };

}


/* =====================================================
   NEXT SESSION
===================================================== */

function getNextSession(
    now
) {

    let nextSession = null;

    let nextOpen =
        Infinity;


    tradingSessions.forEach(
        session => {

            const todayOpen =
                getSessionOpenTimestamp(
                    now,
                    session,
                    0
                );


            const tomorrowOpen =
                getSessionOpenTimestamp(
                    now,
                    session,
                    1
                );


            const candidate =
                todayOpen >
                now.getTime()

                    ? todayOpen
                    : tomorrowOpen;


            if (
                candidate <
                nextOpen
            ) {

                nextOpen =
                    candidate;

                nextSession =
                    session;

            }

        }
    );


    return {

        session:
            nextSession,

        openTimestamp:
            nextOpen

    };

}


/* =====================================================
   SESSION CLOCK
===================================================== */

function getSessionTime(
    timeZone,
    date = new Date()
) {

    return new Intl.DateTimeFormat(
        "en-US",
        {

            timeZone,

            hour: "2-digit",

            minute: "2-digit",

            second: "2-digit",

            hour12: true

        }
    ).format(date);

}


/* =====================================================
   TEHRAN DATE
===================================================== */

function getTehranDate(
    date = new Date()
) {

    return new Intl.DateTimeFormat(
        "en-US",
        {

            timeZone:
                "Asia/Tehran",

            day: "2-digit",

            month: "short",

            year: "numeric"

        }
    ).format(date);

}


/* =====================================================
   CLOCK UPDATE
===================================================== */

function updateClocks() {

    const now =
        new Date();


    tehranClockValue.innerText =
        getSessionTime(
            "Asia/Tehran",
            now
        );


    const active =
        getActiveSession(
            now
        );


    const next =
        getNextSession(
            now
        );


    const activeSession =
        active.session;


    sessionValue.innerText =
        activeSession.name;


    sessionClockLabel.innerText =
        activeSession.name.toUpperCase();


    sessionClockValue.innerText =
        getSessionTime(
            activeSession.timeZone,
            now
        );


    const millisecondsUntilNext =
        next.openTimestamp -
        now.getTime();


    const minutesUntilNext =
        millisecondsUntilNext /
        (1000 * 60);


    sessionValue.classList.remove(
        "session-warning"
    );


    sessionClockValue.classList.remove(
        "clock-warning"
    );


    if (

        minutesUntilNext <= 5 &&

        minutesUntilNext > 0

    ) {

        sessionValue.classList.add(
            "session-warning"
        );

    }


    if (

        minutesUntilNext <= 2 &&

        minutesUntilNext > 0

    ) {

        sessionClockValue.classList.add(
            "clock-warning"
        );

    }


    document.getElementById(
        "date-value"
    ).innerText =
        getTehranDate(
            now
        );

}


/* =====================================================
   RUN CLOCK
===================================================== */

setInterval(
    updateClocks,
    1000
);


updateClocks();


/* =====================================================
   FOREX FACTORY NEWS ENGINE
===================================================== */

/*
   Official Forex Factory weekly CSV export.

   Source:
   Forex Factory Calendar

   Data:
   - Currency
   - Impact
   - Event
   - Date
   - Time
   - Bank Holiday

   Refresh:
   Every 30 seconds
*/

const FOREX_FACTORY_CSV_URL =
    "https://www.forexfactory.com/calendar?export=csv&week=this";


/*
   اگر محیط OBS روی CORS محدودیت اعمال کند،
   این مقدار را می‌توان بعداً به یک Proxy اختصاصی
   تغییر داد.

   فعلاً منبع مستقیم Forex Factory است.
*/

const NEWS_PROXY = "";


/* =====================================================
   NEWS STATE
===================================================== */

let newsEvents = [];

let currentNewsIndex = 0;

let newsRotationTimer = null;

let newsRefreshTimer = null;

let lastNewsSignature = "";


/* =====================================================
   IMPACT SCORE
===================================================== */

function getImpactScore(
    impact
) {

    const value =
        String(
            impact || ""
        ).toLowerCase();


    if (
        value.includes("high")
    ) {

        return 3;

    }


    if (
        value.includes("medium") ||
        value.includes("med")
    ) {

        return 2;

    }


    if (
        value.includes("low")
    ) {

        return 1;

    }


    return 0;

}


/* =====================================================
   CLEAN TEXT
===================================================== */

function cleanText(
    value
) {

    return String(
        value || ""
    )

        .replace(
            /<[^>]*>/g,
            ""
        )

        .replace(
            /&amp;/g,
            "&"
        )

        .replace(
            /&quot;/g,
            '"'
        )

        .replace(
            /&#39;/g,
            "'"
        )

        .replace(
            /\s+/g,
            " "
        )

        .trim();

}


/* =====================================================
   CSV PARSER
===================================================== */

function parseCSV(
    text
) {

    const rows = [];

    let row = [];

    let value = "";

    let insideQuotes = false;


    for (
        let i = 0;
        i < text.length;
        i++
    ) {

        const char =
            text[i];


        const next =
            text[i + 1];


        if (
            char === '"' &&
            insideQuotes &&
            next === '"'
        ) {

            value += '"';

            i++;

            continue;

        }


        if (
            char === '"'
        ) {

            insideQuotes =
                !insideQuotes;

            continue;

        }


        if (
            char === "," &&
            !insideQuotes
        ) {

            row.push(value);

            value = "";

            continue;

        }


        if (
            (char === "\n" ||
             char === "\r") &&
            !insideQuotes
        ) {

            if (
                char === "\r" &&
                next === "\n"
            ) {

                i++;

            }


            row.push(value);

            value = "";


            if (
                row.some(
                    cell =>
                        cell.trim() !== ""
                )
            ) {

                rows.push(row);

            }


            row = [];

            continue;

        }


        value += char;

    }


    if (
        value.length > 0 ||
        row.length > 0
    ) {

        row.push(value);

        rows.push(row);

    }


    return rows;

}


/* =====================================================
   HEADER FINDER
===================================================== */

function findColumn(
    headers,
    names
) {

    const normalized =
        headers.map(
            header =>
                cleanText(header)
                    .toLowerCase()
        );


    for (
        const name of names
    ) {

        const index =
            normalized.indexOf(
                name.toLowerCase()
            );


        if (
            index !== -1
        ) {

            return index;

        }

    }


    return -1;

}


/* =====================================================
   DATE PARSER
===================================================== */

function parseForexFactoryDate(
    dateText,
    timeText
) {

    const date =
        cleanText(
            dateText
        );


    const time =
        cleanText(
            timeText
        );


    if (
        !date
    ) {

        return null;

    }


    /*
       CSV formats can vary.

       We first try native Date parsing.
    */

    const candidate =
        new Date(
            `${date} ${time}`
        );


    if (
        !isNaN(
            candidate.getTime()
        )
    ) {

        return candidate;

    }


    return null;

}


/* =====================================================
   SHORT NEWS TITLE
===================================================== */

function shortNewsTitle(
    title
) {

    let result =
        cleanText(
            title
        );


    const replacements = [

        [
            "Nonfarm Payrolls",
            "NFP"
        ],

        [
            "Non-Farm Employment Change",
            "NFP"
        ],

        [
            "Consumer Price Index",
            "CPI"
        ],

        [
            "Core Consumer Price Index",
            "CORE CPI"
        ],

        [
            "Producer Price Index",
            "PPI"
        ],

        [
            "Federal Funds Rate",
            "FED RATE"
        ],

        [
            "FOMC Statement",
            "FOMC"
        ],

        [
            "Interest Rate Decision",
            "RATE DECISION"
        ],

        [
            "Gross Domestic Product",
            "GDP"
        ],

        [
            "Retail Sales",
            "RETAIL SALES"
        ],

        [
            "Unemployment Rate",
            "UNEMPLOYMENT"
        ],

        [
            "Unemployment Claims",
            "JOBLESS CLAIMS"
        ],

        [
            "Average Hourly Earnings",
            "AVG HOURLY EARNINGS"
        ],

        [
            "Bank Holiday",
            "BANK HOLIDAY"
        ]

    ];


    replacements.forEach(
        pair => {

            result =
                result.replace(
                    new RegExp(
                        pair[0],
                        "gi"
                    ),
                    pair[1]
                );

        }
    );


    /*
       Remove unnecessary suffixes.
    */

    result =
        result

            .replace(
                /\s+y\/y/gi,
                ""
            )

            .replace(
                /\s+m\/m/gi,
                ""
            )

            .replace(
                /\s+q\/q/gi,
                ""
            )

            .trim();


    /*
       Maximum length for Overlay.
    */

    if (
        result.length > 28
    ) {

        result =
            result.slice(
                0,
                28
            ) + "...";

    }


    return result;

}


/* =====================================================
   BANK HOLIDAY DETECTION
===================================================== */

function isBankHoliday(
    title
) {

    return /bank holiday/i.test(
        title
    );

}


/* =====================================================
   NEWS FORMAT
===================================================== */

function formatNewsEvent(
    event
) {

    if (
        event.isHoliday
    ) {

        return (
            "🏦 " +
            event.currency +
            " | " +
            event.shortTitle
        );

    }


    let icon =
        "🟡";


    if (
        event.impactScore === 3
    ) {

        icon = "🔴";

    }

    else if (
        event.impactScore === 2
    ) {

        icon = "🟠";

    }


    return (
        icon +
        " " +
        event.currency +
        " | " +
        event.shortTitle
    );

}


/* =====================================================
   SORT NEWS
===================================================== */

function sortNewsEvents(
    events
) {

    return events.sort(
        (
            a,
            b
        ) => {

            /*
               Time first.

               For identical/similar times,
               High Impact comes first.
            */

            const timeDifference =
                a.timestamp -
                b.timestamp;


            if (
                Math.abs(
                    timeDifference
                ) > 60 * 1000
            ) {

                return timeDifference;

            }


            /*
               Economic news has priority
               over Bank Holiday.
            */

            if (
                a.isHoliday !==
                b.isHoliday
            ) {

                return a.isHoliday
                    ? 1
                    : -1;

            }


            /*
               Impact priority.
            */

            return (
                b.impactScore -
                a.impactScore
            );

        }
    );

}


/* =====================================================
   LOAD FOREX FACTORY
===================================================== */

async function loadForexFactoryNews() {

    try {

        const requestUrl =
            NEWS_PROXY

                ? NEWS_PROXY +
                  encodeURIComponent(
                      FOREX_FACTORY_CSV_URL
                  )

                : FOREX_FACTORY_CSV_URL;


        const response =
            await fetch(
                requestUrl,
                {
                    cache: "no-store"
                }
            );


        if (
            !response.ok
        ) {

            throw new Error(
                "Forex Factory request failed"
            );

        }


        const csv =
            await response.text();


        if (
            !csv ||
            csv.length < 20
        ) {

            throw new Error(
                "Empty Forex Factory data"
            );

        }


        const rows =
            parseCSV(
                csv
            );


        if (
            rows.length < 2
        ) {

            throw new Error(
                "Invalid CSV"
            );

        }


        const headers =
            rows[0];


        const dateIndex =
            findColumn(
                headers,
                [
                    "date"
                ]
            );


        const timeIndex =
            findColumn(
                headers,
                [
                    "time"
                ]
            );


        const currencyIndex =
            findColumn(
                headers,
                [
                    "currency"
                ]
            );


        const impactIndex =
            findColumn(
                headers,
                [
                    "impact"
                ]
            );


        const eventIndex =
            findColumn(
                headers,
                [
                    "event"
                ]
            );


        /*
           If the CSV column names are not recognized,
           stop safely.
        */

        if (
            dateIndex === -1 ||
            currencyIndex === -1 ||
            eventIndex === -1
        ) {

            throw new Error(
                "Forex Factory CSV columns not recognized"
            );

        }


        const parsedEvents = [];


        for (
            let i = 1;
            i < rows.length;
            i++
        ) {

            const row =
                rows[i];


            const dateText =
                row[dateIndex] || "";


            const timeText =
                timeIndex !== -1
                    ? row[timeIndex]
                    : "";


            const currency =
                cleanText(
                    row[currencyIndex]
                );


            const impact =
                impactIndex !== -1
                    ? cleanText(
                        row[impactIndex]
                    )
                    : "";


            const eventName =
                cleanText(
                    row[eventIndex]
                );


            if (
                !eventName
            ) {

                continue;

            }


            const timestamp =
                parseForexFactoryDate(
                    dateText,
                    timeText
                );


            if (
                !timestamp
            ) {

                continue;

            }


            const isHoliday =
                isBankHoliday(
                    eventName
                );


            const impactScore =
                getImpactScore(
                    impact
                );


            /*
               Economic events:
               include all impact levels.

               Bank Holidays:
               always include.
            */

            const event = {

                timestamp:
                    timestamp.getTime(),

                currency:
                    currency || "ALL",

                impact:
                    impact,

                impactScore:
                    impactScore,

                title:
                    eventName,

                shortTitle:
                    shortNewsTitle(
                        eventName
                    ),

                isHoliday:
                    isHoliday

            };


            parsedEvents.push(
                event
            );

        }


        const now =
            Date.now();


        /*
           Keep recent events and upcoming events.

           Recent events are kept for a short time
           so a live result does not disappear
           immediately after publication.
        */

        const minimumTimestamp =
            now -
            (15 * 60 * 1000);


        const maximumTimestamp =
            now +
            (7 * 24 * 60 * 60 * 1000);


        const filteredEvents =
            parsedEvents.filter(
                event =>

                    event.timestamp >=
                    minimumTimestamp &&

                    event.timestamp <=
                    maximumTimestamp

            );


        const sortedEvents =
            sortNewsEvents(
                filteredEvents
            );


        if (
            sortedEvents.length === 0
        ) {

            showNewsOffline(
                "NO NEWS"
            );

            return;

        }


        const signature =
            sortedEvents
                .map(
                    event =>
                        event.timestamp +
                        "|" +
                        event.currency +
                        "|" +
                        event.title
                )
                .join(
                    "||"
                );


        /*
           Only reset the rotation when
           the actual news list changed.
        */

        if (
            signature !==
            lastNewsSignature
        ) {

            lastNewsSignature =
                signature;


            newsEvents =
                sortedEvents;


            currentNewsIndex = 0;


            startNewsRotation();

        }

        else {

            newsEvents =
                sortedEvents;

        }


    }

    catch (
        error
    ) {

        console.warn(
            "Forex Factory News:",
            error
        );


        /*
           Do not destroy the last valid news.

           Only show OFFLINE if we have
           never successfully loaded news.
        */

        if (
            newsEvents.length === 0
        ) {

            showNewsOffline(
                "NEWS OFFLINE"
            );

        }

    }

}


/* =====================================================
   SHOW NEWS
===================================================== */

function showNewsEvent(
    event
) {

    if (
        !event
    ) {

        return;

    }


    newsValue.classList.add(
        "news-switch-out"
    );


    setTimeout(
        function () {

            newsValue.innerText =
                formatNewsEvent(
                    event
                );


            newsValue.classList.remove(
                "news-high",
                "news-medium",
                "news-low",
                "news-holiday",
                "news-normal"
            );


            if (
                event.isHoliday
            ) {

                newsValue.classList.add(
                    "news-holiday"
                );

            }

            else if (
                event.impactScore === 3
            ) {

                newsValue.classList.add(
                    "news-high"
                );

            }

            else if (
                event.impactScore === 2
            ) {

                newsValue.classList.add(
                    "news-medium"
                );

            }

            else if (
                event.impactScore === 1
            ) {

                newsValue.classList.add(
                    "news-low"
                );

            }

            else {

                newsValue.classList.add(
                    "news-normal"
                );

            }


            newsValue.classList.remove(
                "news-switch-out"
            );

        },

        300

    );

}


/* =====================================================
   NEWS OFFLINE
===================================================== */

function showNewsOffline(
    message
) {

    newsValue.classList.remove(
        "news-high",
        "news-medium",
        "news-low",
        "news-holiday"
    );


    newsValue.classList.add(
        "news-normal"
    );


    newsValue.innerText =
        "📰 " +
        message;

}


/* =====================================================
   START NEWS ROTATION
===================================================== */

function startNewsRotation() {

    if (
        newsRotationTimer
    ) {

        clearInterval(
            newsRotationTimer
        );

    }


    if (
        newsEvents.length === 0
    ) {

        showNewsOffline(
            "NO NEWS"
        );

        return;

    }


    /*
       Show first news immediately.
    */

    showNewsEvent(
        newsEvents[
            currentNewsIndex
        ]
    );


    /*
       Every 60 seconds move
       to the next event.
    */

    newsRotationTimer =
        setInterval(

            function () {

                if (
                    newsEvents.length === 0
                ) {

                    return;

                }


                currentNewsIndex++;


                if (
                    currentNewsIndex >=
                    newsEvents.length
                ) {

                    currentNewsIndex = 0;

                }


                showNewsEvent(
                    newsEvents[
                        currentNewsIndex
                    ]
                );

            },

            60000

        );

}


/* =====================================================
   NEWS REFRESH
===================================================== */

loadForexFactoryNews();


newsRefreshTimer =
    setInterval(

        function () {

            loadForexFactoryNews();

        },

        30000

    );


/* =====================================================
   SUBSCRIBE / LIKE
===================================================== */

const subscribeState =
    document.querySelector(
        ".subscribe-state"
    );


const likeState =
    document.querySelector(
        ".like-state"
    );


const likeIcon =
    document.querySelector(
        ".like-icon"
    );


setInterval(

    function () {


        if (
            subscribeState.style.display !==
            "none"
        ) {

            subscribeState.style.display =
                "none";


            likeState.style.display =
                "flex";


            likeIcon.classList.remove(
                "like-pulse"
            );


            void likeIcon.offsetWidth;


            likeIcon.classList.add(
                "like-pulse"
            );

        }

        else {

            likeState.style.display =
                "none";


            subscribeState.style.display =
                "flex";

        }

    },

    10000

);

</script>
