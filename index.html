<script>

/* =====================================================
   تنظیمات سشن‌ها
===================================================== */

const tradingSessions = [

    {
        name: "Sydney",
        timeZone: "Australia/Sydney",
        openHour: 8,
        openMinute: 0
    },

    {
        name: "Tokyo",
        timeZone: "Asia/Tokyo",
        openHour: 9,
        openMinute: 0
    },

    {
        name: "London",
        timeZone: "Europe/London",
        openHour: 8,
        openMinute: 0
    },

    {
        name: "New York",
        timeZone: "America/New_York",
        openHour: 8,
        openMinute: 0
    }

];


/* =====================================================
   عناصر HTML
===================================================== */

const sessionValue =
    document.getElementById(
        "session-value"
    );


const sessionClockLabel =
    document.getElementById(
        "session-clock-label"
    );


const sessionClockValue =
    document.getElementById(
        "newyork-value"
    );


const tehranClockValue =
    document.getElementById(
        "tehran-value"
    );


/* =====================================================
   گرفتن اجزای زمان در Time Zone
===================================================== */

function getTimeZoneParts(
    date,
    timeZone
) {

    const parts =
        new Intl.DateTimeFormat(
            "en-US",
            {
                timeZone: timeZone,

                year: "numeric",

                month: "2-digit",

                day: "2-digit",

                hour: "2-digit",

                minute: "2-digit",

                second: "2-digit",

                hourCycle: "h23"
            }
        ).formatToParts(date);


    const result = {};


    parts.forEach(
        part => {

            if (
                part.type !== "literal"
            ) {

                result[part.type] =
                    part.value;

            }

        }
    );


    return {

        year:
            parseInt(
                result.year,
                10
            ),

        month:
            parseInt(
                result.month,
                10
            ),

        day:
            parseInt(
                result.day,
                10
            ),

        hour:
            parseInt(
                result.hour,
                10
            ),

        minute:
            parseInt(
                result.minute,
                10
            ),

        second:
            parseInt(
                result.second,
                10
            )

    };

}


/* =====================================================
   Offset واقعی Time Zone
===================================================== */

function getTimeZoneOffset(
    date,
    timeZone
) {

    const parts =
        new Intl.DateTimeFormat(
            "en-US",
            {
                timeZone: timeZone,

                year: "numeric",

                month: "2-digit",

                day: "2-digit",

                hour: "2-digit",

                minute: "2-digit",

                second: "2-digit",

                hourCycle: "h23"
            }
        ).formatToParts(date);


    const values = {};


    parts.forEach(
        part => {

            if (
                part.type !== "literal"
            ) {

                values[part.type] =
                    part.value;

            }

        }
    );


    const asUTC =
        Date.UTC(
            Number(values.year),
            Number(values.month) - 1,
            Number(values.day),
            Number(values.hour),
            Number(values.minute),
            Number(values.second)
        );


    return (
        asUTC -
        date.getTime()
    );

}


/* =====================================================
   Timestamp شروع سشن
===================================================== */

function getSessionOpenTimestamp(
    date,
    session,
    dayOffset = 0
) {

    const localParts =
        getTimeZoneParts(
            date,
            session.timeZone
        );


    const localDate =
        new Date(
            Date.UTC(
                localParts.year,
                localParts.month - 1,
                localParts.day + dayOffset,
                session.openHour,
                session.openMinute,
                0
            )
        );


    const offset =
        getTimeZoneOffset(
            localDate,
            session.timeZone
        );


    return (
        localDate.getTime() -
        offset
    );

}


/* =====================================================
   آخرین شروع سشن
===================================================== */

function getLastSessionOpen(
    now,
    session
) {

    const currentOpen =
        getSessionOpenTimestamp(
            now,
            session,
            0
        );


    if (
        currentOpen <=
        now.getTime()
    ) {

        return currentOpen;

    }


    return getSessionOpenTimestamp(
        now,
        session,
        -1
    );

}


/* =====================================================
   سشن فعال
===================================================== */

function getActiveSession(
    now
) {

    let activeSession =
        tradingSessions[
            tradingSessions.length - 1
        ];


    let latestOpen =
        -Infinity;


    tradingSessions.forEach(
        session => {

            const open =
                getLastSessionOpen(
                    now,
                    session
                );


            if (
                open >
                latestOpen
            ) {

                latestOpen =
                    open;

                activeSession =
                    session;

            }

        }
    );


    return {

        session:
            activeSession,

        openTimestamp:
            latestOpen

    };

}


/* =====================================================
   سشن بعدی
===================================================== */

function getNextSession(
    now
) {

    let nextSession = null;

    let nextOpen =
        Infinity;


    tradingSessions.forEach(
        session => {

            const todayOpen =
                getSessionOpenTimestamp(
                    now,
                    session,
                    0
                );


            const tomorrowOpen =
                getSessionOpenTimestamp(
                    now,
                    session,
                    1
                );


            let candidate;


            if (
                todayOpen >
                now.getTime()
            ) {

                candidate =
                    todayOpen;

            } else {

                candidate =
                    tomorrowOpen;

            }


            if (
                candidate <
                nextOpen
            ) {

                nextOpen =
                    candidate;

                nextSession =
                    session;

            }

        }
    );


    return {

        session:
            nextSession,

        openTimestamp:
            nextOpen

    };

}

function getSessionTime(

    date = new Date()
) {

    return new Intl.DateTimeFormat(
        "en-US",
        {
            timeZone: timeZone,

            hour: "2-digit",

            minute: "2-digit",

            hour12: true
        }
    ).format(date);

}

    */

    sessionClockValue.innerText =

        );


    const millisecondsUntilNext =

    /*

    /*

    if (
        minutesUntilNext <= 2 &&

        );

/* =====================================================
   Impact
===================================================== */

function getImpactLevel(
    event
) {

    const impact =
        String(
            event.impact ||
            event.Impact ||
            event.impactTitle ||
            event.ImpactTitle ||
            ""
        ).toLowerCase();


    if (
        impact.includes("high") ||
        impact.includes("red")
    ) {

        return 3;

    }


    if (
        impact.includes("medium") ||
        impact.includes("med") ||
        impact.includes("orange")
    ) {

        return 2;

    }


    if (
        impact.includes("low") ||
        impact.includes("yellow")
    ) {

        return 1;

    }


    const title =
        String(
            event.title ||
            event.event ||
            event.name ||
            ""
        ).toLowerCase();


    if (
        title.includes("bank holiday") ||
        title.includes("holiday")
    ) {

        return 0;

    }


    return 1;

}


/* =====================================================
   تشخیص Bank Holiday
===================================================== */

function isBankHoliday(
    event
) {

    const title =
        String(
            event.title ||
            event.event ||
            event.name ||
            event.Event ||
            ""
        ).toLowerCase();


    const type =
        String(
            event.type ||
            event.eventType ||
            ""
        ).toLowerCase();


    return (
        title.includes("bank holiday") ||
        type.includes("holiday")
    );

}


/* =====================================================

function getNewsCurrency(

    ).toUpperCase();

/* =====================================================

function getNewsTitle(

/* =====================================================
   کوتاه کردن عنوان خبر
===================================================== */

function shortenNewsTitle(
    title
) {

    let shortTitle =
        String(title)
            .replace(
                /\s+/g,
                " "
            )
            .trim();


    /*
       عناوین مهم با نام کوتاه‌تر
    */

    const replacements = [

        [
            "Non-Farm Payrolls",
            "NFP"
        ],

        [
            "Nonfarm Payrolls",
            "NFP"
        ],

        [
            "Consumer Price Index",
            "CPI"
        ],

        [
            "Producer Price Index",
            "PPI"
        ],

        [
            "Gross Domestic Product",
            "GDP"
        ],

        [
            "Purchasing Managers Index",
            "PMI"
        ],

        [
            "Manufacturing PMI",
            "Mfg PMI"
        ],

        [
            "Services PMI",
            "Services PMI"
        ],

        [
            "Interest Rate Decision",
            "Rate Decision"
        ],

        [
            "Unemployment Rate",
            "Unemployment"
        ],

        [
            "Employment Change",
            "Employment"
        ],

        [
            "Retail Sales",
            "Retail Sales"
        ],

        [
            "Consumer Confidence",
            "Consumer Confidence"
        ],

        [
            "Bank Holiday",
            "Bank Holiday"
        ],

        [
            "Central Bank",
            "Central Bank"
        ]

    ];


    replacements.forEach(
        pair => {

            shortTitle =
                shortTitle.replace(
                    new RegExp(
                        pair[0],
                        "gi"
                    ),
                    pair[1]
                );

        }
    );


    /*
       حذف عبارت‌های اضافی رایج
    */

    shortTitle =
        shortTitle
            .replace(
                /\s*\(.*?\)\s*/g,
                " "
            )
            .replace(
                /\s+/g,
                " "
            )
            .trim();


    /*
       محدودیت نهایی برای جلوگیری از
       بزرگ شدن کادر NEWS
    */

    if (
        shortTitle.length > 24
    ) {

        shortTitle =
            shortTitle.substring(
                0,
                24
            ).trim();

    }


    return shortTitle;

}


/* =====================================================
   گرفتن زمان Event
===================================================== */

function getEventTimestamp(
    event
) {

    const candidates = [

        event.timestamp,

        event.Timestamp,

        event.date,

        event.Date,

        event.datetime,

        event.datetimeUTC,

        event.dateUtc,

        event.time

    ];


    for (
        const value of candidates
    ) {

        if (
            value === undefined ||
            value === null ||
            value === ""
        ) {

            continue;

        }


        if (
            typeof value === "number"
        ) {

            /*
               پشتیبانی از timestamp ثانیه‌ای
               و timestamp میلی‌ثانیه‌ای
            */

            return (
                value < 10000000000
                    ? value * 1000
                    : value
            );

        }


        const parsed =
            Date.parse(
                value
            );


        if (
            !Number.isNaN(parsed)
        ) {

            return parsed;

        }

    }


    return Date.now();

}


/* =====================================================
   تبدیل داده‌های مختلف JSON
===================================================== */

function normalizeForexFactoryData(
    data
) {

    let rawEvents = [];


    if (
        Array.isArray(data)
    ) {

        rawEvents =
            data;

    }

    else if (
        Array.isArray(data.events)
    ) {

        rawEvents =
            data.events;

    }

    else if (
        Array.isArray(data.calendar)
    ) {

        rawEvents =
            data.calendar;

    }

    else if (
        Array.isArray(data.data)
    ) {

        rawEvents =
            data.data;

    }


    return rawEvents
        .map(
            (event, index) => {

                const currency =
                    getNewsCurrency(
                        event
                    );


                const title =
                    getNewsTitle(
                        event
                    );


                const holiday =
                    isBankHoliday(
                        event
                    );


                let impact =
                    getImpactLevel(
                        event
                    );


                if (
                    holiday
                ) {

                    impact = 0;

                }


                return {

                    id:
                        String(
                            event.id ||
                            event.Id ||
                            (
                                currency +
                                "|" +
                                title +
                                "|" +
                                getEventTimestamp(event) +
                                "|" +
                                index
                            )
                        ),

                    currency:
                        currency,

                    title:
                        shortenNewsTitle(
                            title
                        ),

                    fullTitle:
                        title,

                    impact:
                        impact,

                    timestamp:
                        getEventTimestamp(
                            event
                        )

                };

            }
        )
        .filter(
            event => {

                return (
                    event.currency &&
                    event.title
                );

            }
        );

}


/* =====================================================
   دریافت تقویم Forex Factory
===================================================== */

async function fetchForexFactoryNews() {

    try {

        const directUrl =
            FOREX_FACTORY_URL;


        let response;


        try {

            response =
                await fetch(
                    directUrl,
                    {
                        cache: "no-store"
                    }
                );

        }

        catch (
            directError
        ) {

            response =
                await fetch(
                    FOREX_FACTORY_PROXY +
                    encodeURIComponent(
                        directUrl
                    ),
                    {
                        cache: "no-store"
                    }
                );

        }


        if (
            !response.ok
        ) {

            throw new Error(
                "Forex Factory request failed"
            );

        }


        const data =
            await response.json();


        const normalized =
            normalizeForexFactoryData(
                data
            );


        if (
            normalized.length === 0
        ) {

            throw new Error(
                "No Forex Factory events found"
            );

        }


        newsEvents =
            normalized
                .sort(
                    (a, b) => {

                        return (
                            a.timestamp -
                            b.timestamp
                        );

                    }
                );


        lastNewsFetch =
            Date.now();


        updateNewsQueue();


    }

    catch (
        error
    ) {

        if (
            newsEvents.length === 0
        ) {

            const newsElement =
                document.getElementById(
                    "news-value"
                );


            newsElement.innerText =
                "Waiting...";

        }

    }

}

function getNewsHourKey(

) {

/* =====================================================
   آپدیت صف خبر
===================================================== */

function updateNewsQueue() {

    const now =
        Date.now();


    /*
       خبرهایی که حداکثر 15 دقیقه از زمانشان گذشته
       یا تا 1 دقیقه آینده هستند.
    */

    const candidates =
        newsEvents.filter(
            event => {

                const age =
                    now -
                    event.timestamp;


                return (
                    age >= -60000 &&
                    age <= 15 * 60 * 1000
                );

            }
        );


    candidates.forEach(
        event => {

            const id =
                getNewsUniqueId(
                    event
                );


            const alreadyQueued =
                newsQueue.some(
                    item =>
                        getNewsUniqueId(item) === id
                );


            const isCurrent =
                currentNews &&
                getNewsUniqueId(
                    currentNews
                ) === id;


            if (
                !alreadyQueued &&
                !isCurrent
            ) {

                newsQueue.push(
                    event
                );

            }

        }
    );


    /*
       اولویت:
       1. High / قرمز
       2. Medium / نارنجی
       3. Low / زرد
       4. Holiday / طوسی

       اگر Impact یکسان باشد:
       زمان زودتر اول نمایش داده می‌شود.
    */

    newsQueue.sort(
        (a, b) => {

            if (
                a.impact !==
                b.impact
            ) {

                return (
                    b.impact -
                    a.impact
                );

            }


            return (
                a.timestamp -
                b.timestamp
            );

        }
    );


    if (
        !currentNews
    ) {

        showNextNews();

    }

}

/* =====================================================
   نمایش خبر بعدی
===================================================== */

function showNextNews() {

    clearTimeout(
        newsDisplayTimer
    );


    currentNews = null;


    if (
        newsQueue.length === 0
    ) {

        updateNewsQueue();

    }


    if (
        newsQueue.length === 0
    ) {

        const element =
            document.getElementById(
                "news-value"
            );


        element.innerText =
            "No major news";


        element.classList.remove(
            "news-high",
            "news-medium",
            "news-low",
            "news-holiday"
        );


        return;

    }


    /*
       خبر مهم‌تر همیشه اول انتخاب می‌شود.
       اگر دو خبر قرمز وجود داشته باشد،
       هر دو جداگانه نمایش داده می‌شوند.
    */

    currentNews =
        newsQueue.shift();


    displayNews(
        currentNews
    );


    /*
       هر خبر دقیقاً 1 دقیقه نمایش داده می‌شود.
    */

    newsDisplayTimer =
        setTimeout(
            function () {

                currentNews =
                    null;


                updateNewsQueue();


                if (
                    !currentNews
                ) {

                    showNextNews();

                }

            },
            60000
        );

}
