<style>

/* =====================================================
   SESSION - هماهنگ سازی کامل با TOP BAR
===================================================== */

.session-map {

    flex: 1;

    min-width: 0;

    display: flex;

    justify-content: center;

    align-items: center;

    position: relative;

    /*
       سشن کمی پایین‌تر از مرکز قرار می‌گیرد
    */
    transform: translateY(5px);
}


.session-map-inner {

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    width: 100%;

    position: relative;

    /*
       ارتفاع کنترل شده برای جلوگیری از شلوغی
    */
    transform: translateY(2px);
}


/* =====================================================
   عنوان SESSION
===================================================== */

.session-map-title {

    font-family: Arial, sans-serif;

    font-size: 13px;

    font-weight: 700;

    letter-spacing: 3px;

    line-height: 16px;

    height: 16px;

    color: #ffae4a;

    text-shadow:

        0 0 6px #ffae4a,
        0 0 14px rgba(255,174,74,0.35);

    margin-bottom: 9px;

    position: relative;
}


/* =====================================================
   مپ سشن
===================================================== */

.session-track {

    display: flex;

    align-items: center;

    justify-content: center;

    /*
       فاصله بیشتر بین سشن‌ها
    */
    gap: 22px;

    height: 27px;

    position: relative;

    white-space: nowrap;
}


/* =====================================================
   Session Node
===================================================== */

.session-node {

    display: flex;

    align-items: center;

    gap: 8px;

    position: relative;

    font-family: Arial, sans-serif;

    /*
       بولد و یکدست با سایر متن‌های TOP BAR
    */
    font-size: 15px;

    font-weight: 700;

    letter-spacing: 1px;

    color: rgba(255,255,255,0.42);

    transition:

        color 0.35s ease,

        text-shadow 0.35s ease,

        opacity 0.35s ease;
}


/* =====================================================
   نام سشن
===================================================== */

.session-name {

    position: relative;

    z-index: 3;

    font-family: Arial, sans-serif;

    font-size: 15px;

    font-weight: 700;

    line-height: 18px;

    transition:

        color 0.35s ease,

        text-shadow 0.35s ease;
}


/* =====================================================
   DOT
===================================================== */

.session-dot {

    width: 7px;

    height: 7px;

    flex: 0 0 7px;

    border-radius: 50%;

    background: rgba(255,255,255,0.25);

    box-shadow:

        0 0 2px rgba(255,255,255,0.15);

    position: relative;

    z-index: 3;

    transition:

        background 0.35s ease,

        box-shadow 0.35s ease,

        transform 0.35s ease;
}


/* =====================================================
   خط اتصال بین سشن‌ها
===================================================== */

.session-connector {

    width: 28px;

    height: 2px;

    flex: 0 0 28px;

    background:
        rgba(255,255,255,0.18);

    box-shadow:

        0 0 4px rgba(0,255,136,0.18),
        0 0 8px rgba(0,255,136,0.08);

    position: relative;

    overflow: hidden;
}


/* خط سبز متحرک */

.session-map.has-active
.session-connector::after {

    content: "";

    position: absolute;

    top: 0;

    left: -100%;

    width: 60%;

    height: 100%;

    background:

        linear-gradient(
            90deg,
            transparent,
            rgba(0,255,136,0.95),
            transparent
        );

    animation:
        connectorSweep 3.2s ease-in-out infinite;

    opacity: 1;
}


/* =====================================================
   ACTIVE
===================================================== */

.session-node.active {

    color: #00ff88;

    font-weight: 700;

    text-shadow:

        0 0 5px #00ff88,
        0 0 12px rgba(0,255,136,0.8);
}


.session-node.active .session-name {

    color: #00ff88;

    font-weight: 700;

    text-shadow:

        0 0 5px #00ff88,
        0 0 12px rgba(0,255,136,0.8);
}


/* =====================================================
   ACTIVE LABEL
===================================================== */

.session-active-label {

    position: relative;

    height: 15px;

    margin-top: 2px;

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 5px;

    font-family: Arial, sans-serif;

    /*
       کوچک‌تر و هماهنگ‌تر
    */
    font-size: 9px;

    font-weight: 700;

    letter-spacing: 1.8px;

    color: #00ff88;

    text-shadow:

        0 0 6px #00ff88,
        0 0 14px rgba(0,255,136,0.45);

    opacity: 0;

    transition:
        opacity 0.35s ease;
}


.session-active-label.visible {

    opacity: 1;
}


.active-arrow {

    display: inline-block;

    font-size: 10px;

    animation:
        activeArrowFloat 1s ease-in-out infinite;
}


/* =====================================================
   SESSION TIMER
===================================================== */

.session-timer {

    height: 15px;

    margin-top: 2px;

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 6px;

    font-family: Arial, sans-serif;

    font-size: 9px;

    font-weight: 700;

    letter-spacing: 1.2px;

    white-space: nowrap;

    color: #00ff88;

    text-shadow:

        0 0 5px #00ff88,
        0 0 10px rgba(0,255,136,0.45);

    opacity: 0;

    transition:
        opacity 0.3s ease;
}


.session-timer.visible {

    opacity: 1;
}


.timer-name {

    color: #ffae4a;

    text-shadow:
        0 0 5px #ffae4a;
}


.timer-count {

    font-variant-numeric:
        tabular-nums;

    letter-spacing: 1.3px;
}


/* =====================================================
   DATE
   اطمینان از اینکه تاریخ حتماً دیده شود
===================================================== */

#date-value {

    display: flex !important;

    align-items: center;

    height: 24px;

    min-height: 24px;

    visibility: visible !important;

    opacity: 1 !important;

    color: #00ff88 !important;

    font-family: Arial, sans-serif !important;

    font-size: 22px !important;

    font-weight: 700 !important;

    line-height: 24px !important;

    white-space: nowrap;

    font-variant-numeric: tabular-nums;

    text-shadow:
        0 0 8px #00ff88;
}


/* =====================================================
   سایر متن‌های TOP BAR
   یکدست سازی
===================================================== */

.top-item .text-box span:first-child {

    font-family: Arial, sans-serif;

    font-weight: 700;
}


.top-item .text-box span:last-child {

    font-family: Arial, sans-serif;

    font-weight: 700;
}


/* =====================================================
   ANIMATION
===================================================== */

@keyframes connectorSweep {

    0% {
        left: -100%;
    }

    55% {
        left: 130%;
    }

    100% {
        left: 130%;
    }
}


@keyframes activeArrowFloat {

    0%,
    100% {
        transform:
            translateY(2px);
    }

    50% {
        transform:
            translateY(-1px);
    }
}

</style>
