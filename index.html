<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<title>FX LEVEL Overlay</title>

<style>

/* =====================================================
   PAGE
===================================================== */

html, body {

    width: 1920px;
    height: 1080px;

    margin: 0;
    padding: 0;

    overflow: hidden;

    background: #808080;

    font-family: Arial, sans-serif;

    color: white;
}


/* =====================================================
   BACKGROUND GRID
===================================================== */

body::before {

    content: "";

    position: absolute;

    inset: 0;

    background-image:

        linear-gradient(
            rgba(0,255,136,0.40) 1px,
            transparent 1px
        ),

        linear-gradient(
            90deg,
            rgba(0,255,136,0.40) 1px,
            transparent 1px
        );

    background-size: 40px 40px;

    pointer-events: none;
}


/* =====================================================
   MAIN FRAME
===================================================== */

.main-frame {

    position: absolute;

    top: 40px;
    left: 40px;

    width: calc(100% - 80px);
    height: calc(100% - 80px);

    clip-path: polygon(

        25px 0,
        calc(100% - 25px) 0,

        100% 25px,
        100% calc(100% - 25px),

        calc(100% - 25px) 100%,
        25px 100%,

        0 calc(100% - 25px),
        0 25px
    );

    background: rgba(0,0,0,0.18);

    border: 3px solid #00ff88;

    box-shadow:

        0 0 25px #00ff88,
        inset 0 0 25px #00ff88;
}


/* =====================================================
   TOP BAR
===================================================== */

.top-bar {

    position: absolute;

    top: 55px;
    left: 50%;

    transform: translateX(-50%);

    width: 86%;
    height: 90px;

    clip-path: polygon(

        18px 0,
        calc(100% - 18px) 0,

        100% 18px,
        100% 100%,

        0 100%,
        0 18px
    );

    background: rgba(0,0,0,0.35);

    border: 2px solid #00ff88;

    box-shadow:

        0 0 14px #00ff88,
        inset 0 0 14px #00ff88;

    display: flex;

    justify-content: space-between;

    align-items: center;

    padding: 0 35px;

    box-sizing: border-box;
}


/* =====================================================
   TOP ITEMS
===================================================== */

.top-item {

    flex: 1;

    display: flex;

    justify-content: center;
}


.item-row {

    display: flex;

    align-items: center;

    gap: 14px;
}


/* =====================================================
   TOP ICONS
===================================================== */

.icon {

    width: 40px;
    height: 40px;

    stroke: #ffffff;

    fill: none;

    filter:
        drop-shadow(0 0 6px #00ff88);
}


/* =====================================================
   TOP TEXT
===================================================== */

.text-box {

    display: flex;

    flex-direction: column;

    line-height: 1.1;
}


.text-box span:first-child {

    font-size: 14px;

    color: #ffae4a;

    text-shadow:
        0 0 6px #ffae4a;
}


.text-box span:last-child {

    font-size: 22px;

    font-weight: bold;

    color: #00ff88;

    text-shadow:
        0 0 8px #00ff88;
}


/* =====================================================
   TOP DIVIDER
===================================================== */

.divider {

    width: 1px;

    height: 60%;

    background:
        rgba(255,255,255,0.35);
}


/* =====================================================
   WEBCAM
===================================================== */

.webcam-frame {

    position: absolute;

    bottom: 170px;
    left: 80px;

    width: 430px;
    height: 250px;

    border: 4px solid #00ff66;

    border-radius: 0;

    background:
        rgba(0,0,0,0.18);

    box-shadow:

        0 0 25px rgba(0,255,102,1),
        0 0 55px rgba(0,255,102,0.85),
        0 0 110px rgba(0,255,102,0.65),
        0 0 160px rgba(0,255,102,0.45);
}


/* =====================================================
   BOTTOM BAR
===================================================== */

.bottom-bar {

    position: absolute;

    bottom: 55px;
    left: 50%;

    transform: translateX(-50%);

    width: 86%;
    height: 80px;

    clip-path: polygon(

        0 0,
        100% 0,

        100% calc(100% - 18px),

        calc(100% - 18px) 100%,

        18px 100%,

        0 calc(100% - 18px)
    );

    background:
        rgba(0,0,0,0.35);

    border: 2px solid #00ff88;

    box-shadow:

        0 0 14px #00ff88,
        inset 0 0 14px #00ff88;

    display: flex;

    justify-content: space-between;

    align-items: center;

    padding: 0 40px;

    box-sizing: border-box;
}


/* =====================================================
   BOTTOM ITEMS
===================================================== */

.bottom-item {

    display: flex;

    align-items: center;

    gap: 10px;
}


/* =====================================================
   BOTTOM FONT
===================================================== */

.bottom-item span {

    font-family: Arial, sans-serif;

    font-size: 18px;

    font-weight: bold;

    line-height: 1;

    display: flex;

    align-items: center;

    white-space: nowrap;

    color: #4da6ff;

    text-shadow:
        0 0 6px #4da6ff;
}


/* =====================================================
   BOTTOM ICON
===================================================== */

.bottom-icon {

    width: 40px;
    height: 40px;

    stroke: #ffffff;

    fill: none;

    flex-shrink: 0;

    filter:
        drop-shadow(0 0 4px #ffb347);
}


/* =====================================================
   SUBSCRIBE / LIKE FIXED AREA
===================================================== */

.subscribe {

    position: relative;

    width: 145px;
    min-width: 145px;
    max-width: 145px;

    height: 40px;

    flex-shrink: 0;
}


.promo-state {

    position: absolute;

    left: 0;
    top: 50%;

    transform: translateY(-50%);

    display: flex;

    align-items: center;

    gap: 10px;

    white-space: nowrap;
}


/* =====================================================
   SUBSCRIBE
===================================================== */

.subscribe-state span {

    color: #ff3333;

    text-shadow:
        0 0 5px rgba(255,51,51,0.55);
}


/* =====================================================
   BELL
===================================================== */

.bell-icon {

    stroke: #ff3333;

    filter:
        drop-shadow(0 0 4px #ff3333);

    transform-origin: 50% 15%;
}


.subscribe-state .bell-icon {

    animation:
        bellMiddle 10s ease-in-out infinite;
}


@keyframes bellMiddle {

    0% {
        transform: rotate(0deg);
    }

    44% {
        transform: rotate(0deg);
    }

    /* لرزش اول */

    46% {
        transform: rotate(-6deg);
    }

    47.5% {
        transform: rotate(6deg);
    }

    49% {
        transform: rotate(-4deg);
    }

    50.5% {
        transform: rotate(0deg);
    }

    /* لرزش دوم */

    52% {
        transform: rotate(-6deg);
    }

    53.5% {
        transform: rotate(6deg);
    }

    55% {
        transform: rotate(-4deg);
    }

    56.5% {
        transform: rotate(0deg);
    }

    100% {
        transform: rotate(0deg);
    }
}


/* =====================================================
   LIKE
===================================================== */

.like-state {

    display: none;
}


.like-state span {

    color: #4da6ff;

    text-shadow:
        0 0 5px rgba(77,166,255,0.55);
}


.like-icon {

    stroke: #4da6ff;

    filter:
        drop-shadow(0 0 4px #4da6ff);

    transform-origin: center;
}


/* =====================================================
   LIKE ANIMATION
===================================================== */

.like-pulse {

    animation:
        likePulse 10s ease-in-out infinite;
}


@keyframes likePulse {

    0% {
        transform: scale(0.78);
    }

    /* بزرگ شدن اول */

    8% {
        transform: scale(1.12);
    }

    15% {
        transform: scale(0.84);
    }

    /* بزرگ شدن دوم */

    23% {
        transform: scale(1.14);
    }

    30% {
        transform: scale(0.84);
    }

    38% {
        transform: scale(1);
    }

    100% {
        transform: scale(1);
    }
}


/* =====================================================
   VIP
===================================================== */

.vip {

    position: relative;

    overflow: hidden;
}


.vip span {

    animation:
        vipPulse 1.8s infinite ease-in-out;
}


@keyframes vipPulse {

    0% {
        text-shadow:
            0 0 6px #00ff88;
    }

    50% {
        text-shadow:
            0 0 18px #00ff88;
    }

    100% {
        text-shadow:
            0 0 6px #00ff88;
    }
}


.vip .shine {

    position: absolute;

    top: 0;
    left: -120%;

    width: 80%;
    height: 100%;

    background:

        linear-gradient(
            120deg,
            transparent,
            rgba(255,255,255,0.4),
            transparent
        );

    animation:
        shineSweep 3s infinite;
}


@keyframes shineSweep {

    0% {
        left: -120%;
    }

    50% {
        left: 120%;
    }

    100% {
        left: 120%;
    }
}

</style>

<script>


/* =====================================================
   CLOCKS / DATE / SESSION
===================================================== */

function updateClocks() {


    const tehranTime =
        new Date().toLocaleTimeString(
            "en-US",
            {
                timeZone: "Asia/Tehran",
                hour12: true
            }
        );


    const newYorkTime =
        new Date().toLocaleTimeString(
            "en-US",
            {
                timeZone: "America/New_York",
                hour12: true
            }
        );


    const today =
        new Date().toLocaleDateString(
            "en-US",
            {
                timeZone: "Asia/Tehran",
                day: "2-digit",
                month: "short",
                year: "numeric"
            }
        );


    const tehranHour =
        parseInt(
            new Date().toLocaleString(
                "en-US",
                {
                    timeZone: "Asia/Tehran",
                    hour: "numeric",
                    hour12: false
                }
            )
        );


    const tehranMinute =
        parseInt(
            new Date().toLocaleString(
                "en-US",
                {
                    timeZone: "Asia/Tehran",
                    minute: "numeric"
                }
            )
        );


    const sessionName =

        (
            tehranHour < 16 ||

            (
                tehranHour === 16 &&
                tehranMinute < 30
            )

        )

        ? "London"
        : "New York";


    document.getElementById(
        "session-value"
    ).innerText = sessionName;


    document.getElementById(
        "tehran-value"
    ).innerText = tehranTime;


    document.getElementById(
        "newyork-value"
    ).innerText = newYorkTime;


    document.getElementById(
        "date-value"
    ).innerText = today;
}


setInterval(
    updateClocks,
    1000
);


updateClocks();


/* =====================================================
   NEWS - MARKETWATCH
===================================================== */

let newsTitles = [];

let newsIndex = 0;


/* =====================================================
   دریافت اخبار
===================================================== */

async function updateNews() {


    const newsElement =
        document.getElementById(
            "news-value"
        );


    try {


        newsElement.innerText =
            "Loading...";


        const rssUrl =
            "https://www.marketwatch.com/rss/topstories";


        const proxyUrl =

            "https://api.allorigins.win/raw?url=" +

            encodeURIComponent(
                rssUrl
            );


        const response =
            await fetch(
                proxyUrl,
                {
                    method: "GET",
                    cache: "no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                "MarketWatch request failed"
            );
        }


        const xmlText =
            await response.text();


        const parser =
            new DOMParser();


        const xml =
            parser.parseFromString(
                xmlText,
                "text/xml"
            );


        const items =
            xml.querySelectorAll(
                "item"
            );


        if (!items.length) {

            throw new Error(
                "No news items found"
            );
        }


        newsTitles = [];


        items.forEach(
            item => {


                const title =
                    item.querySelector(
                        "title"
                    );


                if (title) {


                    const text =
                        title.textContent
                        .trim();


                    if (
                        text.length > 0
                    ) {

                        newsTitles.push(
                            text
                        );

                    }

                }

            }
        );


        if (
            !newsTitles.length
        ) {

            throw new Error(
                "No news titles found"
            );
        }


        newsIndex = 0;


        showNews();


    }

    catch (error) {


        console.log(
            "MarketWatch NEWS Error:",
            error
        );


        newsElement.innerText =
            "NEWS UNAVAILABLE";
    }
}


/* =====================================================
   نمایش خبر
===================================================== */

function showNews() {


    const newsElement =
        document.getElementById(
            "news-value"
        );


    if (
        !newsTitles ||
        newsTitles.length === 0
    ) {

        return;
    }


    let title =
        newsTitles[
            newsIndex
        ];


    if (
        title.length > 55
    ) {

        title =
            title.substring(
                0,
                55
            ) + "...";
    }


    newsElement.innerText =
        title;


    newsIndex++;


    if (
        newsIndex >=
        newsTitles.length
    ) {

        newsIndex = 0;
    }
}


/* =====================================================
   NEWS START
===================================================== */

updateNews();


/*
   دریافت دوباره اخبار
   هر ۳۰ ثانیه
*/

setInterval(
    updateNews,
    30000
);


/*
   تغییر عنوان خبر
   هر ۶ ثانیه
*/

setInterval(
    showNews,
    6000
);


/* =====================================================
   SUBSCRIBE / LIKE
===================================================== */

const subscribeState =
    document.querySelector(
        ".subscribe-state"
    );


const likeState =
    document.querySelector(
        ".like-state"
    );


const likeIcon =
    document.querySelector(
        ".like-icon"
    );


/*
   هر ۱۰ ثانیه
   Subscribe و Like عوض می‌شوند.
*/

setInterval(
    function() {


        /*
           SUBSCRIBE → LIKE
        */

        if (
            subscribeState.style.display
            !== "none"
        ) {


            subscribeState.style.display =
                "none";


            likeState.style.display =
                "flex";


            likeIcon.classList.remove(
                "like-pulse"
            );


            void likeIcon.offsetWidth;


            likeIcon.classList.add(
                "like-pulse"
            );


        }


        /*
           LIKE → SUBSCRIBE
        */

        else {


            likeState.style.display =
                "none";


            subscribeState.style.display =
                "flex";

        }

    },

    10000
);

</script>
