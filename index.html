<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<title>FX LEVEL Overlay</title>

<style>

/* =====================================================
   THEME SYSTEM
===================================================== */

html,
body {

    width: 1920px;
    height: 1080px;

    margin: 0;
    padding: 0;

    overflow: hidden;

    background: #808080;

    font-family: Arial, sans-serif;

    color: white;

}


/* =====================================================
   DEFAULT THEME
===================================================== */

body {

    --theme-color: #00ff88;

    --theme-rgb: 0,255,136;

    --theme-soft: rgba(0,255,136,0.20);

    --theme-faint: rgba(0,255,136,0.08);

    --theme-grid: rgba(0,255,136,0.22);

    --theme-shadow: rgba(0,255,136,0.75);

}


/* =====================================================
   SYDNEY — PURPLE
===================================================== */

body.theme-sydney {

    --theme-color: #b05cff;

    --theme-rgb: 176,92,255;

    --theme-soft: rgba(176,92,255,0.20);

    --theme-faint: rgba(176,92,255,0.08);

    --theme-grid: rgba(176,92,255,0.22);

    --theme-shadow: rgba(176,92,255,0.75);

}


/* =====================================================
   TOKYO — CYAN
===================================================== */

body.theme-tokyo {

    --theme-color: #00d9ff;

    --theme-rgb: 0,217,255;

    --theme-soft: rgba(0,217,255,0.20);

    --theme-faint: rgba(0,217,255,0.08);

    --theme-grid: rgba(0,217,255,0.22);

    --theme-shadow: rgba(0,217,255,0.75);

}


/* =====================================================
   LONDON — GREEN
===================================================== */

body.theme-london {

    --theme-color: #00ff88;

    --theme-rgb: 0,255,136;

    --theme-soft: rgba(0,255,136,0.20);

    --theme-faint: rgba(0,255,136,0.08);

    --theme-grid: rgba(0,255,136,0.22);

    --theme-shadow: rgba(0,255,136,0.75);

}


/* =====================================================
   NEW YORK — ORANGE
===================================================== */

body.theme-newyork {

    --theme-color: #ffae4a;

    --theme-rgb: 255,174,74;

    --theme-soft: rgba(255,174,74,0.20);

    --theme-faint: rgba(255,174,74,0.08);

    --theme-grid: rgba(255,174,74,0.22);

    --theme-shadow: rgba(255,174,74,0.75);

}


/* =====================================================
   BACKGROUND GRID
===================================================== */

body::before {

    content: "";

    position: absolute;

    inset: 0;

    background-image:

        linear-gradient(
            var(--theme-grid) 1px,
            transparent 1px
        ),

        linear-gradient(
            90deg,
            var(--theme-grid) 1px,
            transparent 1px
        );

    background-size: 40px 40px;

    pointer-events: none;

    z-index: 0;

    transition:
        opacity 0.8s ease;

}


/* =====================================================
   AMBIENT BACKGROUND
===================================================== */

body::after {

    content: "";

    position: absolute;

    inset: -12%;

    pointer-events: none;

    z-index: 0;

    background:

        radial-gradient(
            circle at 10% 15%,
            var(--theme-soft),
            transparent 28%
        ),

        radial-gradient(
            circle at 90% 80%,
            var(--theme-soft),
            transparent 32%
        ),

        radial-gradient(
            circle at 50% 50%,
            var(--theme-faint),
            transparent 55%
        );

    opacity: 0.85;

    animation:
        ambientDrift 16s ease-in-out infinite alternate;

    transition:
        opacity 0.8s ease;

}


@keyframes ambientDrift {

    0% {

        transform:
            translate3d(-1.5%, -1%, 0)
            scale(1);

    }

    100% {

        transform:
            translate3d(1.5%, 1%, 0)
            scale(1.04);

    }

}


/* =====================================================
   SESSION CHANGE RED ALERT
===================================================== */

body.session-change-alert::after {

    background:

        radial-gradient(
            circle at 50% 50%,
            rgba(255,51,51,0.22),
            transparent 48%
        ),

        radial-gradient(
            circle at 10% 20%,
            rgba(255,51,51,0.14),
            transparent 30%
        ),

        radial-gradient(
            circle at 90% 80%,
            rgba(255,51,51,0.14),
            transparent 30%
        ),

        radial-gradient(
            circle at 10% 15%,
            var(--theme-soft),
            transparent 28%
        ),

        radial-gradient(
            circle at 90% 80%,
            var(--theme-soft),
            transparent 32%
        );

    animation:
        sessionChangeAlert 0.7s ease-in-out 4;

}


@keyframes sessionChangeAlert {

    0%,
    100% {

        opacity: 0.65;

    }

    50% {

        opacity: 1;

    }

}


/* =====================================================
   SESSION WARNING GLOBAL RED
===================================================== */

body.session-warning::after {

    background:

        radial-gradient(
            circle at 50% 50%,
            rgba(255,51,51,0.13),
            transparent 50%
        ),

        radial-gradient(
            circle at 8% 50%,
            rgba(255,51,51,0.09),
            transparent 34%
        ),

        radial-gradient(
            circle at 92% 50%,
            rgba(255,51,51,0.09),
            transparent 34%
        ),

        radial-gradient(
            circle at 10% 15%,
            var(--theme-soft),
            transparent 28%
        ),

        radial-gradient(
            circle at 90% 80%,
            var(--theme-soft),
            transparent 32%
        );

}


body.session-warning-open::after {

    animation:
        warningAmbient 0.95s ease-in-out infinite;

}


body.session-warning-close::after {

    background:

        radial-gradient(
            circle at 50% 50%,
            rgba(255,51,51,0.18),
            transparent 48%
        ),

        radial-gradient(
            circle at 8% 50%,
            rgba(255,51,51,0.12),
            transparent 34%
        ),

        radial-gradient(
            circle at 92% 50%,
            rgba(255,51,51,0.12),
            transparent 34%
        ),

        radial-gradient(
            circle at 10% 15%,
            var(--theme-soft),
            transparent 28%
        ),

        radial-gradient(
            circle at 90% 80%,
            var(--theme-soft),
            transparent 32%
        );

    animation:
        warningAmbient 0.7s ease-in-out infinite;

}


@keyframes warningAmbient {

    0%,
    100% {

        opacity: 0.65;

    }

    50% {

        opacity: 1;

    }

}


/* =====================================================
   MAIN FRAME
===================================================== */

.main-frame {

    position: absolute;

    top: 20px;
    left: 20px;

    width: calc(100% - 40px);
    height: calc(100% - 40px);

    clip-path: polygon(

        25px 0,
        calc(100% - 25px) 0,
        100% 25px,
        100% calc(100% - 25px),
        calc(100% - 25px) 100%,
        25px 100%,
        0 calc(100% - 25px),
        0 25px

    );

    background:
        rgba(0,0,0,0.18);

    border: 3px solid var(--theme-color);

    box-shadow:

        0 0 25px var(--theme-color),
        inset 0 0 25px var(--theme-color);

    z-index: 2;

    transition:

        border-color 0.7s ease,
        box-shadow 0.7s ease;

}


/* =====================================================
   TOP BAR
===================================================== */

.top-bar {

    position: absolute;

    top: 35px;
    left: 50%;

    transform: translateX(-50%);

    width: 92%;
    height: 90px;

    clip-path: polygon(

        18px 0,
        calc(100% - 18px) 0,
        100% 18px,
        100% 100%,
        0 100%,
        0 18px

    );

    background:
        rgba(0,0,0,0.35);

    border: 2px solid var(--theme-color);

    box-shadow:

        0 0 14px var(--theme-color),
        inset 0 0 14px var(--theme-color);

    display: flex;

    justify-content: space-between;

    align-items: center;

    padding: 0 30px;

    box-sizing: border-box;

    z-index: 3;

    transition:

        border-color 0.7s ease,
        box-shadow 0.7s ease;

}


/* =====================================================
   TOP ITEMS
===================================================== */

.top-item {

    flex: 1;

    min-width: 0;

    height: 100%;

    display: flex;

    justify-content: center;

    align-items: center;

    overflow: hidden;

}


.item-row {

    width: 100%;

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 12px;

    box-sizing: border-box;

    min-width: 0;

}


/* =====================================================
   TOP ICONS
===================================================== */

.icon {

    width: 40px;
    height: 40px;

    flex: 0 0 40px;

    stroke: #ffffff;

    fill: none;

    filter:
        drop-shadow(
            0 0 6px var(--theme-color)
        );

    transition:
        filter 0.7s ease;

}


/* =====================================================
   TEXT BOX
===================================================== */

.text-box {

    min-width: 0;

    height: 44px;

    display: flex;

    flex-direction: column;

    justify-content: center;

    line-height: 1.1;

    text-align: left;

    overflow: hidden;

}


/* =====================================================
   TOP LABEL
===================================================== */

.text-box span:first-child {

    font-family: Arial, sans-serif;

    font-size: 14px;

    font-weight: bold;

    line-height: 18px;

    height: 18px;

    color: var(--theme-color);

    text-shadow:
        0 0 6px var(--theme-color);

    white-space: nowrap;

    transition:

        color 0.7s ease,
        text-shadow 0.7s ease;

}


/* =====================================================
   TOP VALUE
===================================================== */

.text-box span:last-child {

    font-family: Arial, sans-serif;

    font-size: 22px;

    font-weight: bold;

    line-height: 24px;

    height: 24px;

    color: var(--theme-color);

    text-shadow:
        0 0 8px var(--theme-color);

    white-space: nowrap;

    font-variant-numeric:
        tabular-nums;

    transition:

        color 0.7s ease,
        text-shadow 0.7s ease;

}


/* =====================================================
   NEXT EVENT
===================================================== */

.next-event-value {

    display: flex;

    align-items: center;

    gap: 7px;

    white-space: nowrap;

    font-family: Arial, sans-serif;

    font-size: 22px;

    font-weight: bold;

    line-height: 24px;

    height: 24px;

    color: var(--theme-color);

    text-shadow:
        0 0 8px var(--theme-color);

    font-variant-numeric:
        tabular-nums;

    min-width: 0;

    transition:

        color 0.7s ease,
        text-shadow 0.7s ease;

}


.next-event-value .next-session {

    color: var(--theme-color);

    text-shadow:
        0 0 8px var(--theme-color);

    transition:
        color 0.7s ease;

}


.next-event-value .next-open {

    color: rgba(255,255,255,0.75);

    font-size: 17px;

}


.next-event-value .next-separator {

    color:
        rgba(255,255,255,0.45);

    font-size: 15px;

}


.next-event-value .next-countdown {

    color: var(--theme-color);

    font-size: 20px;

    font-variant-numeric:
        tabular-nums;

    text-shadow:
        0 0 8px var(--theme-color);

    transition:
        color 0.7s ease,
        text-shadow 0.7s ease;

}


.next-event-value.warning {

    animation:
        nextEventWarning 0.72s ease-in-out infinite;

}


.next-event-value.warning .next-countdown {

    color: #ff3333;

    text-shadow:

        0 0 6px #ff3333,
        0 0 14px #ff3333;

}


@keyframes nextEventWarning {

    0%,
    100% {

        opacity: 1;

    }

    50% {

        opacity: 0.25;

    }

}


/* =====================================================
   DIVIDER
===================================================== */

.divider {

    width: 1px;

    height: 60%;

    flex: 0 0 1px;

    background:
        rgba(255,255,255,0.35);

}


/* =====================================================
   SESSION MAP
===================================================== */

.session-map {

    flex: 1.15;

    min-width: 0;

    max-width: 100%;

    display: flex;

    justify-content: center;

    align-items: center;

    position: relative;

    overflow: hidden;

}


.session-map-inner {

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    width: 100%;

    max-width: 100%;

    min-width: 0;

    position: relative;

    transform: translateY(7px);

    overflow: hidden;

}


/* =====================================================
   SESSION TITLE
===================================================== */

.session-map-title {

    font-family: Arial, sans-serif;

    font-size: 13px;

    font-weight: bold;

    letter-spacing: 3px;

    line-height: 16px;

    height: 16px;

    color: var(--theme-color);

    text-shadow:

        0 0 6px var(--theme-color),
        0 0 14px var(--theme-soft);

    margin-bottom: 8px;

    position: relative;

    flex-shrink: 0;

    transition:

        color 0.7s ease,
        text-shadow 0.7s ease;

}


/* =====================================================
   SESSION TRACK
===================================================== */

.session-track {

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 12px;

    height: 27px;

    width: 100%;

    max-width: 100%;

    min-width: 0;

    position: relative;

    white-space: nowrap;

    box-sizing: border-box;

    overflow: hidden;

}


/* =====================================================
   SESSION NODE
===================================================== */

.session-node {

    display: flex;

    align-items: center;

    gap: 6px;

    position: relative;

    font-family: Arial, sans-serif;

    font-size: 14px;

    font-weight: bold;

    letter-spacing: 0.5px;

    color: rgba(255,255,255,0.42);

    transition:

        color 0.35s ease,
        text-shadow 0.35s ease,
        opacity 0.35s ease;

    flex: 0 1 auto;

    min-width: 0;

    white-space: nowrap;

}


/* =====================================================
   INDIVIDUAL SESSION COLORS
===================================================== */

#session-sydney {

    --session-color: #b05cff;

    --session-rgb: 176,92,255;

}


#session-tokyo {

    --session-color: #00d9ff;

    --session-rgb: 0,217,255;

}


#session-london {

    --session-color: #00ff88;

    --session-rgb: 0,255,136;

}


#session-newyork {

    --session-color: #ffae4a;

    --session-rgb: 255,174,74;

}


.session-name {

    position: relative;

    z-index: 3;

    transition:

        color 0.35s ease,
        text-shadow 0.35s ease;

    white-space: nowrap;

}


/* =====================================================
   SESSION DOT
===================================================== */

.session-dot {

    width: 7px;
    height: 7px;

    flex: 0 0 7px;

    border-radius: 50%;

    background:
        rgba(255,255,255,0.25);

    box-shadow:

        0 0 2px
        rgba(255,255,255,0.15);

    position: relative;

    z-index: 3;

    transition:

        background 0.35s ease,
        box-shadow 0.35s ease,
        transform 0.35s ease;

}


/* =====================================================
   HALO
===================================================== */

.session-dot::before {

    content: "";

    position: absolute;

    width: 18px;
    height: 18px;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%)
        scale(0.65);

    border-radius: 50%;

    border: 1px solid
        transparent;

    opacity: 0;

    transition:

        opacity 0.3s ease,
        transform 0.3s ease,
        border-color 0.3s ease;

}


/* =====================================================
   ACTIVE SESSION
===================================================== */

.session-node.active {

    color: var(--session-color);

    text-shadow:

        0 0 5px var(--session-color),
        0 0 12px
        rgba(var(--session-rgb),0.8);

}


.session-node.active .session-dot {

    background:
        var(--session-color);

    box-shadow:

        0 0 4px var(--session-color),
        0 0 10px var(--session-color),
        0 0 20px
        rgba(var(--session-rgb),0.85);

    animation:
        activeDotPulse 1.25s ease-in-out infinite;

}


.session-node.active .session-dot::before {

    opacity: 0.65;

    transform:
        translate(-50%, -50%)
        scale(1);

    border-color:
        rgba(var(--session-rgb),0.55);

    animation:
        activeHalo 1.25s ease-in-out infinite;

}


@keyframes activeDotPulse {

    0%,
    100% {

        transform: scale(0.82);

        opacity: 0.78;

    }

    50% {

        transform: scale(1.30);

        opacity: 1;

    }

}


@keyframes activeHalo {

    0%,
    100% {

        transform:
            translate(-50%, -50%)
            scale(0.75);

        opacity: 0.20;

    }

    50% {

        transform:
            translate(-50%, -50%)
            scale(1.35);

        opacity: 0.75;

    }

}


/* =====================================================
   SESSION CONNECTOR
===================================================== */

.session-connector {

    width: 16px;

    height: 1px;

    flex: 0 1 16px;

    min-width: 8px;

    background:
        rgba(255,255,255,0.18);

    box-shadow:
        0 0 4px
        var(--theme-soft);

    position: relative;

    overflow: hidden;

    transition:
        box-shadow 0.7s ease;

}


.session-map.has-active
.session-connector::after {

    content: "";

    position: absolute;

    top: 0;

    left: -100%;

    width: 60%;

    height: 100%;

    background:

        linear-gradient(
            90deg,
            transparent,
            var(--theme-color),
            transparent
        );

    animation:
        connectorSweep 3.2s ease-in-out infinite;

    opacity: 1;

}


@keyframes connectorSweep {

    0% {

        left: -100%;

    }

    55% {

        left: 130%;

    }

    100% {

        left: 130%;

    }

}


/* =====================================================
   OPEN WARNING
===================================================== */

.session-node.open-warning {

    color: var(--session-color);

    animation:
        openWarningBlink 0.72s ease-in-out infinite;

}


.session-node.open-warning .session-dot {

    background:
        var(--session-color);

    box-shadow:

        0 0 5px var(--session-color),
        0 0 13px var(--session-color),
        0 0 28px
        rgba(var(--session-rgb),0.95);

    animation:
        openDotWarning 0.72s ease-in-out infinite;

}


.session-node.open-warning .session-dot::before {

    border-color:
        rgba(var(--session-rgb),0.85);

    opacity: 1;

    animation:
        warningHalo 0.72s ease-in-out infinite;

}


@keyframes openWarningBlink {

    0%,
    100% {

        opacity: 1;

        text-shadow:

            0 0 6px var(--session-color),
            0 0 16px var(--session-color);

    }

    50% {

        opacity: 0.22;

        text-shadow:
            0 0 2px var(--session-color);

    }

}


@keyframes openDotWarning {

    0%,
    100% {

        transform: scale(0.80);

        opacity: 0.55;

    }

    50% {

        transform: scale(1.45);

        opacity: 1;

    }

}


@keyframes warningHalo {

    0%,
    100% {

        transform:
            translate(-50%, -50%)
            scale(0.65);

        opacity: 0.20;

    }

    50% {

        transform:
            translate(-50%, -50%)
            scale(1.55);

        opacity: 0.85;

    }

}


/* =====================================================
   CLOSE WARNING
===================================================== */

.session-node.close-warning {

    color: #ff3333;

    animation:
        closeWarningBlink 0.65s ease-in-out infinite;

}


.session-node.close-warning .session-dot {

    background: #ff3333;

    box-shadow:

        0 0 5px #ff3333,
        0 0 13px #ff3333,
        0 0 30px
        rgba(255,51,51,0.95);

    animation:
        closeDotWarning 0.65s ease-in-out infinite;

}


.session-node.close-warning .session-dot::before {

    border-color:
        rgba(255,51,51,0.85);

    opacity: 1;

    animation:
        warningHaloRed 0.65s ease-in-out infinite;

}


@keyframes closeWarningBlink {

    0%,
    100% {

        opacity: 1;

        text-shadow:

            0 0 6px #ff3333,
            0 0 16px #ff3333;

    }

    50% {

        opacity: 0.18;

        text-shadow:
            0 0 2px #ff3333;

    }

}


@keyframes closeDotWarning {

    0%,
    100% {

        transform: scale(0.80);

        opacity: 0.55;

    }

    50% {

        transform: scale(1.50);

        opacity: 1;

    }

}


@keyframes warningHaloRed {

    0%,
    100% {

        transform:
            translate(-50%, -50%)
            scale(0.65);

        opacity: 0.20;

    }

    50% {

        transform:
            translate(-50%, -50%)
            scale(1.55);

        opacity: 0.85;

    }

}


/* =====================================================
   WEEKEND
===================================================== */

.session-map.weekend
.session-node {

    color:
        rgba(255,51,51,0.55);

}


.session-map.weekend
.session-dot {

    background: #ff3333;

    box-shadow:

        0 0 4px #ff3333,
        0 0 10px
        rgba(255,51,51,0.55);

    animation:
        closedWeekendPulse 1.8s ease-in-out infinite;

}


.session-map.weekend
.session-dot::before {

    border-color:
        rgba(255,51,51,0.45);

    opacity: 0.55;

    transform:
        translate(-50%, -50%)
        scale(0.9);

}


.session-map.weekend
.session-active-label {

    color: #ff3333;

    text-shadow:

        0 0 6px #ff3333,
        0 0 14px
        rgba(255,51,51,0.45);

}


@keyframes closedWeekendPulse {

    0%,
    100% {

        transform: scale(0.85);

        opacity: 0.55;

    }

    50% {

        transform: scale(1.15);

        opacity: 1;

    }

}


/* =====================================================
   ACTIVE LABEL
===================================================== */

.session-active-label {

    position: relative;

    height: 14px;

    margin-top: 1px;

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 5px;

    font-family: Arial, sans-serif;

    font-size: 9px;

    font-weight: bold;

    letter-spacing: 2px;

    color: var(--theme-color);

    text-shadow:

        0 0 6px var(--theme-color),
        0 0 14px var(--theme-soft);

    opacity: 0;

    transition:

        opacity 0.35s ease,
        color 0.7s ease,
        text-shadow 0.7s ease;

}


.session-active-label.visible {

    opacity: 1;

}


.active-arrow {

    display: inline-block;

    font-size: 10px;

    animation:
        activeArrowFloat 1s ease-in-out infinite;

}


@keyframes activeArrowFloat {

    0%,
    100% {

        transform:
            translateY(2px);

    }

    50% {

        transform:
            translateY(-1px);

    }

}


/* =====================================================
   WEBCAM
===================================================== */

.webcam-frame {

    position: absolute;

    bottom: 125px;
    left: 55px;

    width: 430px;
    height: 250px;

    border: 4px solid var(--theme-color);

    border-radius: 0;

    background:
        rgba(0,0,0,0.18);

    box-shadow:

        0 0 25px var(--theme-color),

<script>

/* =====================================================
   SESSION CONFIG
   بدون تغییر
===================================================== */

const SESSION_CONFIG = {

    sydney: {

        name: "Sydney",

        shortName: "SYD",

        open: "01:30",

        close: "10:30"

    },

    tokyo: {

        name: "Tokyo",

        shortName: "TOK",

        open: "03:30",

        close: "12:30"

    },

    london: {

        name: "London",

        shortName: "LON",

        open: "10:30",

        close: "19:30"

    },

    newyork: {

        name: "New York",

        shortName: "NY",

        open: "16:30",

        close: "00:30"

    }

};


const OPEN_WARNING_MINUTES = 5;

const CLOSE_WARNING_MINUTES = 5;


/* =====================================================
   THEME STATE
===================================================== */

let lastPrimarySessionId = null;

let themeInitialized = false;

let sessionAlertTimer = null;


/* =====================================================
   DOM
===================================================== */

const marketValue =
    document.getElementById(
        "market-value"
    );


const tehranClockValue =
    document.getElementById(
        "tehran-value"
    );


const dateValue =
    document.getElementById(
        "date-value"
    );


const nextEventValue =
    document.getElementById(
        "next-event-value"
    );


const nextSession =
    document.getElementById(
        "next-session"
    );


const nextCountdown =
    document.getElementById(
        "next-countdown"
    );


const sessionMap =
    document.getElementById(
        "session-map"
    );


const sessionActiveLabel =
    document.getElementById(
        "session-active-label"
    );


const activeSessionText =
    document.getElementById(
        "active-session-text"
    );


const sessionNodes = {

    sydney:
        document.getElementById(
            "session-sydney"
        ),

    tokyo:
        document.getElementById(
            "session-tokyo"
        ),

    london:
        document.getElementById(
            "session-london"
        ),

    newyork:
        document.getElementById(
            "session-newyork"
        )

};


/* =====================================================
   HH:MM → MINUTES
===================================================== */

function timeToMinutes(time) {

    const [
        hours,
        minutes
    ] = time.split(":").map(Number);

    return (
        hours * 60 +
        minutes
    );

}


/* =====================================================
   TEHRAN
===================================================== */

function getTehranDateParts(
    date = new Date()
) {

    const parts =
        new Intl.DateTimeFormat(
            "en-US",
            {

                timeZone:
                    "Asia/Tehran",

                year:
                    "numeric",

                month:
                    "2-digit",

                day:
                    "2-digit",

                hour:
                    "2-digit",

                minute:
                    "2-digit",

                second:
                    "2-digit",

                hourCycle:
                    "h23"

            }
        ).formatToParts(date);


    const result = {};


    parts.forEach(
        part => {

            if (
                part.type !==
                "literal"
            ) {

                result[part.type] =
                    part.value;

            }

        }
    );


    return {

        year:
            Number(result.year),

        month:
            Number(result.month),

        day:
            Number(result.day),

        hour:
            Number(result.hour),

        minute:
            Number(result.minute),

        second:
            Number(result.second)

    };

}


/* =====================================================
   DAY OF WEEK
===================================================== */

function getTehranDayOfWeek(
    date = new Date()
) {

    const parts =
        getTehranDateParts(
            date
        );


    const utcDate =
        new Date(
            Date.UTC(
                parts.year,
                parts.month - 1,
                parts.day
            )
        );


    return utcDate.getUTCDay();

}


/* =====================================================
   WEEKEND
===================================================== */

function isWeekend(
    date = new Date()
) {

    const day =
        getTehranDayOfWeek(
            date
        );


    return (
        day === 0 ||
        day === 6
    );

}


/* =====================================================
   TRADING DAY
===================================================== */

function isTradingDay(
    date = new Date()
) {

    return !isWeekend(date);

}


/* =====================================================
   CURRENT TEHRAN MINUTE
===================================================== */

function getCurrentTehranMinute(
    date = new Date()
) {

    const parts =
        getTehranDateParts(
            date
        );


    return (
        parts.hour * 60 +
        parts.minute +
        parts.second / 60
    );

}


/* =====================================================
   SESSION STATE
===================================================== */

function getSessionState(
    session,
    currentMinute
) {

    const open =
        timeToMinutes(
            session.open
        );


    const close =
        timeToMinutes(
            session.close
        );


    let isOpen;


    if (open < close) {

        isOpen =
            currentMinute >= open &&
            currentMinute < close;

    }

    else {

        isOpen =
            currentMinute >= open ||
            currentMinute < close;

    }


    return {

        open,
        close,
        isOpen

    };

}


/* =====================================================
   ACTIVE SESSIONS
===================================================== */

function getActiveSessions(
    currentMinute,
    date = new Date()
) {

    if (
        !isTradingDay(date)
    ) {

        return [];

    }


    const active = [];


    Object.entries(
        SESSION_CONFIG
    ).forEach(
        ([id, session]) => {

            const state =
                getSessionState(
                    session,
                    currentMinute
                );


            if (
                state.isOpen
            ) {

                active.push({

                    id,

                    ...session,

                    ...state

                });

            }

        }
    );


    return active;

}


/* =====================================================
   PRIMARY SESSION
   بدون تغییر منطق
===================================================== */

function getPrimaryActiveSession(
    currentMinute,
    date = new Date()
) {

    const active =
        getActiveSessions(
            currentMinute,
            date
        );


    if (
        active.length === 0
    ) {

        return null;

    }


    let primary = null;

    let bestScore = -Infinity;


    active.forEach(
        session => {

            let score =
                timeToMinutes(
                    session.open
                );


            if (
                session.id === "newyork" &&
                currentMinute <
                    timeToMinutes(
                        session.close
                    )
            ) {

                score -= 1440;

            }


            if (
                score > bestScore
            ) {

                bestScore =
                    score;

                primary =
                    session;

            }

        }
    );


    return primary;

}


/* =====================================================
   MARKET STATUS
===================================================== */

function isMarketOpen(
    currentMinute,
    date = new Date()
) {

    if (
        !isTradingDay(date)
    ) {

        return false;

    }


    return (
        getActiveSessions(
            currentMinute,
            date
        ).length > 0
    );

}


/* =====================================================
   OPEN WARNING
===================================================== */

function getMinutesUntilOpen(
    session,
    currentMinute
) {

    const open =
        timeToMinutes(
            session.open
        );


    let diff =
        open -
        currentMinute;


    if (
        diff < 0
    ) {

        diff += 1440;

    }


    return diff;

}


function getMinutesUntilClose(
    session,
    currentMinute
) {

    const close =
        timeToMinutes(
            session.close
        );


    let diff =
        close -
        currentMinute;


    if (
        diff < 0
    ) {

        diff += 1440;

    }


    return diff;

}


function isOpenWarning(
    session,
    currentMinute
) {

    const minutes =
        getMinutesUntilOpen(
            session,
            currentMinute
        );


    return (

        minutes > 0 &&

        minutes <=
            OPEN_WARNING_MINUTES

    );

}


function isCloseWarning(
    session,
    currentMinute
) {

    const minutes =
        getMinutesUntilClose(
            session,
            currentMinute
        );


    return (

        minutes > 0 &&

        minutes <=
            CLOSE_WARNING_MINUTES

    );

}


/* =====================================================
   APPLY SESSION THEME
===================================================== */

function updateSessionTheme(
    primary,
    currentMinute,
    now
) {

    const body =
        document.body;


    body.classList.remove(

        "theme-sydney",
        "theme-tokyo",
        "theme-london",
        "theme-newyork"

    );


    const primaryId =
        primary
            ? primary.id
            : null;


    /*
       وقتی هیچ Session فعال نیست،
       رنگ پیش‌فرض سبز باقی می‌ماند.
    */

    if (primaryId) {

        body.classList.add(
            "theme-" + primaryId
        );

    }

    else {

        body.classList.add(
            "theme-london"
        );

    }


    /* -----------------------------------------------
       Global Warning State
    ------------------------------------------------ */

    let warningType = null;


    if (
        isTradingDay(now)
    ) {

        Object.entries(
            SESSION_CONFIG
        ).forEach(
            ([id, session]) => {

                const state =
                    getSessionState(
                        session,
                        currentMinute
                    );


                if (
                    state.isOpen &&
                    isCloseWarning(
                        session,
                        currentMinute
                    )
                ) {

                    warningType = "close";

                }

                else if (
                    !state.isOpen &&
                    isOpenWarning(
                        session,
                        currentMinute
                    ) &&
                    warningType !== "close"
                ) {

                    warningType = "open";

                }

            }
        );

    }


    body.classList.toggle(
        "session-warning",
        warningType !== null
    );


    body.classList.toggle(
        "session-warning-open",
        warningType === "open"
    );


    body.classList.toggle(
        "session-warning-close",
        warningType === "close"
    );


    /* -----------------------------------------------
       Session Change Detection
    ------------------------------------------------ */

    if (

        themeInitialized &&

        primaryId &&

        lastPrimarySessionId &&

        primaryId !== lastPrimarySessionId

    ) {

        body.classList.remove(
            "session-change-alert"
        );


        /*
           Restart animation
        */

        void body.offsetWidth;


        body.classList.add(
            "session-change-alert"
        );


        clearTimeout(
            sessionAlertTimer
        );


        sessionAlertTimer =
            setTimeout(
                function () {

                    body.classList.remove(
                        "session-change-alert"
                    );

                },
                3000
            );

    }


    lastPrimarySessionId =
        primaryId;


    themeInitialized = true;

}


/* =====================================================
   SESSION MAP
===================================================== */

function updateSessionMap(
    currentMinute,
    now = new Date()
) {

    sessionMap.classList.remove(
        "has-active"
    );


    Object.values(
        sessionNodes
    ).forEach(
        node => {

            node.classList.remove(

                "active",
                "open-warning",
                "close-warning"

            );

        }
    );


    if (
        isWeekend(now)
    ) {

        sessionMap.classList.add(
            "weekend"
        );


        sessionActiveLabel.classList.add(
            "visible"
        );


        activeSessionText.textContent =
            "MARKET CLOSED";


        updateSessionTheme(
            null,
            currentMinute,
            now
        );


        return;

    }


    sessionMap.classList.remove(
        "weekend"
    );


    const active =
        getActiveSessions(
            currentMinute,
            now
        );


    const primary =
        getPrimaryActiveSession(
            currentMinute,
            now
        );


    if (
        active.length > 0
    ) {

        sessionMap.classList.add(
            "has-active"
        );

    }


    active.forEach(
        session => {

            const node =
                sessionNodes[
                    session.id
                ];


            if (!node) {

                return;

            }


            node.classList.add(
                "active"
            );

        }
    );


    Object.entries(
        SESSION_CONFIG
    ).forEach(
        ([id, session]) => {

            const node =
                sessionNodes[id];


            if (!node) {

                return;

            }


            const state =
                getSessionState(
                    session,
                    currentMinute
                );


            if (

                state.isOpen &&

                isCloseWarning(
                    session,
                    currentMinute
                )

            ) {

                node.classList.remove(
                    "active"
                );


                node.classList.add(
                    "close-warning"
                );

            }


            else if (

                !state.isOpen &&

                isOpenWarning(
                    session,
                    currentMinute
                )

            ) {

                node.classList.add(
                    "open-warning"
                );

            }

        }
    );


    if (
        active.length > 0
    ) {

        sessionActiveLabel.classList.add(
            "visible"
        );


        activeSessionText.textContent =
            "ACTIVE";

    }

    else {

        sessionActiveLabel.classList.remove(
            "visible"
        );

    }


    /*
       Theme must be updated AFTER
       primary session has been calculated.
    */

    updateSessionTheme(
        primary,
        currentMinute,
        now
    );

}


/* =====================================================
   MARKET
===================================================== */

function updateMarket(
    currentMinute,
    now = new Date()
) {

    const open =
        isMarketOpen(
            currentMinute,
            now
        );


    if (open) {

        marketValue.textContent =
            "OPEN";


        /*
           Market follows active theme.
        */

        const themeColor =
            getComputedStyle(
                document.body
            )
            .getPropertyValue(
                "--theme-color"
            )
            .trim();


        marketValue.style.color =
            themeColor;


        marketValue.style.textShadow =
            "0 0 8px " +
            themeColor;

    }

    else {

        marketValue.textContent =
            "CLOSED";


        marketValue.style.color =
            "#ff3333";


        marketValue.style.textShadow =
            "0 0 8px #ff3333";

    }

}


/* =====================================================
   TEHRAN TIME
===================================================== */

function getTehranTime(
    date = new Date()
) {

    return new Intl.DateTimeFormat(
        "en-US",
        {

            timeZone:
                "Asia/Tehran",

            hour:
                "2-digit",

            minute:
                "2-digit",

            second:
                "2-digit",

            hour12:
                true

        }
    ).format(date);

}


/* =====================================================
   GREGORIAN DATE
===================================================== */

function getGregorianDate(
    date = new Date()
) {

    const formatter =
        new Intl.DateTimeFormat(
            "en-US",
            {

                calendar:
                    "gregory",

                year:
                    "numeric",

                month:
                    "short",

                day:
                    "2-digit"

            }
        );


    return formatter
        .format(date)
        .toUpperCase();

}


/* =====================================================
   NEXT SESSION
===================================================== */

function getNextSessionOpen(
    currentMinute,
    date = new Date()
) {

    const sessions =
        Object.entries(
            SESSION_CONFIG
        );


    let next = null;

    let smallestDiff =
        Infinity;


    sessions.forEach(
        ([id, session]) => {

            const open =
                timeToMinutes(
                    session.open
                );


            let diff =
                open -
                currentMinute;


            if (
                diff <= 0
            ) {

                diff += 1440;

            }


            if (
                diff < smallestDiff
            ) {

                smallestDiff =
                    diff;


                next = {

                    id,

                    ...session,

                    diff

                };

            }

        }
    );


    return next;

}


/* =====================================================
   NEXT EVENT
===================================================== */

function updateNextEvent(
    now = new Date()
) {

    const tehranParts =
        getTehranDateParts(
            now
        );


    const currentMinute =
        tehranParts.hour * 60 +
        tehranParts.minute +
        tehranParts.second / 60;


    const next =
        getNextSessionOpen(
            currentMinute,
            now
        );


    if (!next) {

        nextSession.textContent =
            "---";


        nextCountdown.textContent =
            "--:--:--";


        return;

    }


    nextSession.textContent =
        next.shortName;


    const openMinutes =
        timeToMinutes(
            next.open
        );


    let currentSeconds =
        tehranParts.hour * 3600 +
        tehranParts.minute * 60 +
        tehranParts.second;


    let openSeconds =
        openMinutes * 60;


    let secondsUntil =
        openSeconds -
        currentSeconds;


    if (
        secondsUntil <= 0
    ) {

        secondsUntil +=
            24 * 60 * 60;

    }


    const hours =
        Math.floor(
            secondsUntil / 3600
        );


    const minutes =
        Math.floor(
            (secondsUntil % 3600) / 60
        );


    const seconds =
        secondsUntil % 60;


    nextCountdown.textContent =

        String(hours)
            .padStart(2, "0")

        + ":" +

        String(minutes)
            .padStart(2, "0")

        + ":" +

        String(seconds)
            .padStart(2, "0");


    if (
        secondsUntil <=
        OPEN_WARNING_MINUTES * 60
    ) {

        nextEventValue.classList.add(
            "warning"
        );

    }

    else {

        nextEventValue.classList.remove(
            "warning"
        );

    }

}


/* =====================================================
   CLOCKS
===================================================== */

function updateClocks() {

    const now =
        new Date();


    const tehranParts =
        getTehranDateParts(
            now
        );


    const currentMinute =
        tehranParts.hour * 60 +
        tehranParts.minute +
        tehranParts.second / 60;


    /* -----------------------------------------------
       Tehran
    ------------------------------------------------ */

    tehranClockValue.textContent =
        getTehranTime(
            now
        );


    /* -----------------------------------------------
       Session
    ------------------------------------------------ */

    updateSessionMap(
        currentMinute,
        now
    );


    /* -----------------------------------------------
       Market
    ------------------------------------------------ */

    updateMarket(
        currentMinute,
        now
    );


    /* -----------------------------------------------
       Next Event
    ------------------------------------------------ */

    updateNextEvent(
        now
    );


    /* -----------------------------------------------
       Date
    ------------------------------------------------ */

    dateValue.textContent =
        getGregorianDate(
            now
        );

}


/* =====================================================
   START
===================================================== */

updateClocks();


setInterval(
    updateClocks,
    1000
);


/* =====================================================
   SUBSCRIBE / LIKE
===================================================== */

const subscribeState =
    document.querySelector(
        ".subscribe-state"
    );


const likeState =
    document.querySelector(
        ".like-state"
    );


const likeIcon =
    document.querySelector(
        ".like-icon"
    );


setInterval(

            subscribeState.style.display !==

        ) {

            subscribeState.style.display =

            likeState.style.display =

            likeIcon.classList.remove(
                "like-pulse"
            );


            void likeIcon.offsetWidth;


            likeIcon.classList.add(

            );

        }

        else {

            likeState.style.display =
                "none";


            subscribeState.style.display =
                "flex";

        }

    },

    10000

);
