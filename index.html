<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<title>FX LEVEL Overlay</title>

<style>

/* =====================================================
   صفحه اصلی
===================================================== */

html,
body {

    width: 1920px;
    height: 1080px;

    margin: 0;
    padding: 0;

    overflow: hidden;

    background: #808080;

    font-family: Arial, sans-serif;

    color: white;
}


/* =====================================================
   شبکه پس‌زمینه
===================================================== */

body::before {

    content: "";

    position: absolute;

    inset: 0;

    background-image:

        linear-gradient(
            rgba(0,255,136,0.40) 1px,
            transparent 1px
        ),

        linear-gradient(
            90deg,
            rgba(0,255,136,0.40) 1px,
            transparent 1px
        );

    background-size: 40px 40px;

    pointer-events: none;
}


/* =====================================================
   فریم اصلی
===================================================== */

.main-frame {

    position: absolute;

    top: 40px;
    left: 40px;

    width: calc(100% - 80px);
    height: calc(100% - 80px);

    clip-path: polygon(

        25px 0,
        calc(100% - 25px) 0,
        100% 25px,
        100% calc(100% - 25px),
        calc(100% - 25px) 100%,
        25px 100%,
        0 calc(100% - 25px),
        0 25px

    );

    background: rgba(0, 0, 0, 0.18);

    border: 3px solid #00ff88;

    box-shadow:

        0 0 25px #00ff88,
        inset 0 0 25px #00ff88;
}


/* =====================================================
   نوار بالا
===================================================== */

.top-bar {

    position: absolute;

    top: 55px;
    left: 50%;

    transform: translateX(-50%);

    width: 86%;
    height: 90px;

    clip-path: polygon(

        18px 0,
        calc(100% - 18px) 0,
        100% 18px,
        100% 100%,
        0 100%,
        0 18px

    );

    background: rgba(0, 0, 0, 0.35);

    border: 2px solid #00ff88;

    box-shadow:

        0 0 14px #00ff88,
        inset 0 0 14px #00ff88;

    display: flex;

    justify-content: space-between;

    align-items: center;

    padding: 0 35px;

    box-sizing: border-box;
}


/* =====================================================
   آیتم‌های نوار بالا
===================================================== */

.top-item {

    flex: 1;

    min-width: 0;

    height: 100%;

    display: flex;

    justify-content: center;

    align-items: center;
}


.item-row {

    width: 100%;

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 14px;

    box-sizing: border-box;
}


/* =====================================================
   آیکون‌های بالا
===================================================== */

.icon {

    width: 40px;
    height: 40px;

    flex: 0 0 40px;

    stroke: #ffffff;

    fill: none;

    filter:
        drop-shadow(0 0 6px #00ff88);
}


/* =====================================================
   متن‌های بالا
===================================================== */

.text-box {

    min-width: 125px;

    height: 44px;

    display: flex;

    flex-direction: column;

    justify-content: center;

    line-height: 1.1;

    text-align: left;
}


.text-box span:first-child {

    font-family: Arial, sans-serif;

    font-size: 14px;

    font-weight: bold;

    line-height: 18px;

    height: 18px;

    color: #ffae4a;

    text-shadow:
        0 0 6px #ffae4a;

    white-space: nowrap;
}


.text-box span:last-child {

    font-family: Arial, sans-serif;

    font-size: 22px;

    font-weight: bold;

    line-height: 24px;

    height: 24px;

    color: #00ff88;

    text-shadow:
        0 0 8px #00ff88;

    white-space: nowrap;

    font-variant-numeric:
        tabular-nums;
}


/* =====================================================
   جداکننده بالا
===================================================== */

.divider {

    width: 1px;

    height: 60%;

    flex: 0 0 1px;

    background:
        rgba(255,255,255,0.35);
}


/* =====================================================
   SESSION MAP
   اصلاح شده برای هماهنگی عمودی با نوار بالا
===================================================== */

.session-map {

    flex: 1;

    min-width: 0;

    display: flex;

    justify-content: center;

    align-items: center;

    position: relative;
}


.session-map-inner {

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    width: 100%;

    position: relative;

    transform: translateY(1px);
}


/* =====================================================
   عنوان SESSION
===================================================== */

.session-map-title {

    font-family: Arial, sans-serif;

    font-size: 12px;

    font-weight: bold;

    letter-spacing: 2.5px;

    line-height: 14px;

    height: 14px;

    color: #ffae4a;

    text-shadow:

        0 0 6px #ffae4a,
        0 0 14px rgba(255,174,74,0.35);

    margin-bottom: 5px;

    position: relative;
}


/* =====================================================
   مپ اصلی
===================================================== */

.session-track {

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 11px;

    height: 25px;

    position: relative;

    white-space: nowrap;

    transform: translateY(3px);
}


/* =====================================================
   Session Node
===================================================== */

.session-node {

    display: flex;

    align-items: center;

    gap: 5px;

    position: relative;

    font-family: Arial, sans-serif;

    font-size: 14px;

    font-weight: bold;

    letter-spacing: 0.8px;

    color: rgba(255,255,255,0.42);

    transition:

        color 0.35s ease,

        text-shadow 0.35s ease,

        opacity 0.35s ease;
}


.session-name {

    position: relative;

    z-index: 3;

    transition:

        color 0.35s ease,

        text-shadow 0.35s ease;
}


/* =====================================================
   Dot
===================================================== */

.session-dot {

    width: 6px;
    height: 6px;

    flex: 0 0 6px;

    border-radius: 50%;

    background: rgba(255,255,255,0.25);

    box-shadow:

        0 0 2px rgba(255,255,255,0.15);

    position: relative;

    z-index: 3;

    transition:

        background 0.35s ease,

        box-shadow 0.35s ease,

        transform 0.35s ease;
}


.session-dot::before {

    content: "";

    position: absolute;

    width: 17px;
    height: 17px;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%)
        scale(0.65);

    border-radius: 50%;

    border: 1px solid
        rgba(0,255,136,0);

    opacity: 0;

    transition:

        opacity 0.3s ease,

        transform 0.3s ease,

        border-color 0.3s ease;
}


/* =====================================================
   Session Active
===================================================== */

.session-node.active {

    color: #00ff88;

    text-shadow:

        0 0 5px #00ff88,
        0 0 12px rgba(0,255,136,0.8);
}


.session-node.active .session-dot {

    background: #00ff88;

    box-shadow:

        0 0 4px #00ff88,
        0 0 10px #00ff88,
        0 0 20px rgba(0,255,136,0.85);

    animation:
        activeDotPulse 1.25s ease-in-out infinite;
}


.session-node.active .session-dot::before {

    opacity: 0.65;

    transform:
        translate(-50%, -50%)
        scale(1);

    border-color:
        rgba(0,255,136,0.55);

    animation:
        activeHalo 1.25s ease-in-out infinite;
}


@keyframes activeDotPulse {

    0%,
    100% {

        transform: scale(0.82);

        opacity: 0.78;
    }

    50% {

        transform: scale(1.30);

        opacity: 1;
    }
}


@keyframes activeHalo {

    0%,
    100% {

        transform:
            translate(-50%, -50%)
            scale(0.75);

        opacity: 0.20;
    }

    50% {

        transform:
            translate(-50%, -50%)
            scale(1.35);

        opacity: 0.75;
    }
}


/* =====================================================
   خط اتصال
===================================================== */

.session-connector {

    width: 14px;

    height: 1px;

    flex: 0 0 14px;

    background:
        rgba(255,255,255,0.18);

    box-shadow:
        0 0 4px rgba(0,255,136,0.12);

    position: relative;

    overflow: hidden;
}


.session-map.has-active
.session-connector::after {

    content: "";

    position: absolute;

    top: 0;

    left: -100%;

    width: 60%;

    height: 100%;

    background:

        linear-gradient(
            90deg,
            transparent,
            rgba(0,255,136,0.9),
            transparent
        );

    animation:
        connectorSweep 3.2s ease-in-out infinite;

    opacity: 1;
}


@keyframes connectorSweep {

    0% {
        left: -100%;
    }

    55% {
        left: 130%;
    }

    100% {
        left: 130%;
    }
}


/* =====================================================
   هشدار OPEN
===================================================== */

.session-node.open-warning {

    color: #00ff88;

    animation:
        openWarningBlink 0.72s ease-in-out infinite;
}


.session-node.open-warning .session-dot {

    background: #00ff88;

    box-shadow:

        0 0 5px #00ff88,
        0 0 13px #00ff88,
        0 0 28px rgba(0,255,136,0.95);

    animation:
        openDotWarning 0.72s ease-in-out infinite;
}


.session-node.open-warning .session-dot::before {

    border-color:
        rgba(0,255,136,0.85);

    opacity: 1;

    animation:
        warningHalo 0.72s ease-in-out infinite;
}


@keyframes openWarningBlink {

    0%,
    100% {

        opacity: 1;

        text-shadow:

            0 0 6px #00ff88,
            0 0 16px #00ff88;
    }

    50% {

        opacity: 0.22;

        text-shadow:
            0 0 2px #00ff88;
    }
}


@keyframes openDotWarning {

    0%,
    100% {

        transform: scale(0.80);

        opacity: 0.55;
    }

    50% {

        transform: scale(1.45);

        opacity: 1;
    }
}


@keyframes warningHalo {

    0%,
    100% {

        transform:
            translate(-50%, -50%)
            scale(0.65);

        opacity: 0.20;
    }

    50% {

        transform:
            translate(-50%, -50%)
            scale(1.55);

        opacity: 0.85;
    }
}


/* =====================================================
   هشدار CLOSE
===================================================== */

.session-node.close-warning {

    color: #ff3333;

    animation:
        closeWarningBlink 0.65s ease-in-out infinite;
}


.session-node.close-warning .session-dot {

    background: #ff3333;

    box-shadow:

        0 0 5px #ff3333,
        0 0 13px #ff3333,
        0 0 30px rgba(255,51,51,0.95);

    animation:
        closeDotWarning 0.65s ease-in-out infinite;
}


.session-node.close-warning .session-dot::before {

    border-color:
        rgba(255,51,51,0.85);

    opacity: 1;

    animation:
        warningHaloRed 0.65s ease-in-out infinite;
}


@keyframes closeWarningBlink {

    0%,
    100% {

        opacity: 1;

        text-shadow:

            0 0 6px #ff3333,
            0 0 16px #ff3333;
    }

    50% {

        opacity: 0.18;

        text-shadow:
            0 0 2px #ff3333;
    }
}


@keyframes closeDotWarning {

    0%,
    100% {

        transform: scale(0.80);

        opacity: 0.55;
    }

    50% {

        transform: scale(1.50);

        opacity: 1;
    }
}


@keyframes warningHaloRed {

    0%,
    100% {

        transform:
            translate(-50%, -50%)
            scale(0.65);

        opacity: 0.20;
    }

    50% {

        transform:
            translate(-50%, -50%)
            scale(1.55);

        opacity: 0.85;
    }
}


/* =====================================================
   WEEKEND
===================================================== */

.session-map.weekend
.session-node {

    color: rgba(255,51,51,0.55);
}


.session-map.weekend
.session-dot {

    background: #ff3333;

    box-shadow:

        0 0 4px #ff3333,
        0 0 10px rgba(255,51,51,0.55);

    animation:
        closedWeekendPulse 1.8s ease-in-out infinite;
}


.session-map.weekend
.session-dot::before {

    border-color:
        rgba(255,51,51,0.45);

    opacity: 0.55;

    transform:
        translate(-50%, -50%)
        scale(0.9);
}


.session-map.weekend
.session-active-label {

    color: #ff3333;

    text-shadow:

        0 0 6px #ff3333,
        0 0 14px rgba(255,51,51,0.45);
}


@keyframes closedWeekendPulse {

    0%,
    100% {

        transform: scale(0.85);

        opacity: 0.55;
    }

    50% {

        transform: scale(1.15);

        opacity: 1;
    }
}


/* =====================================================
   Session Timer
===================================================== */

.session-timer {

    height: 15px;

    margin-top: 2px;

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 5px;

    font-family: Arial, sans-serif;

    font-size: 9px;

    font-weight: bold;

    letter-spacing: 1.1px;

    white-space: nowrap;

    color: #00ff88;

    text-shadow:

        0 0 5px #00ff88,
        0 0 10px rgba(0,255,136,0.45);

    opacity: 0;

    transition:
        opacity 0.3s ease;
}


.session-timer.visible {

    opacity: 1;
}


.session-timer.closed {

    color: #ff3333;

    text-shadow:

        0 0 5px #ff3333,
        0 0 10px rgba(255,51,51,0.45);
}


.timer-name {

    color: #ffae4a;

    text-shadow:
        0 0 5px #ffae4a;
}


.timer-count {

    font-variant-numeric:
        tabular-nums;

    letter-spacing: 1.3px;
}


/* =====================================================
   Active Label
   کوچک‌تر و فشرده‌تر شده
===================================================== */

.session-active-label {

    position: relative;

    height: 13px;

    margin-top: 2px;

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 4px;

    font-family: Arial, sans-serif;

    font-size: 8px;

    font-weight: bold;

    letter-spacing: 1.6px;

    line-height: 13px;

    color: #00ff88;

    text-shadow:

        0 0 5px #00ff88,
        0 0 11px rgba(0,255,136,0.45);

    opacity: 0;

    transition:
        opacity 0.35s ease;

    transform: translateY(3px);
}


.session-active-label.visible {

    opacity: 1;
}


.active-arrow {

    display: inline-block;

    font-size: 9px;

    animation:
        activeArrowFloat 1s ease-in-out infinite;
}


@keyframes activeArrowFloat {

    0%,
    100% {
        transform:
            translateY(1px);
    }

    50% {
        transform:
            translateY(-1px);
    }
}


/* =====================================================
   وبکم
===================================================== */

.webcam-frame {

    position: absolute;

    bottom: 170px;
    left: 80px;

    width: 430px;
    height: 250px;

    border: 4px solid #00ff66;

    border-radius: 0;

    background:
        rgba(0, 0, 0, 0.18);

    box-shadow:

        0 0 25px rgba(0, 255, 102, 1),
        0 0 55px rgba(0, 255, 102, 0.85),
        0 0 110px rgba(0, 255, 102, 0.65),
        0 0 160px rgba(0, 255, 102, 0.45);
}


/* =====================================================
   نوار پایین
===================================================== */

.bottom-bar {

    position: absolute;

    bottom: 55px;
    left: 50%;

    transform: translateX(-50%);

    width: 86%;
    height: 80px;

    clip-path: polygon(

        0 0,
        100% 0,
        100% calc(100% - 18px),
        calc(100% - 18px) 100%,
        18px 100%,
        0 calc(100% - 18px)

    );

    background:
        rgba(0, 0, 0, 0.35);

    border: 2px solid #00ff88;

    box-shadow:

        0 0 14px #00ff88,
        inset 0 0 14px #00ff88;

    display: flex;

    justify-content: space-between;

    align-items: center;

    padding: 0 40px;

    box-sizing: border-box;
}


/* =====================================================
   فونت نوار پایین
===================================================== */

.bottom-item span {

    font-family: Arial, sans-serif;

    font-size: 18px;

    font-weight: bold;

    line-height: 1;

    display: flex;

    align-items: center;

    white-space: nowrap;
}


.bottom-item {

    display: flex;

    align-items: center;

    gap: 10px;
}


.bottom-item:not(.subscribe) span {

    color: #4da6ff;

    text-shadow:
        0 0 6px #4da6ff;
}


.bottom-divider {

    width: 1px;

    height: 35px;

    background:
        rgba(255,255,255,0.22);

    flex-shrink: 0;
}


.bottom-icon {

    width: 40px;
    height: 40px;

    stroke: #ffffff;

    fill: none;

    display: flex;

    align-items: center;

    flex-shrink: 0;

    filter:
        drop-shadow(0 0 4px #ffb347);
}


/* =====================================================
   SUBSCRIBE
===================================================== */

.subscribe {

    position: relative;

    width: 145px;
    min-width: 145px;
    max-width: 145px;

    height: 40px;

    flex-shrink: 0;
}


.promo-state {

    position: absolute;

    left: 0;
    top: 50%;

    transform: translateY(-50%);

    display: flex;

    align-items: center;

    gap: 10px;

    white-space: nowrap;
}


.subscribe-state span {

    font-family: Arial, sans-serif;

    font-size: 18px;

    font-weight: bold;

    color: #ff3333;

    text-shadow:
        0 0 5px rgba(255,51,51,0.55);
}


.bell-icon {

    stroke: #ff3333;

    filter:
        drop-shadow(0 0 4px #ff3333);

    transform-origin: 50% 15%;
}


.subscribe-state .bell-icon {

    animation:
        bellMiddle 10s ease-in-out infinite;
}


@keyframes bellMiddle {

    0% {
        transform: rotate(0deg);
    }

    45% {
        transform: rotate(0deg);
    }

    47% {
        transform: rotate(-6deg);
    }

    48.5% {
        transform: rotate(6deg);
    }

    50% {
        transform: rotate(-4deg);
    }

    51.5% {
        transform: rotate(0deg);
    }

    53% {
        transform: rotate(-6deg);
    }

    54.5% {
        transform: rotate(6deg);
    }

    56% {
        transform: rotate(-4deg);
    }

    57.5% {
        transform: rotate(0deg);
    }

    100% {
        transform: rotate(0deg);
    }
}


/* =====================================================
   LIKE
===================================================== */

.like-state {

    display: none;
}


.like-state span {

    font-family: Arial, sans-serif;

    font-size: 18px;

    font-weight: bold;

    color: #4da6ff;

    text-shadow:
        0 0 5px rgba(77,166,255,0.55);
}


.like-icon {

    stroke: #4da6ff;

    filter:
        drop-shadow(0 0 4px #4da6ff);

    transform-origin: center;
}


.like-pulse {

    animation:
        likePulse 10s ease-in-out infinite;
}


@keyframes likePulse {

    0% {
        transform: scale(0.82);
    }

    8% {
        transform: scale(1.10);
    }

    15% {
        transform: scale(0.88);
    }

    22% {
        transform: scale(1.12);
    }

    29% {
        transform: scale(0.88);
    }

    38% {
        transform: scale(1);
    }

    100% {
        transform: scale(1);
    }
}


/* =====================================================
   VIP
===================================================== */

.vip {

    position: relative;

    overflow: hidden;
}


.vip span {

    animation:
        vipPulse 1.8s infinite ease-in-out;
}


@keyframes vipPulse {

    0% {

        text-shadow:
            0 0 6px #00ff88;
    }

    50% {

        text-shadow:
            0 0 18px #00ff88;
    }

    100% {

        text-shadow:
            0 0 6px #00ff88;
    }
}


.vip .shine {

    position: absolute;

    top: 0;
    left: -120%;

    width: 80%;
    height: 100%;

    background:

        linear-gradient(
            120deg,
            transparent,
            rgba(255,255,255,0.4),
            transparent
        );

    animation:
        shineSweep 3s infinite;
}


@keyframes shineSweep {

    0% {
        left: -120%;
    }

    50% {
        left: 120%;
    }

    100% {
        left: 120%;
    }
}

</style>

</head>

     TOP BAR

                id="session-tokyo"

                <span class="session-name">

                </span>

                <span class="session-dot"></span>

            </div>


            <div class="session-connector"></div>


            <div
                class="session-node"
                id="session-london"
            >

                <span class="session-name">
                    LON
                </span>

                <span class="session-dot"></span>

            </div>


            <div class="session-connector"></div>


            <div
                class="session-node"
                id="session-newyork"

                <span class="session-name">
                    NY

<script>

/* =====================================================
   SESSION CONFIG
===================================================== */

const SESSION_CONFIG = {

    sydney: {

        name: "Sydney",
        shortName: "SYD",
        open: "00:30",
        close: "09:30"

    },

    tokyo: {

        name: "Tokyo",
        shortName: "TOK",
        open: "03:30",
        close: "12:30"

    },

    london: {

        name: "London",
        shortName: "LON",
        open: "10:30",
        close: "19:30"

    },

    newyork: {

        name: "New York",
        shortName: "NY",
        open: "16:30",
        close: "00:30"

    }

};


const OPEN_WARNING_MINUTES = 5;

const CLOSE_WARNING_MINUTES = 5;


/* =====================================================
   DOM
===================================================== */

const marketValue =
    document.getElementById(
        "market-value"
    );


const sessionClockLabel =
    document.getElementById(
        "session-clock-label"
    );


const sessionClockValue =
    document.getElementById(
        "newyork-value"
    );


const tehranClockValue =
    document.getElementById(
        "tehran-value"
    );


const sessionMap =
    document.getElementById(
        "session-map"
    );


const sessionActiveLabel =
    document.getElementById(
        "session-active-label"
    );


const activeSessionText =
    document.getElementById(
        "active-session-text"
    );


const sessionTimer =
    document.getElementById(
        "session-timer"
    );


const timerSessionName =
    document.getElementById(
        "timer-session-name"
    );


const timerAction =
    document.getElementById(
        "timer-action"
    );


const timerCount =
    document.getElementById(
        "timer-count"
    );


const sessionNodes = {

    sydney:
        document.getElementById(
            "session-sydney"
        ),

    tokyo:
        document.getElementById(
            "session-tokyo"
        ),

    london:
        document.getElementById(
            "session-london"
        ),

    newyork:
        document.getElementById(
            "session-newyork"
        )

};


/* =====================================================
   HH:MM → minutes
===================================================== */

function timeToMinutes(time) {

    const [
        hours,
        minutes
    ] = time.split(":").map(Number);

    return (
        hours * 60 +
        minutes
    );

}


/* =====================================================
   تهران
===================================================== */

function getTehranDateParts(
    date = new Date()
) {

    const parts =
        new Intl.DateTimeFormat(
            "en-US",
            {

                timeZone:
                    "Asia/Tehran",

                year:
                    "numeric",

                month:
                    "2-digit",

                day:
                    "2-digit",

                hour:
                    "2-digit",

                minute:
                    "2-digit",

                second:
                    "2-digit",

                hourCycle:
                    "h23"

            }
        ).formatToParts(date);


    const result = {};


    parts.forEach(
        part => {

            if (
                part.type !==
                "literal"
            ) {

                result[part.type] =
                    part.value;

            }

        }
    );


    return {

        year:
            Number(result.year),

        month:
            Number(result.month),

        day:
            Number(result.day),

        hour:
            Number(result.hour),

        minute:
            Number(result.minute),

        second:
            Number(result.second)

    };

}


/* =====================================================
   روز هفته تهران
===================================================== */

function getTehranDayOfWeek(
    date = new Date()
) {

    const parts =
        getTehranDateParts(
            date
        );


    const utcDate =
        new Date(
            Date.UTC(
                parts.year,
                parts.month - 1,
                parts.day
            )
        );


    return utcDate.getUTCDay();

}


/* =====================================================
   تعطیلی هفتگی
===================================================== */

function isWeekend(
    date = new Date()
) {

    const day =
        getTehranDayOfWeek(
            date
        );


    return (
        day === 0 ||
        day === 6
    );

}


/* =====================================================
   آیا روز معاملاتی است؟
===================================================== */

function isTradingDay(
    date = new Date()
) {

    return !isWeekend(date);

}


/* =====================================================
   دقیقه فعلی تهران
===================================================== */

function getCurrentTehranMinute(
    date = new Date()
) {

    const parts =
        getTehranDateParts(
            date
        );


    return (
        parts.hour * 60 +
        parts.minute +
        parts.second / 60
    );

}


/* =====================================================
   وضعیت خام Session
===================================================== */

function getSessionState(
    session,
    currentMinute
) {

    const open =
        timeToMinutes(
            session.open
        );


    const close =
        timeToMinutes(
            session.close
        );


    let isOpen;


    if (open < close) {

        isOpen =
            currentMinute >= open &&
            currentMinute < close;

    }

    else {

        isOpen =
            currentMinute >= open ||
            currentMinute < close;

    }


    return {

        open,
        close,
        isOpen

    };

}


/* =====================================================
   Session فعال واقعی
===================================================== */

function getActiveSessions(
    currentMinute,
    date = new Date()
) {

    if (
        !isTradingDay(date)
    ) {

        return [];

    }


    const active = [];


    Object.entries(
        SESSION_CONFIG
    ).forEach(
        ([id, session]) => {

            const state =
                getSessionState(
                    session,
                    currentMinute
                );


            if (
                state.isOpen
            ) {

                active.push({

                    id,

                    ...session,

                    ...state

                });

            }

        }
    );


    return active;

}


/* =====================================================
   Session اصلی
===================================================== */

function getPrimaryActiveSession(
    currentMinute,
    date = new Date()
) {

    const active =
        getActiveSessions(
            currentMinute,
            date
        );


    if (
        active.length === 0
    ) {

        return null;

    }


    let primary = null;

    let bestScore = -Infinity;


    active.forEach(
        session => {

            let score =
                timeToMinutes(
                    session.open
                );


            if (
                session.id === "newyork" &&
                currentMinute <
                    timeToMinutes(
                        session.close
                    )
            ) {

                score -= 1440;

            }


            if (
                score > bestScore
            ) {

                bestScore =
                    score;

                primary =
                    session;

            }

        }
    );


    return primary;

}


/* =====================================================
   MARKET STATUS
===================================================== */

function isMarketOpen(
    currentMinute,
    date = new Date()
) {

    if (
        !isTradingDay(date)
    ) {

        return false;

    }


    return (
        getActiveSessions(
            currentMinute,
            date
        ).length > 0
    );

}


/* =====================================================
   فاصله تا OPEN
===================================================== */

function getMinutesUntilOpen(
    session,
    currentMinute
) {

    const open =
        timeToMinutes(
            session.open
        );


    let diff =
        open -
        currentMinute;


    if (
        diff < 0
    ) {

        diff += 1440;

    }


    return diff;

}


/* =====================================================
   فاصله تا CLOSE
===================================================== */

function getMinutesUntilClose(
    session,
    currentMinute
) {

    const close =
        timeToMinutes(
            session.close
        );


    let diff =
        close -
        currentMinute;


    if (
        diff < 0
    ) {

        diff += 1440;

    }


    return diff;

}


/* =====================================================
   هشدار OPEN
===================================================== */

function isOpenWarning(
    session,
    currentMinute
) {

    const minutes =
        getMinutesUntilOpen(
            session,
            currentMinute
        );


    return (

        minutes > 0 &&

        minutes <=
            OPEN_WARNING_MINUTES

    );

}


/* =====================================================
   هشدار CLOSE
===================================================== */

function isCloseWarning(
    session,
    currentMinute
) {

    const minutes =
        getMinutesUntilClose(
            session,
            currentMinute
        );


    return (

        minutes > 0 &&

        minutes <=
            CLOSE_WARNING_MINUTES

    );

}


/* =====================================================
   NEXT SESSION EVENT
===================================================== */

function getNextSessionEvent(
    now = new Date()
) {

    const currentMinute =
        getCurrentTehranMinute(
            now
        );


    if (
        isWeekend(now)
    ) {

        return {

            type: "open",

            session:
                SESSION_CONFIG.sydney,

            seconds:
                getSecondsUntilNextMondaySydney(
                    now
                )

        };

    }


    const active =
        getActiveSessions(
            currentMinute,
            now
        );


    if (
        active.length > 0
    ) {

        const primary =
            getPrimaryActiveSession(
                currentMinute,
                now
            );


        const seconds =
            getSecondsUntilSessionClose(
                primary,
                now
            );


        return {

            type: "close",

            session:
                primary,

            seconds

        };

    }


    const upcoming = [];


    Object.values(
        SESSION_CONFIG
    ).forEach(
        session => {

            const minutes =
                getMinutesUntilOpen(
                    session,
                    currentMinute
                );


            if (
                minutes > 0
            ) {

                upcoming.push({

                    session,

                    minutes

                });

            }

        }
    );


    upcoming.sort(
        (a, b) =>
            a.minutes -
            b.minutes
    );


    if (
        upcoming.length > 0
    ) {

        const item =
            upcoming[0];


        return {

            type: "open",

            session:
                item.session,

            seconds:
                Math.max(
                    0,
                    Math.round(
                        item.minutes *
                        60
                    )
                )

        };

    }


    return {

        type: "open",

        session:
            SESSION_CONFIG.sydney,

        seconds:
            0

    };

}


/* =====================================================
   ثانیه تا دوشنبه 00:30 Sydney
===================================================== */

function getSecondsUntilNextMondaySydney(
    now = new Date()
) {

    const parts =
        getTehranDateParts(
            now
        );


    const currentDay =
        getTehranDayOfWeek(
            now
        );


    let daysUntilMonday =
        (1 - currentDay + 7) % 7;


    if (
        currentDay === 1
    ) {

        const currentSeconds =
            parts.hour * 3600 +
            parts.minute * 60 +
            parts.second;


        const targetSeconds =
            30 * 60;


        if (
            currentSeconds <
            targetSeconds
        ) {

            daysUntilMonday = 0;

        }

        else {

            daysUntilMonday = 7;

        }

    }


    const currentTotalSeconds =
        parts.hour * 3600 +
        parts.minute * 60 +
        parts.second;


    const targetTotalSeconds =
        (24 * 3600) -
        currentTotalSeconds +
        (daysUntilMonday - 1) *
            24 * 3600 +
        30 * 60;


    return Math.max(
        0,
        targetTotalSeconds
    );

}


/* =====================================================
   ثانیه تا CLOSE واقعی Session
===================================================== */

function getSecondsUntilSessionClose(
    session,
    now = new Date()
) {

    const parts =
        getTehranDateParts(
            now
        );


    const currentSeconds =
        parts.hour * 3600 +
        parts.minute * 60 +
        parts.second;


    const closeMinutes =
        timeToMinutes(
            session.close
        );


    const closeSeconds =
        closeMinutes * 60;


    let diff =
        closeSeconds -
        currentSeconds;


    if (
        diff < 0
    ) {

        diff +=
            24 * 3600;

    }


    return diff;

}


/* =====================================================
   تبدیل ثانیه به HH:MM:SS
===================================================== */

function formatDuration(
    totalSeconds
) {

    totalSeconds =
        Math.max(
            0,
            Math.floor(
                totalSeconds
            )
        );


    const hours =
        Math.floor(
            totalSeconds / 3600
        );


    const minutes =
        Math.floor(
            (totalSeconds % 3600) /
            60
        );


    const seconds =
        totalSeconds % 60;


    return (

        String(hours)
            .padStart(2, "0") +

        ":" +

        String(minutes)
            .padStart(2, "0") +

        ":" +

        String(seconds)
            .padStart(2, "0")

    );

}


/* =====================================================
   SESSION TIMER UI
===================================================== */

function updateSessionTimer(
    now = new Date()
) {

    const event =
        getNextSessionEvent(
            now
        );


    sessionTimer.classList.add(
        "visible"
    );


    timerSessionName.innerText =
        event.session.shortName;


    timerCount.innerText =
        formatDuration(
            event.seconds
        );


    if (
        event.type === "open"
    ) {

        timerAction.innerText =
            "OPEN IN";


        sessionTimer.classList.remove(
            "closed"
        );

    }

    else {

        timerAction.innerText =
            "CLOSE IN";


        sessionTimer.classList.remove(
            "closed"
        );

    }


    if (
        isWeekend(now)
    ) {

        sessionTimer.classList.add(
            "closed"
        );

    }

}


/* =====================================================
   SESSION MAP
===================================================== */

function updateSessionMap(
    currentMinute,
    now = new Date()
) {

    sessionMap.classList.remove(
        "has-active"
    );


    Object.values(
        sessionNodes
    ).forEach(
        node => {

            node.classList.remove(
                "active",
                "open-warning",
                "close-warning"
            );

        }
    );


    if (
        isWeekend(now)
    ) {

        sessionMap.classList.add(
            "weekend"
        );


        sessionActiveLabel.classList.add(
            "visible"
        );


        activeSessionText.innerText =
            "MARKET CLOSED";


        return;

    }


    sessionMap.classList.remove(
        "weekend"
    );


    const active =
        getActiveSessions(
            currentMinute,
            now
        );


    if (
        active.length > 0
    ) {

        sessionMap.classList.add(
            "has-active"
        );

    }


    active.forEach(
        session => {

            const node =
                sessionNodes[
                    session.id
                ];


            if (!node) {
                return;
            }


            node.classList.add(
                "active"
            );

        }
    );


    Object.entries(
        SESSION_CONFIG
    ).forEach(
        ([id, session]) => {

            const node =
                sessionNodes[id];


            if (!node) {
                return;
            }


            const state =
                getSessionState(
                    session,
                    currentMinute
                );


            if (
                state.isOpen &&
                isCloseWarning(
                    session,
                    currentMinute
                )
            ) {

                node.classList.remove(
                    "active"
                );


                node.classList.add(
                    "close-warning"
                );

            }


            else if (
                !state.isOpen &&
                isOpenWarning(
                    session,
                    currentMinute
                )
            ) {

                node.classList.add(
                    "open-warning"
                );

            }

        }
    );


    if (
        active.length > 0
    ) {

        sessionActiveLabel.classList.add(
            "visible"
        );


        activeSessionText.innerText =
            "ACTIVE";

    }

    else {

        sessionActiveLabel.classList.remove(
            "visible"
        );

    }

}


/* =====================================================
   MARKET
===================================================== */

function updateMarket(
    currentMinute,
    now = new Date()
) {

    const open =
        isMarketOpen(
            currentMinute,
            now
        );


    if (open) {

        marketValue.innerText =
            "OPEN";


        marketValue.style.color =
            "#00ff88";


        marketValue.style.textShadow =
            "0 0 8px #00ff88";

    }

    else {

        marketValue.innerText =
            "CLOSED";


        marketValue.style.color =
            "#ff3333";


        marketValue.style.textShadow =
            "0 0 8px #ff3333";

    }

}


/* =====================================================
   ساعت تهران
===================================================== */

function getTehranTime(
    date = new Date()
) {

    return new Intl.DateTimeFormat(
        "en-US",
        {

            timeZone:
                "Asia/Tehran",

            hour:
                "2-digit",

            minute:
                "2-digit",

            second:
                "2-digit",

            hour12:
                true

        }
    ).format(date);

}


/* =====================================================
   تاریخ میلادی
   نسخه اصلاح‌شده
===================================================== */

function getDate(
    date = new Date()
) {

    const months = [

        "JAN",
        "FEB",
        "MAR",
        "APR",
        "MAY",
        "JUN",
        "JUL",
        "AUG",
        "SEP",
        "OCT",
        "NOV",
        "DEC"

    ];


    const day =
        String(
            date.getDate()
        ).padStart(
            2,
            "0"
        );


    const month =
        months[
            date.getMonth()
        ];


    const year =
        date.getFullYear();


    return `${day} ${month} ${year}`;

}


/* =====================================================
   CLOCKS
===================================================== */

function updateClocks() {

    const now =
        new Date();


    const tehranParts =
        getTehranDateParts(
            now
        );


    const currentMinute =
        tehranParts.hour * 60 +
        tehranParts.minute +
        tehranParts.second / 60;


    /*
       تهران
    */

    tehranClockValue.innerText =
        getTehranTime(
            now
        );


    /*
       Session Map
    */

    updateSessionMap(
        currentMinute,
        now
    );


    /*
       Market
    */

    updateMarket(
        currentMinute,
        now
    );


    /*
       Session Timer
    */

    updateSessionTimer(
        now
    );


    /*
       Primary Session Clock
    */

    const activeSession =
        getPrimaryActiveSession(
            currentMinute,
            now
        );


    if (
        !activeSession
    ) {

        sessionClockLabel.innerText =
            "MARKET";


        sessionClockValue.innerText =
            "--:--:--";

    }

    else {

        sessionClockLabel.innerText =
            activeSession.name
                .toUpperCase();


        sessionClockValue.innerText =
            getTehranTime(
                now
            );

    }


    /*
       DATE
    */

    document.getElementById(
        "date-value"
    ).innerText =
        getDate(
            now
        );

}


/* =====================================================
   START CLOCK
===================================================== */

setInterval(
    updateClocks,
    1000
);


updateClocks();


/* =====================================================
   SUBSCRIBE / LIKE
===================================================== */

const subscribeState =
    document.querySelector(
        ".subscribe-state"
    );


const likeState =
    document.querySelector(
        ".like-state"
    );


const likeIcon =
    document.querySelector(
        ".like-icon"
    );


setInterval(
    function () {

        if (

            subscribeState.style.display !==
            "none"

        ) {

            subscribeState.style.display =
                "none";


            likeState.style.display =
                "flex";


            likeIcon.classList.remove(
                "like-pulse"
            );


            void likeIcon.offsetWidth;


            likeIcon.classList.add(
                "like-pulse"
            );

        }

        else {

            likeState.style.display =
                "none";


            subscribeState.style.display =
                "flex";

        }

    },

    10000

);

</script>
