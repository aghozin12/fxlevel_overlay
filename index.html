/* =========================
   صفحه اصلی

html, body {

    background: #808080;
    font-family: Arial, sans-serif;

/* =========================
   افکت شبکه‌ای پس‌زمینه
========================= */

body::before {
    content: "";
    position: absolute;
    inset: 0;

    background-image:
        linear-gradient(rgba(0,255,136,0.40) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,255,136,0.40) 1px, transparent 1px);

    background-size: 40px 40px;

   فریم اصلی

.main-frame {
    position: absolute;
    top: 40px;
    left: 40px;

    width: calc(100% - 80px);
    height: calc(100% - 80px);

    clip-path: polygon(
        25px 0,
        calc(100% - 25px) 0,
        100% 25px,
        100% calc(100% - 25px),
        calc(100% - 25px) 100%,
        25px 100%,
        0 calc(100% - 25px),
        0 25px
    );

    background: rgba(0, 0, 0, 0.18);

    border: 3px solid #00ff88;

    box-shadow:
        0 0 25px #00ff88,

}

========================= */

<script>

function updateClocks() {

    const tehranTime =
        new Date().toLocaleTimeString("en-US", {
            timeZone: "Asia/Tehran",
            hour12: true
        });


    const newYorkTime =
        new Date().toLocaleTimeString("en-US", {
            timeZone: "America/New_York",
            hour12: true
        });


    const today =
        new Date().toLocaleDateString("en-US", {
            timeZone: "Asia/Tehran",
            day: "2-digit",
            month: "short",
            year: "numeric"
        });


    const tehranHour =
        parseInt(
            new Date().toLocaleString("en-US", {
                timeZone: "Asia/Tehran",
                hour: "numeric",
                hour12: false
            })
        );


    const tehranMinute =
        parseInt(
            new Date().toLocaleString("en-US", {
                timeZone: "Asia/Tehran",
                minute: "numeric"
            })
        );


    let sessionName =
        (
            tehranHour < 16 ||
            (
                tehranHour === 16 &&
                tehranMinute < 30
            )
        )
        ? "London"
        : "New York";


    document.getElementById("session-value").innerText =
        sessionName;

    document.getElementById("tehran-value").innerText =
        tehranTime;

    document.getElementById("newyork-value").innerText =
        newYorkTime;

    document.getElementById("date-value").innerText =
        today;
}


setInterval(updateClocks, 1000);

updateClocks();


/* =========================
   خبر MarketWatch
========================= */

async function updateNews() {

    try {

        const rssUrl =
            "https://www.marketwatch.com/rss/topstories";


        const response =
            await fetch(
                `https://api.allorigins.win/get?url=${encodeURIComponent(rssUrl)}`
            );


        const data =
            await response.json();


        const parser =
            new DOMParser();


        const xml =
            parser.parseFromString(
                data.contents,
                "text/xml"
            );


        const firstItem =
            xml.querySelector("item > title").textContent;


        const shortTitle =
            firstItem.length > 55
                ? firstItem.slice(0, 55) + "..."
                : firstItem;


        document.getElementById("news-value").innerText =
            shortTitle;

    }

    catch (e) {

        document.getElementById("news-value").innerText =
            "Loading...";

    }
}


updateNews();

setInterval(updateNews, 30000);


/* =========================
   SUBSCRIBE / LIKE
========================= */

const subscribeState =
    document.querySelector(".subscribe-state");

const likeState =
    document.querySelector(".like-state");


let showSubscribe = true;


setInterval(() => {

    if (showSubscribe) {

        /* نمایش LIKE */

        subscribeState.style.display = "none";

        likeState.style.display = "flex";


        /* بزرگ شدن بسیار کوتاه آیکون Like */

        const likeIcon =
            likeState.querySelector(".like-icon");


        likeIcon.animate(
            [
                {
                    transform: "scale(1)"
                },

                {
                    transform: "scale(1.10)"
                },

                {
                    transform: "scale(1)"
                }
            ],
            {
                duration: 450,
                easing: "ease-out"
            }
        );

    }

    else {

        /* نمایش SUBSCRIBE */

        likeState.style.display = "none";

        subscribeState.style.display = "flex";

    }


    showSubscribe = !showSubscribe;


}, 10000);

</script>
