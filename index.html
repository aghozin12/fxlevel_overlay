<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<title>FX LEVEL Overlay</title>

<style>

/* =====================================================
   صفحه اصلی
===================================================== */

html,
body {

    width: 1920px;
    height: 1080px;

    margin: 0;
    padding: 0;

    overflow: hidden;

    background: #808080;

    font-family: Arial, sans-serif;

    color: white;
}


/* =====================================================
   شبکه پس‌زمینه
===================================================== */

body::before {

    content: "";

    position: absolute;

    inset: 0;

    background-image:

        linear-gradient(
            rgba(0,255,136,0.40) 1px,
            transparent 1px
        ),

        linear-gradient(
            90deg,
            rgba(0,255,136,0.40) 1px,
            transparent 1px
        );

    background-size: 40px 40px;

    pointer-events: none;
}


/* =====================================================
   فریم اصلی
===================================================== */

.main-frame {

    position: absolute;

    top: 40px;
    left: 40px;

    width: calc(100% - 80px);
    height: calc(100% - 80px);

    clip-path: polygon(

        25px 0,
        calc(100% - 25px) 0,
        100% 25px,
        100% calc(100% - 25px),
        calc(100% - 25px) 100%,
        25px 100%,
        0 calc(100% - 25px),
        0 25px

    );

    background: rgba(0, 0, 0, 0.18);

    border: 3px solid #00ff88;

    box-shadow:

        0 0 25px #00ff88,
        inset 0 0 25px #00ff88;
}


/* =====================================================
   نوار بالا
===================================================== */

.top-bar {

    position: absolute;

    top: 55px;
    left: 50%;

    transform: translateX(-50%);

    width: 86%;
    height: 90px;

    clip-path: polygon(

        18px 0,
        calc(100% - 18px) 0,
        100% 18px,
        100% 100%,
        0 100%,
        0 18px

    );

    background: rgba(0, 0, 0, 0.35);

    border: 2px solid #00ff88;

    box-shadow:

        0 0 14px #00ff88,
        inset 0 0 14px #00ff88;

    display: flex;

    justify-content: space-between;

    align-items: center;

    padding: 0 35px;

    box-sizing: border-box;
}


/* =====================================================
   آیتم‌های نوار بالا
===================================================== */

.top-item {

    flex: 1;

    display: flex;

    justify-content: center;
}


.item-row {

    display: flex;

    align-items: center;

    gap: 14px;
}


/* =====================================================
   آیکون‌های بالا
===================================================== */

.icon {

    width: 40px;
    height: 40px;

    stroke: #ffffff;

    fill: none;

    filter:
        drop-shadow(0 0 6px #00ff88);
}


/* =====================================================
   متن‌های بالا
===================================================== */

.text-box {

    display: flex;

    flex-direction: column;

    line-height: 1.1;
}


.text-box span:first-child {

    font-size: 14px;

    color: #ffae4a;

    text-shadow:
        0 0 6px #ffae4a;
}


.text-box span:last-child {

    font-size: 22px;

    font-weight: bold;

    color: #00ff88;

    text-shadow:
        0 0 8px #00ff88;
}


/* =====================================================
   جداکننده بالا
===================================================== */

.divider {

    width: 1px;

    height: 60%;

    background:
        rgba(255,255,255,0.35);
}


/* =====================================================
   SESSION MAP
===================================================== */

.session-map {

    flex: 1.25;

    display: flex;

    justify-content: center;

    align-items: center;

    min-width: 360px;

    position: relative;
}


.session-map-inner {

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    width: 100%;

    position: relative;
}


/* =====================================================
   عنوان SESSION
===================================================== */

.session-map-title {

    font-size: 13px;

    font-weight: bold;

    letter-spacing: 3px;

    color: #ffae4a;

    text-shadow:

        0 0 6px #ffae4a,
        0 0 14px rgba(255,174,74,0.35);

    margin-bottom: 8px;

    position: relative;
}


/* =====================================================
   مپ اصلی
===================================================== */

.session-track {

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 13px;

    height: 27px;

    position: relative;
}


/* =====================================================
   Session Node
===================================================== */

.session-node {

    display: flex;

    align-items: center;

    gap: 6px;

    position: relative;

    font-size: 15px;

    font-weight: bold;

    letter-spacing: 1px;

    color: rgba(255,255,255,0.42);

    transition:

        color 0.35s ease,

        text-shadow 0.35s ease,

        opacity 0.35s ease;
}


.session-name {

    position: relative;

    z-index: 3;

    transition:

        color 0.35s ease,

        text-shadow 0.35s ease;
}


/* =====================================================
   Dot
===================================================== */

.session-dot {

    width: 7px;
    height: 7px;

    border-radius: 50%;

    background: rgba(255,255,255,0.25);

    box-shadow:

        0 0 2px rgba(255,255,255,0.15);

    position: relative;

    z-index: 3;

    transition:

        background 0.35s ease,

        box-shadow 0.35s ease,

        transform 0.35s ease;
}


/* =====================================================
   Halo پشت Dot
===================================================== */

.session-dot::before {

    content: "";

    position: absolute;

    width: 18px;
    height: 18px;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%)
        scale(0.65);

    border-radius: 50%;

    border: 1px solid
        rgba(0,255,136,0.0);

    opacity: 0;

    transition:

        opacity 0.3s ease,

        transform 0.3s ease,

        border-color 0.3s ease;
}


/* =====================================================
   Session Active
===================================================== */

.session-node.active {

    color: #00ff88;

    text-shadow:

        0 0 5px #00ff88,
        0 0 12px rgba(0,255,136,0.8);
}


.session-node.active .session-dot {

    background: #00ff88;

    box-shadow:

        0 0 4px #00ff88,
        0 0 10px #00ff88,
        0 0 20px rgba(0,255,136,0.85);

    animation:
        activeDotPulse 1.25s ease-in-out infinite;
}


.session-node.active .session-dot::before {

    opacity: 0.65;

    transform:
        translate(-50%, -50%)
        scale(1);

    border-color:
        rgba(0,255,136,0.55);

    animation:
        activeHalo 1.25s ease-in-out infinite;
}


@keyframes activeDotPulse {

    0%,
    100% {

        transform: scale(0.82);

        opacity: 0.78;
    }

    50% {

        transform: scale(1.30);

        opacity: 1;
    }
}


@keyframes activeHalo {

    0%,
    100% {

        transform:
            translate(-50%, -50%)
            scale(0.75);

        opacity: 0.20;
    }

    50% {

        transform:
            translate(-50%, -50%)
            scale(1.35);

        opacity: 0.75;
    }
}


/* =====================================================
   خط اتصال
===================================================== */

.session-connector {

    width: 16px;

    height: 1px;

    background:
        rgba(255,255,255,0.18);

    box-shadow:
        0 0 4px rgba(0,255,136,0.12);

    position: relative;

    overflow: hidden;
}


.session-connector::after {

    content: "";

    position: absolute;

    top: 0;

    left: -100%;

    width: 60%;

    height: 100%;

    background:

        linear-gradient(
            90deg,
            transparent,
            rgba(0,255,136,0.9),
            transparent
        );

    opacity: 0;
}


.session-map.has-active
.session-connector::after {

    animation:
        connectorSweep 3.2s ease-in-out infinite;

    opacity: 1;
}


@keyframes connectorSweep {

    0% {
        left: -100%;
    }

    55% {
        left: 130%;
    }

    100% {
        left: 130%;
    }
}


/* =====================================================
   هشدار OPEN
===================================================== */

.session-node.open-warning {

    color: #00ff88;

    animation:
        openWarningBlink 0.72s ease-in-out infinite;
}


.session-node.open-warning .session-dot {

    background: #00ff88;

    box-shadow:

        0 0 5px #00ff88,
        0 0 13px #00ff88,
        0 0 28px rgba(0,255,136,0.95);

    animation:
        openDotWarning 0.72s ease-in-out infinite;
}


.session-node.open-warning .session-dot::before {

    border-color:
        rgba(0,255,136,0.85);

    opacity: 1;

    animation:
        warningHalo 0.72s ease-in-out infinite;
}


@keyframes openWarningBlink {

    0%,
    100% {

        opacity: 1;

        text-shadow:

            0 0 6px #00ff88,
            0 0 16px #00ff88;
    }

    50% {

        opacity: 0.22;

        text-shadow:

            0 0 2px #00ff88;
    }
}


@keyframes openDotWarning {

    0%,
    100% {

        transform: scale(0.80);

        opacity: 0.55;
    }

    50% {

        transform: scale(1.45);

        opacity: 1;
    }
}


@keyframes warningHalo {

    0%,
    100% {

        transform:
            translate(-50%, -50%)
            scale(0.65);

        opacity: 0.20;
    }

    50% {

        transform:
            translate(-50%, -50%)
            scale(1.55);

        opacity: 0.85;
    }
}


/* =====================================================
   هشدار CLOSE
===================================================== */

.session-node.close-warning {

    color: #ff3333;

    animation:
        closeWarningBlink 0.65s ease-in-out infinite;
}


.session-node.close-warning .session-dot {

    background: #ff3333;

    box-shadow:

        0 0 5px #ff3333,
        0 0 13px #ff3333,
        0 0 30px rgba(255,51,51,0.95);

    animation:
        closeDotWarning 0.65s ease-in-out infinite;
}


.session-node.close-warning .session-dot::before {

    border-color:
        rgba(255,51,51,0.85);

    opacity: 1;

    animation:
        warningHaloRed 0.65s ease-in-out infinite;
}


@keyframes closeWarningBlink {

    0%,
    100% {

        opacity: 1;

        text-shadow:

            0 0 6px #ff3333,
            0 0 16px #ff3333;
    }

    50% {

        opacity: 0.18;

        text-shadow:

            0 0 2px #ff3333;
    }
}


@keyframes closeDotWarning {

    0%,
    100% {

        transform: scale(0.80);

        opacity: 0.55;
    }

    50% {

        transform: scale(1.50);

        opacity: 1;
    }
}


@keyframes warningHaloRed {

    0%,
    100% {

        transform:
            translate(-50%, -50%)
            scale(0.65);

        opacity: 0.20;
    }

    50% {

        transform:
            translate(-50%, -50%)
            scale(1.55);

        opacity: 0.85;
    }
}


/* =====================================================
   Weekend
===================================================== */

.session-map.weekend
.session-map-title {

    color: #ffae4a;

    text-shadow:
        0 0 6px #ffae4a;
}


.session-map.weekend
.session-node {

    color: rgba(255,51,51,0.55);
}


.session-map.weekend
.session-dot {

    background: #ff3333;

    box-shadow:

        0 0 4px #ff3333,
        0 0 10px rgba(255,51,51,0.55);

    animation:
        closedWeekendPulse 1.8s ease-in-out infinite;
}


.session-map.weekend
.session-dot::before {

    border-color:
        rgba(255,51,51,0.45);

    opacity: 0.55;

    transform:
        translate(-50%, -50%)
        scale(0.9);
}


.session-map.weekend
.session-active-label {

    color: #ff3333;

    text-shadow:

        0 0 6px #ff3333,
        0 0 14px rgba(255,51,51,0.45);
}


@keyframes closedWeekendPulse {

    0%,
    100% {

        transform: scale(0.85);

        opacity: 0.55;
    }

    50% {

        transform: scale(1.15);

        opacity: 1;
    }
}


/* =====================================================
   Label فعال
===================================================== */

.session-active-label {

    position: relative;

    height: 18px;

    margin-top: 3px;

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 5px;

    font-size: 10px;

    font-weight: bold;

    letter-spacing: 2px;

    color: #00ff88;

    text-shadow:

        0 0 6px #00ff88,
        0 0 14px rgba(0,255,136,0.45);

    opacity: 0;

    transition:
        opacity 0.35s ease;
}


.session-active-label.visible {

    opacity: 1;
}


.active-arrow {

    display: inline-block;

    font-size: 12px;

    animation:
        activeArrowFloat 1s ease-in-out infinite;
}


@keyframes activeArrowFloat {

    0%,
    100% {

        transform:
            translateY(2px);
    }

    50% {

        transform:
            translateY(-1px);
    }
}


/* =====================================================
   =====================================================
   SESSION TIMER — بخش سوم
   =====================================================
===================================================== */

.session-timer {

    flex: 1;

    min-width: 250px;

    display: flex;

    justify-content: center;

    align-items: center;

    position: relative;

    height: 100%;
}


.session-timer-inner {

    width: 230px;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    position: relative;

    line-height: 1;
}


/* =====================================================
   عنوان ثابت
===================================================== */

.session-timer-title {

    font-size: 12px;

    font-weight: bold;

    letter-spacing: 3px;

    color: #ffae4a;

    text-shadow:

        0 0 6px #ffae4a,
        0 0 12px rgba(255,174,74,0.35);

    margin-bottom: 7px;
}


/* =====================================================
   نام Session + تایمر
===================================================== */

.session-timer-main {

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 10px;

    min-height: 25px;

    white-space: nowrap;
}


#timer-session-name {

    font-size: 15px;

    font-weight: bold;

    letter-spacing: 1px;

    color: #00ff88;

    text-shadow:

        0 0 5px #00ff88,
        0 0 12px rgba(0,255,136,0.55);

    transition:

        color 0.3s ease,

        text-shadow 0.3s ease;
}


#session-countdown {

    font-size: 20px;

    font-weight: bold;

    letter-spacing: 1px;

    font-variant-numeric: tabular-nums;

    color: #ffffff;

    text-shadow:

        0 0 6px rgba(255,255,255,0.75);

    transition:

        color 0.3s ease,

        text-shadow 0.3s ease,

        opacity 0.3s ease;
}


/* =====================================================
   خط تایمر
===================================================== */

.session-timer-line {

    position: relative;

    width: 190px;

    height: 2px;

    margin-top: 9px;

    background:
        rgba(255,255,255,0.16);

    box-shadow:
        0 0 4px rgba(0,255,136,0.18);

    overflow: visible;
}


/* خط پرشونده */

.session-timer-progress {

    position: absolute;

    top: 0;

    left: 0;

    height: 100%;

    width: 0%;

    background: #00ff88;

    box-shadow:

        0 0 5px #00ff88,
        0 0 12px rgba(0,255,136,0.75);

    transition:
        width 0.5s linear,
        background 0.3s ease,
        box-shadow 0.3s ease;
}


/* نقطه */

.session-timer-dot {

    position: absolute;

    top: 50%;

    left: 0%;

    width: 7px;

    height: 7px;

    border-radius: 50%;

    transform:
        translate(-50%, -50%);

    background: #00ff88;

    box-shadow:

        0 0 5px #00ff88,
        0 0 13px #00ff88;

    transition:

        left 0.5s linear,

        background 0.3s ease,

        box-shadow 0.3s ease;
}


/* =====================================================
   حالت Waiting / Open
===================================================== */

.session-timer.waiting
#timer-session-name {

    color: #ffae4a;

    text-shadow:

        0 0 6px #ffae4a,
        0 0 14px rgba(255,174,74,0.55);
}


.session-timer.waiting
#session-countdown {

    color: #ffae4a;

    text-shadow:

        0 0 6px #ffae4a,
        0 0 12px rgba(255,174,74,0.55);
}


.session-timer.waiting
.session-timer-progress {

    left: auto;

    right: 0;

    background: #ffae4a;

    box-shadow:

        0 0 5px #ffae4a,
        0 0 12px rgba(255,174,74,0.75);
}


.session-timer.waiting
.session-timer-dot {

    background: #ffae4a;

    box-shadow:

        0 0 5px #ffae4a,
        0 0 13px #ffae4a;
}


/* =====================================================
   حالت Active / Close
===================================================== */

.session-timer.active
.session-timer-progress {

    background: #00ff88;

    box-shadow:

        0 0 5px #00ff88,
        0 0 12px rgba(0,255,136,0.75);
}


/* =====================================================
   هشدار نزدیک Open
===================================================== */

.session-timer.open-warning
#timer-session-name,
.session-timer.open-warning
#session-countdown {

    color: #00ff88;

    animation:
        timerOpenBlink 0.72s ease-in-out infinite;
}


@keyframes timerOpenBlink {

    0%,
    100% {

        opacity: 1;

    }

    50% {

        opacity: 0.25;

    }
}


/* =====================================================
   هشدار نزدیک Close
===================================================== */

.session-timer.close-warning
#timer-session-name,
.session-timer.close-warning
#session-countdown {

    color: #ff3333;

    text-shadow:

        0 0 6px #ff3333,
        0 0 15px rgba(255,51,51,0.75);

    animation:
        timerCloseBlink 0.65s ease-in-out infinite;
}


.session-timer.close-warning
.session-timer-progress {

    background: #ff3333;

    box-shadow:

        0 0 5px #ff3333,
        0 0 13px rgba(255,51,51,0.8);
}


.session-timer.close-warning
.session-timer-dot {

    background: #ff3333;

    box-shadow:

        0 0 5px #ff3333,
        0 0 15px #ff3333;

    animation:
        timerDotPulse 0.65s ease-in-out infinite;
}


@keyframes timerCloseBlink {

    0%,
    100% {

        opacity: 1;

    }

    50% {

        opacity: 0.20;

    }
}


@keyframes timerDotPulse {

    0%,
    100% {

        transform:
            translate(-50%, -50%)
            scale(0.8);

    }

    50% {

        transform:
            translate(-50%, -50%)
            scale(1.45);

    }
}


/* =====================================================
   Weekend Timer
===================================================== */

.session-timer.weekend
#timer-session-name {

    color: #ff3333;

    text-shadow:

        0 0 6px #ff3333,
        0 0 14px rgba(255,51,51,0.55);
}


.session-timer.weekend
#session-countdown {

    color: #ff3333;

    text-shadow:

        0 0 6px #ff3333,
        0 0 14px rgba(255,51,51,0.55);
}


.session-timer.weekend
.session-timer-progress {

    background: #ff3333;

    box-shadow:

        0 0 5px #ff3333,
        0 0 12px rgba(255,51,51,0.65);

    left: 0;

    right: auto;
}


.session-timer.weekend
.session-timer-dot {

    background: #ff3333;

    box-shadow:

        0 0 5px #ff3333,
        0 0 13px #ff3333;

    animation:
        weekendTimerPulse 1.8s ease-in-out infinite;
}


@keyframes weekendTimerPulse {

    0%,
    100% {

        transform:
            translate(-50%, -50%)
            scale(0.8);

        opacity: 0.55;
    }

    50% {

        transform:
            translate(-50%, -50%)
            scale(1.2);

        opacity: 1;
    }
}


/* =====================================================
   حالت Market Closed
===================================================== */

.session-timer.closed
.session-timer-main {

    gap: 12px;
}


/* =====================================================
   وبکم
===================================================== */

.webcam-frame {

    position: absolute;

    bottom: 170px;
    left: 80px;

    width: 430px;
    height: 250px;

    border: 4px solid #00ff66;

    border-radius: 0;

    background:
        rgba(0, 0, 0, 0.18);

    box-shadow:

        0 0 25px rgba(0, 255, 102, 1),

   نوار پایین
===================================================== */

    left: 50%;

    transform: translateX(-50%);

    width: 86%;
    height: 80px;

    );

    background:
        rgba(0, 0, 0, 0.35);

    box-shadow:

        0 0 14px #00ff88,

/* =====================================================

===================================================== */

    font-size: 18px;

    font-weight: bold;

    line-height: 1;

    display: flex;

    align-items: center;

    white-space: nowrap;

        rgba(255,255,255,0.22);

/* =====================================================

.bottom-icon {

   SUBSCRIBE / LIKE
===================================================== */

    position: relative;

    width: 145px;
    min-width: 145px;
    max-width: 145px;

    height: 40px;

    flex-shrink: 0;
}


.promo-state {

    position: absolute;

    left: 0;
    top: 50%;

    transform: translateY(-50%);

    display: flex;

<script>

/* =====================================================

===================================================== */

const SESSION_CONFIG = {

    sydney: {

        name: "Sydney",

        shortName: "SYD",

        open: "00:30",

        close: "09:30"

    },


    tokyo: {

        name: "Tokyo",

    },


    london: {

        name: "London",

        open: "10:30",

        close: "19:30"

    },


    newyork: {

        name: "New York",

        shortName: "NY",

        open: "16:30",

        close: "00:30"

    }

};


/* =====================================================
   تنظیمات هشدار
===================================================== */

const OPEN_WARNING_MINUTES = 5;

const CLOSE_WARNING_MINUTES = 5;


/* =====================================================
   عناصر HTML
===================================================== */

const marketValue =
    document.getElementById(
        "market-value"
    );


const tehranClockValue =
    document.getElementById(
        "tehran-value"
    );


const sessionMap =
    document.getElementById(
        "session-map"
    );


const sessionActiveLabel =
    document.getElementById(
        "session-active-label"
    );


const activeSessionText =
    document.getElementById(
        "active-session-text"
    );


/* =====================================================
   عناصر Session Timer
===================================================== */

const sessionTimer =
    document.getElementById(
        "session-timer"
    );


const timerSessionName =
    document.getElementById(
        "timer-session-name"
    );


const sessionCountdown =
    document.getElementById(
        "session-countdown"
    );


const sessionTimerProgress =
    document.getElementById(
        "session-timer-progress"
    );


const sessionTimerDot =
    document.getElementById(
        "session-timer-dot"
    );


/* =====================================================
   Nodeهای Session
===================================================== */

const sessionNodes = {

    sydney:
        document.getElementById(
            "session-sydney"
        ),

    tokyo:
        document.getElementById(
            "session-tokyo"
        ),

    london:
        document.getElementById(
            "session-london"
        ),

    newyork:
        document.getElementById(
            "session-newyork"
        )

};


/* =====================================================
   تبدیل HH:MM به دقیقه
===================================================== */

function timeToMinutes(
    time
) {

    const parts =
        time.split(":");


    return (
        Number(parts[0]) * 60 +
        Number(parts[1])
    );

}


/* =====================================================
   ساعت تهران واقعی
===================================================== */

function getTehranDateParts(
    date = new Date()
) {

    const parts =
        new Intl.DateTimeFormat(
            "en-US",
            {

                timeZone:
                    "Asia/Tehran",

                year:
                    "numeric",

                month:
                    "2-digit",

                day:
                    "2-digit",

                hour:
                    "2-digit",

                minute:
                    "2-digit",

                second:
                    "2-digit",

                hourCycle:
                    "h23"

            }
        ).formatToParts(date);


    const result = {};


    parts.forEach(
        part => {

            if (
                part.type !==
                "literal"
            ) {

                result[part.type] =
                    part.value;

            }

        }
    );


    return {

        year:
            Number(result.year),

        month:
            Number(result.month),

        day:
            Number(result.day),

        hour:
            Number(result.hour),

        minute:
            Number(result.minute),

        second:
            Number(result.second)

    };

}


/* =====================================================
   دقیقه فعلی تهران
===================================================== */

function getTehranMinuteOfDay(
    date = new Date()
) {

    const parts =
        getTehranDateParts(
            date
        );


    return (
        parts.hour * 60 +
        parts.minute +
        parts.second / 60
    );

}


/* =====================================================
   ساخت Date تهران برای یک تاریخ و زمان مشخص
   بدون وابستگی به Time Zone مرورگر
===================================================== */

function tehranDateFromParts(
    year,
    month,
    day,
    hour,
    minute,
    second = 0
) {

    /*
       تهران در سال‌های اخیر UTC+3:30 است.
       برای این Overlay زمان‌های Session به‌صورت
       ثابت بر اساس تهران تعریف شده‌اند.

       این تابع با UTC Date کار می‌کند تا
       محاسبه روز و عبور از نیمه‌شب پایدار باشد.
    */

    return new Date(
        Date.UTC(
            year,
            month - 1,
            day,
            hour - 3,
            minute - 30,
            second
        )
    );

}


/* =====================================================
   اضافه کردن روز
===================================================== */

function addDaysToDateParts(
    parts,
    days
) {

    const d =
        new Date(
            Date.UTC(
                parts.year,
                parts.month - 1,
                parts.day
            )
        );


    d.setUTCDate(
        d.getUTCDate() + days
    );


    return {

        year:
            d.getUTCFullYear(),

        month:
            d.getUTCMonth() + 1,

        day:
            d.getUTCDate()

    };

}


/* =====================================================
   آخر هفته
===================================================== */

function isWeekend(
    date = new Date()
) {

    const parts =
        getTehranDateParts(
            date
        );


    const utcDate =
        new Date(
            Date.UTC(
                parts.year,
                parts.month - 1,
                parts.day
            )
        );


    const day =
        utcDate.getUTCDay();


    return (
        day === 0 ||
        day === 6
    );

}


/* =====================================================
   روز هفته تهران
   0 = Sunday
   1 = Monday
   ...
   6 = Saturday
===================================================== */

function getTehranWeekday(
    date = new Date()
) {

    const parts =
        getTehranDateParts(
            date
        );


    const utcDate =
        new Date(
            Date.UTC(
                parts.year,
                parts.month - 1,
                parts.day
            )
        );


    return utcDate.getUTCDay();

}


/* =====================================================
   ساخت وضعیت Session با درنظر گرفتن روز هفته
===================================================== */

function getSessionState(
    session,
    currentMinute,
    currentWeekday
) {

    /*
       شنبه و یکشنبه:
       هیچ Sessionی فعال نیست.
    */

    if (
        currentWeekday === 0 ||
        currentWeekday === 6
    ) {

        return {

            open:
                timeToMinutes(
                    session.open
                ),

            close:
                timeToMinutes(
                    session.close
                ),

            isOpen: false

        };

    }


    const open =
        timeToMinutes(
            session.open
        );


    const close =
        timeToMinutes(
            session.close
        );


    let isOpen = false;


    /*
       Session معمولی
    */

    if (
        open < close
    ) {

        isOpen =
            currentMinute >= open &&
            currentMinute < close;

    }


    /*
       Session عبوری از نیمه‌شب
       New York:
       16:30 → 00:30
    */

    else {

        isOpen =
            currentMinute >= open ||
            currentMinute < close;

    }


    return {

        open,
        close,
        isOpen

    };

}


/* =====================================================
   Sessionهای فعال
===================================================== */

function getActiveSessions(
    currentMinute,
    currentWeekday
) {

    if (
        currentWeekday === 0 ||
        currentWeekday === 6
    ) {

        return [];

    }


    const active = [];


    Object.entries(
        SESSION_CONFIG
    ).forEach(
        ([id, session]) => {

            const state =
                getSessionState(
                    session,
                    currentMinute,
                    currentWeekday
                );


            if (
                state.isOpen
            ) {

                active.push({

                    id,

                    ...session,

                    ...state

                });

            }

        }
    );


    return active;

}


/* =====================================================
   Session اصلی فعال
===================================================== */

function getPrimaryActiveSession(
    currentMinute,
    currentWeekday
) {

    const active =
        getActiveSessions(
            currentMinute,
            currentWeekday
        );


    if (
        active.length === 0
    ) {

        return null;

    }


    /*
       برای بازه‌های معمولی، Session با
       آخرین Open همان روز اولویت دارد.
    */

    let primary =
        active[0];


    let latestOpen =
        -1;


    active.forEach(
        session => {

            const open =
                timeToMinutes(
                    session.open
                );


            /*
               در ساعات قبل از 00:30،
               New York مربوط به شب قبل است.
            */

            if (
                session.id ===
                "newyork"
            ) {

                if (
                    currentMinute <
                    timeToMinutes("00:30")
                ) {

                    if (
                        open > latestOpen
                    ) {

                        latestOpen =
                            open;

                        primary =
                            session;

                    }

                    return;

                }

            }


            if (
                open <= currentMinute &&
                open > latestOpen
            ) {

                latestOpen =
                    open;

                primary =
                    session;

            }

        }
    );


    /*
       در بازه 00:00 تا 00:30:
       New York باید Session اصلی باشد.
    */

    if (
        currentMinute <
        timeToMinutes("00:30")
    ) {

        const ny =
            active.find(
                s =>
                    s.id ===
                    "newyork"
            );


        if (ny) {

            primary = ny;

        }

    }


    return primary;

}


/* =====================================================
   MARKET
===================================================== */

function isMarketOpen(
    currentMinute,
    currentWeekday
) {

    /*
       شنبه و یکشنبه همیشه بسته
    */

    if (
        currentWeekday === 0 ||
        currentWeekday === 6
    ) {

        return false;

    }


    return (
        getActiveSessions(
            currentMinute,
            currentWeekday
        ).length > 0
    );

}


/* =====================================================
   فرمت ساعت تهران
===================================================== */

function getTehranTime(
    date = new Date()
) {

    return new Intl.DateTimeFormat(
        "en-US",
        {

            timeZone:
                "Asia/Tehran",

            hour:
                "2-digit",

            minute:
                "2-digit",

            second:
                "2-digit",

            hour12:
                true

        }
    ).format(date);

}


/* =====================================================
   فرمت تاریخ تهران
===================================================== */

function getTehranDate(
    date = new Date()
) {

    return new Intl.DateTimeFormat(
        "en-US",
        {

            timeZone:
                "Asia/Tehran",

            day:
                "2-digit",

            month:
                "short",

            year:
                "numeric"

        }
    ).format(date);

}


/* =====================================================
   پیدا کردن Session بعدی
   فقط دوشنبه تا جمعه
===================================================== */

function getNextSession(
    currentMinute
) {

    const sessions =
        Object.entries(
            SESSION_CONFIG
        ).map(
            ([id, session]) => ({

                id,

                ...session,

                openMinute:
                    timeToMinutes(
                        session.open
                    )

            })
        );


    /*
       ابتدا Sessionهای بعدی امروز
    */

    const todayCandidates =
        sessions
            .filter(
                session =>
                    session.openMinute >
                    currentMinute
            )
            .sort(
                (a, b) =>
                    a.openMinute -
                    b.openMinute
            );


    if (
        todayCandidates.length > 0
    ) {

        return {

            ...todayCandidates[0],

            minutesUntilOpen:
                todayCandidates[0].openMinute -
                currentMinute

        };

    }


    /*
       اگر امروز Session دیگری نمانده:
       اولین Session فردا
    */

    const first =
        sessions.sort(
            (a, b) =>
                a.openMinute -
                b.openMinute
        )[0];


    return {

        ...first,

        minutesUntilOpen:
            1440 -
            currentMinute +
            first.openMinute

    };

}


/* =====================================================
   تایمر دقیق تا Open Session بعدی
===================================================== */

function getNextSessionDate(
    tehranParts,
    currentMinute
) {

    const sessions =
        Object.entries(
            SESSION_CONFIG
        )
        .map(
            ([id, session]) => ({

                id,

                ...session,

                openMinute:
                    timeToMinutes(
                        session.open
                    )

            })
        )
        .sort(
            (a, b) =>
                a.openMinute -
                b.openMinute
        );


    let targetSession =
        sessions.find(
            session =>
                session.openMinute >
                currentMinute
        );


    let targetDay =
        {

            year:
                tehranParts.year,

            month:
                tehranParts.month,

            day:
                tehranParts.day

        };


    if (
        !targetSession
    ) {

        targetSession =
            sessions[0];

        targetDay =
            addDaysToDateParts(
                targetDay,
                1
            );

    }


    const openHour =
        Math.floor(
            targetSession.openMinute /
            60
        );


    const openMinute =
        targetSession.openMinute %
        60;


    return {

        session:
            targetSession,

        date:
            tehranDateFromParts(
                targetDay.year,
                targetDay.month,
                targetDay.day,
                openHour,
                openMinute,
                0
            )

    };

}


/* =====================================================
   پیدا کردن Session فعال + زمان دقیق Close
===================================================== */

function getActiveSessionTimerTarget(
    tehranParts,
    currentMinute
) {

    const active =
        getActiveSessions(
            currentMinute,
            getTehranWeekday()
        );


    if (
        active.length === 0
    ) {

        return null;

    }


    const primary =
        getPrimaryActiveSession(
            currentMinute,
            getTehranWeekday()
        );


    if (
        !primary
    ) {

        return null;

    }


    let targetDay =
        {

            year:
                tehranParts.year,

            month:
                tehranParts.month,

            day:
                tehranParts.day

        };


    /*
       New York:
       16:30 → 00:30

       اگر بعد از نیمه‌شب هستیم،
       Close مربوط به همان روز است.
       اگر قبل از نیمه‌شب هستیم،
       Close همان روز ساعت 00:30 روز بعد است.
    */

    if (
        primary.id === "newyork"
    ) {

        if (
            currentMinute <
            timeToMinutes("00:30")
        ) {

            /*
               Close همین روز در 00:30
            */

        }

        else {

            /*
               Close فردا در 00:30
            */

            targetDay =
                addDaysToDateParts(
                    targetDay,
                    1
                );

        }

    }


    /*
       Sessionهای معمولی
    */

    const closeMinute =
        timeToMinutes(
            primary.close
        );


    const closeHour =
        Math.floor(
            closeMinute / 60
        );


    const closeMin =
        closeMinute % 60;


    return {

        session:
            primary,

        date:
            tehranDateFromParts(
                targetDay.year,
                targetDay.month,
                targetDay.day,
                closeHour,
                closeMin,
                0
            )

    };

}


/* =====================================================
   زمان تا دوشنبه 00:30
===================================================== */

function getWeekendOpeningTarget(
    tehranParts
) {

    const currentDay =
        new Date(
            Date.UTC(
                tehranParts.year,
                tehranParts.month - 1,
                tehranParts.day
            )
        );


    const weekday =
        currentDay.getUTCDay();


    /*
       Sunday = 0
       Saturday = 6

       Sunday:
       1 day تا Monday

       Saturday:
       2 روز تا Monday
    */

    let daysUntilMonday;


    if (
        weekday === 0
    ) {

        daysUntilMonday = 1;

    }

    else {

        daysUntilMonday = 2;

    }


    const monday =
        new Date(
            Date.UTC(
                tehranParts.year,
                tehranParts.month - 1,
                tehranParts.day
            )
        );


    monday.setUTCDate(
        monday.getUTCDate() +
        daysUntilMonday
    );


    return tehranDateFromParts(
        monday.getUTCFullYear(),
        monday.getUTCMonth() + 1,
        monday.getUTCDate(),
        0,
        30,
        0
    );

}


/* =====================================================
   تبدیل میلی‌ثانیه به HH:MM:SS
===================================================== */

function formatCountdown(
    milliseconds
) {

    let totalSeconds =
        Math.max(
            0,
            Math.floor(
                milliseconds / 1000
            )
        );


    const hours =
        Math.floor(
            totalSeconds / 3600
        );


    totalSeconds %=
        3600;


    const minutes =
        Math.floor(
            totalSeconds / 60
        );


    const seconds =
        totalSeconds % 60;


    return (

        String(hours)
            .padStart(2, "0")

        +

        ":" +

        String(minutes)
            .padStart(2, "0")

        +

        ":" +

        String(seconds)
            .padStart(2, "0")

    );

}


/* =====================================================
   ریست وضعیت Timer
===================================================== */

function resetTimerClasses() {

    sessionTimer.classList.remove(

        "active",

        "waiting",

        "open-warning",

        "close-warning",

        "weekend",

        "closed"

    );

}


/* =====================================================
   بروزرسانی Session Timer
===================================================== */

function updateSessionTimer(
    now,
    tehranParts,
    currentMinute,
    currentWeekday
) {

    resetTimerClasses();


    /*
       آخر هفته
    */

    if (
        currentWeekday === 0 ||
        currentWeekday === 6
    ) {

        const target =
            getWeekendOpeningTarget(
                tehranParts
            );


        const remaining =
            target.getTime() -
            now.getTime();


        const weekendDuration =
            currentWeekday === 0
                ? 86400000 +
                  (
                      30 * 60 * 1000
                  )
                : 2 * 86400000 +
                  (
                      30 * 60 * 1000
                  );


        const elapsed =
            Math.max(
                0,
                weekendDuration -
                remaining
            );


        const progress =
            Math.min(
                100,
                Math.max(
                    0,
                    (
                        elapsed /
                        weekendDuration
                    ) * 100
                )
            );


        timerSessionName.innerText =
            "MARKET CLOSED";


        sessionCountdown.innerText =
            formatCountdown(
                remaining
            );


        sessionTimer.classList.add(
            "weekend",
            "closed"
        );


        sessionTimerProgress.style.left =
            "0";


        sessionTimerProgress.style.right =
            "auto";


        sessionTimerProgress.style.width =
            progress + "%";


        sessionTimerDot.style.left =
            progress + "%";


        return;

    }


    /*
       Session فعال
    */

    const activeTimer =
        getActiveSessionTimerTarget(
            tehranParts,
            currentMinute
        );


    if (
        activeTimer
    ) {

        const remaining =
            activeTimer.date.getTime() -
            now.getTime();


        const session =
            activeTimer.session;


        const openMinute =
            timeToMinutes(
                session.open
            );


        const closeMinute =
            timeToMinutes(
                session.close
            );


        let durationMinutes;


        if (
            session.id ===
            "newyork"
        ) {

            durationMinutes =
                8 * 60;

        }

        else {

            durationMinutes =
                closeMinute -
                openMinute;

        }


        let elapsedMinutes;


        if (
            session.id ===
            "newyork" &&
            currentMinute <
            timeToMinutes("00:30")
        ) {

            elapsedMinutes =
                currentMinute +
                24 * 60 -
                openMinute;

        }

        else {

            elapsedMinutes =
                currentMinute -
                openMinute;

        }


        const progress =
            Math.min(
                100,
                Math.max(
                    0,
                    (
                        elapsedMinutes /
                        durationMinutes
                    ) * 100
                )
            );


        timerSessionName.innerText =
            session.shortName;


        sessionCountdown.innerText =
            formatCountdown(
                remaining
            );


        sessionTimer.classList.add(
            "active"
        );


        sessionTimerProgress.style.left =
            "0";


        sessionTimerProgress.style.right =
            "auto";


        sessionTimerProgress.style.width =
            progress + "%";


        sessionTimerDot.style.left =
            progress + "%";


        const remainingMinutes =
            remaining /
            60000;


        if (
            remainingMinutes > 0 &&
            remainingMinutes <=
                CLOSE_WARNING_MINUTES
        ) {

            sessionTimer.classList.add(
                "close-warning"
            );

        }


        return;

    }


    /*
       هیچ Session فعالی نیست
       → Session بعدی
    */

    const next =
        getNextSessionDate(
            tehranParts,
            currentMinute
        );


    const remaining =
        next.date.getTime() -
        now.getTime();


    const progress =
        Math.min(
            100,
            Math.max(
                0,
                100 -
                (
                    remaining /
                    (24 * 60 * 60 * 1000)
                ) * 100
            )
        );


    timerSessionName.innerText =
        next.session.shortName;


    sessionCountdown.innerText =
        formatCountdown(
            remaining
        );


    sessionTimer.classList.add(
        "waiting"
    );


    /*
       حالت Waiting:
       نقطه از سمت راست به چپ می‌آید.
    */

    sessionTimerProgress.style.left =
        "auto";


    sessionTimerProgress.style.right =
        "0";


    sessionTimerProgress.style.width =
        progress + "%";


    sessionTimerDot.style.left =
        (100 - progress) + "%";


    const remainingMinutes =
        remaining /
        60000;


    if (
        remainingMinutes > 0 &&
        remainingMinutes <=
            OPEN_WARNING_MINUTES
    ) {

        sessionTimer.classList.add(
            "open-warning"
        );

    }

}


/* =====================================================
   آپدیت Session Map
===================================================== */

function updateSessionMap(
    currentMinute,
    currentWeekday
) {

    sessionMap.classList.remove(
        "has-active"
    );


    Object.values(
        sessionNodes
    ).forEach(
        node => {

            node.classList.remove(
                "active",
                "open-warning",
                "close-warning"
            );

        }
    );


    /*
       آخر هفته
    */

    if (
        currentWeekday === 0 ||
        currentWeekday === 6
    ) {

        sessionMap.classList.add(
            "weekend"
        );


        sessionActiveLabel.classList.add(
            "visible"
        );


        activeSessionText.innerText =
            "MARKET CLOSED";


        Object.keys(
            sessionNodes
        ).forEach(
            id => {

                sessionNodes[id]
                    .classList.add(
                        "close-warning"
                    );

            }
        );


        return;

    }


    sessionMap.classList.remove(
        "weekend"
    );


    /*
       Sessionهای فعال
    */

    const active =
        getActiveSessions(
            currentMinute,
            currentWeekday
        );


    if (
        active.length > 0
    ) {

        sessionMap.classList.add(
            "has-active"
        );

    }


    active.forEach(
        session => {

            const node =
                sessionNodes[
                    session.id
                ];


            if (!node) {
                return;
            }


            node.classList.add(
                "active"
            );

        }
    );


    /*
       هشدار Open / Close
    */

    Object.entries(
        SESSION_CONFIG
    ).forEach(
        ([id, session]) => {

            const node =
                sessionNodes[id];


            if (!node) {
                return;
            }


            const state =
                getSessionState(
                    session,
                    currentMinute,
                    currentWeekday
                );


            if (
                state.isOpen &&
                isCloseWarning(
                    session,
                    currentMinute
                )
            ) {

                node.classList.remove(
                    "active"
                );


                node.classList.add(
                    "close-warning"
                );

            }


            else if (
                !state.isOpen &&
                isOpenWarning(
                    session,
                    currentMinute
                )
            ) {

                node.classList.add(
                    "open-warning"
                );

            }

        }
    );


    /*
       Active Label
    */

    if (
        active.length > 0
    ) {

        sessionActiveLabel.classList.add(
            "visible"
        );


        activeSessionText.innerText =
            "ACTIVE";

    }

    else {

        sessionActiveLabel.classList.remove(
            "visible"
        );

    }

}


/* =====================================================
   هشدار OPEN
===================================================== */

function isOpenWarning(
    session,
    currentMinute
) {

    const open =
        timeToMinutes(
            session.open
        );


    /*
       در 00:00 تا 00:30، Sessionهایی
       که Open آنها در همان روز است.
    */

    let diff =
        open -
        currentMinute;


    if (
        diff < 0
    ) {

        diff += 1440;

    }


    return (

        diff > 0 &&

        diff <=
            OPEN_WARNING_MINUTES

    );

}


/* =====================================================
   هشدار CLOSE
===================================================== */

function isCloseWarning(
    session,
    currentMinute
) {

    const close =
        timeToMinutes(
            session.close
        );


    let diff =
        close -
        currentMinute;


    if (
        diff < 0
    ) {

        diff += 1440;

    }


    return (

        diff > 0 &&

        diff <=
            CLOSE_WARNING_MINUTES

    );

}


/* =====================================================
   آپدیت Market
===================================================== */

function updateMarket(
    currentMinute,
    currentWeekday
) {

    const open =
        isMarketOpen(
            currentMinute,
            currentWeekday
        );


    if (open) {

        marketValue.innerText =
            "OPEN";


        marketValue.style.color =
            "#00ff88";


        marketValue.style.textShadow =
            "0 0 8px #00ff88";

    }

    else {

        marketValue.innerText =
            "CLOSED";


        marketValue.style.color =
            "#ff3333";


        marketValue.style.textShadow =
            "0 0 8px #ff3333";

    }

}


/* =====================================================
   آپدیت اصلی
===================================================== */

function updateClocks() {

    const now =
        new Date();


    const tehranParts =
        getTehranDateParts(
            now
        );


    const currentMinute =
        tehranParts.hour * 60 +
        tehranParts.minute +
        tehranParts.second / 60;


    const currentWeekday =
        getTehranWeekday(
            now
        );


    /*
       ساعت تهران
    */

    tehranClockValue.innerText =
        getTehranTime(
            now
        );


    /*
       Session Map
    */

    updateSessionMap(
        currentMinute,
        currentWeekday
    );


    /*
       Market
    */

    updateMarket(

        currentWeekday
    );


    /*
       Session Timer
    */

    updateSessionTimer(

        tehranParts,
        currentMinute,
        currentWeekday
    );


    /*
       تاریخ
    */

    document.getElementById(
        "date-value"
    ).innerText =
        getTehranDate(

        );

}
